kind: project
name: Mini catalog
design: docs/design.md
out: docs/stories
asvs_level: L2
roles: [visitor, seller, admin]
stack:
  - Node.js 22 (LTS)
  - TypeScript 5.9.3, strict, ES2022 modules
  - Express 5.1.0
  - PostgreSQL 16
  - Prisma 7.10.0 with @prisma/adapter-pg
  - Zod 3.25.76 for validation
  - Vitest 4.0.9 and Supertest 7.1.4 for tests
  - Pino 10.1.0 for logs
commands:
  install: npm ci
  lint (includes SAST rules): npm run lint
  typecheck: npm run typecheck
  test one file: npx vitest run <test-file>
  full suite: npm test
  quiet run: npx vitest run --reporter=dot --silent
  dependency audit: npm audit --audit-level=high
  test database: docker compose up -d db-test
  new migration: npx prisma migrate dev --name <name>
layout:
  - "`src/app.ts` builds the Express app, `src/server.ts` starts it, `src/config/env.ts` validates the environment."
  - "`src/modules/<module>/`: `<name>.routes.ts`, `<name>.service.ts`, `<name>.schemas.ts`. A module imports another only through the functions listed in its contracts.md."
  - "`tests/<module>/<feature>.test.ts`; shared test helpers in `tests/helpers/`."
  - "`prisma/schema.prisma`, `prisma/migrations/`; constraints Prisma cannot express go in the migration's SQL."
  - "Files kebab-case, types PascalCase, functions camelCase; tables and columns verbatim from the design (snake_case)."
  - "Money: integer XAF in `bigint`. IDs: UUIDv7. Timestamps: `timestamptz`, UTC."
dependencies:
  runtime: {express: 5.1.0, "@prisma/client": 7.10.0, "@prisma/adapter-pg": 7.10.0, pg: 8.23.0, zod: 3.25.76, pino: 10.1.0, pino-http: 11.0.0, helmet: 8.1.0, express-rate-limit: 8.2.1, jsonwebtoken: 9.0.2, argon2: 0.44.0, dotenv: 17.4.2}
  dev: {typescript: 5.9.3, prisma: 7.10.0, tsx: 4.20.6, vitest: 4.0.9, "@vitest/coverage-v8": 4.0.9, supertest: 7.1.4, eslint: 9.39.1, "@eslint/js": 9.39.1, typescript-eslint: 8.46.4, eslint-plugin-security: 3.0.1, globals: 16.5.0, prettier: 3.6.2, "@types/node": 22.19.1, "@types/express": 5.0.5, "@types/supertest": 6.0.3, "@types/jsonwebtoken": 9.0.10, "@types/pg": 8.23.1}
  ci: {actions/checkout: v7, actions/setup-node: v7, semgrep/semgrep: 1.178.0, zricethezav/gitleaks: v8.30.1, postgres: 16-alpine}
urls: [http://localhost:3000]
glossary:
  - "seller | `SELLER`, vendeur | account that manages its own products"
  - "admin | `ADMIN`, administrateur | platform account that reviews every product and removes non-compliant ones"
  - "visitor | visiteur | person who is not signed in; can only sign up and log in"
  - "product | `Product`, produit | item of a seller's catalog"
  - "catalog | catalogue | the products of one seller"
  - "removal | retrait | an admin sets a product to REMOVED with a reason"
  - "refresh token | `RefreshToken`, jeton de renouvellement | single-use token exchanged for a new access token"
validation:
  - "Lowercase `email` before validating and storing it (C-01)."
logging:
  - "Log each login success and failure with the account ID when known; never the e-mail or the password."
baseline:
  - "v5.0.0-9.1.2: JWTs are signed and verified with HS256 only, with `JWT_SECRET` (at least 32 random bytes)."
  - "v5.0.0-9.2.1: access tokens expire after 15 minutes; refresh tokens after 30 days and are single use."
  - "v5.0.0-6.3.1: 5 failed logins for one e-mail within 15 minutes lock that e-mail for 15 minutes."
rules:
  - "Lists are paginated (20 per page for sellers, 50 for admins) and ordered by `created_at` descending, with an index matching the filter and order (target: 95% of requests under 300 ms at 50 concurrent users)."
