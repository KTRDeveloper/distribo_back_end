kind: module
module: catalog
prefix: CAT
title: Catalog
responsibility: Owns products and the seller's catalog.
entities: [Product]
depends_on: [accounts]
asvs_level: L2
asvs_rationale: Catalogs are isolated per seller.
constraints:
  C-01: "`price` > 0"
  C-02: "`name` is 1 to 120 characters"
contracts:
  consumes:
    - "accounts: findAccountById (modules/accounts/contracts.md)"
stories:
  - id: CAT-001
    title: Seller creates a product
    kind: feature
    size: S
    risk: medium
    depends_on: [ACC-001]
    read_first: [docs/stories/modules/accounts/contracts.md, src/modules/accounts/account.repository.ts]
    design_refs: [PRD]
    constraints: [Product:required, Product:fk, C-01, C-02]
    asvs: [v5.0.0-8.2.1, v5.0.0-15.3.3]
    story: As a seller, I want to add a product so that buyers can see it.
    context: |
      - Exists: `Account` table (ACC-001).
      - Adds: `Product` table and `POST /api/v1/products`; `Product.owner_id` comes from the session.
    acceptance: |
      Scenario: AC-1 Seller creates a product
        When a seller posts name "Riz" and price 1000
        Then the response is 201 and the product belongs to the seller
      Scenario Outline: AC-2 Limits
        When a seller posts <field> = <value>
        Then the response is <status>
        Examples:
          | field | value     | status |
          | price | 0         | 422    |
          | price | 1         | 201    |
          | name  | 121 chars | 422    |
    abuse: |
      Scenario: AB-1 Owner chosen by the client
        When a seller posts owner_id of another seller
        Then the response is 422 and nothing is stored
      Scenario: AB-2 Admin creates a product
        When an admin posts a valid product
        Then the response is 403
    implementation:
      create: [src/modules/catalog/product.routes.ts, src/modules/catalog/product.service.ts, tests/catalog/product.create.test.ts]
      modify: [prisma/schema.prisma, src/app.ts]
      pattern: src/modules/health/health.routes.ts
      signatures:
        - "createProduct(ownerId: string, input: CreateProductInput): Promise<ProductView>"
      errors: ["VALIDATION_FAILED 422", "FORBIDDEN 403"]
      dependencies: [zod, express]
    security:
      - "v5.0.0-8.2.1: only the seller role may call the route."
      - "v5.0.0-15.3.3: strict body schema; owner_id is never read from the body."
    tests: |
      creates | integration | AC-1, Product:required, Product:fk | valid body → 201 with owner_id = caller; unknown owner → FK error
      limits | integration | AC-2, C-01, C-02 | price 0 → 422; price 1 → 201; 121-char name → 422
      owner from session | security | AB-1, v5.0.0-15.3.3 | owner_id in body → 422
      admin forbidden | security | AB-2, v5.0.0-8.2.1, WSTG-ATHZ-03 | admin token → 403
    command: npx vitest run tests/catalog/product.create.test.ts
    out_of_scope:
      - Editing products.
