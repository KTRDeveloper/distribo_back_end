  - id: REL-021
    title: Invited supplier accepts or declines
    kind: feature
    size: M
    risk: high
    depends_on: [REL-020, REL-006, REL-007, REL-008]
    read_first: [src/modules/relationship/relationship.service.ts, src/modules/relationship/relationship.repository.ts]
    design_refs: [relations-commerciales/customerrelationship/invitation-d-un-fournisseur-par-un]
    constraints: [CM-25, C-08, C-07]
    asvs: [v5.0.0-8.2.1, v5.0.0-8.2.2, v5.0.0-2.3.3]
    story: As a manager, I want to see the customers who invited me and accept them for my business so that they become my customers.
    context: |
      - Exists: PENDING relationships (REL-020); `getActiveCollaboration`.
      - Adds: `GET /api/v1/supplier-invitations` (relationships with `supplier_person_id` = caller, PENDING; `id, supplier_label, customer` public view); `POST /api/v1/supplier-invitations/{id}/accept` with `{ organization_id }`; `POST /api/v1/supplier-invitations/{id}/decline`.
      - Accept: the caller must be MANAGER or OWNER of `organization_id` (ACTIVE, not CLOSED or SUSPENDED). One transaction sets `supplier_person_id` empty, `supplier_organization_id` = the organization and status ACTIVE. If the organization already has a live relationship with that customer, the invitation is deleted (`deleted_at`) and the answer is 200 `{ merged: true }`.
      - Decline: the row is deleted (`deleted_at`); the customer is notified `supplier.declined`.
      - A customer notification `supplier.accepted` follows an acceptance.
    acceptance: |
      Scenario: AC-1 List
        Given two invitations addressed to the caller's number
        Then the list shows both with the customers' public view
      Scenario: AC-2 Accept
        When the caller accepts for an organization they manage
        Then the relationship is ACTIVE with that organization as supplier and no supplier person
      Scenario: AC-3 Existing relationship
        Given the organization already has a live relationship with that customer
        When the caller accepts
        Then the response is 200 `{ merged: true }` and the invitation is deleted
      Scenario: AC-4 Decline
        When the caller declines
        Then the invitation is deleted and the customer is notified
      Scenario Outline: AC-5 Refusals
        When the accept call has <problem>
        Then the response is <status> and nothing changes
        Examples:
          | problem                                       | status                      |
          | an organization the caller only sells for     | 403 FORBIDDEN               |
          | an organization they are not a member of      | 404 NOT_FOUND               |
          | a CLOSED organization                         | 409 ORGANIZATION_NOT_ACTIVE |
          | an invitation addressed to someone else       | 404 NOT_FOUND               |
    abuse: |
      Scenario: AB-1 Taking another person's invitation (horizontal)
        When person A accepts an invitation whose supplier person is B
        Then the response is 404 and it stays PENDING
      Scenario: AB-2 Accepting for a business one does not manage (elevation)
        When a SELLER of the organization accepts
        Then the response is 403
    implementation:
      create: [tests/integration/relationship/supplier-invitations.test.ts]
      modify: [src/modules/relationship/relationship.routes.ts, src/modules/relationship/relationship.schemas.ts, src/modules/relationship/relationship.service.ts, src/modules/relationship/relationship.repository.ts, src/modules/relationship/relationship.openapi.ts]
      pattern: src/modules/relationship/relationship.routes.ts
      signatures:
        - "acceptSupplierInvitation(personId: string, invitationId: string, organizationId: string): Promise<{ merged: boolean; relationship?: SupplierRelationshipView }>"
        - "declineSupplierInvitation(personId: string, invitationId: string): Promise<void>"
      types: []
      errors: ["FORBIDDEN 403", "NOT_FOUND 404", "ORGANIZATION_NOT_ACTIVE 409"]
      dependencies: [express, zod, "@prisma/client"]
    security:
      - "v5.0.0-8.2.1: only a MANAGER or OWNER of the target organization accepts."
      - "v5.0.0-8.2.2: the invitation is selected by id and `supplier_person_id` = caller."
      - "v5.0.0-2.3.3: the swap of supplier columns is one conditional update."
    tests: |
      list | integration | AC-1 | two items
      accept | integration | AC-2, CM-25, C-08 | ACTIVE with organization
      existing relationship | integration | AC-3, C-07 | merged true, deleted
      decline | integration | AC-4 | deleted, customer notified
      refusals | integration | AC-5 | each Examples row → status
      other person | security | AB-1, WSTG-ATHZ-04 | 404
      seller accepts | security | AB-2, WSTG-ATHZ-03 | 403
    command: npx vitest run tests/integration/relationship/supplier-invitations.test.ts
    out_of_scope:
      - "Orders on the new relationship (ORD module)."
  - id: REL-022
    title: Newly registered person sees what is attached to their number
    kind: feature
    size: S
    risk: medium
    depends_on: [REL-021, ORG-008, REL-006, REL-007, REL-008]
    read_first: [src/modules/relationship/relationship.service.ts, src/modules/organization/organization.repository.ts]
    design_refs: [identite-et-organisation/person, relations-commerciales/customerrelationship/entree-en-relation-le-numero-comme]
    constraints: [CM-19]
    asvs: [v5.0.0-8.2.2, v5.0.0-15.3.1]
    story: As a customer, I want to see everything attached to my number after registering so that I accept or contest each item.
    context: |
      - Exists: customer relationships (REL-016), team invitations (ORG-008), supplier invitations (REL-021).
      - Adds: `GET /api/v1/people/me/attachments`, response 200 `{ relationships: [...], team_invitations: [...], supplier_invitations: [...] }`. `relationships` are the caller's ACTIVE and ENDED relationships as customer (`projectForCustomer`, with the supplier's public name and balance), `team_invitations` and `supplier_invitations` as in their own lists.
      - Each list is capped at 100 items.
    acceptance: |
      Scenario: AC-1 Everything attached
        Given a guest completed by registration who had 2 relationships as customer, 1 team invitation and 1 supplier invitation
        When the person calls the route
        Then all four items appear in their lists
      Scenario: AC-2 Nothing attached
        When the person has none
        Then the three lists are empty
      Scenario: AC-3 Views
        Then relationships have no customer_label or supplier_notes
      Scenario: AC-4 Cap
        When there are 150 relationships
        Then 100 are returned
    abuse: |
      Scenario: AB-1 Another number's attachments (horizontal)
        When the request is made with the token of person B
        Then only B's items appear
      Scenario: AB-2 No token (unauthenticated)
        Then the response is 401
    implementation:
      create: [tests/integration/relationship/attachments.test.ts]
      modify: [src/modules/relationship/relationship.routes.ts, src/modules/relationship/relationship.service.ts, src/modules/relationship/relationship.repository.ts, src/modules/relationship/relationship.openapi.ts]
      pattern: src/modules/relationship/relationship.routes.ts
      signatures:
        - "getAttachments(personId: string): Promise<{ relationships: CustomerRelationshipView[]; team_invitations: TeamInvitationView[]; supplier_invitations: SupplierInvitationView[] }>"
      types: []
      errors: ["UNAUTHORIZED 401"]
      dependencies: [express]
    security:
      - "v5.0.0-8.2.2: every query filters on the person id from the token."
      - "v5.0.0-15.3.1: customer projections only."
    tests: |
      attached | integration | AC-1 | four items
      none | integration | AC-2 | empty lists
      views | integration | AC-3, CM-19 | private fields absent
      cap | integration | AC-4 | 100 of 150
      other person | security | AB-1, WSTG-ATHZ-04 | only own items
      no token | security | AB-2, WSTG-ATHN-04 | 401
    command: npx vitest run tests/integration/relationship/attachments.test.ts
    out_of_scope:
      - "The accept or contest gestures (REL-017, REL-023, ORG-008)."
  - id: REL-023
    title: Customer contests a relationship ("this is not me")
    kind: feature
    size: M
    risk: high
    depends_on: [REL-014, REL-016, ACC-007, NTF-002, REL-006, REL-007, REL-008]
    read_first: [src/modules/relationship/relationship.repository.ts, src/modules/person/person.repository.ts]
    design_refs: [relations-commerciales/customerrelationshipreassignment/ce-n-est-pas-moi-erreurs-de-saisie-et]
    constraints: [C-12, CM-24, CM-03, C-02]
    asvs: [v5.0.0-8.2.2, v5.0.0-2.3.3, v5.0.0-16.3.1]
    story: As a customer, I want to say "this is not me" about a relationship so that a debt entered on my number by mistake or by the previous holder leaves my account.
    context: |
      - Exists: the reassignment journal (REL-014); `bumpScopeVersion`; `notify`; `idempotent()`.
      - Adds: `POST /api/v1/suppliers/{relationshipId}/contest` with `{ id, reason? }`; response 204. The caller must be `customer_person_id` of an ACTIVE or ENDED relationship.
      - One transaction: a ghost person is created (no name, no active number, `released_phone_number` = the caller's active number, not registered); the relationship's `customer_person_id` becomes the ghost; one journal row is added (`previous_person_id` = caller, `new_person_id` = ghost, `reassigned_by_id` = caller, `reason`); the caller's `scope_version` is bumped; the supplier's OWNER and MANAGERs are notified `relationship.contested` ("un numéro est à corriger"). The relationship disappears from the caller's lists.
      - A second contestation of the same relationship by the same person answers 409 `ALREADY_CONTESTED`. Balance and history are untouched.
    acceptance: |
      Scenario: AC-1 Contest
        When a customer contests a relationship
        Then the relationship points to a ghost person holding the number as released number, one journal row exists, and the caller no longer sees it
      Scenario: AC-2 Notices and counters
        Then the caller's scope_version is +1 and the supplier's owner and managers have one notification `relationship.contested`
      Scenario: AC-3 History kept
        Then balance, orders and ledger entries still point to the same relationship
      Scenario Outline: AC-4 Refusals
        When the request has <problem>
        Then the response is <status> and nothing changes
        Examples:
          | problem                                         | status                |
          | a second contestation by the same person        | 409 ALREADY_CONTESTED |
          | a relationship of another person                | 404 NOT_FOUND         |
          | a PENDING invitation (decline it instead)       | 404 NOT_FOUND         |
      Scenario: AC-5 Atomic
        When the journal insert fails
        Then no ghost person exists and the relationship is unchanged
    abuse: |
      Scenario: AB-1 Making a debt disappear in a loop (tampering)
        When the customer contests, the supplier restores the same number, and the customer contests again
        Then the second contestation answers 409 and the debt stays on the customer's account
      Scenario: AB-2 Contesting someone else's relationship (horizontal)
        When person A contests a relationship of person B
        Then the response is 404
    implementation:
      create: [tests/integration/relationship/contest.test.ts]
      modify: [src/modules/relationship/relationship.routes.ts, src/modules/relationship/relationship.schemas.ts, src/modules/relationship/relationship.service.ts, src/modules/relationship/relationship.repository.ts, src/modules/relationship/relationship.openapi.ts]
      pattern: src/modules/relationship/relationship.routes.ts
      signatures:
        - "contestRelationship(personId: string, relationshipId: string, input: { id: string; reason?: string }): Promise<void>"
      types: []
      errors: ["ALREADY_CONTESTED 409", "NOT_FOUND 404", "VALIDATION_ERROR 400"]
      dependencies: [express, zod, "@prisma/client"]
    security:
      - "v5.0.0-8.2.2: the relationship is selected with the caller as `customer_person_id`."
      - "v5.0.0-2.3.3: ghost person, reassignment, journal and scope bump are one transaction."
      - "v5.0.0-16.3.1: log `warn` event `relationship_contested` with relationship and person ids."
    tests: |
      contest | integration | AC-1, C-12, C-02 | ghost, journal row, hidden from caller
      notices | integration | AC-2, CM-03 | scope +1, notifications
      history kept | integration | AC-3 | ids unchanged
      refusals | integration | AC-4, CM-24 | each Examples row → status
      atomic | integration | AC-5, CWE-362 | forced failure → unchanged
      loop | security | AB-1, CWE-841 | second contest → 409
      other person | security | AB-2, WSTG-ATHZ-04 | 404
    command: npx vitest run tests/integration/relationship/contest.test.ts
    out_of_scope:
      - "Contesting a team invitation (ORG-008 decline) or a supplier invitation (REL-021 decline)."
  - id: REL-024
    title: Owner or manager corrects a customer's number
    kind: feature
    size: M
    risk: high
    depends_on: [REL-023, ACC-002, ACC-007, REL-006, REL-007, REL-008]
    read_first: [src/modules/relationship/relationship.service.ts, src/modules/person/person.repository.ts]
    design_refs: [relations-commerciales/customerrelationshipreassignment/correction-par-le-fournisseur, relations-commerciales/customerrelationshipreassignment]
    constraints: [C-12, CM-24, CM-03, C-07]
    asvs: [v5.0.0-8.2.1, v5.0.0-8.2.2, v5.0.0-2.3.3]
    story: As an owner, I want to point a customer's relationship to the right number so that the account follows the right person.
    context: |
      - Exists: contestation and the journal (REL-023); rule `reassign` on CustomerRelationship for MANAGER online, OWNER always (ACC-002); `findOrCreateByPhone`; `bumpScopeVersion`; `notify`.
      - Adds: `POST /api/v1/organizations/{organizationId}/customers/{relationshipId}/correct-number` with `{ id, phone_number, reason?, confirm_same_customer? }`; response 200 `projectForSupplier`.
      - One transaction: the target person is found or created by the number; `customer_person_id` is repointed; one journal row is added (`reassigned_by_id` = caller); the scope versions of the previous and new persons are bumped; a registered new person is notified `customer.added`.
      - The target must not already have a live relationship with this supplier (409 `RELATIONSHIP_EXISTS`; the pair index would also refuse it). When the target is a person who contested this relationship, `confirm_same_customer: true` and a `reason` are required (409 `CONFIRMATION_REQUIRED` otherwise); the relationship then comes back to them and they can no longer contest it.
      - A manager cannot correct a relationship where they are the customer or manage the customer organization (403 `OWN_RECORD`); counters and organization customers cannot be corrected (409 `NOT_A_PERSON_CUSTOMER`).
    acceptance: |
      Scenario: AC-1 Correct a typo
        When an OWNER posts the right number for a customer entered wrongly
        Then the relationship points to the new number's person, one journal row exists, balance and history are unchanged
        And both persons' scope_version is +1 and a registered new person is notified
      Scenario: AC-2 Existing relationship
        When the new number's person already has a live relationship with this supplier
        Then the response is 409 `RELATIONSHIP_EXISTS` and nothing changes
      Scenario: AC-3 Same customer after contestation
        Given the customer contested the relationship
        When the supplier posts the customer's own number without confirmation
        Then the response is 409 `CONFIRMATION_REQUIRED`
        And with confirm_same_customer true and a reason the relationship returns to that person and a second contestation is refused
      Scenario Outline: AC-4 Refusals
        When the request has <problem>
        Then the response is <status>
        Examples:
          | problem                                       | status                      |
          | a SELLER or DRIVER caller                     | 403 FORBIDDEN               |
          | a MANAGER on their own customer record        | 403 OWN_RECORD              |
          | a counter                                     | 409 NOT_A_PERSON_CUSTOMER   |
    abuse: |
      Scenario: AB-1 Moving a debt to an innocent person (tampering)
        Then the journal records who moved it, and the moved person can contest it once
    implementation:
      create: [tests/integration/relationship/correct-number.test.ts]
      modify: [src/modules/relationship/relationship.routes.ts, src/modules/relationship/relationship.schemas.ts, src/modules/relationship/relationship.service.ts, src/modules/relationship/relationship.repository.ts, src/modules/relationship/relationship.openapi.ts]
      pattern: src/modules/relationship/relationship.routes.ts
      signatures:
        - "correctCustomerNumber(actor: Actor, relationshipId: string, input: CorrectNumberInput): Promise<SupplierRelationshipView>"
      types:
        - "CorrectNumberInput = { id: string; phone_number: string; reason?: string; confirm_same_customer?: boolean }"
      errors: ["RELATIONSHIP_EXISTS 409", "CONFIRMATION_REQUIRED 409", "OWN_RECORD 403", "NOT_A_PERSON_CUSTOMER 409", "VALIDATION_ERROR 400", "FORBIDDEN 403"]
      dependencies: [express, zod, "@prisma/client"]
    security:
      - "v5.0.0-8.2.1: owner, or manager online."
      - "v5.0.0-2.3.3: repoint, journal row and scope bumps are one transaction."
    tests: |
      correct | integration | AC-1, C-12, CM-03 | repointed, journal, history unchanged, scope +1 each, notification
      existing | integration | AC-2, C-07 | 409
      same customer | integration | AC-3, CM-24 | confirmation flow and later refusal to contest
      refusals | integration | AC-4 | each Examples row → status
      innocent person | security | AB-1, CWE-841 | journal row exists; contest possible once
    command: npx vitest run tests/integration/relationship/correct-number.test.ts
    out_of_scope:
      - "Merging two histories: never done by the model."
  - id: REL-025
    title: Merge a duplicate customer record
    kind: technical
    size: S
    risk: high
    depends_on: [REL-007]
    read_first: [src/modules/relationship/relationship.repository.ts, tests/integration/relationship/party-rules.test.ts]
    design_refs: [synchronisation-hors-ligne/ce-que-recoit-et-garde-chaque-telephone, relations-commerciales/customerrelationship]
    constraints: [C-07, C-06, C-35]
    asvs: [v5.0.0-2.3.3, v5.0.0-2.3.4]
    story: "Technical story: provide the function that folds a customer record created twice offline into the first one, so that the sync server never blocks on a duplicate."
    context: |
      - Exists: `ensureCustomerRelationship`, the pair index (REL-002).
      - Adds to `relationship.repository.ts`: `mergeDuplicateRelation(tx, duplicateId, keptId)` and `resolveMergedRelation(id, tx?)`.
      - Merge: both rows must have the same supplier organization and resolve to the same person (or the duplicate's `customer_phone_number` normalizes to the kept row's person number); the duplicate gets `deleted_at` = now, `merged_into_id` = kept id and its `customer_phone_number` emptied. The kept row keeps all its settings. No ledger entry or order is rewritten.
      - `resolveMergedRelation` follows `merged_into_id` (at most 5 hops) and returns the live id; an id that is not merged returns itself.
    acceptance: |
      Scenario: AC-1 Merge
        Given two live relationships of one supplier for one person
        When mergeDuplicateRelation runs
        Then the duplicate is deleted with merged_into_id set and the kept row is unchanged
      Scenario: AC-2 Resolve
        Then resolveMergedRelation(duplicateId) returns the kept id and resolveMergedRelation(keptId) returns itself
      Scenario Outline: AC-3 Refusals
        When the pair is <case>
        Then mergeDuplicateRelation throws `httpError(409, 'CANNOT_MERGE', ...)` and changes nothing
        Examples:
          | case                                         |
          | from two different suppliers                 |
          | for two different people                     |
          | a counter                                    |
          | the same row twice                           |
      Scenario: AC-4 Atomic and repeatable
        When the merge runs twice, or its transaction rolls back
        Then the second run changes nothing, or nothing changed at all
    abuse: |
      Scenario: AB-1 Merging two identities (tampering)
        When a merge is tried between relationships of two different people
        Then it is refused and both stay live
    implementation:
      create: [tests/integration/relationship/merge-duplicate.test.ts]
      modify: [src/modules/relationship/relationship.repository.ts]
      pattern: src/modules/relationship/relationship.repository.ts
      signatures:
        - "mergeDuplicateRelation(tx: Prisma.TransactionClient, duplicateId: string, keptId: string): Promise<void>"
        - "resolveMergedRelation(id: string, tx?: Prisma.TransactionClient): Promise<string>"
      types: []
      errors: ["CANNOT_MERGE 409"]
      dependencies: ["@prisma/client"]
    security:
      - "v5.0.0-2.3.3: the merge is one transaction."
      - "v5.0.0-2.3.4: the duplicate is locked (`SELECT ... FOR UPDATE`) before it is changed."
    tests: |
      merge | integration | AC-1, C-07, C-35 | deleted, merged_into_id, kept unchanged
      resolve | integration | AC-2 | kept id; itself
      refusals | integration | AC-3, C-06 | each Examples row → CANNOT_MERGE
      repeat and rollback | integration | AC-4, CWE-362 | idempotent; rolled back leaves nothing
      two identities | security | AB-1, CWE-841 | refused
    command: npx vitest run tests/integration/relationship/merge-duplicate.test.ts
    out_of_scope:
      - "Detecting duplicates on a sync push and redirecting incoming rows (SYNC module)."
