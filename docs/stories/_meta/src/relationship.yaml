kind: module
module: relationship
prefix: REL
title: Relationship
responsibility: Owns the account between one supplier and one customer, counters, credit limits, invitations, contestation and number correction, and the visibility rule between the two parties.
entities: [CustomerRelationship, CustomerRelationshipReassignment, CreditLimitChange]
depends_on: [foundation, person, notification, access, auth, organization]
asvs_level: L2
asvs_rationale: A relationship carries a debt between two parties; every read and write must respect which party the caller is, and credit decisions are the riskiest gesture of the product.
classification:
  - "CustomerRelationship.balance, credit_limit | confidential | supplier and customer parties only; a driver receives only the available credit"
  - "CustomerRelationship.customer_label, supplier_notes | confidential | supplier party only"
  - "CustomerRelationship.supplier_label | confidential | customer party only"
  - "CustomerRelationship.customer_phone_number | PII | supplier party only until the server resolves the person"
  - "CustomerRelationship.contested_at | internal | both parties; set and cleared by the customer only"
threats:
  - "T1 | I | An organization sees relationships it is not a party to | one visibility predicate on every read and write | REL-005 AB-1, REL-008 AB-1"
  - "T2 | I | A party reads the other party's private fields | per-party projections with explicit field lists | REL-005 AB-2, REL-016 AB-2"
  - "T3 | E | A seller or driver grants credit, or a manager grants it to themselves | credit needs OWNER or online MANAGER, never on one's own record | REL-012 AB-1, AB-2"
  - "T4 | T | A debt moves to another debtor | reassignment only by a supplier correction, journaled and immutable, never to a person with a relation already; contestation only marks the record | REL-024 AB-1, REL-028 AB-1"
  - "T5 | R | A credit limit changes without a trace | every change writes the immutable journal in the same transaction | REL-004 AB-1"
  - "T6 | S | Guessing numbers to learn who is registered | lookup and invitation limits | REL-020 AB-2"
constraints:
  C-06: "A relationship has exactly one supplier (organization or person); at most one customer (person or organization), none only for a counter, and then `customer_label` is required; `customer_phone_number` is empty once `customer_person_id` is set."
  C-07: "At most one live relationship per (supplier, customer) pair, ignoring deleted and merged rows (partial unique indexes per column combination); `supplier_organization_id` differs from `customer_organization_id`; `merged_into_id` set means the row is deleted."
  C-08: "`status` is PENDING if and only if `supplier_person_id` is set."
  C-09: "`ended_by_party` is set if and only if `status` is ENDED; only that party may reopen the relationship."
  C-10: "`credit_limit` is 0 at creation and always 0 for a counter; `credit_limit_set_by_id` and `credit_limit_set_at` are set together; every change adds one `CreditLimitChange` row in the same transaction."
  C-12: "A reassignment has previous and new person set; the new person has no relationship with the same supplier; the journal is never modified."
  C-57: "`contested_at` is set and cleared by the customer alone, through an online route; a supplier correction clears it and must target another number; it is always empty for a counter."
  C-04: "Author columns (`*_by_id`, `assigned_to_id`, `reporter_id`, `person_id` of an administrator, `to_person_id`) refer to a registered person; `resolved_by_id` and `administrator_id` refer to an Administrator."
  C-32: "Immutable journals are never updated or deleted by the application; only the retention purge removes them."
  C-37: "`CustomerRelationship.balance` and `Collaboration.amount_held` are updated by adding the effect of each operation inside its transaction, always relationship first then collaboration; a nightly check compares each total with the sum of its entries."
  C-39: "The application account has only INSERT and SELECT on the immutable tables."
  CM-03: "`Person.scope_version` is incremented by the server on every rights change."
  CM-19: "`customer_label` and `supplier_notes` are never sent to the customer; `supplier_label` is never sent to the supplier; each party writes only its own fields."
  CM-24: "Contestation only sets `contested_at`, with no journal row and no change of customer; the customer then sees the record only among their hidden records, the supplier sees a contested number and is notified; only the customer clears it ('this is me'); the supplier can only correct to another number; a contested invitation is declined."
  CM-25: "Supplier invitation: acceptance replaces `supplier_person_id` by `supplier_organization_id` and sets ACTIVE, on behalf of an organization the person manages; refused, cancelled, contested or released-number invitations are deleted."
  C-01: "Identifiers use `uuid` columns (UUIDv7), amounts `bigint`, quantities `numeric(12,3)`, timestamps `timestamptz`."
  C-35: "Synchronized tables carry `server_updated_at`, set by the server on every write, and `deleted_at` for deletion; unique constraints ignore deleted rows."
contracts:
  provides:
    - name: RelationshipVisibility
      file: src/modules/relationship/relationship.visibility.ts
      story: REL-005
      items:
        - "visibleRelationsWhere(viewer: { personId: string; organizationIds: string[] }): Prisma.CustomerRelationshipWhereInput"
        - "projectForSupplier(row): SupplierRelationshipView — includes customer_label, supplier_notes, credit_limit, balance, contested_at; never supplier_label"
        - "projectForCustomer(row): CustomerRelationshipView — includes supplier_label, credit_limit, balance, contested_at; never customer_label or supplier_notes"
        - "projectForDriver(row): DriverRelationshipView — id, customer public name, available_credit only"
      used_by: [catalog, order, finance, delivery, sync]
    - name: RelationshipRepository
      file: src/modules/relationship/relationship.repository.ts
      story: REL-007
      items:
        - "ensureCustomerRelationship(tx, input: { supplierOrganizationId: string; customerPersonId?: string; customerOrganizationId?: string; createdById: string }): Promise<{ relationship: CustomerRelationship; created: boolean }>"
        - "addToBalance(tx, relationshipId: string, delta: bigint): Promise<void> — `SET balance = balance + delta`"
        - "resolveMergedRelation(id: string, tx?): Promise<string> — follows merged_into_id"
      used_by: [order, finance, delivery, sync]
  consumes:
    - "organization: loadActor, assertOrganizationActive, findOrganizationsByPublicNumber (docs/stories/modules/organization/contracts.md)"
    - "person: findOrCreateByPhone, toPublicPerson, bumpScopeVersion (docs/stories/modules/person/contracts.md)"
    - "access: requireAbility, idempotent (docs/stories/modules/access/contracts.md)"
stories:
  - id: REL-001
    title: Relationships table
    kind: technical
    size: S
    risk: medium
    depends_on: [ORG-001, PER-008, FND-005, ORG-003]
    read_first: [prisma/schema.prisma, tests/integration/organization/collaboration-table.test.ts]
    design_refs: [relations-commerciales/customerrelationship, contraintes-a-poser-au-niveau-base-de]
    constraints: [CustomerRelationship:required, CustomerRelationship.status:enum, CustomerRelationship.ended_by_party:enum, CustomerRelationship:fk, C-01, C-35]
    asvs: [v5.0.0-2.2.3]
    fields: ["CustomerRelationship.{supplier_organization_id,supplier_person_id,customer_person_id,customer_organization_id,customer_phone_number,customer_label,supplier_label,delivery_address,credit_limit,credit_limit_set_by_id,credit_limit_set_at,balance,status,ended_by_party,supplier_notes,created_by_id,created_at,merged_into_id}"]
    story: "Technical story: create the relationships table with its columns, keys and indexes so that suppliers and customers can be linked."
    context: |
      - Exists: `people`, `organizations`, `require_registered_person()`, `set_server_updated_at()`.
      - Adds: table `customer_relationships` with `balance` bigint default 0, `status` default ACTIVE, `server_updated_at` and `deleted_at`, foreign keys (including `merged_into_id` to itself), indexes on each party column, and the triggers `require_registered_person('created_by_id', 'credit_limit_set_by_id')` and `set_server_updated_at()`.
      - Party, pair, status and credit rules follow in REL-002 and REL-004.
    acceptance: |
      Scenario: AC-1 Defaults
        When a relationship is inserted with a supplier organization and a customer person
        Then `status` is ACTIVE, `balance` is 0, `created_at` and `server_updated_at` are set
      Scenario Outline: AC-2 Enums and keys
        When a row has <values>
        Then the insert <result>
        Examples:
          | values                               | result  |
          | status ENDED                         | accepts |
          | status "BLOCKED"                     | rejects |
          | ended_by_party "PLATFORM"            | rejects |
          | an unknown supplier organization     | rejects (23503) |
          | created_by_id of a guest             | rejects (23514) |
      Scenario: AC-3 Required
        When `created_by_id` is null
        Then the insert fails with 23502
    implementation:
      create: [prisma/migrations/<timestamp>_rel_001_relationships/migration.sql, tests/integration/relationship/relationship-table.test.ts]
      modify: [prisma/schema.prisma]
      pattern: tests/integration/organization/collaboration-table.test.ts
      signatures: []
      types: []
      errors: []
      dependencies: [prisma, "@prisma/client"]
    security:
      - "v5.0.0-2.2.3: enums, keys and author checks are enforced by the database."
    tests: |
      defaults | integration | AC-1, C-01, C-35 | insert → defaults; column types; server time
      enums and keys | integration | AC-2, CustomerRelationship.status:enum, CustomerRelationship.ended_by_party:enum, CustomerRelationship:fk | each Examples row → accepted or rejected
      required | integration | AC-3, CustomerRelationship:required | null created_by_id → 23502
    command: npx vitest run tests/integration/relationship/relationship-table.test.ts
    out_of_scope:
      - "Party, pair, status and credit rules (REL-002, REL-004)."
  - id: REL-002
    title: Party and pair rules in the database
    kind: technical
    size: S
    risk: high
    depends_on: [REL-001]
    read_first: [prisma/schema.prisma, tests/integration/relationship/relationship-table.test.ts]
    design_refs: [relations-commerciales/customerrelationship, contraintes-a-poser-au-niveau-base-de]
    constraints: [C-06, C-07, C-08, C-09]
    asvs: [v5.0.0-2.2.3, v5.0.0-8.2.2]
    story: "Technical story: enforce who the parties are, one live relationship per pair, and the PENDING and ENDED rules with CHECKs and partial unique indexes."
    context: |
      - Exists: `customer_relationships` (REL-001).
      - Adds: one migration with CHECKs and partial unique indexes over live rows (`deleted_at` is null and `merged_into_id` is null).
      - Party rules: exactly one of `supplier_organization_id` and `supplier_person_id`; at most one of `customer_person_id` and `customer_organization_id`; no customer means `customer_label` is set; `customer_phone_number` is null when `customer_person_id` is set; `supplier_organization_id <> customer_organization_id`.
      - Pair rules: unique live (`supplier_organization_id`, `customer_person_id`), (`supplier_organization_id`, `customer_organization_id`), (`supplier_person_id`, `customer_person_id`), (`supplier_person_id`, `customer_organization_id`); `merged_into_id` set requires `deleted_at` set.
      - State rules: `status = 'PENDING'` if and only if `supplier_person_id` is set; `ended_by_party` is set if and only if `status = 'ENDED'`.
    acceptance: |
      Scenario Outline: AC-1 Parties
        When a row has <values>
        Then the insert <result>
        Examples:
          | values                                                          | result          |
          | supplier organization and customer person                       | accepts         |
          | both supplier columns set                                       | rejects (23514) |
          | no supplier                                                     | rejects (23514) |
          | customer person and customer organization                       | rejects (23514) |
          | no customer, customer_label "Client de passage"                 | accepts         |
          | no customer, customer_label empty                               | rejects (23514) |
          | customer_person_id and customer_phone_number both set           | rejects (23514) |
          | supplier and customer organization equal                        | rejects (23514) |
      Scenario Outline: AC-2 One live relationship per pair
        When a second row for the same pair is inserted while the first is <first>
        Then the insert <result>
        Examples:
          | first                       | result          |
          | live                        | rejects (23505) |
          | deleted                     | accepts         |
          | merged into another row     | accepts         |
      Scenario: AC-3 Two counters
        When one organization has two counters with different labels
        Then both are accepted
      Scenario Outline: AC-4 Status rules
        When a row has <values>
        Then the insert <result>
        Examples:
          | values                                        | result          |
          | PENDING with a supplier person                | accepts         |
          | PENDING with a supplier organization          | rejects (23514) |
          | ACTIVE with a supplier person                 | rejects (23514) |
          | ENDED with ended_by_party CUSTOMER            | accepts         |
          | ENDED with ended_by_party empty               | rejects (23514) |
          | ACTIVE with ended_by_party SUPPLIER           | rejects (23514) |
          | merged_into_id set and deleted_at empty       | rejects (23514) |
    abuse: |
      Scenario: AB-1 Crafted duplicate relationship (tampering)
        When code inserts a second live relationship for a pair
        Then PostgreSQL refuses it, even though no validation ran
    implementation:
      create: [prisma/migrations/<timestamp>_rel_002_party_rules/migration.sql, tests/integration/relationship/party-rules.test.ts]
      modify: []
      pattern: tests/integration/relationship/relationship-table.test.ts
      signatures: []
      types: []
      errors: []
      dependencies: [prisma, "@prisma/client"]
    security:
      - "v5.0.0-2.2.3: related columns are checked together in the database."
      - "v5.0.0-8.2.2: one live row per pair prevents a second, differently scoped copy of the account."
    tests: |
      parties | integration | AC-1, C-06 | each Examples row → accepted or 23514
      pair rule | integration | AC-2, C-07 | each Examples row → accepted or 23505
      two counters | integration | AC-3, C-07 | both accepted
      state rules | integration | AC-4, C-08, C-09 | each Examples row → accepted or 23514
      crafted duplicate | security | AB-1, CWE-20 | raw second live row → 23505
    command: npx vitest run tests/integration/relationship/party-rules.test.ts
    out_of_scope:
      - "Credit limit rules (REL-004)."
  - id: REL-003
    title: Credit limit journal table
    kind: technical
    size: XS
    risk: medium
    depends_on: [REL-001, FND-002, PER-008, PER-004]
    read_first: [prisma/schema.prisma, tests/integration/person/phone-change-log.test.ts]
    design_refs: [relations-commerciales/creditlimitchange]
    constraints: [CreditLimitChange:required, CreditLimitChange:fk, C-32, C-39, C-04, C-35]
    asvs: [v5.0.0-8.3.1, v5.0.0-16.3.3]
    fields: ["CreditLimitChange.{customer_relationship_id,previous_limit,new_limit,set_by_id,set_at}"]
    story: "Technical story: create the immutable journal of credit limits so that every change of the riskiest setting can be traced."
    context: |
      - Exists: `customer_relationships` (REL-001), role `distribo_app`, `getAppRolePrisma()`.
      - Adds: table `credit_limit_changes` with `previous_limit` and `new_limit` nullable (empty means no ceiling), `server_updated_at`, triggers `require_registered_person('set_by_id')` and `set_server_updated_at()`, and `REVOKE UPDATE, DELETE, TRUNCATE ... FROM distribo_app`.
    acceptance: |
      Scenario: AC-1 Rows can be added and read
        When the application account inserts a row and selects it
        Then both succeed and `server_updated_at` is set
      Scenario: AC-2 Rows cannot change
        When the application account runs UPDATE or DELETE on a row
        Then PostgreSQL answers permission denied (42501)
      Scenario Outline: AC-3 Limits may be empty
        When a row has previous_limit <previous> and new_limit <new>
        Then the insert <result>
        Examples:
          | previous | new    | result  |
          | 0        | 50000  | accepts |
          | 50000    | empty  | accepts |
          | empty    | 100000 | accepts |
      Scenario: AC-4 Author and relationship
        When `set_by_id` is a guest, or the relationship id is unknown
        Then the insert fails with 23514 or 23503
    abuse: |
      Scenario: AB-1 Rewriting a credit decision (repudiation)
        When code running as the application account edits `new_limit`
        Then the change is refused and the row is unchanged
    implementation:
      create: [prisma/migrations/<timestamp>_rel_003_credit_limit_changes/migration.sql, tests/integration/relationship/credit-limit-changes-table.test.ts]
      modify: [prisma/schema.prisma]
      pattern: tests/integration/person/phone-change-log.test.ts
      signatures: []
      types: []
      errors: []
      dependencies: [prisma, "@prisma/client"]
    security:
      - "v5.0.0-8.3.1: only INSERT and SELECT are granted to `distribo_app`."
      - "v5.0.0-16.3.3: each credit decision has an author and a server time."
    tests: |
      add and read | integration | AC-1, CreditLimitChange:required, C-35 | as `distribo_app` → row with server time
      immutable | security | AC-2, AB-1, C-32, C-39, WSTG-ATHZ-03 | UPDATE, DELETE → 42501
      empty limits | integration | AC-3 | each Examples row → accepted
      author and key | integration | AC-4, C-04, CreditLimitChange:fk | guest → 23514; unknown relationship → 23503
    command: npx vitest run tests/integration/relationship/credit-limit-changes-table.test.ts
    out_of_scope:
      - "Writing rows: the trigger in REL-004 and the route in REL-012."
  - id: REL-004
    title: Credit limit rules and journal trigger
    kind: technical
    size: S
    risk: high
    depends_on: [REL-002, REL-003]
    read_first: [prisma/schema.prisma, tests/integration/relationship/party-rules.test.ts]
    design_refs: [relations-commerciales/customerrelationship, contraintes-a-poser-au-niveau-base-de]
    constraints: [C-10]
    asvs: [v5.0.0-2.2.3, v5.0.0-16.3.3]
    story: "Technical story: enforce the credit limit rules and write the journal row from the database, so that no code path can change a limit without a trace."
    context: |
      - Exists: `customer_relationships` with `credit_limit` (nullable bigint), `credit_limit_set_by_id`, `credit_limit_set_at`; `credit_limit_changes` (REL-003).
      - Adds: one migration. New rows get `credit_limit` 0 by default. CHECK: a counter (no customer) has `credit_limit = 0`; `credit_limit_set_by_id` and `credit_limit_set_at` are both null or both set; `credit_limit >= 0` when set.
      - Trigger `AFTER UPDATE OF credit_limit`: when the value changes it inserts one `credit_limit_changes` row (`previous_limit` = old, `new_limit` = new, `set_by_id` = `credit_limit_set_by_id`, `set_at` = `now()`); the same statement must also change `credit_limit_set_by_id` (a change with an unchanged author is refused with 23514) and sets `credit_limit_set_at` to `now()`.
    acceptance: |
      Scenario: AC-1 Default
        When a relationship is inserted without `credit_limit`
        Then `credit_limit` is 0 and no journal row exists
      Scenario Outline: AC-2 Rules
        When a row has <values>
        Then the statement <result>
        Examples:
          | values                                                   | result          |
          | counter with credit_limit 10000                          | rejects (23514) |
          | credit_limit -1                                          | rejects (23514) |
          | credit_limit_set_by_id set, credit_limit_set_at empty    | rejects (23514) |
          | credit_limit empty (no ceiling) on a customer            | accepts         |
      Scenario: AC-3 Journal from the database
        When an update sets `credit_limit` 50000 and `credit_limit_set_by_id` to a registered person
        Then one journal row has previous 0, new 50000, that author and a server time, and `credit_limit_set_at` is that time
      Scenario: AC-4 Author must change with the value
        When an update changes `credit_limit` without changing `credit_limit_set_by_id`
        Then the update fails with 23514 and the value is unchanged
      Scenario: AC-5 Same value is no change
        When an update sets the same `credit_limit`
        Then no journal row is added
      Scenario: AC-6 Same transaction
        When the transaction rolls back
        Then neither the limit nor the journal row exists
    abuse: |
      Scenario: AB-1 Silent limit change (repudiation)
        When code raises a limit and tries to avoid the journal
        Then the journal row exists anyway, or the update fails
    implementation:
      create: [prisma/migrations/<timestamp>_rel_004_credit_limit_rules/migration.sql, tests/integration/relationship/credit-limit-rules.test.ts]
      modify: []
      pattern: tests/integration/relationship/party-rules.test.ts
      signatures: []
      types: []
      errors: []
      dependencies: [prisma, "@prisma/client"]
    security:
      - "v5.0.0-2.2.3: limit, author and time are checked together."
      - "v5.0.0-16.3.3: the journal is written by a trigger, so it cannot be skipped."
    tests: |
      default | integration | AC-1, C-10 | limit 0, no journal
      rules | integration | AC-2, C-10 | each Examples row → accepted or 23514
      journal | integration | AC-3, C-10 | one row with previous, new, author, time
      author changes | integration | AC-4 | 23514, unchanged
      same value | integration | AC-5 | no row
      transaction | integration | AC-6, CWE-362 | rollback → nothing
      silent change | security | AB-1, CWE-778 | update without journal impossible
    command: npx vitest run tests/integration/relationship/credit-limit-rules.test.ts
    out_of_scope:
      - "The route that changes a limit (REL-012)."
  - id: REL-005
    title: Visibility predicate and party projections
    kind: technical
    size: M
    risk: high
    depends_on: [REL-002, ORG-005]
    read_first: [docs/stories/modules/organization/contracts.md, prisma/schema.prisma]
    design_refs: [relations-commerciales/customerrelationship, identite-et-organisation/person]
    constraints: [CM-19, CM-20]
    asvs: [v5.0.0-8.2.2, v5.0.0-8.2.3, v5.0.0-8.4.1, v5.0.0-15.3.1]
    story: "Technical story: provide the one predicate that says which relationships a viewer may see and the projections that give each party only its own fields."
    context: |
      - Exists: `customer_relationships` (REL-001, REL-002); `toPublicPerson`.
      - Adds: `src/modules/relationship/relationship.visibility.ts`.
      - `visibleRelationsWhere({ personId, organizationIds })` returns a Prisma filter: live rows (`deleted_at` and `merged_into_id` null) where the supplier or customer organization is in `organizationIds`, or `customer_person_id` = `personId`, or `supplier_person_id` = `personId`.
      - `projectForSupplier` returns `id, status, customer (public person view or organization name), customer_label, supplier_notes, delivery_address, credit_limit, credit_limit_set_by_id, credit_limit_set_at, balance, ended_by_party, created_at`; `projectForCustomer` returns `id, status, supplier (organization name and description, or person public view), supplier_label, delivery_address, credit_limit, balance, ended_by_party, created_at`; `projectForDriver` returns `id, customer name, available_credit` (limit minus balance, null when there is no ceiling).
    acceptance: |
      Scenario Outline: AC-1 Who sees a row
        Given a relationship between supplier organization S and customer person C
        When the viewer is <viewer>
        Then the row is <result>
        Examples:
          | viewer                                        | result  |
          | a member of S                                 | visible |
          | C                                             | visible |
          | a member of another organization              | hidden  |
          | another person                                | hidden  |
          | the supplier person of a PENDING invitation   | visible |
          | S when the row is deleted or merged           | hidden  |
      Scenario: AC-2 Supplier projection
        Then it contains customer_label and supplier_notes and does not contain supplier_label
      Scenario: AC-3 Customer projection
        Then it contains supplier_label and does not contain customer_label or supplier_notes
      Scenario: AC-4 Driver projection
        When the limit is 50000 and the balance 40000
        Then available_credit is 10000 and neither credit_limit nor balance is present
        And with no ceiling available_credit is null
    abuse: |
      Scenario: AB-1 Reading another organization's relationships (horizontal)
        When a viewer of organization A applies the predicate to a table holding B's rows
        Then no row of B is returned
      Scenario: AB-2 Private fields of the other party (information disclosure)
        When any projection is serialized
        Then none of the other party's private fields appears
    implementation:
      create: [src/modules/relationship/relationship.visibility.ts, tests/integration/relationship/visibility.test.ts]
      modify: []
      pattern: src/modules/tasks/tasks.repository.ts
      signatures:
        - "visibleRelationsWhere(viewer: { personId: string; organizationIds: string[] }): Prisma.CustomerRelationshipWhereInput"
        - "projectForSupplier(row: RelationshipRow): SupplierRelationshipView"
        - "projectForCustomer(row: RelationshipRow): CustomerRelationshipView"
        - "projectForDriver(row: RelationshipRow): DriverRelationshipView"
      types:
        - "DriverRelationshipView = { id: string; customer_name: string | null; available_credit: number | null }"
      errors: []
      dependencies: ["@prisma/client"]
    security:
      - "v5.0.0-8.2.2: one predicate for every consumer."
      - "v5.0.0-8.2.3: projections are built from explicit field lists."
      - "v5.0.0-8.4.1: an empty `organizationIds` matches no organization row."
    tests: |
      who sees | integration | AC-1 | each Examples row → visible or hidden
      supplier view | unit | AC-2, CM-19, CM-20 | keys checked; the customer person part has exactly public_name, phone_number, registered
      customer view | unit | AC-3, CM-19 | keys checked
      driver view | unit | AC-4 | available_credit arithmetic; no limit or balance
      other organization | security | AB-1, WSTG-ATHZ-04 | no foreign rows
      private fields | security | AB-2, CWE-200 | serialized views lack the other side's fields
    command: npx vitest run tests/integration/relationship/visibility.test.ts
    out_of_scope:
      - "Routes that use it (REL-008 onward)."
  - id: REL-006
    title: Every new organization gets its first counter
    kind: change
    size: S
    risk: medium
    depends_on: [REL-004, ORG-004]
    amends: [ORG-004]
    read_first: [src/modules/organization/organization.service.ts, src/modules/organization/organization.repository.ts]
    design_refs: [identite-et-organisation/organization, relations-commerciales/customerrelationship/comptoirs]
