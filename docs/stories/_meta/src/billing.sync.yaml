  - id: BIL-037
    title: A gift period is placed behind the paid ones
    kind: technical
    size: S
    risk: high
    depends_on: [BIL-027]
    read_first: [src/modules/billing/forfait.service.ts, src/modules/billing/subscription.repository.ts]
    design_refs: [finances/subscription]
    constraints: [C-52]
    asvs: [v5.0.0-2.3.3]
    story: "Technical story: give billing the function that places days offered by an administrator behind the periods already bought, so that a gift never shortens, ends or converts a paid period."
    context: |
      - Exists: `lockSubscriptions`, `listQueue`, `insertPeriod`, `insertEvent` (BIL-011); `addDays` (BIL-010). No route calls it yet.
      - `findPeriod(tx, id)` is added to `subscription.repository.ts`: the period or null.
      - `addGiftForfait(tx, gift)` in `forfait.service.ts` locks the business and reads the queue (ACTIVE and SCHEDULED). Empty queue: the period is ACTIVE from `now`. Otherwise it is SCHEDULED from the later of `now` and the latest `ends_at` of the queue: a lapsed ACTIVE period not yet ended still counts, so there is never a second ACTIVE row. `ends_at = addDays(starts_at, days)`.
      - Origin GIFT, the given plan, price 0, no `months`, no payment. One FORFAIT_ADDED event: actor ADMINISTRATOR with both ids, details plan, days, status. The caller checks `days` (1 to 365) and handles a repeated `id`.
    acceptance: |
      Scenario: AC-1 Nothing running
        When 30 days of PRO are placed at 2026-10-12T09:00:00Z with an empty queue
        Then the period is ACTIVE, origin GIFT, from that instant to 2026-11-11T09:00:00Z, price 0, with no `months` and no payment
      Scenario: AC-2 Behind the queue
        Given ESSENTIAL ACTIVE until 2026-11-01T00:00:00Z and PRO SCHEDULED until 2026-12-01T00:00:00Z
        When 10 days of ENTERPRISE are placed
        Then the gift is SCHEDULED from 2026-12-01T00:00:00Z to 2026-12-11T00:00:00Z and the other two periods are unchanged
      Scenario: AC-3 A lapsed period not yet ended
        Given an ACTIVE period whose `ends_at` passed one day ago
        When a gift is placed
        Then it is SCHEDULED from `now`, not ACTIVE
      Scenario: AC-4 The journal and the lookup
        When a gift is placed
        Then one FORFAIT_ADDED event has actor ADMINISTRATOR with both ids, and `findPeriod` returns the period, or null for an unknown id
    abuse: |
      Scenario: AB-1 Two gifts at once (race, T3)
        When two transactions place a gift for one business with different ids
        Then one period is ACTIVE and the other SCHEDULED from its end, with no overlap error
    implementation:
      create: [tests/integration/billing/gift-forfait.test.ts]
      modify: [src/modules/billing/forfait.service.ts, src/modules/billing/subscription.repository.ts]
      pattern: tests/integration/organization/amount-held.test.ts
      signatures:
        - "addGiftForfait(tx: Prisma.TransactionClient, gift: GiftInput): Promise<PeriodRow>"
        - "findPeriod(tx: Prisma.TransactionClient, id: string): Promise<PeriodRow | null>"
      types:
        - "GiftInput = { id: string; organizationId: string; plan: PaidPlanCode; days: number; actor: { administratorId: string; adminActionId: string }; now: Date }"
      dependencies: ["@prisma/client"]
    security:
      - "v5.0.0-2.3.3: the lock, the period and the event belong to the caller's transaction."
    tests: |
      nothing running | integration | AC-1, C-52 | ACTIVE GIFT period, dates
      behind | integration | AC-2 | SCHEDULED after the queue, others unchanged
      lapsed | integration | AC-3 | SCHEDULED from now
      journal | integration | AC-4 | event fields, lookup
      race | security | AB-1, CWE-362 | two gifts → ACTIVE and SCHEDULED, no overlap
    command: npx vitest run tests/integration/billing/gift-forfait.test.ts
    out_of_scope:
      - "The route, the admin action and the notice: BIL-023."

  - id: BIL-038
    title: A refund cancels the receipt and ends the periods of the payment
    kind: technical
    size: M
    risk: high
    depends_on: [BIL-012, BIL-014, BIL-027]
    read_first: [src/modules/billing/receipt.service.ts, src/modules/billing/payment.repository.ts]
    design_refs: [finances/subscriptionpayment, finances/subscriptionreceipt]
    constraints: [C-53, C-54]
    asvs: [v5.0.0-2.2.3, v5.0.0-2.3.3]
    story: "Technical story: give billing the function that refunds a confirmed payment: a credit note for its receipt and the end of the periods it bought, in the caller's transaction."
    context: |
      - Exists: `lockPayment`, `setPaymentOutcome` (BIL-014); `issueReceipt` and the number function (BIL-012); `endPeriod` (BIL-027); `insertEvent`. No route calls it yet.
      - `receipt.repository.ts` gains `findReceiptOfPayment`, `findCreditNoteOfPayment` and `insertCreditNote`; `subscription.repository.ts` gains `listOpenPeriodsOfPayment(tx, paymentId)` (ACTIVE or SCHEDULED).
      - `issueCreditNote(tx, receipt, now)` in `receipt.service.ts`: next number of the same series, kind CREDIT_NOTE, label `Avoir — ` plus the receipt's, same customer, rate and positive amounts, `cancels_receipt_id` the receipt's id.
      - `applyRefund(tx, { paymentId, organizationId, actor, now })` in the new `refund.service.ts` locks the payment: unknown or of another business is 404 `NOT_FOUND`, not SUCCEEDED is 409 `PAYMENT_NOT_REFUNDABLE`. It sets REFUNDED (the confirmation date stays), issues the credit note, ends each open period of the payment (ACTIVE: `ends_at = now`; SCHEDULED: `ends_at = starts_at`; ENDED, reason REFUNDED; one FORFAIT_ENDED event each) and writes one PAYMENT event (actor ADMINISTRATOR, the payment id). Later periods keep their dates. Returns `{ creditNote, endedIds }`; the caller recomputes the rights.
    acceptance: |
      Scenario: AC-1 An active period
        Given a SUCCEEDED payment of 15000 for ESSENTIAL, 3 months, its receipt R-2026-000001 and its ACTIVE period
        When `applyRefund` runs
        Then the payment is REFUNDED, a CREDIT_NOTE `R-2026-000002` has the receipt's amounts and `cancels_receipt_id`, the period is ENDED REFUNDED with `ends_at = now`, and one FORFAIT_ENDED and one PAYMENT event name the administrator
      Scenario: AC-2 A scheduled period
        Given the payment bought a SCHEDULED period, and another period follows it
        When `applyRefund` runs
        Then the scheduled period is ENDED REFUNDED with `ends_at = starts_at` and the following one is unchanged
      Scenario: AC-3 A period already over
        Given the payment's period is ENDED with reason EXPIRED
        When `applyRefund` runs
        Then the credit note exists and the period is unchanged
      Scenario Outline: AC-4 Refused
        When the payment is <case>
        Then <answer> is thrown and nothing is written
        Examples:
          | case                              | answer                         |
          | PENDING, FAILED, EXPIRED or REFUNDED | 409 `PAYMENT_NOT_REFUNDABLE` |
          | of another business, or unknown   | 404 `NOT_FOUND`                |
    abuse: |
      Scenario: AB-1 Two refunds at once (race, T3)
        When `applyRefund` runs twice in parallel for one payment
        Then one credit note exists and the other call fails with 409
    implementation:
      create: [src/modules/billing/refund.service.ts, tests/integration/billing/refund-payment.test.ts]
      modify: [src/modules/billing/receipt.service.ts, src/modules/billing/receipt.repository.ts, src/modules/billing/subscription.repository.ts]
      pattern: tests/integration/organization/amount-held.test.ts
      signatures:
        - "applyRefund(tx: Prisma.TransactionClient, input: RefundInput): Promise<RefundResult>"
        - "issueCreditNote(tx: Prisma.TransactionClient, receipt: ReceiptRow, now: Date): Promise<ReceiptRow>"
      types:
        - "RefundInput = { paymentId: string; organizationId: string; actor: { administratorId: string; adminActionId: string }; now: Date }"
        - "RefundResult = { creditNote: ReceiptRow; endedIds: string[] }"
      errors: ["NOT_FOUND 404", "PAYMENT_NOT_REFUNDABLE 409"]
      dependencies: ["@prisma/client"]
    security:
      - "v5.0.0-2.2.3: the credit note repeats the receipt's amounts, so receipt and credit note cancel out."
      - "v5.0.0-2.3.3: status, credit note, periods and events belong to the caller's transaction."
    tests: |
      active | integration | AC-1, C-53, C-54 | payment, credit note, period, events
      scheduled | integration | AC-2 | ended empty, next unchanged
      over | integration | AC-3 | credit note, period unchanged
      refused | integration | AC-4 | each Examples row → error, no rows
      race | security | AB-1, CWE-362 | parallel → one credit note
    command: npx vitest run tests/integration/billing/refund-payment.test.ts
    out_of_scope:
      - "The route, the admin action, the rights and the notice: BIL-025."

  - id: BIL-023
    title: A super administrator gives days of a plan to a business
    kind: feature
    size: M
    risk: high
    depends_on: [ADM-016, BIL-013, BIL-020, BIL-036, BIL-037]
    read_first: [src/middleware/admin-auth.ts, src/modules/billing/forfait.service.ts]
    design_refs: [finances/subscription]
    constraints: [C-55]
    asvs: [v5.0.0-8.2.1, v5.0.0-2.3.3, v5.0.0-15.3.3]
    story: As a super-admin, I want to give days of a plan to a business so that I can make up for a problem or reward a customer.
    context: |
      - Exists: `addGiftForfait`, `findPeriod` (BIL-037), `recomputeRights` (BIL-013), `enforceLimits` (BIL-020), `notifyOwnerOfAdjustment` (BIL-036), `recordAdminAction` (ADM-016), `findOrganizationSummary` (ORG-044).
      - `POST /api/v1/admin/organizations/{organizationId}/billing/gift-days` in the new `billing.admin.routes.ts` (`Router({ mergeParams: true })`), mounted in `src/app.ts` before `/admin`. Chain: `adminAuthMiddleware`, `requireAdminRole('SUPER_ADMIN')`, then the body.
      - Body, strict: `id` (UUIDv7, the gift period's id), `plan` (ESSENTIAL, PRO or ENTERPRISE), `days` (integer 1 to 365), `reason` (1 to 2000 characters).
      - `giveDays(admin, organizationId, input, now)`, one transaction: unknown business is 404 `NOT_FOUND`; lock the business; a GIFT period with this `id` of the same business, plan and days (`ends_at - starts_at`) is answered again with nothing written, any other period with it is 409 `ID_USED`. Else `recordAdminAction` GIFT_DAYS (target the business), `addGiftForfait`, `recomputeRights`, `enforceLimits`, `notifyOwnerOfAdjustment`.
      - Answer 201 `{ id, plan, days, status, starts_at, ends_at }`; a repeat gets the same fields.
    acceptance: |
      Scenario: AC-1 A gift
        Given ESSENTIAL running until 2026-11-01T00:00:00Z
        When a super administrator posts plan PRO, 30 days and a reason
        Then the answer is 201 with a SCHEDULED period of 30 days from 2026-11-01T00:00:00Z, one `admin_actions` row GIFT_DAYS targets the business with the reason, one FORFAIT_ADDED event holds the administrator and action ids, and the owner has one notice `subscription.adjusted`
      Scenario: AC-2 A business on the free plan
        When the same gift goes to a business with no period and 2 paused collaborators
        Then the period is ACTIVE, the business has the PRO limits at once and the collaborators are back
      Scenario: AC-3 A repeat
        When the same body is posted twice, then once more with the same `id` and other days
        Then the second answer is 201 with the same fields, the third is 409 `ID_USED`, and one period, one action, one event and one notice exist
      Scenario Outline: AC-4 Refused
        When the request has <problem>
        Then the answer is <answer> and nothing is written
        Examples:
          | problem                                                          | answer                 |
          | days 0 or 366, plan FREE, no reason, an unknown field, a bad id | 400 `VALIDATION_ERROR` |
          | no administration token                                          | 401 `UNAUTHORIZED`     |
          | an unknown business                                              | 404 `NOT_FOUND`        |
    abuse: |
      Scenario: AB-1 A moderator or an app user gifts days (elevation of privilege, T7)
        When a MODERATOR, and a customer's app token, post a valid gift
        Then the answers are 403 `FORBIDDEN` and 401 `UNAUTHORIZED`, and no action, period or notice exists
    implementation:
      create: [src/modules/billing/billing.admin.routes.ts, src/modules/billing/gift.service.ts, tests/integration/billing/gift-days.test.ts]
      modify: [src/modules/billing/billing.schemas.ts, src/modules/billing/billing.openapi.ts, src/app.ts]
      pattern: tests/integration/organization/amount-held.test.ts
      signatures:
        - "giveDays(admin: { administratorId: string }, organizationId: string, input: GiftDaysInput, now: Date): Promise<GiftView>"
      types:
        - "GiftDaysInput = { id: string; plan: PaidPlanCode; days: number; reason: string }"
        - "GiftView = { id: string; plan: PaidPlanCode; days: number; status: 'ACTIVE' | 'SCHEDULED' | 'ENDED'; starts_at: string; ends_at: string }"
      errors: ["VALIDATION_ERROR 400", "UNAUTHORIZED 401", "FORBIDDEN 403", "NOT_FOUND 404", "ID_USED 409"]
      dependencies: [express, zod]
    security:
      - "v5.0.0-8.2.1: the role is checked before the body is read; only a SUPER_ADMIN passes."
      - "v5.0.0-2.3.3: action, period, event, rights, limits and notice are written in one transaction."
      - "v5.0.0-15.3.3: the four body fields are the only writable ones; the business comes from the path, the administrator from the token."
    tests: |
      gift | integration | AC-1, C-55 | answer, action, event, notice
      free plan | integration | AC-2 | ACTIVE, limits, collaborators back
      repeat | integration | AC-3 | same answer, 409, single rows
      refused | integration | AC-4 | each Examples row → answer, no rows
      moderator | security | AB-1, CWE-269 | 403 and 401, no rows
    command: npx vitest run tests/integration/billing/gift-days.test.ts tests/integration/api-docs tests/integration/per-001.test.ts
    out_of_scope:
      - "Which plan and how many days fit a case: left to the administrator (Q-043)."
    tests_to_update:
      - "tests/integration/api-docs/catalog.test.ts | the route list lacks the gift-days path | add POST /api/v1/admin/organizations/{organizationId}/billing/gift-days, remove nothing"
      - "tests/integration/per-001.test.ts | the route list lacks the gift-days path | add POST /api/v1/admin/organizations/{organizationId}/billing/gift-days, remove nothing"

  - id: BIL-024
