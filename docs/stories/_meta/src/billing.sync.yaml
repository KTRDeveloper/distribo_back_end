kind: stories
module: billing
constraints:
  C-42: "At each invitation, the ACTIVE or INVITED collaborators of an organization, owner excluded, number at most `Organization.max_collaborators`; the status PAUSED is written by the server only and never for the OWNER."
  C-46: "`Product.paused_at` is written by the server only; the products on sale (not deleted, not paused, with at least one ACTIVE variant) number at most `Organization.max_products`, checked by the phone and by the online routes; what arrives in excess through synchronization is paused, never refused."
stories:
  - id: BIL-005
    title: The owner can no longer write a subscription
    kind: removal
    size: S
    risk: medium
    depends_on: [ORG-034, ORG-020]
    amends: [ORG-013, ORG-014, ORG-016]
    read_first: [src/modules/organization/organization.routes.ts, src/modules/organization/organization.service.ts]
    design_refs: [finances/subscription]
    constraints: []
    asvs: [v5.0.0-8.2.1, v5.0.0-15.3.3]
    story: As an owner, I want my plan to come only from a confirmed payment so that nobody can set a plan without paying.
    context: |
      - Exists: `POST`, `GET` and `DELETE /api/v1/organizations/{organizationId}/subscription` (ORG-013, ORG-014); `startSubscription`, `getSubscription`, `endSubscription`; `expireLapsedSubscriptions`, `insertSubscription`, `endActiveSubscription`, `findActiveSubscription`; `startSubscriptionSchema` with the subscription view types; three paths in `organization.openapi.ts`; one `endActiveSubscription` call in `closeOrganization` (ORG-016).
      - Remove all of them, with the `Subscription` type import. The three paths then answer the router's 404 `NOT_FOUND`. A plan is paid on a website and only the server writes it (BIL-009 onward).
      - `closeOrganization` keeps running the close hooks (ORG-034) and no longer touches `subscriptions`; billing ends the plans in a close hook (BIL-031).
      - Stay for now: the table and the Prisma model `Subscription` (BIL-002 rebuilds them) and the rule row `manage Subscription` (BIL-006).
    acceptance: |
      Scenario: AC-1 The three routes are gone
        When the OWNER sends POST `{ "plan": "PRO" }` and DELETE, and a member sends GET, each to `…/subscription`
        Then each answer is 404 `NOT_FOUND` and no subscription row changes
      Scenario: AC-2 Closing a business still works
        When the OWNER closes the business
        Then the answer is 200, the business is CLOSED and the team is revoked
      Scenario: AC-3 The documentation lists no subscription path
        When a client reads `/api/v1/docs/openapi.json`
        Then no path ends with `/subscription`
    abuse: |
      Scenario: AB-1 A plan is set without paying (elevation, T4)
        When an OWNER and a MANAGER each send POST `{ "plan": "ENTERPRISE" }` to `…/subscription`
        Then both get 404 `NOT_FOUND`, the count of `subscriptions` is unchanged and `organizations.plan` is still FREE
    implementation:
      create: [tests/integration/organization/subscription-routes-removed.test.ts]
      modify: [src/modules/organization/organization.routes.ts, src/modules/organization/organization.service.ts, src/modules/organization/organization.repository.ts, src/modules/organization/organization.schemas.ts, src/modules/organization/organization.openapi.ts]
      pattern: src/middleware/require-ability.ts
      signatures: []
      types: []
      errors: ["NOT_FOUND 404"]
      dependencies: []
    security:
      - "v5.0.0-8.2.1: no route lets the client write a plan; the only writer is the server after a payment."
      - "v5.0.0-15.3.3: no body field reaches `subscriptions` or the plan columns of an organization."
    tests: |
      routes gone | integration | AC-1 | POST, DELETE and GET → 404, rows unchanged
      close | integration | AC-2 | owner closes → 200, CLOSED, team revoked
      docs | integration | AC-3 | openapi.json has no `/subscription` path
      no free plan | security | AB-1, CWE-285 | OWNER and MANAGER post a plan → 404, count unchanged, plan FREE
    command: npx vitest run tests/integration/organization tests/integration/api-docs tests/integration/per-001.test.ts
    out_of_scope:
      - "Dropping or rebuilding the table: BIL-002."
      - "The `manage Subscription` rule row: BIL-006."
    tests_to_update:
      - "tests/integration/organization/subscription-start.test.ts | every case calls the removed POST route | file deleted; subscription-routes-removed.test.ts covers the refused route"
      - "tests/integration/organization/subscription-end.test.ts | every case calls the removed DELETE and GET routes | file deleted; subscription-routes-removed.test.ts covers the refused routes"
      - "tests/integration/organization/close.test.ts | AC-2 expects the ACTIVE subscription to become EXPIRED and AC-5 expects a failing trigger on `subscriptions` to undo the close | both cases and the seeds of `subscriptions` are dropped; a failing close hook is covered by lifecycle-hooks.test.ts (ORG-034)"
      - "tests/integration/api-docs/catalog.test.ts | lists the path `/api/v1/organizations/{organizationId}/subscription` | the path is removed from the list and checked absent"

  - id: BIL-006
    title: The rules table has no subscription row and gains the keep rows
    kind: change
    size: XS
    risk: medium
    depends_on: [BIL-005, ORG-040]
    amends: [ACC-005]
    read_first: [src/shared/access/ability.ts, tests/unit/access/ability.test.ts]
    design_refs: [annexe-la-table-des-regles/extrait-du-fichier, finances/subscription]
    constraints: []
    asvs: [v5.0.0-8.2.1, v5.0.0-15.3.3]
    story: "Technical story: take the subscription out of the rules table and add the two rows that let an owner choose what to keep, so that no row grants `manage`."
    context: |
      - Exists: `{ who: OWNER, where: ONLINE_FOR_ALL, action: manage, subject: Subscription }` in `src/shared/access/ability.ts`; no route reads it after BIL-005. ORG-040 already replaced `manage` on Collaboration, so this is the last `manage` row.
      - Remove it. The design gives the subscription no rule: it is paid on a website and only the server writes it. The owner reads their subscription screen with an OWNER check in billing (BIL-016).
      - Add two OWNER rows, ONLINE_FOR_ALL, with no fields: `keep` on Collaboration and `keep` on Product (choose who and what to keep when the plan drops; the server writes the pause). They ship before their route (BIL-018).
      - A new unit test fails when any row of `RULES` has the action `manage`.
    acceptance: |
      Scenario: AC-1 The subscription has no rule
        When abilityFor is built for each role online
        Then can(manage, Subscription), can(read, Subscription), can(create, Subscription) and can(update, Subscription) are false for all four
      Scenario Outline: AC-2 The keep rows
        When abilityFor is built for <role> with <ctx>
        Then can(keep, <subject>) is <result>
        Examples:
          | role    | ctx     | subject       | result |
          | OWNER   | online  | Collaboration | true   |
          | OWNER   | online  | Product       | true   |
          | OWNER   | offline | Product       | false  |
          | MANAGER | online  | Collaboration | false  |
      Scenario: AC-3 No row grants manage
        When the rows of `RULES` are listed
        Then none has the action `manage`
    abuse: |
      Scenario: AB-1 A manager keeps and drops team seats (elevation)
        When abilityFor is built for MANAGER, SELLER and DRIVER, online and offline
        Then can(keep, Collaboration) and can(keep, Product) are false for all six
    implementation:
      create: [tests/unit/access/no-manage-rule.test.ts]
      modify: [src/shared/access/ability.ts]
      pattern: tests/unit/access/require-ability.test.ts
      signatures: []
      types: []
      errors: []
      dependencies: []
    security:
      - "v5.0.0-8.2.1: only the OWNER, online, holds `keep`; the server checks it on every request."
      - "v5.0.0-15.3.3: `keep` carries no field, so the route lists what its body may name."
    tests: |
      no subscription rule | unit | AC-1 | four roles, four actions → false
      keep rows | unit | AC-2 | each Examples row → result
      no manage | unit | AC-3 | no row of RULES has action manage
      keep by others | security | AB-1, CWE-285 | MANAGER, SELLER, DRIVER, online and offline → false
    command: npx vitest run tests/unit/access
    out_of_scope:
      - "The route that uses `keep`: BIL-018."
    tests_to_update:
      - "tests/unit/access/ability.test.ts | the list of owner rows names `manage:Subscription` and one test expects `manage` on Subscription to be true for the owner | the list has no `manage:Subscription` and has `keep:Collaboration` and `keep:Product`; the owner can no longer `manage` Subscription"

  - id: BIL-001
    title: Table of subscription payments
    kind: migration
    size: M
    risk: high
    depends_on: [ORG-020]
    read_first: [prisma/schema.prisma, prisma/migrations/20261004180000_adm_002_admin_actions/migration.sql]
    design_refs: [finances/subscriptionpayment, contraintes-a-poser-au-niveau-base-de]
    constraints: [SubscriptionPayment:required, SubscriptionPayment.provider_reference:unique, SubscriptionPayment.plan:enum, SubscriptionPayment.operator:enum, SubscriptionPayment.status:enum, SubscriptionPayment:fk, C-53]
    asvs: [v5.0.0-2.2.3]
    story: "Technical story: create the table of payment requests with the rules that stop a payment from being changed or counted twice, so that no later writer can bypass them."
    context: |
      - Exists: `organizations` (ORG-020). No payment table.
      - One migration creates enums `PaidPlan` (ESSENTIAL, PRO, ENTERPRISE; BIL-002 reuses it), `PaymentOperator`, `PaymentStatus` and table `subscription_payments` (`status` default PENDING, `created_at` default now(), `provider_payload` jsonb, indexes on (`organization_id`, `created_at`) and (`status`, `created_at`)).
      - Checks (23514): `amount` above 0; `months` 1, 3, 6 or 12; `confirmed_at` set exactly when `status` is SUCCEEDED or REFUNDED; `payer_phone_number` empty exactly when `operator` is OTHER.
      - Trigger `subscription_payments_check_update` (23514): a status moves only from PENDING to another value or from SUCCEEDED to REFUNDED; only `status`, `provider_payload` and `confirmed_at` may change.
      - GRANT SELECT, INSERT, UPDATE; DELETE and TRUNCATE revoked (the purge, PRIV, uses the migration account).
      - `prisma/schema.prisma`: enums, model and, above it, a plain-words `//` comment: a payment only moves forward, amount and plan never change, the reference is unique, and the migration.
    acceptance: |
      Scenario: AC-1 A pending payment
        When a payment of 15 000, ESSENTIAL, 3 months, MTN_MOMO, with a payer number is inserted
        Then it is stored with status PENDING and `confirmed_at` empty
      Scenario Outline: AC-2 Wrong rows are refused
        When a row is inserted with <problem>
        Then the database refuses it with <code>
        Examples:
          | problem                            | code  |
          | months 2, or amount 0              | 23514 |
          | operator OTHER with a payer number | 23514 |
          | SUCCEEDED and no `confirmed_at`    | 23514 |
          | plan FREE                          | 22P02 |
          | no `terms_version`                 | 23502 |
      Scenario Outline: AC-3 Status moves
        When a row in <from> is updated to <to>
        Then the update <result>
        Examples:
          | from      | to         | result       |
          | PENDING   | SUCCEEDED  | succeeds     |
          | SUCCEEDED | REFUNDED   | succeeds     |
          | SUCCEEDED | PENDING    | fails 23514  |
          | FAILED    | SUCCEEDED  | fails 23514  |
      Scenario: AC-4 Frozen columns
        When `amount`, `plan`, `months`, `provider_reference` or `payer_phone_number` of a stored row is updated
        Then each update fails with 23514
      Scenario: AC-5 No delete
        When the application account deletes or truncates the table
        Then each statement fails with 42501
    abuse: |
      Scenario: AB-1 A confirmed payment is replayed (tampering, T3)
        When SQL sets a SUCCEEDED payment back to PENDING
        Then the database refuses with 23514 and the row is unchanged
      Scenario: AB-2 The same transaction is recorded twice (tampering, T3)
        When a second payment has the same `provider_reference`
        Then the database refuses with 23505 and one row exists
    implementation:
      create: [prisma/migrations/<timestamp>_bil_001_subscription_payments/migration.sql, tests/integration/billing/subscription-payments-table.test.ts]
      modify: [prisma/schema.prisma]
      pattern: tests/integration/organization/amount-held.test.ts
      signatures: []
      types: []
      errors: []
      dependencies: [prisma, "@prisma/client"]
    security:
      - "v5.0.0-2.2.3: the database holds the rules, so every writer obeys them: no delete, no change of money fields, no status regression."
    tests: |
      pending | integration | AC-1 | insert the payment → PENDING, date set
      wrong rows | integration | AC-2, SubscriptionPayment:required, SubscriptionPayment.provider_reference:unique, SubscriptionPayment.plan:enum, SubscriptionPayment.operator:enum, SubscriptionPayment.status:enum, SubscriptionPayment:fk | each Examples row → the code
      moves | integration | AC-3, C-53 | each Examples row → result
      frozen | integration | AC-4 | each update → 23514
      no delete | integration | AC-5 | DELETE and TRUNCATE as the application role → 42501
      replay | security | AB-1, CWE-345 | SUCCEEDED → PENDING → 23514
      duplicate | security | AB-2, CWE-362 | same reference twice → 23505
    command: npx vitest run tests/integration/billing/subscription-payments-table.test.ts
    out_of_scope:
      - "Writing payments: BIL-009, BIL-014. Purging old requests: PRIV."

  - id: BIL-002
    title: The subscriptions table holds prepaid periods
    kind: migration
    size: M
    risk: high
    depends_on: [BIL-001, BIL-005]
    amends: [ORG-012]
    read_first: [prisma/schema.prisma, prisma/migrations/20261004120000_org_012_subscriptions/migration.sql]
    design_refs: [finances/subscription, contraintes-a-poser-au-niveau-base-de]
    constraints: [Subscription:required, Subscription.plan:enum, Subscription.origin:enum, Subscription.status:enum, Subscription.end_reason:enum, Subscription:fk, C-52]
    asvs: [v5.0.0-2.2.3]
    story: "Technical story: rebuild the subscriptions table as prepaid periods with the rules that keep one period running at a time, so that no writer can store a plan that makes no sense."
    context: |
      - Exists: `subscriptions` with `plan` text, status ACTIVE or EXPIRED and nullable dates (ORG-012), no longer written (BIL-005); `PaidPlan` and `subscription_payments` (BIL-001).
      - Migration `<timestamp>_bil_002_subscription_periods`: (1) preflight `DO` block: any row raises an error with the count and at most 20 ids (old rows have no price or payment, nothing is invented); (2) drop the table and the old `SubscriptionStatus`; (3) create `SubscriptionStatus` (SCHEDULED, ACTIVE, ENDED), `SubscriptionOrigin` (PAYMENT, CONVERSION, GIFT), `SubscriptionEndReason` (EXPIRED, UPGRADED, CLOSED, REFUNDED); (4) create the new `subscriptions`, dates not null.
      - Unique: one ACTIVE row per `organization_id`; one row per `payment_id` when set. The no-overlap rule is BIL-032.
      - Checks (23514): `starts_at` not after `ends_at`; `months` 1, 3, 6 or 12 when set; `payment_id` and `months` set exactly when `origin` is PAYMENT; `end_reason` set exactly when `status` is ENDED; `price` 0 unless `origin` is PAYMENT.
      - GRANT SELECT, INSERT, UPDATE; DELETE and TRUNCATE revoked. `prisma/schema.prisma`: enums and model, with the `//` comment above `Subscription` rewritten in plain words (one running period, no overlap, the payment rule, only the server writes, the migration).
    acceptance: |
      Scenario: AC-1 The preflight stops on an old row
        Given a scratch table `subscriptions(id uuid)` first in `search_path` holding two rows
        When the preflight runs
        Then it raises an error with the count 2 and the two ids; with no row it succeeds
      Scenario: AC-2 Valid periods
        When a PAYMENT period (PRO, 3 months, 30 000, with its payment), a CONVERSION period and a GIFT period (price 0) are inserted
        Then all three are stored
      Scenario Outline: AC-3 Wrong rows are refused
        When a row is inserted with <problem>
        Then the database refuses it with <code>
        Examples:
          | problem                                         | code  |
          | a second ACTIVE period for the business         | 23505 |
          | `starts_at` after `ends_at`                     | 23514 |
          | PAYMENT without a payment                       | 23514 |
          | CONVERSION with a price                         | 23514 |
          | ENDED without `end_reason`                      | 23514 |
      Scenario: AC-4 Periods are never deleted
        When the application account deletes or truncates the table
        Then each statement fails with 42501
    abuse: |
      Scenario: AB-1 One payment buys two periods (tampering, T3)
        When a second period uses the payment of an existing period
        Then the database refuses with 23505 and one period exists
    implementation:
      create: [prisma/migrations/<timestamp>_bil_002_subscription_periods/migration.sql, tests/integration/billing/subscriptions-table.test.ts]
      modify: [prisma/schema.prisma]
      pattern: tests/integration/organization/amount-held.test.ts
      signatures: []
      types: []
      errors: []
      dependencies: [prisma, "@prisma/client"]
    security:
      - "v5.0.0-2.2.3: the database refuses inconsistent periods whatever the writer does; the preflight message names ids only."
    tests: |
      preflight | integration | AC-1 | two scratch rows → error with count and ids; none → passes
      valid periods | integration | AC-2, Subscription:required, Subscription.plan:enum, Subscription.origin:enum, Subscription.status:enum, Subscription.end_reason:enum, Subscription:fk | three periods → stored
      wrong rows | integration | AC-3, C-52 | each Examples row → the code
      no delete | integration | AC-4 | DELETE, TRUNCATE → 42501
      same payment | security | AB-1, CWE-362 | second period with the same payment → 23505
    command: npx vitest run tests/integration/billing/subscriptions-table.test.ts tests/integration/organization
    out_of_scope:
      - "Writing periods: BIL-011, BIL-014, BIL-023. The no-overlap rule: BIL-032."
    tests_to_update:
      - "tests/integration/organization/subscription-table.test.ts | inserts the old shape (plan text, status ACTIVE or EXPIRED, nullable dates) | file deleted; subscriptions-table.test.ts covers the new shape"
      - "tests/integration/organization/reopen.test.ts | seeds a `subscriptions` row of the old shape (plan 'BASIC', status EXPIRED) and expects it unchanged after reopening | the seed is dropped with the assertion on it"

  - id: BIL-032
    title: Two periods of one business can never overlap
    kind: migration
    size: XS
    risk: high
    depends_on: [BIL-002]
    read_first: [prisma/schema.prisma, prisma/migrations/20261004120000_org_012_subscriptions/migration.sql]
    design_refs: [finances/subscription, contraintes-a-poser-au-niveau-base-de]
    constraints: [C-52]
    asvs: [v5.0.0-2.2.3]
    story: "Technical story: forbid overlapping periods of one business in the database, so that a double write never doubles the time a customer has paid for."
    context: |
      - Exists: `subscriptions` with `starts_at` and `ends_at` not null and a unique ACTIVE row per business (BIL-002).
      - Migration `<timestamp>_bil_032_subscription_no_overlap`: `CREATE EXTENSION IF NOT EXISTS btree_gist`, then an exclusion constraint on (`organization_id` with `=`, `tstzrange(starts_at, ends_at)` with `&&`). Refusal is 23P01.
      - Periods that touch (one ends when the next starts) are allowed. A period absorbed by an upgrade ends with `ends_at = starts_at`, an empty range that overlaps nothing.
      - Add a sentence above `Subscription` in `prisma/schema.prisma`: two periods of one business never overlap, enforced by the migration; the schema cannot express it.
    acceptance: |
      Scenario: AC-1 Back-to-back periods
        When two periods of one business are inserted, the second starting when the first ends
        Then both are stored
      Scenario: AC-2 Overlap refused
        When a period starts inside another period of the same business
        Then the database refuses with 23P01 and one period exists
      Scenario: AC-3 Other businesses and empty ranges
        When the same dates are used by another business, and when a SCHEDULED period is ended with `ends_at` equal to `starts_at`
        Then both succeed
    abuse: |
      Scenario: AB-1 Two writers each add the same month (tampering, T3)
        When two transactions insert periods starting inside each other for one business
        Then one commits and the other fails with 23P01
    implementation:
      create: [prisma/migrations/<timestamp>_bil_032_subscription_no_overlap/migration.sql, tests/integration/billing/subscription-no-overlap.test.ts]
      modify: [prisma/schema.prisma]
      pattern: tests/integration/organization/amount-held.test.ts
      signatures: []
      types: []
      errors: []
      dependencies: [prisma, "@prisma/client"]
    security:
      - "v5.0.0-2.2.3: the database, not each writer, keeps periods from overlapping."
    tests: |
      touching | integration | AC-1 | back-to-back periods → stored
      overlap | integration | AC-2, C-52 | period inside another → 23P01
      scope | integration | AC-3 | other business, empty range → stored
      parallel | security | AB-1, CWE-362 | two parallel inserts → one 23P01
    command: npx vitest run tests/integration/billing/subscription-no-overlap.test.ts
    out_of_scope:
      - "Choosing start dates: BIL-010 and BIL-011."

  - id: BIL-003
    title: Table of subscription receipts with gap-free numbers
    kind: migration
    size: M
    risk: high
    depends_on: [BIL-001]
    read_first: [prisma/schema.prisma, prisma/migrations/20261004180000_adm_002_admin_actions/migration.sql]
    design_refs: [finances/subscriptionreceipt, contraintes-a-poser-au-niveau-base-de]
    constraints: [SubscriptionReceipt:required, SubscriptionReceipt.number:unique, SubscriptionReceipt.kind:enum, SubscriptionReceipt:fk, C-54, C-39]
    asvs: [v5.0.0-2.2.3]
    story: "Technical story: create the receipt table, its number function and its credit-note rules so that a receipt can never be changed, skipped or cancelled twice."
    context: |
      - Exists: `subscription_payments` (BIL-001), `organizations`.
      - Migration `<timestamp>_bil_003_subscription_receipts`: enum `ReceiptKind`; table `subscription_receipts` as in the design, `issued_at` default now(); unique on `cancels_receipt_id`.
      - Checks (23514): `number` matches `R-YYYY-NNNNNN`; `amount` = `amount_excl_tax` + `vat_amount`; `amount` above 0, other amounts not below 0; `cancels_receipt_id` set exactly when `kind` is CREDIT_NOTE.
      - Trigger `subscription_receipts_check_credit_note` (23514): the cancelled row is a RECEIPT with the same business, payment and amounts.
      - SQL function `next_subscription_receipt_number(issued timestamptz)`: takes `pg_advisory_xact_lock`, returns `R-<issue year>-<last suffix + 1, 6 digits>`; one series across years. A BEFORE INSERT trigger takes the same lock and refuses (23514) any other number.
      - GRANT SELECT, INSERT and EXECUTE on the function only (C-39). `prisma/schema.prisma`: enum, model and a plain-words `//` comment above it (never changed, numbers gap-free, one credit note per receipt, migration).
    acceptance: |
      Scenario: AC-1 A receipt
        When a RECEIPT of 5 000 (4 193 excl. tax, 807 VAT, rate 1925) is inserted with the number the function returned
        Then it is stored with `issued_at` set
      Scenario Outline: AC-2 Wrong rows are refused
        When a row is inserted with <problem>
        Then the database refuses it with <code>
        Examples:
          | problem                                           | code  |
          | `amount` not equal to excl. tax plus VAT          | 23514 |
          | number `R-26-1`                                   | 23514 |
          | CREDIT_NOTE without `cancels_receipt_id`          | 23514 |
          | a second credit note for one receipt              | 23505 |
          | a credit note with another amount                 | 23514 |
      Scenario: AC-3 Numbers
        Given an empty table, then a table whose last number is `R-2026-000007`
        When the function runs for a date in 2026
        Then it returns `R-2026-000001`, then `R-2026-000008`; inserting `R-2026-000010` is refused with 23514
      Scenario: AC-4 Never changed or deleted
        When the application account updates, deletes or truncates
        Then each statement fails with 42501
    abuse: |
      Scenario: AB-1 A receipt amount is rewritten (tampering, T8)
        When the application account sets `amount` of a stored receipt
        Then the statement fails with 42501 and the row is unchanged
      Scenario: AB-2 Two receipts at once (tampering, T8)
        When two transactions each ask for a number and insert
        Then the numbers are consecutive, none skipped and none repeated
    implementation:
      create: [prisma/migrations/<timestamp>_bil_003_subscription_receipts/migration.sql, tests/integration/billing/subscription-receipts-table.test.ts]
      modify: [prisma/schema.prisma]
      pattern: tests/integration/organization/amount-held.test.ts
      signatures: ["next_subscription_receipt_number(issued timestamptz) RETURNS text"]
      types: []
      errors: []
      dependencies: [prisma, "@prisma/client"]
    security:
      - "v5.0.0-2.2.3: the database, not the writer, keeps numbers gap-free and receipts unchanged."
    tests: |
      receipt | integration | AC-1, SubscriptionReceipt:required, SubscriptionReceipt.number:unique, SubscriptionReceipt.kind:enum, SubscriptionReceipt:fk | insert → stored
      wrong rows | integration | AC-2, C-54 | each Examples row → the code
      numbers | integration | AC-3 | function and gap → results
      immutable | integration | AC-4, C-39 | UPDATE, DELETE, TRUNCATE → 42501
      rewrite | security | AB-1, CWE-345 | UPDATE amount → 42501
      parallel | security | AB-2, CWE-362 | two transactions → consecutive numbers
    command: npx vitest run tests/integration/billing/subscription-receipts-table.test.ts
    out_of_scope:
      - "Issuing receipts and VAT arithmetic: BIL-012. A yearly reset of the series: open question."

  - id: BIL-004
    title: Table of subscription events
    kind: migration
