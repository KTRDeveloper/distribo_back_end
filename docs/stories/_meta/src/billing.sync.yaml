  - id: BIL-025
    title: A super administrator refunds a payment after an error
    kind: feature
    size: S
    risk: high
    depends_on: [BIL-023, BIL-038, BIL-017]
    read_first: [src/modules/billing/billing.admin.routes.ts, src/modules/billing/refund.service.ts]
    design_refs: [finances/subscriptionpayment, finances/subscriptionreceipt]
    constraints: [C-54]
    asvs: [v5.0.0-8.2.1, v5.0.0-8.2.2, v5.0.0-2.3.3]
    story: As a super-admin, I want to refund a payment made by mistake so that the business gets a credit note and its plan stops.
    context: |
      - Exists: `applyRefund`, `findCreditNoteOfPayment` (BIL-038), `lockPayment` (BIL-014), the receipt view of BIL-017, `recomputeRights`, `enforceLimits`, `notifyOwnerOfAdjustment`, the admin router (BIL-023).
      - `POST /api/v1/admin/organizations/{organizationId}/billing/payments/{paymentId}/refund`, same chain as BIL-023. Both ids must be UUIDs; body, strict: `reason` (1 to 2000 characters). The payment id is the key of the gesture.
      - `refundPayment(admin, organizationId, paymentId, input, now)`, one transaction: lock the payment; unknown, or of another business, is 404 `NOT_FOUND`; already REFUNDED is answered again with nothing written. Else `recordAdminAction` REFUND_PAYMENT (target the business), `applyRefund`, `recomputeRights`, `enforceLimits`, `notifyOwnerOfAdjustment`.
      - Answer 200 `{ payment_id, status: 'REFUNDED', credit_note }`, the credit note being the item of BIL-017.
    acceptance: |
      Scenario: AC-1 A refund
        Given a SUCCEEDED ESSENTIAL payment with its receipt and ACTIVE period, and 4 collaborators
        When a super administrator posts a reason
        Then the answer is 200 with the credit note, one `admin_actions` row REFUND_PAYMENT targets the business, the business is on the free plan with its extra collaborators paused, and the owner has one notice
      Scenario: AC-2 A repeat
        When the same refund is posted twice
        Then both answers are the same 200, and one credit note, one action and one notice exist
      Scenario Outline: AC-3 Refused
        When the request has <problem>
        Then the answer is <answer> and nothing is written
        Examples:
          | problem                                                | answer                         |
          | a PENDING, FAILED or EXPIRED payment                   | 409 `PAYMENT_NOT_REFUNDABLE`   |
          | a payment of another business, or an unknown one       | 404 `NOT_FOUND`                |
          | no reason, an unknown field, an id that is not a UUID  | 400 `VALIDATION_ERROR`         |
          | no administration token                                | 401 `UNAUTHORIZED`             |
    abuse: |
      Scenario: AB-1 A moderator refunds a payment (elevation of privilege, T7)
        When a MODERATOR posts a valid refund
        Then the answer is 403 `FORBIDDEN` and the payment, receipts and periods are unchanged
      Scenario: AB-2 A payment of another business under a business id (information disclosure)
        When the path names business A and the payment of business B
        Then the answer is 404 and nothing of B changes
    implementation:
      create: [src/modules/billing/refund-payment.service.ts, tests/integration/billing/refund-gesture.test.ts]
      modify: [src/modules/billing/billing.admin.routes.ts, src/modules/billing/billing.schemas.ts, src/modules/billing/billing.openapi.ts]
      pattern: tests/integration/organization/amount-held.test.ts
      signatures:
        - "refundPayment(admin: { administratorId: string }, organizationId: string, paymentId: string, input: { reason: string }, now: Date): Promise<RefundView>"
      types:
        - "RefundView = { payment_id: string; status: 'REFUNDED'; credit_note: ReceiptView }"
      errors: ["VALIDATION_ERROR 400", "UNAUTHORIZED 401", "FORBIDDEN 403", "NOT_FOUND 404", "PAYMENT_NOT_REFUNDABLE 409"]
      dependencies: [express, zod]
    security:
      - "v5.0.0-8.2.1: the role is checked before the body is read; only a SUPER_ADMIN passes."
      - "v5.0.0-8.2.2: the payment must belong to the business of the path, else 404."
      - "v5.0.0-2.3.3: action, refund, rights and notice are written in one transaction."
    tests: |
      refund | integration | AC-1, C-54 | answer, action, free plan, notice
      repeat | integration | AC-2 | same answer, single rows
      refused | integration | AC-3 | each Examples row → answer, no rows
      moderator | security | AB-1, CWE-269 | 403, nothing changed
      other business | security | AB-2, CWE-639 | 404, B unchanged
    command: npx vitest run tests/integration/billing/refund-gesture.test.ts tests/integration/api-docs tests/integration/per-001.test.ts
    out_of_scope:
      - "Returning the money to the payer: done outside Distribo. Which periods a refund ends is open (Q-043)."
    tests_to_update:
      - "tests/integration/api-docs/catalog.test.ts | the route list lacks the refund path | add POST /api/v1/admin/organizations/{organizationId}/billing/payments/{paymentId}/refund, remove nothing"
      - "tests/integration/per-001.test.ts | the route list lacks the refund path | add POST /api/v1/admin/organizations/{organizationId}/billing/payments/{paymentId}/refund, remove nothing"

  - id: BIL-028
    title: A business's periods and rights follow the clock
    kind: technical
    size: M
    risk: high
    depends_on: [BIL-013, BIL-020, BIL-027, ORG-045]
    read_first: [src/modules/billing/rights.service.ts, src/modules/billing/limits.service.ts]
    design_refs: [finances/subscription]
    constraints: [C-52]
    asvs: [v5.0.0-2.3.3, v5.0.0-8.2.2]
    story: "Technical story: give billing the function that ends the periods that ran out, starts the ones whose turn came, and refreshes the rights and the paused items of one business."
    context: |
      - Exists: `lockSubscriptions`, `listQueue`, `insertEvent` (BIL-011); `endPeriod` (BIL-027); `recomputeRights` (BIL-013); `enforceLimits` (BIL-020); `readPlanFields` (ORG-045).
      - Why: a period row changes only when a purchase writes it, so something must make `status` and the plan columns follow the date.
      - `subscription.repository.ts` gains `activatePeriod(tx, id)`: SCHEDULED becomes ACTIVE.
      - `advanceSubscription(tx, organizationId, now)` in the new `advance.service.ts` locks, then walks the queue by `starts_at`:
        - an ACTIVE period with `ends_at <= now` is ended, reason EXPIRED, `ends_at` kept;
        - a SCHEDULED one with `starts_at <= now` is ended the same way when its `ends_at <= now` too, else activated;
        - each ended period writes one FORFAIT_ENDED event (actor SYSTEM, details: period id, reason).
      - Then it reads the plan fields, calls `recomputeRights` and `enforceLimits`. When `plan` or `grace_ends_at` differs from before it writes one PLAN_CHANGED event (actor SYSTEM, details: from, to, `grace_ends_at`). It returns `{ ended, started, planChanged }`; an unknown or deleted business gives zeros and writes nothing.
    acceptance: |
      Scenario: AC-1 A period runs out
        Given an ESSENTIAL ACTIVE period that ended 3 days ago, nothing after it, and plan columns still ESSENTIAL without grace
        When `advanceSubscription` runs
        Then the period is ENDED EXPIRED with its `ends_at` kept, one FORFAIT_ENDED event (SYSTEM) exists, `grace_ends_at` is 7 days after that end, one PLAN_CHANGED event holds the grace date, and the result is `ended` 1, `started` 0, `planChanged` true
      Scenario: AC-2 The next period takes over
        Given an ESSENTIAL ACTIVE period that ended 1 hour ago and an ESSENTIAL one SCHEDULED from that instant for a month
        When `advanceSubscription` runs
        Then the first is ENDED EXPIRED, the second ACTIVE, the plan is ESSENTIAL without grace, and no PLAN_CHANGED event is written
      Scenario: AC-3 A lower plan follows
        Given a PRO ACTIVE period that ended 2 days ago, an ESSENTIAL one SCHEDULED from that instant for 3 months, and 8 ACTIVE non-owner seats
        When `advanceSubscription` runs
        Then ESSENTIAL is ACTIVE, one PLAN_CHANGED event goes from PRO to ESSENTIAL, and 3 seats are paused
      Scenario: AC-4 Whole periods were missed
        Given three ESSENTIAL periods in a row, the first ACTIVE and ended 40 days ago, the second ended 20 days ago, the third SCHEDULED for 3 months
        When `advanceSubscription` runs
        Then the first two are ENDED EXPIRED, the third is ACTIVE and two FORFAIT_ENDED events exist
      Scenario: AC-5 The grace is over
        Given the last ESSENTIAL period ENDED EXPIRED 8 days ago, plan columns ESSENTIAL and 4 ACTIVE non-owner seats
        When `advanceSubscription` runs
        Then the business is FREE, one PLAN_CHANGED event goes from ESSENTIAL to FREE, and 2 seats are paused
      Scenario Outline: AC-6 Nothing to do
        Given <state>
        When `advanceSubscription` runs
        Then no period, event or other row changes and the result is zeros
        Examples:
          | state                                           |
          | an ACTIVE period still running, rights written  |
          | a SCHEDULED period starting in the future       |
          | a deleted business                              |
    abuse: |
      Scenario: AB-1 Two runs at once (race, T3)
        When two transactions advance one business whose ACTIVE period lapsed and whose next one is due
        Then one set of events exists, one period is ACTIVE and no unique-index error escapes
    implementation:
      create: [src/modules/billing/advance.service.ts, tests/integration/billing/advance.test.ts]
      modify: [src/modules/billing/subscription.repository.ts]
      pattern: tests/integration/organization/amount-held.test.ts
      signatures:
        - "advanceSubscription(tx: Prisma.TransactionClient, organizationId: string, now: Date): Promise<AdvanceResult>"
        - "activatePeriod(tx: Prisma.TransactionClient, id: string): Promise<void>"
      types:
        - "AdvanceResult = { ended: number; started: number; planChanged: boolean }"
      errors: []
      dependencies: ["@prisma/client"]
    security:
      - "v5.0.0-2.3.3: ending, starting, events, rights and limits run in the caller's transaction, under the business's lock."
      - "v5.0.0-8.2.2: every read and write uses the organization id given by server code; no client value."
    tests: |
      runs out | integration | AC-1, C-52 | ended, event, grace date
      takes over | integration | AC-2 | ACTIVE, no plan event
      lower plan | integration | AC-3 | PRO to ESSENTIAL, 3 paused
      missed | integration | AC-4 | two ended, one ACTIVE
      grace over | integration | AC-5 | FREE, 2 paused
      nothing | integration | AC-6 | each Examples row → no change
      race | security | AB-1, CWE-362 | two parallel runs → one set of events
    command: npx vitest run tests/integration/billing/advance.test.ts
    out_of_scope:
      - "The daily job and its list of businesses: BIL-039. Reminders: BIL-026."

  - id: BIL-039
    title: A daily job advances every business that needs it
    kind: technical
    size: S
    risk: high
    depends_on: [BIL-028, ORG-045]
    read_first: [src/jobs/reconcile.ts, src/modules/billing/advance.service.ts]
    design_refs: [finances/subscription]
    constraints: [C-52]
    asvs: [v5.0.0-2.3.3, v5.0.0-16.5.3]
    story: "Technical story: give billing a job that refreshes the periods, rights and paused items of each business whose dates passed, so that a plan ends on time even if nobody opens the app."
    context: |
      - Exists: `advanceSubscription` (BIL-028), `listOrganizationsToRefresh` (ORG-045), `runInTransaction` (BIL-011); `src/jobs/reconcile.ts` is the model of a job.
      - `subscription.repository.ts` gains `listBusinessesToAdvance(now, limit, afterId?)`: ids, ascending, of businesses with an ACTIVE period whose `ends_at <= now` or a SCHEDULED one whose `starts_at <= now`.
      - `advanceDueBusinesses(now)` in the new `expire.service.ts` reads both lists page by page (`ADVANCE_PAGE` 500), takes their union once per id, ascending, and runs `advanceSubscription` for each in its own transaction. It returns `{ checked, ended, started, planChanged }`.
      - A business that fails is logged at `error` with its id and the loop goes on; the first error is rethrown after the loop, so `main` exits 2.
      - Job `src/jobs/expire-forfaits.ts`: `runExpireForfaitsJob(now)` logs the report at `info` (counts only) and returns 0; script `job:expire-forfaits`. The schedule is outside the job (Q-010).
    acceptance: |
      Scenario: AC-1 Only the businesses that need it
        Given A with a lapsed ACTIVE period, B with a running one, C with a SCHEDULED period whose time came, and D FREE
        When the job runs
        Then A and C are advanced, B and D are not touched, and the report says `checked` 2
      Scenario: AC-2 Grace over and excess seats
        Given E whose last period ended 8 days ago with plan columns still ESSENTIAL, and F with limit 2 and 3 ACTIVE seats
        When the job runs
        Then E is FREE and one seat of F is paused
      Scenario: AC-3 Once per business
        Given a business that both lists return
        When the job runs
        Then it is advanced once: one FORFAIT_ENDED event
      Scenario: AC-4 A second run
        When the job runs twice with the same `now`
        Then the second run changes no row and writes no event
      Scenario: AC-5 More than a page
        Given 3 businesses to advance and `ADVANCE_PAGE` set to 2 in the test
        When the job runs
        Then all 3 are advanced
    abuse: |
      Scenario: AB-1 One broken business blocks the others (denial of service)
        Given the advance of business B throws
        When the job runs
        Then the other businesses are still advanced, the error is logged with B's id only, and the job rejects after the loop
    implementation:
      create: [src/modules/billing/expire.service.ts, src/jobs/expire-forfaits.ts, tests/integration/billing/expire-forfaits.test.ts]
      modify: [src/modules/billing/subscription.repository.ts, package.json]
      pattern: src/jobs/reconcile.ts
      signatures:
        - "advanceDueBusinesses(now: Date): Promise<AdvanceReport>"
        - "runExpireForfaitsJob(now?: Date): Promise<number>"
        - "listBusinessesToAdvance(now: Date, limit: number, afterId?: string): Promise<string[]>"
      types:
        - "AdvanceReport = { checked: number; ended: number; started: number; planChanged: number }"
      errors: []
      dependencies: ["@prisma/client"]
    security:
      - "v5.0.0-2.3.3: each business is advanced in its own transaction, so a failure leaves no half-done business."
      - "v5.0.0-16.5.3: a failing business is logged and skipped, and the run still fails at the end; nothing is swallowed."
    tests: |
      selection | integration | AC-1, C-52 | A and C advanced, B and D untouched
      grace and seats | integration | AC-2 | E FREE, one seat paused
      once | integration | AC-3 | one event for a business in both lists
      second run | integration | AC-4 | no change
      pages | integration | AC-5 | 3 advanced with a page of 2
      broken business | security | AB-1, CWE-400 | others advanced, id logged, job rejects
    command: npx vitest run tests/integration/billing/expire-forfaits.test.ts
    out_of_scope:
      - "Reminders before the end: BIL-026. Closing or reopening a business: BIL-031."

  - id: BIL-026
    title: The owner is reminded before the plan ends
    kind: technical
    size: M
    risk: medium
    depends_on: [BIL-016, BIL-019, ORG-045]
    read_first: [src/jobs/reconcile.ts, src/modules/billing/notices.ts]
    design_refs: [finances/subscription]
    constraints: []
    asvs: [v5.0.0-2.3.3, v5.0.0-16.5.3]
    story: "Technical story: give billing a daily job that tells the owner 7 days, 1 day and 0 days before the plan ends, the first time with what will be paused."
    context: |
      - Exists: `readPlanFields`, `listOrganizationsEnding` (ORG-045); `readAfterEnd` (BIL-016); `findActiveOwnerId` (ORG-044); `notify`, `recipientLanguage` (NTF-002); `lockSubscriptions`, `insertEvent`, `runInTransaction` (BIL-011); `notices.ts` (BIL-019).
      - `subscription.repository.ts` gains `hasReminder(tx, organizationId, planEndsAt, daysBefore)`: a REMINDER event with those details exists.
      - `sendDueReminders(now)` in the new `reminder.service.ts` pages `listOrganizationsEnding` over the Douala calendar days of `now` to `now + 7` (UTC+1; pages of 500). Per business, in its own transaction under the lock, `days_before` is the number of Douala calendar days from `now` to `plan_ends_at`.
      - Only 7, 1 and 0 send, once per `plan_ends_at`. That date ends the same-plan chain, so a follow-up of the same plan moves the reminder to the chain's end.
      - A send inserts one REMINDER event (actor SYSTEM, details: `plan_ends_at`, `days_before`) and `notify({ recipientId, organizationId, sourceEvent: 'subscription.reminder', content }, tx)` for the active owner, in their language; no owner, no reminder. At 7 days the text adds the `readAfterEnd` counts above 0.
      - A failing business is logged at `error` with its id, the loop goes on, the first error is rethrown after it. Job `src/jobs/send-reminders.ts`: `runSendRemindersJob(now)` logs the counts at `info`, returns 0; script `job:send-reminders`.
    acceptance: |
      Scenario Outline: AC-1 Which days
        Given an ESSENTIAL plan ending on 12 January 2027 (Douala day)
        When the job runs on <day>
        Then <result>
        Examples:
          | day                      | result                      |
          | 5 January                | one reminder, `days_before` 7 |
          | 11 January               | one reminder, `days_before` 1 |
          | 12 January               | one reminder, `days_before` 0 |
          | 8 January, or 13 (grace) | none                        |
      Scenario: AC-2 Once per end date
        When the job runs twice on 5 January, the plan is extended to 12 April, and it runs on 5 April
        Then there is one reminder for 12 January and one for 12 April
      Scenario Outline: AC-3 The text
        Given the plan ends on 12 January 2027, the owner reads <language>, <days> days before, and <pause>
        When the reminder is sent
        Then the notice `subscription.reminder` reads <text>
        Examples:
          | language | days | pause                        | text                                                                                                      |
          | FR       | 7    | 3 collaborators, 45 products | Votre forfait Essentiel se termine le 12 janvier 2027 : 3 collaborateurs et 45 produits seront mis en pause. |
          | EN       | 7    | nothing to pause             | Your Essential plan ends on January 12, 2027.                                                             |
          | FR       | 1    | 3 collaborators              | Votre forfait Essentiel se termine demain.                                                                |
          | EN       | 0    | 3 collaborators              | Your Essential plan ends today.                                                                           |
      Scenario Outline: AC-4 A follow-up period
        Given <chain>
        When the job runs 7 days before the first period ends
        Then <result>
        Examples:
          | chain                           | result                       |
          | ESSENTIAL, then ESSENTIAL       | no reminder                  |
          | PRO, then ESSENTIAL scheduled   | one reminder for the PRO end |
      Scenario: AC-5 Nobody to tell
        When the job runs 7 days before the end of a business without an active owner, and for a FREE business
        Then no event and no notice are written
      Scenario: AC-6 A broken business
        Given the reminder of business B throws
        When the job runs
        Then the others get theirs, B's id is logged and the job rejects after the loop
    implementation:
      create: [src/modules/billing/reminder.service.ts, src/jobs/send-reminders.ts, tests/integration/billing/reminders.test.ts]
      modify: [src/modules/billing/notices.ts, src/modules/billing/subscription.repository.ts, package.json]
      pattern: src/jobs/reconcile.ts
      signatures:
        - "sendDueReminders(now: Date): Promise<{ checked: number; sent: number }>"
        - "reminderNotice(language: 'FR' | 'EN', input: { daysBefore: 7 | 1 | 0; plan: PaidPlanCode; planEndsAt: Date; afterEnd: AfterEnd | null }): string"
        - "hasReminder(tx: Prisma.TransactionClient, organizationId: string, planEndsAt: Date, daysBefore: number): Promise<boolean>"
      types: []
      errors: []
      dependencies: ["@prisma/client"]
    security:
      - "v5.0.0-2.3.3: check, event and notice share one transaction under the business's lock: no double send."
      - "v5.0.0-16.5.3: a failing business is logged and skipped, the run fails at the end; nothing is swallowed."
    tests: |
      days | integration | AC-1 | each Examples row → reminder or none
      once | integration | AC-2 | one per end date
      text | integration | AC-3 | each Examples row → notice text
      follow-up | integration | AC-4 | each Examples row → reminder or none
      nobody | integration | AC-5 | no owner, FREE → nothing written
      broken | integration | AC-6 | others sent, id logged, rejects
    command: npx vitest run tests/integration/billing/reminders.test.ts
    out_of_scope:
      - "Choosing what to keep: BIL-018."

  - id: BIL-029
    title: The owner swaps a paused collaborator with an active one
    kind: feature
    size: M
    risk: medium
    depends_on: [BIL-018, BIL-019]
    read_first: [src/modules/billing/billing.owner.routes.ts, src/modules/billing/seat-limit.service.ts]
    design_refs: [finances/subscription]
    constraints: [C-42, C-55]
    asvs: [v5.0.0-8.2.1, v5.0.0-15.3.3, v5.0.0-2.3.3]
    story: As an owner, I want to bring back a paused collaborator by pausing another so that my seats fit my needs.
    context: |
      - Exists: the router (BIL-018), `seatNotice` (BIL-019), `listTeamSeats`, `setSeatPaused` (ORG-035), `findDriversWithOpenDeliveries` (DLV-015), `listProductsOnSale` (CAT-020), `insertEvent`, `runInTransaction` (BIL-011), `notify`.
      - `POST /api/v1/organizations/{organizationId}/billing/swap-seat` on that router. Chain: sign-in, `loadActor`, `requireAbility('keep', 'Collaboration')`, `idempotent()`. Body, strict: `id` (UUIDv7), `pause_collaboration_id`, `resume_collaboration_id` (distinct).
      - `swapSeat(actor, input, now)` in the new `swap.service.ts`, one transaction under `lockSubscriptions`. Both ids must be seats of `listTeamSeats` (else 404 `NOT_FOUND`). The seat to pause must be ACTIVE or INVITED, the one to resume PAUSED (else 409 `SEAT_STATE`); a DRIVER with an open delivery cannot be paused (409 `DRIVER_ON_DELIVERY`).
      - It calls `setSeatPaused` for both, writes a PAUSED and a RESUMED event (actor OWNER, the owner's person id, details: the collaboration id) and one `seatNotice` to each.
      - `writeCurrentKeepChoice(tx, organizationId, personId)`, exported for BIL-030, inserts a KEEP_CHOICE event (actor OWNER) with the seats now not paused and the products now on sale, so that enforcement keeps the swap.
      - Answer 201 `{ paused_collaboration_id, resumed_collaboration_id }`.
    acceptance: |
      Scenario: AC-1 A swap
        Given limit 2, A and B ACTIVE, C PAUSED
        When the owner pauses A and resumes C
        Then the answer is 201, A is PAUSED and C ACTIVE, one PAUSED, one RESUMED and one KEEP_CHOICE event name the owner, A and C each have one notice, and `enforceSeatLimit` with limit 2 changes nothing afterwards
      Scenario Outline: AC-2 A state that refuses
        When <case>
        Then the answer is <answer> and nothing changes
        Examples:
          | case                                             | answer                       |
          | the seat to pause is already PAUSED              | 409 `SEAT_STATE`             |
          | the seat to resume is ACTIVE                     | 409 `SEAT_STATE`             |
          | the seat to pause is a driver on a delivery      | 409 `DRIVER_ON_DELIVERY`     |
          | an id is unknown or the owner's own              | 404 `NOT_FOUND`              |
      Scenario: AC-3 Who may
        When a manager, a seller, a driver or a person not signed in sends a valid swap
        Then the answers are 403 `FORBIDDEN` for the first three and 401 `UNAUTHORIZED` for the last
      Scenario: AC-4 Body and repeat
        When the body has an extra field, a bad UUID or twice the same id, then a valid swap is sent twice
        Then the first three give 400 `VALIDATION_ERROR`, the repeat equal answers and one set of events
    abuse: |
      Scenario: AB-1 A seat of another business is paused (broken access control)
        When an owner of A sends a seat id of business B
        Then the answer is 404, equal to an unknown id's, and B's seat is unchanged
    implementation:
      create: [src/modules/billing/swap.service.ts, tests/integration/billing/swap-seat.test.ts]
      modify: [src/modules/billing/billing.owner.routes.ts, src/modules/billing/billing.schemas.ts, src/modules/billing/billing.openapi.ts]
      pattern: tests/integration/organization/amount-held.test.ts
      signatures:
        - "swapSeat(actor: OrganizationActor, input: SwapSeatInput, now: Date): Promise<SwapSeatView>"
        - "writeCurrentKeepChoice(tx: Prisma.TransactionClient, organizationId: string, personId: string): Promise<void>"
      types:
        - "SwapSeatInput = { id: string; pauseCollaborationId: string; resumeCollaborationId: string }"
        - "SwapSeatView = { paused_collaboration_id: string; resumed_collaboration_id: string }"
      errors: ["VALIDATION_ERROR 400", "UNAUTHORIZED 401", "FORBIDDEN 403", "NOT_FOUND 404", "SEAT_STATE 409", "DRIVER_ON_DELIVERY 409"]
      dependencies: [zod, express]
    security:
      - "v5.0.0-8.2.1: only an owner passes `keep`; the business comes from the session."
      - "v5.0.0-15.3.3: the body lists its fields and refuses any other."
      - "v5.0.0-2.3.3: seats, events and notices share one transaction."
    tests: |
      swap | integration | AC-1, C-55, C-42 | 201, seats, events, notices, enforcement keeps it
      refused | integration | AC-2 | each Examples row → answer, no change
      who may | integration | AC-3 | 403 and 401
      body and repeat | integration | AC-4 | 400s, equal answers
      other business | security | AB-1, CWE-639 | 404 equal to unknown, B unchanged
    command: npx vitest run tests/integration/billing/swap-seat.test.ts tests/integration/api-docs tests/integration/per-001.test.ts
    out_of_scope:
      - "Products: BIL-030."
    tests_to_update:
      - "tests/integration/api-docs/catalog.test.ts | route list | add POST /api/v1/organizations/{organizationId}/billing/swap-seat"
      - "tests/integration/per-001.test.ts | route list | add POST /api/v1/organizations/{organizationId}/billing/swap-seat"

  - id: BIL-030
    title: The owner swaps a paused product with one on sale
    kind: feature
    size: S
    risk: medium
    depends_on: [BIL-029, BIL-020]
    read_first: [src/modules/billing/swap.service.ts, src/modules/billing/billing.owner.routes.ts]
    design_refs: [finances/subscription]
    constraints: [C-46, C-55]
    asvs: [v5.0.0-8.2.1, v5.0.0-15.3.3, v5.0.0-2.3.3]
    story: As an owner, I want to put a paused product back on sale by pausing another so that I sell what I need within my plan.
    context: |
      - Exists: `swapSeat`, `writeCurrentKeepChoice` (BIL-029), `listProductsOnSale`, `listPausedProducts`, `setProductsPaused` (CAT-020), `insertEvent`, `runInTransaction` (BIL-011), the router (BIL-018).
      - `POST /api/v1/organizations/{organizationId}/billing/swap-product` on that router. Chain: sign-in, `loadActor`, `requireAbility('keep', 'Product')`, `idempotent()`. Body, strict: `id` (UUIDv7), `pause_product_id`, `resume_product_id`, two different UUIDs.
      - `swapProduct(actor, input, now)` in `swap.service.ts`, one transaction under `lockSubscriptions`. An id in neither product list is 404 `NOT_FOUND`; the one to pause must be on sale and the one to resume paused (else 409 `PRODUCT_STATE`).
      - It calls `setProductsPaused` for each, writes a PAUSED and a RESUMED event (actor OWNER, details: target PRODUCTS and the product id) and `writeCurrentKeepChoice`. Answer 201 `{ paused_product_id, resumed_product_id }`.
    acceptance: |
      Scenario: AC-1 A swap
        Given limit 30, 30 products on sale and product P paused
        When the owner pauses product Q and resumes P
        Then the answer is 201, Q is paused, P is on sale, and one PAUSED, one RESUMED and one KEEP_CHOICE event name the owner
      Scenario: AC-2 The swap sticks
        When `enforceLimits` runs with limit 30 after AC-1
        Then Q stays paused and P stays on sale
      Scenario Outline: AC-3 A state that refuses
        When <case>
        Then the answer is <answer> and nothing changes
        Examples:
          | case                                  | answer                        |
          | the product to pause is already paused | 409 `PRODUCT_STATE`           |
          | the product to resume is on sale      | 409 `PRODUCT_STATE`           |
          | an id is unknown or deleted           | 404 `NOT_FOUND`, same message |
      Scenario: AC-4 Who may
        When a manager, a seller, a driver or a person not signed in sends a valid swap
        Then the answers are 403 `FORBIDDEN` for the first three and 401 `UNAUTHORIZED` for the last
      Scenario: AC-5 Body and repeat
        When the body has an extra field, a bad UUID or the same id twice, then a valid swap is sent twice with one `id`
        Then the first three give 400 `VALIDATION_ERROR` and the repeat gives equal answers with one set of events
    abuse: |
      Scenario: AB-1 A product of another business is paused (broken access control)
        When an owner of A sends a product id of business B
        Then the answer is 404, equal to an unknown id's, and B's product is unchanged
    implementation:
      create: [tests/integration/billing/swap-product.test.ts]
      modify: [src/modules/billing/swap.service.ts, src/modules/billing/billing.owner.routes.ts, src/modules/billing/billing.schemas.ts, src/modules/billing/billing.openapi.ts]
      pattern: tests/integration/organization/amount-held.test.ts
      signatures:
        - "swapProduct(actor: OrganizationActor, input: SwapProductInput, now: Date): Promise<SwapProductView>"
      types:
        - "SwapProductInput = { id: string; pauseProductId: string; resumeProductId: string }"
        - "SwapProductView = { paused_product_id: string; resumed_product_id: string }"
      errors: ["VALIDATION_ERROR 400", "UNAUTHORIZED 401", "FORBIDDEN 403", "NOT_FOUND 404", "PRODUCT_STATE 409"]
      dependencies: [zod, express]
    security:
      - "v5.0.0-8.2.1: only an owner passes `keep`, and the business comes from the session actor."
      - "v5.0.0-15.3.3: the body lists its writable fields and refuses any other."
      - "v5.0.0-2.3.3: products, events and the choice are written in one transaction."
    tests: |
      swap | integration | AC-1, C-55 | 201, products, events
      sticks | integration | AC-2, C-46 | enforcement keeps the swap
      refused | integration | AC-3 | each Examples row → answer, no change
      who may | integration | AC-4 | 403 and 401
      body and repeat | integration | AC-5 | 400s, equal answers, one set of events
      other business | security | AB-1, CWE-639 | 404 equal to unknown, B unchanged
    command: npx vitest run tests/integration/billing/swap-product.test.ts tests/integration/api-docs tests/integration/per-001.test.ts
    out_of_scope:
      - "Swapping a collaborator: BIL-029."
    tests_to_update:
      - "tests/integration/api-docs/catalog.test.ts | route list | add POST /api/v1/organizations/{organizationId}/billing/swap-product"
      - "tests/integration/per-001.test.ts | route list | add POST /api/v1/organizations/{organizationId}/billing/swap-product"

  - id: BIL-031
    title: Closing a business ends its plans and reopening restarts from free
    kind: technical
    size: M
    risk: high
    depends_on: [BIL-005, BIL-013, BIL-020, BIL-027, ORG-034, ORG-045]
    read_first: [src/modules/billing/rights.service.ts, src/app.ts]
    design_refs: [finances/subscription]
    constraints: [C-52]
    asvs: [v5.0.0-2.3.3, v5.0.0-8.2.2]
    story: "Technical story: let billing stop the plans of a business when it is closed and restart it from the free plan when it is reopened, inside the closing and reopening transactions."
    context: |
      - Exists: `registerLifecycleHook` (ORG-034; the hooks run in the closing or reopening transaction and a failing hook aborts it); `lockSubscriptions`, `listQueue`, `insertEvent` (BIL-011); `endPeriod` (BIL-027); `recomputeRights` (BIL-013); `enforceLimits` (BIL-020); `readPlanFields` (ORG-045); `writePlanFields` (ORG-035); `PLANS` (FND-014). BIL-005 stopped `closeOrganization` from touching `subscriptions`.
      - `registerBillingLifecycleHooks()` in the new `lifecycle.service.ts` registers one hook, once, however often it is called; `src/app.ts` calls it at start.
      - Close: lock; each ACTIVE or SCHEDULED period ends with reason CLOSED (ACTIVE: `ends_at` is the earlier of its end and `now`; SCHEDULED: `ends_at = starts_at`), one FORFAIT_ENDED event each (actor SYSTEM). Then the five plan fields are written as FREE (no dates, the limits of `PLANS.FREE`), even during a grace, and one PLAN_CHANGED event (old plan to FREE) is written when the plan was not FREE. Nothing is paused: the close revokes the team itself.
      - Reopen: lock, `recomputeRights`, `enforceLimits`. A period bought while the business was closed counts; products above the free limit are paused.
    acceptance: |
      Scenario: AC-1 Close ends the plans
        Given an ESSENTIAL ACTIVE period with 20 days left and an ESSENTIAL one SCHEDULED after it
        When the owner closes the business
        Then both periods are ENDED CLOSED (the first with `ends_at = now`, the second with `ends_at = starts_at`), two FORFAIT_ENDED events exist, the plan fields are FREE with no dates, and one PLAN_CHANGED event goes from ESSENTIAL to FREE
      Scenario: AC-2 Close during the grace
        Given the last period ENDED EXPIRED 3 days ago and plan columns ESSENTIAL with a grace date
        When the owner closes the business
        Then the plan fields are FREE with no grace date
      Scenario: AC-3 A free business
        When a business with no period is closed
        Then no period or event is written and the plan stays FREE
      Scenario Outline: AC-4 Reopen
        Given a closed business with <state>
        When the owner reopens it
        Then <result>
        Examples:
          | state                                   | result                                              |
          | 45 products on sale and no period       | the plan is FREE and 15 products are paused         |
          | an ESSENTIAL period bought while closed | the plan is ESSENTIAL and no product is paused      |
      Scenario: AC-5 A failure aborts the close
        Given ending a period fails during the close
        When the owner closes the business
        Then the business stays open, its periods and plan fields are unchanged and no event is written
      Scenario: AC-6 Registered once
        When `registerBillingLifecycleHooks` is called twice and a business is closed
        Then each period gets one FORFAIT_ENDED event
    abuse: |
      Scenario: AB-1 Closing one business touches another (broken access control)
        Given businesses A and B, each with an ACTIVE period
        When A is closed
        Then B's periods, events and plan fields are unchanged
    implementation:
      create: [src/modules/billing/lifecycle.service.ts, tests/integration/billing/lifecycle.test.ts]
      modify: [src/app.ts]
      pattern: tests/integration/organization/amount-held.test.ts
      signatures:
        - "registerBillingLifecycleHooks(): void"
      types: []
      errors: []
      dependencies: ["@prisma/client"]
    security:
      - "v5.0.0-2.3.3: ending, rights and events share the closing or reopening transaction."
      - "v5.0.0-8.2.2: the hook acts on the organization id the organization module gives it, never on a client value."
    tests: |
      close | integration | AC-1, C-52 | periods CLOSED, events, FREE
      grace | integration | AC-2 | FREE without grace
      free | integration | AC-3 | nothing written
      reopen | integration | AC-4 | each Examples row → plan, products
      abort | integration | AC-5 | failure → nothing changes
      once | integration | AC-6 | one event per period
      other business | security | AB-1, CWE-639 | B unchanged
    command: npx vitest run tests/integration/billing/lifecycle.test.ts
    out_of_scope:
      - "The close and reopen operations and their routes: ORG. Refunds: BIL-025."
