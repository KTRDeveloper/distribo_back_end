      signatures:
        - "saveKeepChoice(actor: OrganizationActor, input: KeepChoiceInput): Promise<KeepChoiceView>"
      types:
        - "KeepChoiceInput = { id: string; collaborationIds: string[]; productIds: string[] }"
        - "KeepChoiceView = { collaboration_ids: string[]; product_ids: string[] }"
      errors: ["VALIDATION_ERROR 400", "UNAUTHORIZED 401", "FORBIDDEN 403", "NOT_FOUND 404"]
      dependencies: [zod, express]
    security:
      - "v5.0.0-8.2.1: only an owner passes the two `keep` checks, and the business comes from the session actor."
      - "v5.0.0-15.3.3: the body lists its writable fields and refuses any other."
      - "v5.0.0-2.2.1: lists have a maximum of 100 and every id is checked against the business."
    tests: |
      stored | integration | AC-1, C-55 | 201 and the event
      later | integration | AC-2 | two events
      not the business's | integration | AC-3 | each Examples row → 404, no event
      who may | integration | AC-4 | each Examples row → answer
      body | integration | AC-5 | extra field, 101 ids, repeat, bad UUID → 400
      repeat | integration | AC-6 | same id → equal answers, one event
      other business | security | AB-1, CWE-639 | B's ids → 404, no event
    command: npx vitest run tests/integration/billing/keep-choice.test.ts tests/integration/api-docs tests/integration/per-001.test.ts
    out_of_scope:
      - "Applying the choice: BIL-019 for collaborators and BIL-020 for products."
      - "Swapping one seat or product online at once: BIL-029 and BIL-030."
    tests_to_update:
      - "tests/integration/api-docs/catalog.test.ts | the route list lacks the keep-choice path | add POST /api/v1/organizations/{organizationId}/billing/keep-choice, remove nothing"
      - "tests/integration/per-001.test.ts | the route list lacks the keep-choice path | add POST /api/v1/organizations/{organizationId}/billing/keep-choice, remove nothing"

  - id: BIL-019
    title: Collaborators beyond the plan are paused and come back when it allows
    kind: technical
    size: M
    risk: high
    depends_on: [BIL-018, BIL-011, ORG-035, ORG-044, DLV-015, NTF-002]
    read_first: [src/modules/billing/subscription.repository.ts]
    design_refs: [finances/subscription]
    constraints: [C-42]
    asvs: [v5.0.0-8.2.2, v5.0.0-2.3.3, v5.0.0-16.3.1]
    story: "Technical story: give billing the function that pauses the collaborators a plan no longer covers and brings them back when a plan allows, following the owner's choice, so that the team always fits the plan."
    context: |
      - Exists: `listTeamSeats` and `setSeatPaused` (ORG-035), `findDriversWithOpenDeliveries` (DLV-015), `notify` and `recipientLanguage` (NTF-002), `findOrganizationSummary` (ORG-044), `insertEvent` (BIL-011), the KEEP_CHOICE events (BIL-018).
      - `findLatestKeepChoice(tx, organizationId)` is added to `subscription.repository.ts`: the details of the latest KEEP_CHOICE event, or null.
      - New `seat-limit.service.ts`: `enforceSeatLimit(tx, organizationId, maxCollaborators, now)`, `null` meaning no limit. It ranks every seat of `listTeamSeats`, whatever its status: first the ids of the latest choice, in the order given; then accepted seats (`acceptedAt` set) oldest first; then pending invitations oldest first. The first `maxCollaborators` stay or return; the rest are paused.
      - A seat to pause that is a DRIVER with an open delivery is left as it is and listed as deferred; the next run pauses it. The OWNER is never in the list.
      - Each change is made with `setSeatPaused`, logs one PAUSED or RESUMED event (actor SYSTEM, details: the collaboration id) and notifies the person: `subscription.paused` or `subscription.resumed`, in their language, from `notices.ts` (new, French and English texts that name the business and hold no other personal data).
    acceptance: |
      Scenario Outline: AC-1 Who stays
        Given a limit of 2 and no choice
        When the seats are <seats>
        Then <paused> are paused
        Examples:
          | seats (oldest first)                       | paused |
          | A accepted, B accepted, C accepted         | C      |
          | A accepted, B pending, C accepted          | B      |
          | A accepted, B pending, C pending           | C      |
      Scenario: AC-2 The owner's choice
        Given a limit of 2, seats A, B, C all accepted, and a choice naming C
        When the limit is enforced
        Then C and A stay and B is paused
      Scenario: AC-3 They come back
        Given B paused after being accepted and C paused while still pending, and a limit of 5
        When the limit is enforced
        Then B is ACTIVE again and C is INVITED again
      Scenario: AC-4 A driver on the road
        Given the seat to pause is a driver with an open delivery
        When the limit is enforced, then the delivery closes and it is enforced again
        Then the first run lists the seat as deferred and changes nothing, and the second pauses it
      Scenario: AC-5 No limit and no owner
        When `maxCollaborators` is null
        Then every paused seat returns, and the owner's seat is never read or changed
      Scenario: AC-6 Journal and notices
        When a seat is paused and another resumed
        Then there is one PAUSED and one RESUMED event and one notice each in the person's language, and a second run changes and writes nothing
    abuse: |
      Scenario: AB-1 Another business's team is touched (broken access control)
        Given business B has seats over its limit
        When the limit is enforced for business A
        Then no seat of B changes
    implementation:
      create: [src/modules/billing/seat-limit.service.ts, src/modules/billing/notices.ts, tests/integration/billing/seat-limit.test.ts]
      modify: [src/modules/billing/subscription.repository.ts]
      pattern: tests/integration/organization/amount-held.test.ts
      signatures:
        - "enforceSeatLimit(tx: Prisma.TransactionClient, organizationId: string, maxCollaborators: number | null, now: Date): Promise<SeatEnforcement>"
        - "findLatestKeepChoice(tx: Prisma.TransactionClient, organizationId: string): Promise<{ collaborationIds: string[]; productIds: string[] } | null>"
        - "seatNotice(kind: 'PAUSED' | 'RESUMED', language: 'FR' | 'EN', businessName: string): string"
      types:
        - "SeatEnforcement = { paused: string[]; resumed: string[]; deferred: string[] }"
      errors: []
      dependencies: ["@prisma/client"]
    security:
      - "v5.0.0-8.2.2: every read and write is bound to the organization id given by server code."
      - "v5.0.0-2.3.3: seats, events and notices belong to the caller's transaction."
      - "v5.0.0-16.3.1: events and logs carry ids only; a notice names the business, never another person."
    tests: |
      who stays | integration | AC-1, C-42 | each Examples row → paused seats
      choice | integration | AC-2 | C kept before A
      return | integration | AC-3 | ACTIVE and INVITED
      driver | integration | AC-4 | deferred then paused
      no limit | integration | AC-5 | all back, owner unchanged
      journal | integration | AC-6 | events, notices, no change on a repeat
      other business | security | AB-1, CWE-639 | B's seats unchanged
    command: npx vitest run tests/integration/billing/seat-limit.test.ts
    out_of_scope:
      - "Computing the limit and calling this function: BIL-014, BIL-028."
      - "Products: BIL-020."

  - id: BIL-020
    title: Products beyond the plan are paused and come back when it allows
    kind: technical
    size: M
    risk: high
    depends_on: [BIL-019, BIL-013, CAT-020, ORD-029, ORG-044]
    read_first: [src/modules/billing/seat-limit.service.ts, src/modules/billing/notices.ts]
    design_refs: [finances/subscription, catalogue/product]
    constraints: [C-46]
    asvs: [v5.0.0-8.2.2, v5.0.0-2.3.3, v5.0.0-16.3.1]
    story: "Technical story: give billing the one function that applies the limits of a plan to a business, pausing the products and the collaborators beyond them and bringing back what fits, so that a plan change never deletes anything."
    context: |
      - Exists: `listProductsOnSale`, `listPausedProducts`, `setProductsPaused` (CAT-020), `countOrderedLinesByVariant` (ORD-029), `findLatestKeepChoice` and `enforceSeatLimit` (BIL-019), `findActiveOwnerId` (ORG-044), `OrganizationRights` (BIL-013).
      - New `limits.service.ts`: `enforceLimits(tx, organizationId, rights, now)` first calls `enforceSeatLimit` with `rights.maxCollaborators`, then handles products with `rights.maxProducts` (`null` means no limit).
      - Products: the on-sale and the paused lists are ranked together: first the product ids of the latest choice, in the order given; then by demand, the sum of `countOrderedLinesByVariant(…, now − 90 days)` over the product's variant ids, highest first; ties newest first, then by id. The first `maxProducts` are on sale: the paused ones among them are resumed, the on-sale ones outside are paused, with `setProductsPaused`.
      - Each non-empty change writes one PAUSED or RESUMED event (actor SYSTEM, details: target PRODUCTS and the count) and notifies the owner once: `subscription.products_paused` or `subscription.products_resumed`, in their language (texts added to `notices.ts`, with the count only).
      - Returns `{ seats, productsPaused, productsResumed }`.
    acceptance: |
      Scenario: AC-1 The most ordered stay
        Given a limit of 3 and 5 products on sale, ordered 9, 7, 5, 2 and 0 times in the last 90 days
        When the limits are enforced
        Then the first three stay and the other two are paused
      Scenario: AC-2 Ties and old orders
        Given two products with the same demand, one newer, and a third whose orders are 91 days old
        When the limits are enforced with room for one
        Then the newer of the two stays and the third has no demand
      Scenario: AC-3 The owner's choice
        Given a limit of 2 and a choice naming the least ordered product
        When the limits are enforced
        Then that product stays with the most ordered one
      Scenario Outline: AC-4 They come back
        Given 4 products, 2 of them paused
        When the limit becomes <limit>
        Then <result>
        Examples:
          | limit     | result                              |
          | 3         | one paused product returns, by rank |
          | no limit  | both return                         |
      Scenario: AC-5 Seats too
        When the limits are enforced for a business over its collaborator limit
        Then its seats are paused as in BIL-019 and the answer carries that result
      Scenario: AC-6 Journal and notice
        When products are paused
        Then one PAUSED event with the count exists and the owner has one notice with the count, and a second run changes and writes nothing
    abuse: |
      Scenario: AB-1 Another business's products or orders count or change (broken access control)
        Given business B has products and orders
        When the limits are enforced for business A
        Then no product of B changes and B's orders add nothing to A's demand
    implementation:
      create: [src/modules/billing/limits.service.ts, tests/integration/billing/limits.test.ts]
      modify: [src/modules/billing/notices.ts]
      pattern: tests/integration/organization/amount-held.test.ts
      signatures:
        - "enforceLimits(tx: Prisma.TransactionClient, organizationId: string, rights: OrganizationRights, now: Date): Promise<LimitsEnforcement>"
        - "productsNotice(kind: 'PAUSED' | 'RESUMED', language: 'FR' | 'EN', count: number): string"
      types:
        - "LimitsEnforcement = { seats: SeatEnforcement; productsPaused: number; productsResumed: number }"
      errors: []
      dependencies: ["@prisma/client"]
    security:
      - "v5.0.0-8.2.2: every call is bound to the organization id given by server code."
      - "v5.0.0-2.3.3: pauses, events and notices belong to the caller's transaction."
      - "v5.0.0-16.3.1: the event and the notice carry a count, never product names or ids."
    tests: |
      most ordered | integration | AC-1, C-46 | five products → three on sale
      ties | integration | AC-2 | newer first, old orders ignored
      choice | integration | AC-3 | chosen product stays
      return | integration | AC-4 | each Examples row → result
      seats | integration | AC-5 | result carries the seat outcome
      journal | integration | AC-6 | event, notice, repeat changes nothing
      other business | security | AB-1, CWE-639 | B unchanged, no demand from B
    command: npx vitest run tests/integration/billing/limits.test.ts tests/integration/billing/seat-limit.test.ts
    out_of_scope:
      - "Computing the rights and the callers: BIL-014 and BIL-028."
      - "Pausing the excess products that arrive by synchronization: the synchronization stories."

  - id: BIL-009
    title: A payer starts a payment for a business
    kind: feature
    size: M
    risk: high
    depends_on: [BIL-001, BIL-007, BIL-008, BIL-010, FND-004]
    read_first: [src/modules/billing/billing.routes.ts, src/modules/billing/aggregator.port.ts]
    design_refs: [finances/subscriptionpayment, finances/subscription/plans-on-paie-pour-son-equipe]
    constraints: [C-53]
    asvs: [v5.0.0-2.2.1, v5.0.0-2.2.3, v5.0.0-2.4.1, v5.0.0-15.3.3]
    story: As a visitor, I want to pay a plan for a business with my mobile-money number so that the business gets the plan I chose.
    context: |
      - Exists: BIL-001, 007, 008, `priceFor` (FND-014), `normalizeE164`, `findOrganizationByPaymentCode` (ORG-044), `checkAndConsume`.
      - `POST /api/v1/billing/payments`, public. Body, strict: `id` (UUIDv7, the payment id), `code` (as in BIL-007), `plan` (ESSENTIAL, PRO, ENTERPRISE), `months` (1, 3, 6, 12), `operator` (MTN_MOMO, ORANGE_MONEY), `payer_phone_number` (`normalizeE164`, else 400), `customer_tax_id` (optional, 1 to 20 letters and digits), `terms_version` (at most 20 characters).
      - Order: validation; limits of 10 an hour per `req.ip` (`billing:pay:<ip>`) and 5 an hour per payer number (hashed), provisional, else 429 `RATE_LIMITED` and `warn` event `payment_create_rate_limited`; business ACTIVE (else 404); `terms_version` equal to `CURRENT_TERMS_VERSION` (provisional constant in `payment.service.ts`), else 409 `TERMS_CHANGED`.
      - Then, in one transaction with a lock on the id: a stored payment with the same business, plan, months, operator and number is answered again; another body gives 409 `PAYMENT_ID_USED`. Else the amount is `priceFor`, `requestPayment({ clientReference: id, … })` runs and the row is inserted PENDING with its reference. An aggregator failure is rethrown: nothing stored.
      - Answer 201 with the `PaymentView` fields.
    acceptance: |
      Scenario: AC-1 A payment starts
        When a visitor sends ESSENTIAL, 3 months, MTN_MOMO, a valid number, a NIU and the current terms version
        Then the answer is 201, amount 15000, PENDING; one row holds the amount, the aggregator's reference, the terms version and the NIU; the aggregator got one request
      Scenario: AC-2 A repeat
        When the same body is sent twice with one `id`
        Then the answers are equal, with one row and one aggregator request; the same `id` with another plan answers 409 `PAYMENT_ID_USED`
      Scenario Outline: AC-3 Refused, nothing stored, no aggregator call
        When the request has <problem>
        Then the answer is <answer>
        Examples:
          | problem                                                  | answer                 |
          | plan FREE, months 2, an invalid number, or a long NIU    | 400 `VALIDATION_ERROR` |
          | an unknown, SUSPENDED or CLOSED business                 | 404 `NOT_FOUND`        |
          | an older terms version                                   | 409 `TERMS_CHANGED`    |
    abuse: |
      Scenario: AB-1 The browser chooses the amount (tampering, T2)
        When the body carries `amount` 1
        Then the answer is 400 `VALIDATION_ERROR`, no row exists and the aggregator is not called
      Scenario: AB-2 A flood, or a stranger's phone harassed (denial of service)
        When one address sends 11 payments in an hour, or 6 requests name one payer number
        Then the 11th and the 6th answer 429 `RATE_LIMITED` before any read
    implementation:
      create: [src/modules/billing/payment.repository.ts, src/modules/billing/payment.service.ts, tests/integration/billing/payment-create.test.ts]
      modify: [src/modules/billing/billing.routes.ts, src/modules/billing/billing.schemas.ts, src/modules/billing/billing.openapi.ts]
      pattern: tests/integration/auth/register-request.test.ts
      signatures:
        - "createPayment(input: CreatePaymentInput, ip: string): Promise<PaymentView>"
      types:
        - "CreatePaymentInput = the body fields in camelCase; payerPhoneNumber is already normalized; customerTaxId: string | null"
        - "PaymentView = { id; status; plan; months; amount: bigint; operator }"
      errors: ["VALIDATION_ERROR 400", "NOT_FOUND 404", "TERMS_CHANGED 409", "PAYMENT_ID_USED 409", "RATE_LIMITED 429"]
      dependencies: [zod, express]
    security:
      - "v5.0.0-2.2.1: closed lists and a body that names every writable field."
      - "v5.0.0-2.2.3: the amount comes from the server's grid, never from the request."
      - "v5.0.0-2.4.1: creation is limited per address and per payer number."
      - "v5.0.0-15.3.3: the answer lists six fields, no number or reference."
    tests: |
      starts | integration | AC-1, C-53 | 201, row, one aggregator request
      repeat | integration | AC-2 | equal answers, one row; other plan → 409
      refused | integration | AC-3 | each Examples row → answer, nothing stored
      browser amount | security | AB-1, CWE-915 | amount sent → 400, no row
      flood | security | AB-2, CWE-770 | 11th and 6th → 429
    command: npx vitest run tests/integration/billing/payment-create.test.ts tests/integration/api-docs tests/integration/per-001.test.ts
    out_of_scope:
      - "Activation: BIL-014, BIL-034. Reading the status: BIL-015."
    tests_to_update:
      - "tests/integration/api-docs/catalog.test.ts | the route list lacks the payments path | add POST /api/v1/billing/payments, remove nothing"
      - "tests/integration/per-001.test.ts | the route list lacks the payments path | add POST /api/v1/billing/payments, remove nothing"

  - id: BIL-014
    title: A confirmed payment activates one period and its receipt
    kind: technical
    size: M
    risk: high
    depends_on: [BIL-009, BIL-012, BIL-013, BIL-020, BIL-027, BIL-008]
    read_first: [src/modules/billing/payment.repository.ts, src/modules/billing/upgrade.service.ts]
    design_refs: [finances/subscription/plans-on-paie-pour-son-equipe, finances/subscriptionpayment]
    constraints: [C-53]
    asvs: [v5.0.0-2.3.3, v5.0.0-8.2.1, v5.0.0-16.3.1]
    story: "Technical story: give billing the one function that turns a confirmed payment into a period, a receipt and new rights, once, in one transaction, so that a payment is never counted twice or half done."
    context: |
      - Exists: payments (BIL-009), `getPaymentAggregator` (BIL-008), `addPaidForfait` (BIL-027), `issueReceipt` (BIL-012), `recomputeRights` (BIL-013), `enforceLimits` (BIL-020), `insertEvent`, `findOrganizationSummary` (ORG-044).
      - `payment.repository.ts` gains `findPaymentByReference`, `lockPayment` (`FOR UPDATE`) and `setPaymentOutcome`.
      - `confirmPayment(providerReference, receivedBody, now)` in the new `confirmation.service.ts`: no payment is 404 `NOT_FOUND`; not PENDING is `ALREADY_DONE`. `getStatus` runs outside the transaction: PENDING gives `STILL_PENDING`; FAILED or EXPIRED sets the payment to that status (`FAILED`, `EXPIRED`); SUCCEEDED for another amount logs `warn` event `payment_amount_mismatch` (payment id) and throws 409 `PAYMENT_MISMATCH`.
      - SUCCEEDED for the right amount, in one transaction: lock the payment, recheck PENDING (else `ALREADY_DONE`); set SUCCEEDED, `confirmed_at = now`, `provider_payload = { received, checked }`; `addPaidForfait`; `issueReceipt` with the business name; a PAYMENT event (actor PAYER); `recomputeRights`; `enforceLimits`. Outcome `ACTIVATED`. The owner's notice is BIL-035.
    acceptance: |
      Scenario: AC-1 Activation
        Given a PENDING ESSENTIAL 3-month payment of 15000, the aggregator saying SUCCEEDED for 15000, and 2 collaborators paused under the free plan
        When `confirmPayment` runs with an empty queue
        Then the payment is SUCCEEDED with `confirmed_at`, an ACTIVE 3-month period carries its id, a receipt and one PAYMENT event exist, the business is ESSENTIAL with 5 collaborators, the 2 collaborators are back and the outcome is `ACTIVATED`
      Scenario: AC-2 A replay
        When `confirmPayment` runs twice for one payment
        Then the second outcome is `ALREADY_DONE` and one period and one receipt exist
      Scenario Outline: AC-3 Not paid
        When the aggregator says <says>
        Then the outcome is <result> and no period or receipt is added
        Examples:
          | says    | result                             |
          | PENDING | `STILL_PENDING`, payment unchanged |
          | FAILED  | `FAILED`, payment FAILED           |
          | EXPIRED | `EXPIRED`, payment EXPIRED         |
          | unknown | 404 `NOT_FOUND`                    |
      Scenario: AC-4 Another amount
        When the aggregator says SUCCEEDED for 5000 on a payment of 15000
        Then 409 `PAYMENT_MISMATCH` is thrown, the payment stays PENDING and one `warn` log holds the payment id only
    abuse: |
      Scenario: AB-1 A failure leaves a half-done payment (tampering)
        When issuing the receipt throws during a confirmation
        Then the payment is still PENDING and no period, receipt or event exists
      Scenario: AB-2 Two confirmations arrive at once (race, T3)
        When `confirmPayment` runs twice in parallel
        Then one period and one receipt exist
    implementation:
      create: [src/modules/billing/confirmation.service.ts, tests/integration/billing/confirm-payment.test.ts]
      modify: [src/modules/billing/payment.repository.ts]
      pattern: tests/integration/organization/amount-held.test.ts
      signatures:
        - "confirmPayment(providerReference: string, receivedBody: unknown, now: Date): Promise<ConfirmOutcome>"
      types:
        - "ConfirmOutcome = 'ACTIVATED' | 'ALREADY_DONE' | 'STILL_PENDING' | 'FAILED' | 'EXPIRED'"
      errors: ["NOT_FOUND 404", "PAYMENT_MISMATCH 409"]
      dependencies: ["@prisma/client"]
    security:
      - "v5.0.0-2.3.3: status, period, receipt, event, rights and limits are written in one transaction."
      - "v5.0.0-8.2.1: the status comes from the aggregator, not from the caller."
      - "v5.0.0-16.3.1: logs hold the payment id only."
    tests: |
      activation | integration | AC-1, C-53 | rows, seats back, outcome
      replay | integration | AC-2 | ALREADY_DONE, single rows
      not paid | integration | AC-3 | each Examples row → outcome
      mismatch | integration | AC-4 | 409, PENDING, log content
      half done | security | AB-1, CWE-367 | receipt throws → nothing written
      race | security | AB-2, CWE-362 | parallel calls → one period
    command: npx vitest run tests/integration/billing/confirm-payment.test.ts
    out_of_scope:
      - "The owner's notice: BIL-035. The route the aggregator calls: BIL-034. Payments never confirmed: BIL-021, BIL-022."

  - id: BIL-034
    title: The aggregator confirms a payment through a verified call
    kind: feature
    size: S
    risk: high
    depends_on: [BIL-014]
    read_first: [src/middleware/body-parser.ts, src/modules/billing/billing.routes.ts]
    design_refs: [finances/subscription/plans-on-paie-pour-son-equipe]
    asvs: [v5.0.0-8.2.1, v5.0.0-2.2.1, v5.0.0-16.3.1]
    story: As a visitor, I want my payment to count once the aggregator confirms it so that the business gets its plan without my browser having to prove anything.
    context: |
      - Exists: `confirmPayment` (BIL-014), `getPaymentAggregator` and `verifyConfirmation` (BIL-008), the public router (BIL-007), the global JSON parser in `src/middleware/body-parser.ts`.
      - `POST /api/v1/billing/confirmations`, public in the sense that it has no sign-in: the aggregator's proof is the only credential.
      - `jsonBodyParser` keeps the raw bytes as `req.rawBody` (a `Buffer`) for this exact path only, through the `verify` option of `express.json`; the 100 kb limit and the other paths do not change.
      - The handler passes the headers (lower-cased names, string values) and `req.rawBody` to `verifyConfirmation`. Null (or a missing body) answers 401 `UNAUTHORIZED` and logs a `warn` event `payment_confirmation_rejected`, with no header or body.
      - Else it calls `confirmPayment(providerReference, req.body ?? null, now)` and answers 200 `{ "status": "OK" }` for every outcome except errors (404 for an unknown reference, 409 `PAYMENT_MISMATCH`). Nothing else is returned: the call is not a browser.
    acceptance: |
      Scenario: AC-1 A genuine confirmation
        Given a pending payment that the fake aggregator settled
        When the aggregator's signed call arrives
        Then the answer is 200 `{ "status": "OK" }` and the plan is active
      Scenario: AC-2 A repeat
        When the same signed call arrives twice
        Then both answers are 200 and one period exists
      Scenario Outline: AC-3 A call that proves nothing
        When the call has <problem>
        Then the answer is 401 `UNAUTHORIZED` and the payment stays PENDING
        Examples:
          | problem                                           |
          | no signature header                               |
          | a wrong signature naming a real pending reference |
          | an empty body                                     |
      Scenario: AC-4 An unknown reference
        When a validly signed call names a reference that no payment holds
        Then the answer is 404 `NOT_FOUND`
      Scenario: AC-5 The parser is unchanged elsewhere
        When another route receives a JSON body, and this route receives one over 100 kb
        Then the other route parses as before and this one answers 413 `PAYLOAD_TOO_LARGE`
    abuse: |
      Scenario: AB-1 A forged confirmation activates a plan (spoofing, T1)
        When a call names a real pending reference, claims success and carries no valid signature
        Then the answer is 401, the payment stays PENDING, no period or receipt exists, and one `warn` log holds no body
      Scenario: AB-2 A signed call says success while the aggregator says pending (spoofing, T1)
        When the call is valid but `getStatus` says PENDING
        Then no period exists and the payment stays PENDING
    implementation:
      create: [tests/integration/billing/confirmation-route.test.ts]
      modify: [src/middleware/body-parser.ts, src/modules/billing/billing.routes.ts, src/modules/billing/billing.service.ts, src/modules/billing/billing.openapi.ts]
      pattern: tests/integration/auth/register-request.test.ts
      signatures:
        - "handleConfirmation(headers: Record<string, string | undefined>, rawBody: Buffer | undefined, parsedBody: unknown, now: Date): Promise<void>"
      types:
        - "Request.rawBody?: Buffer (module augmentation in body-parser.ts)"
      errors: ["UNAUTHORIZED 401", "NOT_FOUND 404", "PAYMENT_MISMATCH 409", "PAYLOAD_TOO_LARGE 413"]
      dependencies: [express]
    security:
      - "v5.0.0-8.2.1: only a call that `verifyConfirmation` accepts is acted on, and `confirmPayment` asks the aggregator for the status again."
      - "v5.0.0-2.2.1: the body keeps its 100 kb maximum."
      - "v5.0.0-16.3.1: a rejected call logs the event name only."
    tests: |
      genuine | integration | AC-1 | 200, plan active
      repeat | integration | AC-2 | 200 twice, one period
      no proof | integration | AC-3 | each Examples row → 401, PENDING
      unknown | integration | AC-4 | 404
      parser | integration | AC-5 | other route unchanged, 413 here
      forged | security | AB-1, CWE-345 | unsigned success claim → 401, no period, log without body
      claim vs status | security | AB-2, CWE-807 | valid call, aggregator PENDING → no period
    command: npx vitest run tests/integration/billing/confirmation-route.test.ts tests/integration/api-docs tests/integration/per-001.test.ts
    out_of_scope:
      - "The real aggregator's signature scheme: ADR-006."
    tests_to_update:
      - "tests/integration/api-docs/catalog.test.ts | the route list lacks the confirmations path | add POST /api/v1/billing/confirmations, remove nothing"
      - "tests/integration/per-001.test.ts | the route list lacks the confirmations path | add POST /api/v1/billing/confirmations, remove nothing"

  - id: BIL-035
    title: The owner is told when a payment is confirmed
    kind: technical
    size: XS
    risk: medium
    depends_on: [BIL-014, NTF-002]
    read_first: [src/modules/billing/confirmation.service.ts, src/modules/billing/notices.ts]
    design_refs: [finances/subscription/plans-on-paie-pour-son-equipe]
    asvs: [v5.0.0-16.3.1]
    story: "Technical story: tell the owner, in their language and with the payer's number masked, that a payment was received, in the same transaction as the activation."
    context: |
      - Exists: `confirmPayment` (BIL-014), `notices.ts` (BIL-019), `notify` and `recipientLanguage` (NTF-002), `findActiveOwnerId` (ORG-044).
      - New `src/lib/mask-phone.ts`: `maskPhone('+237677123456')` is `+237 6 77…` (the first six digits grouped 3, 1, 2, then `…`).
      - `notices.ts` gains `paidNotice(language, input)`. Inside the activation transaction, `confirmPayment` writes `notify({ recipientId, organizationId, sourceEvent: 'subscription.paid', content }, tx)` for the active owner, in that person's language. No active owner, no notice. The payer's number appears only masked.
    acceptance: |
      Scenario Outline: AC-1 The notice
        Given a confirmed ESSENTIAL 3-month payment of 15000 ending on 12 January 2027
        When the owner's language is <language>
        Then the owner has one unread notice `subscription.paid` reading <text>
        Examples:
          | language | text                                                                                  |
          | FR       | Paiement de 15 000 reçu du +237 6 77… : Essentiel actif jusqu'au 12 janvier 2027.     |
          | EN       | Payment of 15,000 received from +237 6 77…: Essential active until January 12, 2027. |
      Scenario: AC-2 No owner
        When the business has no active owner
        Then the payment is still activated and no notice is written
      Scenario: AC-3 A replay
        When the same payment is confirmed twice
        Then the owner has one notice
