kind: stories
module: delivery
constraints: {C-60: "A `PICKUP` order has no delivery address."}
stories:
  - id: DLV-017
    title: A delivery paid in full is accepted even when the credit limit is already exceeded
    kind: change
    size: S
    risk: medium
    amends: [DLV-007, SYNC-017]
    depends_on: [DLV-007]
    read_first: [src/modules/delivery/delivery.service.ts, tests/integration/delivery/open-deliveries.test.ts]
    design_refs: [a3-plafond-de-credit-deja-depasse/la-regle, a3-plafond-de-credit-deja-depasse/le-controle-complete-4-1-commande, a3-plafond-de-credit-deja-depasse/exemples-montants-en-xaf]
    constraints: [CM-15]
    asvs: [v5.0.0-2.3.1]
    story: As a driver, I want to deliver an order paid in full even when the customer's old debt is above the limit, so that an old debt never blocks a paid sale.
    context: |
      - Today `deliverOrder` refuses when balance + total − collected exceeds `credit_limit`, so a customer already above the limit must also pay the old overrun.
      - New pure functions in `src/shared/credit.ts`: `availableCredit` = limit − balance, never below 0, null for no limit; `creditCheck` gives `minCollect` = total − available and `exceededBy` = total − collected − available, both never below 0 (0 with no limit).
      - `balance` is the relationship balance locked before the gesture, `total` the server total of the delivered quantities, `collected` the payments of the same gesture.
      - Online: collected below `minCollect` → 409 `CREDIT_INSUFFICIENT` with `details.min_collect` = `minCollect`, nothing written (as today).
      - Through sync (`viaSync`): never refused; `creditExceededBy` = `exceededBy`, so "plafond dépassé de …" names only this gesture's overrun. Issues already recorded stay.
    acceptance: |
      Scenario Outline: AC-1 The minimum and the overrun
        Given a balance before of <balance>, a credit limit of <limit> and a delivered total of <total>
        When the gesture collects <collected>
        Then the minimum is <min>, online the delivery is <online>, and through sync it is kept <sync>
        Examples:
          | balance | limit  | total | collected | min   | online                   | sync                 |
          | 120000  | 100000 | 10000 | 10000     | 10000 | accepted, balance 120000 | without an issue     |
          | 120000  | 100000 | 10000 | 9999      | 10000 | refused, nothing written | with an overrun of 1 |
          | 100000  | 100000 | 10000 | 10000     | 10000 | accepted, balance 100000 | without an issue     |
          | 90000   | 100000 | 30000 | 20000     | 20000 | accepted, balance 100000 | without an issue     |
          | 5000    | 0      | 10000 | 10000     | 10000 | accepted, balance 5000   | without an issue     |
          | -20000  | 0      | 30000 | 10000     | 10000 | accepted, balance 0      | without an issue     |
          | 120000  | none   | 10000 | 0         | 0     | accepted, balance 130000 | without an issue     |
      Scenario: AC-2 The refusal names the minimum
        Given a balance of 120000 and a limit of 100000
        When the driver delivers 10000 collecting 9999 online
        Then the response is 409 CREDIT_INSUFFICIENT with details.min_collect 10000 and nothing is written
      Scenario: AC-3 Under the limit nothing changes
        Given a limit of 50000 and a balance of 40000
        When the driver delivers 30000 collecting 19999 online
        Then the response is 409 CREDIT_INSUFFICIENT with details.min_collect 20000
    abuse: |
      Scenario: AB-1 An unpaid sale to a customer above the limit
        Given a balance of 120000 and a limit of 100000
        When the driver delivers 10000 collecting 0 online
        Then the response is 409 CREDIT_INSUFFICIENT with details.min_collect 10000 and nothing is written
    implementation:
      create: [src/shared/credit.ts, tests/unit/delivery/credit-check.test.ts, tests/integration/delivery/credit-already-exceeded.test.ts]
      modify: [src/modules/delivery/delivery.service.ts]
      pattern: tests/integration/delivery/open-deliveries.test.ts
      signatures:
        - "availableCredit(limit: bigint | null, balance: bigint): bigint | null"
        - "creditCheck(input: { limit: bigint | null; balance: bigint; total: bigint; collected: bigint }): { minCollect: bigint; exceededBy: bigint }"
      types: []
      errors: ["CREDIT_INSUFFICIENT 409"]
      dependencies: []
    security:
      - "v5.0.0-2.3.1: the minimum comes from the locked balance and the server total, never from the phone."
    tests: |
      credit rule | unit | AC-1, CM-15 | each Examples row → min and overrun
      online rows | integration | AC-1 | rows 1, 4 and 6 accepted with their final balance
      refusal | integration | AC-2 | 409, min_collect 10000, no line, entry or status change
      sync row | integration | AC-1 | row 2 through `deliverOrder` with `viaSync` → DELIVERED, creditExceededBy 1
      under the limit | integration | AC-3 | min_collect 20000
      unpaid above limit | security | AB-1, WSTG-BUSL-01 | 409, nothing written
    tests_to_update:
      - "tests/integration/delivery/deliver.test.ts | its customers start within their limit, where the new check gives the same minimum | unchanged: passes without edits"
      - "tests/integration/sync/controls-credit.test.ts | its balance starts within the limit, so the overrun named is the same | unchanged: passes without edits"
    command: npx vitest run tests/unit/delivery/credit-check.test.ts tests/integration/delivery/credit-already-exceeded.test.ts
    out_of_scope:
      - "The driver's available credit in sync rows (REL-032)."

  - id: DLV-018
    title: The order for the rest keeps the reception mode of the first order
    kind: change
    size: XS
    risk: low
    amends: [DLV-008]
    depends_on: [DLV-008, ORD-036]
    read_first: [src/modules/delivery/delivery.repository.ts, tests/integration/delivery/open-deliveries.test.ts]
    design_refs: [a4-livraison-ou-retrait-reception-mode]
    constraints: [C-60]
    asvs: [v5.0.0-2.3.1]
    story: As a driver, I want the order for the rest to keep the reception mode of the first one, so that the rest is delivered or picked up like the order was.
    context: |
      - `deliverOrder` with `rest: 'LATER'` creates the order for the rest through `insertRestOrder` (delivery.repository.ts), copying the address of the first order.
      - It now also copies `reception_mode` from the first order; an empty mode stays empty.
      - A `PICKUP` order has no address, so its rest has none either.
    acceptance: |
      Scenario Outline: AC-1 The rest keeps the mode
        Given a CONFIRMED order with reception_mode <mode> and 10 units ordered
        When the driver delivers 8 with rest LATER
        Then the order for the rest has reception_mode <mode> and the address <address>
        Examples:
          | mode     | address              |
          | DELIVERY | of the first order   |
          | PICKUP   | empty                |
          | empty    | of the first order   |
    implementation:
      create: [tests/integration/delivery/rest-reception-mode.test.ts]
      modify: [src/modules/delivery/delivery.service.ts, src/modules/delivery/delivery.repository.ts]
      pattern: tests/integration/delivery/open-deliveries.test.ts
      signatures: []
      types: []
      errors: []
      dependencies: ["@prisma/client"]
    security:
      - "v5.0.0-2.3.1: the mode comes from the stored first order, never from the request."
    tests: |
      rest mode | integration | AC-1, C-60 | each Examples row → the rest's mode and address
    tests_to_update:
      - "tests/integration/delivery/partial-delivery.test.ts | its orders are DELIVERY orders, whose rest keeps DELIVERY | unchanged: passes without edits"
    command: npx vitest run tests/integration/delivery/rest-reception-mode.test.ts
    out_of_scope:
      - "Rest orders made through sync, which call the same `deliverOrder`."

  - id: DLV-019
    title: A delivery writes its receipt once, in the transaction that delivers the order
    kind: change
    size: M
    risk: high
    amends: [DLV-007, DLV-009]
    depends_on: [ORD-040, DLV-007, DLV-009]
    read_first: [src/modules/order/order.state.ts, tests/integration/delivery/open-deliveries.test.ts]
    design_refs: [a8-le-recu-ne-change-plus-point-9, a8-le-recu-ne-change-plus-point-9/champs-figes-champs-ajoutes-a-order]
    constraints: []
    fields: "Order.{supplier_name_applied,customer_name_applied,collected_applied,balance_after_applied}"
    asvs: [v5.0.0-2.3.1, v5.0.0-15.3.3]
    story: As a supplier, I want each delivery to write its receipt once, from the server's own data, so that every copy of a receipt is the same.
    context: |
      - `TransitionFields` (order.state.ts) gets `receipt?: ReceiptFields`; `transitionOrder` writes it in the same update that sets DELIVERED, including the sync step from CANCELLED.
      - `deliverOrder` (online and `viaSync`) and `sellAtCounter` compute it before `transitionOrder`, in their transaction: `collectedApplied` = the payments of this gesture; `balanceAfterApplied` = the locked balance + total − collected.
      - Names, read in the transaction through a new `findReceiptNames`: `supplierNameApplied` = the supplier organization's `name`; `customerNameApplied` = the customer organization's `name`, else the customer person's `full_name`, else null (counter, guest, anonymized). Never `customer_label`.
      - A repeat of the same gesture (`findClosedResult`) writes nothing; no route or push body accepts these fields.
    acceptance: |
      Scenario: AC-1 Online delivery
        Given business C, customer of supplier S, with a balance of 40000
        When a driver delivers 30000 and collects 25000
        Then the order has supplier_name_applied S's name, customer_name_applied C's name, collected_applied 25000, balance_after_applied 45000, equal to the balance read afterwards
      Scenario Outline: AC-2 The customer's public name
        Given a customer <customer> with customer_label "Mama du marché"
        When the order is delivered
        Then customer_name_applied is <name>
        Examples:
          | customer                         | name       |
          | person with full_name "Awa Kone" | "Awa Kone" |
          | person without full_name         | null       |
      Scenario: AC-3 Counter sale
        When a seller validates a counter sale of 12000
        Then customer_name_applied is null, collected_applied 12000 and balance_after_applied the counter's balance
      Scenario: AC-4 Delivered through sync
        When a pushed delivery closes a CONFIRMED order, and another closes a CANCELLED one
        Then both orders get the four fields like AC-1
      Scenario: AC-5 Written once
        When the same delivery is sent again with the same ids, after S renamed its business
        Then the four fields keep their first values
    abuse: |
      Scenario: AB-1 A receipt sent by the phone
        When the deliver body adds collected_applied or supplier_name_applied
        Then the response is 400 VALIDATION_ERROR and nothing is written
    implementation:
      create: [tests/integration/delivery/receipt-fields.test.ts]
      modify: [src/modules/order/order.state.ts, src/modules/order/order.repository.ts, src/modules/delivery/delivery.service.ts, src/modules/delivery/delivery.repository.ts]
      pattern: tests/integration/delivery/open-deliveries.test.ts
      signatures:
        - "findReceiptNames(tx: Prisma.TransactionClient, relationshipId: string): Promise<{ supplierName: string; customerName: string | null }>"
      types:
        - "ReceiptFields = { supplierNameApplied: string; customerNameApplied: string | null; collectedApplied: bigint; balanceAfterApplied: bigint }"
      errors: ["VALIDATION_ERROR 400"]
      dependencies: ["@prisma/client"]
    security:
      - "v5.0.0-2.3.1: the receipt is written in the delivering transaction, from server data only."
      - "v5.0.0-15.3.3: no body accepts the four fields."
    tests: |
      online | integration | AC-1 | four values; balance equals the one read afterwards
      names | integration | AC-2 | each Examples row; never customer_label
      counter | integration | AC-3 | null name, collected = total
      sync | integration | AC-4 | both orders get the fields
      once | integration | AC-5 | fields unchanged after rename and repeat
      phone receipt | security | AB-1, WSTG-INPV-20 | 400, nothing written
    tests_to_update:
      - "tests/integration/delivery/deliver.test.ts | the receipt fields are added; no existing field changes | unchanged: passes without edits"
      - "tests/integration/delivery/counter-sale.test.ts | the receipt fields are added; no existing field changes | unchanged: passes without edits"
    command: npx vitest run tests/integration/delivery/receipt-fields.test.ts
    out_of_scope:
      - "Orders delivered before this story (ORD-042) and the database rules (ORD-042, ORD-043); sync rows (SYNC-048)."
