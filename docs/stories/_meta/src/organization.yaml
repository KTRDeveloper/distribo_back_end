kind: module
module: organization
prefix: ORG
title: Organization
responsibility: Owns businesses, their team with fixed roles and ownership, closing and reopening, the verified public contacts (numbers and email) and the plan fields of a business, which billing writes.
entities: [Organization, Collaboration, OrganizationContact]
depends_on: [foundation, person, notification, access, auth]
asvs_level: L2
asvs_rationale: Roles decide who can move money and change rights; team, ownership and closing gestures change other people's access; a public contact decides to whom a customer believes they send money, so it is published only once verified.
classification:
  - "Organization.name, description, logo_key | public | visible to anyone who finds the business"
  - "Organization.payment_code, plan, plan_ends_at, grace_ends_at, max_collaborators, max_products | confidential | visible to the team of the business only, never to its customers or suppliers; written by the server only"
  - "OrganizationContact.value | public | a verified contact is visible to the team and to customers, suppliers and drivers of the business; a pending contact is visible to the team only"
  - "OrganizationContact.verification_method, created_by_id | internal | visible to the team"
  - "Collaboration.amount_held | confidential | visible to the collaborator and the owner"
  - "Collaboration.role | internal | visible to the team"
threats:
  - "T1 | E | A member of one business acts in another | every organization route loads the actor from an ACTIVE collaboration of that organization, else 404 | ORG-005 AB-1"
  - "T2 | E | A manager or seller changes the team or the owner | team gestures need OWNER and the network | ORG-007 AB-1, ORG-009 AB-1, ORG-010 AB-1"
  - "T3 | E | The owner is demoted, revoked or left with two owners | the database keeps exactly one active OWNER and the routes refuse to touch it | ORG-003 AB-1, ORG-010 AB-2"
  - "T4 | S | A business is found under a number that is not its own | a contact is published only when it is the owner's own verified number or when its code, received on that number or address, was entered | ORG-024 AB-1, ORG-025 AB-1, ORG-029 AB-1"
  - "T5 | I | Enumerating businesses by number | per-person lookup limit shared with person lookups | ORG-018 AB-2"
  - "T6 | E | A manager, seller or driver changes the public contacts | the contact gestures need OWNER and the network | ORG-024 AB-2, ORG-027 AB-1"
  - "T7 | S | A verification code is guessed, or used on another contact | a code belongs to one contact and its target, allows 5 attempts and is consumed once | ORG-025 AB-2"
  - "T8 | S | A recycled number keeps a business findable | a number that changes holder sends its contacts back to pending and warns the owner | ORG-037 AB-1"
  - "T9 | I | The plan of a business reaches a customer or a supplier | no organization view returns the plan fields to anyone who is not an ACTIVE member of the team | ORG-028 AB-1"
constraints:
  C-05: "`Collaboration` is unique per (`person_id`, `organization_id`); an ACTIVE collaboration needs a registered person; every organization has exactly one ACTIVE OWNER at the end of each transaction."
  C-41: "`Organization.payment_code` is unique; `plan`, `plan_ends_at`, `grace_ends_at`, `max_collaborators` and `max_products` are written by the server only and sent to the team of the business only; `plan = FREE` exactly when `plan_ends_at` is empty; a set `grace_ends_at` is after `plan_ends_at`."
  C-42: "At each invitation, the ACTIVE or INVITED collaborators of an organization, owner excluded, number at most `Organization.max_collaborators`; the status PAUSED is written by the server only and never for the OWNER."
  C-43: "`OrganizationContact`: `slot` is set exactly when `kind = PHONE` and is between 1 and 3, unique per (`organization_id`, `slot`); at most one EMAIL per organization (partial unique index); unique per (`organization_id`, `value`); a PHONE `value` is in E.164 format; `verification_method` is set exactly when `verified_at` is set; all these uniqueness rules ignore deleted rows."
  C-44: "`OrganizationContact` is written by the owner only, online; `verified_at` and `verification_method` are set by the server."
  C-33: "`OtpChallenge`: `attempts` is at most 5; a consumed or expired code is no longer usable; SMS only to +237 numbers; with `channel = EMAIL`, `target` is the person's email or an administrator's recovery email, already verified except for `EMAIL_VERIFICATION`, or the email of the targeted contact for `ORG_CONTACT_VERIFICATION`; `organization_contact_id` is set exactly when `purpose = ORG_CONTACT_VERIFICATION`, and `target` equals its value."
  C-46: "`Product.paused_at` is written by the server only; products on sale (not deleted, not paused, with at least one ACTIVE variant) number at most `Organization.max_products`, checked by the phone and by the online routes; what arrives in excess through synchronization is paused, never refused."
  C-49: "`Product.image_keys` and `ProductVariant.image_keys` hold at most 5 keys (database limit); the application allows `k` of them (5 at most, set at deployment); a key is cited by one card only, across all tables; `image_keys`, `Organization.logo_key` and `Person.avatar_key` are written by the server only."
  CM-03: "`Person.scope_version` is incremented by the server on every rights change."
  C-37: "`CustomerRelationship.balance` and `Collaboration.amount_held` are updated by adding the effect of each operation inside its transaction, always relationship first then collaboration; a nightly check compares each total with the sum of its entries."
  CM-09: "The OWNER can be neither demoted nor revoked; an ownership transfer makes the chosen ACTIVE collaborator OWNER and the former owner MANAGER in one transaction; a revocation takes effect immediately."
  CM-10: "CLOSED (by the owner, reopenable): no new order or customer, not findable by number, pending orders refused with reason 'Commerce fermé', team revoked, plans stopped without refund; relations, balances, history and verified public contacts stay visible and payments stay possible; a reopened business restarts from the free plan."
  CM-26: "Finding an organization by number returns only ACTIVE organizations that have a verified PHONE contact with that number; a number that is not a verified public number of any organization leads to an invitation for every person."
  CM-36: "When a phone number changes holder (recycled number), every `OrganizationContact` with that number goes back to pending (`verified_at` and `verification_method` cleared), is no longer published, and the owner is notified; when the owner changes their own number, nothing changes by itself."
  C-01: "Identifiers use `uuid` columns (UUIDv7), amounts `bigint`, quantities `numeric(12,3)`, timestamps `timestamptz`."
  C-35: "Synchronized tables carry `server_updated_at`, set by the server on every write, and `deleted_at` for deletion; unique constraints ignore deleted rows."
contracts:
  provides:
    - name: OrganizationActor
      file: src/middleware/load-actor.ts
      story: ORG-005
      items:
        - "loadActor: RequestHandler — reads `req.params.organizationId` and `req.user.id`, sets `req.actor = { personId, organizationId, role }` from an ACTIVE collaboration, else 404 NOT_FOUND"
        - "getActiveCollaboration(personId: string, organizationId: string): Promise<Collaboration | null>"
        - "assertOrganizationActive(organizationId: string, tx?): Promise<void> — 409 ORGANIZATION_NOT_ACTIVE when SUSPENDED or CLOSED"
      used_by: [relationship, catalog, order, finance, delivery, sync]
    - name: AmountHeld
      file: src/modules/organization/organization.repository.ts
      story: ORG-003
      items:
        - "addAmountHeld(tx, personId: string, organizationId: string, delta: bigint): Promise<void> — `SET amount_held = amount_held + delta`"
      used_by: [finance]
    - name: PublicContacts
      file: src/modules/organization/organization.repository.ts
      story: ORG-018
      items:
        - "findOrganizationsByPublicNumber(e164: string): Promise<Array<{ id: string; name: string; description: string | null }>> — ACTIVE organizations with a verified PHONE contact holding the number"
      used_by: [relationship]
    - name: OrganizationLifecycleHooks
      file: src/modules/organization/lifecycle-hooks.ts
      story: ORG-034
      items:
        - "registerLifecycleHook(hook: { onClose?: (tx: Prisma.TransactionClient, organizationId: string, now: Date) => Promise<void>; onReopen?: (tx: Prisma.TransactionClient, organizationId: string, now: Date) => Promise<void> }): () => void — hooks run inside the closing or reopening transaction, in registration order; the returned function removes the hook"
      used_by: [billing]
    - name: SubscriptionFields
      file: src/modules/organization/organization.repository.ts
      story: ORG-035
      items:
        - "writePlanFields(tx: Prisma.TransactionClient, organizationId: string, fields: PlanFields): Promise<void> — after creation, the only writer of `plan`, `plan_ends_at`, `grace_ends_at`, `max_collaborators`, `max_products`; the database refuses an impossible combination"
        - "listTeamSeats(tx: Prisma.TransactionClient, organizationId: string): Promise<TeamSeat[]> — non-owner collaborations ACTIVE, INVITED or PAUSED, oldest invitation first; TeamSeat = { id, personId, role, status, invitedAt, acceptedAt }"
        - "setSeatPaused(tx: Prisma.TransactionClient, collaborationId: string, paused: boolean): Promise<boolean> — PAUSED from ACTIVE or INVITED; back to ACTIVE, or INVITED when `accepted_at` is empty; never for the OWNER; a change bumps the person's scope version and returns true"
      used_by: [billing]
    - name: PaymentTargets
      file: src/modules/organization/organization.repository.ts
      story: ORG-044
      items:
        - "findOrganizationByPaymentCode(code: string, tx?: Prisma.TransactionClient): Promise<OrganizationSummary | null> — exact match, non-deleted; no trimming or case change; OrganizationSummary = { id, name, status: 'ACTIVE' | 'SUSPENDED' | 'CLOSED' }"
        - "findOrganizationSummary(organizationId: string, tx?: Prisma.TransactionClient): Promise<OrganizationSummary | null> — null when absent or deleted"
        - "findActiveOwnerId(tx: Prisma.TransactionClient, organizationId: string): Promise<string | null> — person id of the ACTIVE OWNER"
      used_by: [billing]
    - name: PlanRefresh
      file: src/modules/organization/organization.repository.ts
      story: ORG-045
      items:
        - "readPlanFields(tx: Prisma.TransactionClient, organizationId: string): Promise<PlanFields | null> — the five plan fields of a non-deleted business, else null"
        - "listOrganizationsEnding(from: Date, to: Date, limit: number, afterId?: string): Promise<string[]> — ids of non-deleted businesses, ascending, whose plan is not FREE and whose `plan_ends_at` is in [from, to); reads only"
        - "listOrganizationsToRefresh(now: Date, limit: number, afterId?: string): Promise<string[]> — ids of non-deleted businesses, ascending, whose plan is not FREE and whose grace or plan end is past, or whose ACTIVE and INVITED non-owner seats exceed `max_collaborators`; reads only"
      used_by: [billing]
    - name: OrganizationLogo
      file: src/modules/organization/organization.repository.ts
      story: ORG-038
      items:
        - "getLogoKey(organizationId: string): Promise<string | null>"
        - "setLogoKey(tx: Prisma.TransactionClient, organizationId: string, key: string | null): Promise<string | null> — the only writer of `logo_key`; returns the previous key; a key outside `logos/` throws a RangeError"
      used_by: [images]
  consumes:
    - "person: PersonRepository, require_registered_person, registerPhoneReleasedHandler (docs/stories/modules/person/contracts.md)"
    - "access: requireAbility, idempotent, abilityFor (docs/stories/modules/access/contracts.md)"
    - "notification: notify (docs/stories/modules/notification/contracts.md)"
    - "auth: authMiddleware, revokeSessions, OtpService issueCode and verifyCode (docs/stories/modules/auth/contracts.md)"
    - "foundation: generatePaymentCode, PLANS (docs/stories/modules/foundation/contracts.md)"
pointers:
  - "Decision: `docs/stories/decisions/ADR-004-modules-for-design-v16.md`"
stories:
  - id: ORG-001
    title: Organizations table
    kind: technical
    size: XS
    risk: low
    depends_on: [PER-002, FND-002, FND-005, NTF-001]
    read_first: [prisma/schema.prisma, tests/integration/notification/notification-table.test.ts]
    design_refs: [identite-et-organisation/organization, contraintes-a-poser-au-niveau-base-de]
    constraints: [Organization:required, Organization.status:enum, C-01, C-35]
    asvs: [v5.0.0-2.2.3]
    fields: ["Organization.{name,description,email,status,created_at}"]
    story: "Technical story: create the organizations table so that businesses can exist."
    context: |
      - Exists: `set_server_updated_at()` (FND-002), `expectColumnType` (FND-005).
      - Adds: table `organizations` with `server_updated_at` and `deleted_at`, status default ACTIVE, `created_at` default now. There is no owner column: ownership is the OWNER collaboration (ORG-003).
    acceptance: |
      Scenario: AC-1 Row with defaults
        When an organization is inserted with a name
        Then `status` is ACTIVE, `created_at` and `server_updated_at` are set, description and email are empty
      Scenario Outline: AC-2 Required and enum
        When a row has <values>
        Then the insert <result>
        Examples:
          | values                    | result          |
          | name empty (null)         | rejects (23502) |
          | status SUSPENDED          | accepts         |
          | status CLOSED             | accepts         |
          | status "DELETED"          | rejects         |
      Scenario: AC-3 Server time
        When a row is updated
        Then `server_updated_at` moves forward
    implementation:
      create: [prisma/migrations/<timestamp>_org_001_organizations/migration.sql, tests/integration/organization/organization-table.test.ts]
      modify: [prisma/schema.prisma]
      pattern: tests/integration/notification/notification-table.test.ts
      signatures: []
      types: []
      errors: []
      dependencies: [prisma, "@prisma/client"]
    security:
      - "v5.0.0-2.2.3: status values are enforced by the database enum."
    tests: |
      defaults | integration | AC-1, C-01 | insert → defaults; column types
      required and enum | integration | AC-2, Organization:required, Organization.status:enum | each Examples row → accepted or rejected
      server time | integration | AC-3, C-35 | update → later server_updated_at
    command: npx vitest run tests/integration/organization/organization-table.test.ts
    out_of_scope:
      - "Collaboration table (ORG-003). Creating organizations (ORG-004)."
  - id: ORG-002
    title: Notifications point to organizations
    kind: change
    size: XS
    risk: low
    depends_on: [ORG-001, NTF-001]
    amends: [NTF-001]
    read_first: [prisma/schema.prisma, tests/integration/notification/notification-table.test.ts]
    design_refs: [notifications/notification]
    constraints: [Notification:fk]
    asvs: [v5.0.0-2.2.3]
    story: "Technical story: add the foreign key from notifications to organizations, so that a notification's business context is always a real business."
    context: |
      - Exists: `notifications.organization_id` as a plain `uuid` column (NTF-001); `organizations` (ORG-001).
      - Changes: a migration adds a foreign key `notifications.organization_id` to `organizations(id)`.
    acceptance: |
      Scenario: AC-1 Foreign key
        When a notification references an unknown organization id
        Then the insert fails with 23503
      Scenario: AC-2 Valid and empty
        When it references an existing organization, or none
        Then the insert succeeds
      Scenario: AC-3 Recipient key unchanged
        When a notification references an unknown recipient
        Then the insert still fails with 23503
    implementation:
      create: [prisma/migrations/<timestamp>_org_002_notification_org_fk/migration.sql]
      modify: [prisma/schema.prisma]
      pattern: prisma/migrations/20260930210000_baseline/migration.sql
      signatures: []
      types: []
      errors: []
      dependencies: [prisma]
    security:
      - "v5.0.0-2.2.3: referential integrity in the database."
    tests: |
      unknown organization | integration | AC-1, Notification:fk | 23503
      valid and empty | integration | AC-2 | accepted
      recipient key | integration | AC-3, Notification:fk | 23503
    command: npx vitest run tests/integration/notification/notification-table.test.ts
    out_of_scope:
      - "Anything else about notifications."
    tests_to_update:
      - "tests/integration/notification/notification-table.test.ts | inserts notifications with a random organization id, if it does | use an existing organization or none"
  - id: ORG-003
    title: Collaborations table
    kind: technical
    size: M
    risk: high
    depends_on: [ORG-001, PER-008, FND-005]
    read_first: [prisma/schema.prisma, tests/integration/person/registered-guard.test.ts]
    design_refs: [identite-et-organisation/collaboration, contraintes-a-poser-au-niveau-base-de]
    constraints: [Collaboration:required, Collaboration.role:enum, Collaboration.status:enum, Collaboration:fk, C-05, CM-09, C-01, C-35]
    asvs: [v5.0.0-8.2.1, v5.0.0-2.2.3]
    fields: ["Collaboration.{person_id,organization_id,role,status,is_public_contact,invited_at,accepted_at,amount_held}"]
    story: "Technical story: create the collaborations table with the ownership and public-contact rules in the database, so that roles cannot be corrupted by any code path."
    context: |
      - Exists: `people`, `organizations`, `require_registered_person()`.
      - Adds: table `collaborations` (`is_public_contact` default false, `amount_held` bigint default 0, `invited_at` default now) with `server_updated_at` and `deleted_at`, unique (`person_id`, `organization_id`), partial unique index on (`organization_id`) where `role = 'OWNER'` and `status = 'ACTIVE'`.
      - A trigger refuses `status = ACTIVE` for a person with empty `registered_at`, and `is_public_contact = true` unless the collaboration is ACTIVE and the person's `phone_number` is not null.
      - A deferred constraint trigger checks that an organization with any collaboration has exactly one ACTIVE OWNER when the transaction ends.
      - A trigger on `people` clears `is_public_contact` on the person's collaborations when their `phone_number` becomes null.
    acceptance: |
      Scenario Outline: AC-1 Table rules
        When a collaboration is inserted with <values>
        Then the database <result>
        Examples:
          | values                                                        | result          |
          | a second row for the same person and organization             | rejects (23505) |
          | status ACTIVE for a guest                                     | rejects (23514) |
          | status INVITED for a guest                                    | accepts         |
          | is_public_contact true, INVITED                               | rejects (23514) |
          | is_public_contact true, ACTIVE, person with an active number  | accepts         |
          | role "BOSS"                                                   | rejects         |
      Scenario: AC-2 Exactly one owner
        When an organization gets a second ACTIVE OWNER, or its only OWNER row is set to MANAGER, then the transaction commits
        Then the commit fails
      Scenario: AC-3 Ownership swap
        When one transaction makes the OWNER a MANAGER and another ACTIVE collaborator the OWNER
        Then the commit succeeds
      Scenario: AC-4 Number released
        When a person's `phone_number` becomes null
        Then their collaborations have `is_public_contact` false
    abuse: |
      Scenario: AB-1 Owner removed by a crafted write (elevation)
        When code sets the only OWNER's status to REVOKED and commits
        Then PostgreSQL refuses the commit
    implementation:
      create: [prisma/migrations/<timestamp>_org_003_collaborations/migration.sql, tests/integration/organization/collaboration-table.test.ts]
      modify: [prisma/schema.prisma]
      pattern: tests/integration/person/person-table.test.ts
      signatures: []
      types: []
      errors: []
      dependencies: [prisma, "@prisma/client"]
    security:
      - "v5.0.0-8.2.1: role and status rules live in the database, not only in routes."
      - "v5.0.0-2.2.3: related columns are checked together by triggers."
    tests: |
      table rules | integration | AC-1, C-05, Collaboration:required, Collaboration.role:enum, Collaboration.status:enum, Collaboration:fk | each Examples row → accepted or rejected
      one owner | integration | AC-2, C-05, CM-09 | second owner or owner demotion → commit error
      swap | integration | AC-3, CM-09 | one transaction swap → commit succeeds
      number released | integration | AC-4, C-05 | update people.phone_number to null → flag false
      column types and defaults | integration | AC-1, C-01, C-35 | `expectColumnType` on ids and `amount_held`; `amount_held` defaults to 0; `server_updated_at` set
      crafted owner removal | security | AB-1, CWE-269 | REVOKED only owner → commit refused
    command: npx vitest run tests/integration/organization/collaboration-table.test.ts
    out_of_scope:
      - "Routes that write collaborations (ORG-004 onward)."
  - id: ORG-004
    title: Registered person creates an organization
    kind: feature
    size: S
    risk: high
    depends_on: [ORG-003, ACC-007, PER-005, NTF-002]
    read_first: [docs/stories/modules/access/contracts.md, src/modules/tasks/tasks.routes.ts]
    design_refs: [identite-et-organisation/organization, identite-et-organisation/collaboration]
    constraints: [Organization:required, C-05, CM-03]
    asvs: [v5.0.0-8.2.1, v5.0.0-2.3.3, v5.0.0-15.3.3]
    story: As a customer, I want to create my business with a name so that I become its owner.
    context: |
      - Exists: `idempotent()` (ACC-007), tables (ORG-001, ORG-003), `bumpScopeVersion` (PER-005), `authMiddleware`.
      - Adds: `POST /api/v1/organizations` with `{ id, name, description?, email? }`; `id` is a UUIDv7 made by the phone. Response 201 `{ id, name, description, email, status, created_at, role: 'OWNER' }`.
      - One transaction creates the organization and the creator's collaboration: role OWNER, status ACTIVE, `is_public_contact` true (the creator has an active number), `accepted_at` = now; then bumps the creator's `scope_version`.
      - `name` 1 to 100 characters; `description` up to 2000; `email` a valid address (Q-027). A repeat of the same `id` returns the first response.
    acceptance: |
      Scenario: AC-1 Create
        When a signed-in person posts a name
        Then the response is 201, the organization is ACTIVE, and the caller has an ACTIVE OWNER collaboration with is_public_contact true
      Scenario: AC-2 Scope version
        Then the caller's `scope_version` increased by 1
      Scenario Outline: AC-3 Limits
        When the body has <field> = <value>
        Then the response is <status>
        Examples:
          | field       | value      | status |
          | name        | empty      | 400    |
          | name        | 100 chars  | 201    |
          | name        | 101 chars  | 400    |
          | description | 2001 chars | 400    |
          | email       | not-mail   | 400    |
          | id          | a UUIDv4   | 400    |
      Scenario: AC-4 Repeat
        When the same body is posted twice
        Then one organization exists and both responses are equal
      Scenario: AC-5 Atomic
        When the collaboration insert fails
        Then no organization exists
    abuse: |
      Scenario: AB-1 Owner or status chosen by the client (mass assignment)
        When the body contains status, role, owner or person_id
        Then the response is 400 and nothing is stored
      Scenario: AB-2 No token (unauthenticated)
        When the request has no valid token
        Then the response is 401
    implementation:
      create: [src/modules/organization/organization.routes.ts, src/modules/organization/organization.schemas.ts, src/modules/organization/organization.service.ts, src/modules/organization/organization.repository.ts, tests/integration/organization/create.test.ts]
      modify: [src/app.ts]
      pattern: src/modules/tasks/tasks.routes.ts
      signatures:
        - "createOrganization(personId: string, input: CreateOrganizationInput): Promise<OrganizationView>"
      types:
        - "CreateOrganizationInput = { id: string; name: string; description?: string; email?: string }"
        - "OrganizationView = { id: string; name: string; description: string | null; email: string | null; status: string; created_at: string; role: 'OWNER' }"
      errors: ["VALIDATION_ERROR 400", "UNAUTHORIZED 401"]
      dependencies: [express, zod, "@asteasolutions/zod-to-openapi"]
    security:
      - "v5.0.0-15.3.3: strict schema with four fields."
      - "v5.0.0-2.3.3: organization, collaboration and scope bump are one transaction."
      - "v5.0.0-8.2.1: the owner is the person from the token, never from the body."
    tests: |
      create | integration | AC-1, Organization:required, C-05 | 201, org and OWNER row
      scope version | integration | AC-2, CM-03 | +1
      limits | integration | AC-3 | each Examples row → status
      repeat | integration | AC-4 | one row, equal responses
      atomic | integration | AC-5 | forced failure → no org
      mass assignment | security | AB-1, CWE-915 | forbidden fields → 400
      no token | security | AB-2, WSTG-ATHN-04 | 401
    command: npx vitest run tests/integration/organization/create.test.ts
    out_of_scope:
      - "The default counter 'Client de passage' (REL module)."
      - "Renaming or editing an organization (Q-032)."
      - "OpenAPI registration of this route (ORG-005)."
  - id: ORG-005
    title: Actor loading and reading my organizations
    kind: feature
    size: M
    risk: high
    depends_on: [ORG-004, ACC-006]
    read_first: [src/middleware/require-ability.ts, src/modules/organization/organization.routes.ts]
    design_refs: [identite-et-organisation/collaboration, identite-et-organisation/organization]
    constraints: [Collaboration.role:enum]
    asvs: [v5.0.0-8.2.1, v5.0.0-8.2.2, v5.0.0-8.4.1, v5.0.0-15.3.1]
    story: As an owner, I want to see my organizations and their details so that I know where I work and with which role.
    context: |
      - Exists: `requireAbility` and the `Actor` type (ACC-006); `POST /organizations` (ORG-004).
      - Adds: `src/middleware/load-actor.ts` (`loadActor`, `getActiveCollaboration`, `assertOrganizationActive`), and `organization.openapi.ts` documenting `POST /organizations` (ORG-004) and the two routes below; `organization.routes.ts` imports it for its side effect (`import './organization.openapi.js'`) so that `src/app.ts` needs no change; `GET /api/v1/organizations` (my ACTIVE collaborations: `id, name, status, role`, paginated) and `GET /api/v1/organizations/{organizationId}` (`id, name, description, email, status, created_at, role`).
      - `loadActor` sets `req.actor` from the caller's ACTIVE collaboration in `req.params.organizationId`; without one it answers 404 `NOT_FOUND` (never 403, so an id is never confirmed).
      - `assertOrganizationActive` throws 409 `ORGANIZATION_NOT_ACTIVE` when the status is SUSPENDED or CLOSED.
    acceptance: |
