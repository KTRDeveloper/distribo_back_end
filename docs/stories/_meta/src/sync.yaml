kind: module
module: sync
prefix: SYNC
title: Synchronization
responsibility: Owns the WatermelonDB pull and push endpoints, the judging of every pushed line, the archive of received batches, full resynchronization and replay.
entities: [SyncArchive]
depends_on: [foundation, person, notification, access, auth, organization, relationship, catalog, order, finance, delivery, admin]
asvs_level: L2
asvs_rationale: A phone can be modified; the server judges every pushed line for scope, fields, steps and controls, and never trusts a computed value or a date from the phone.
classification:
  - "SyncArchive.changes | confidential | full pushed batches, administrators only, kept 90 days"
  - "Pull responses | confidential | each phone receives only what its user may see; a driver receives available credit instead of balance and limit"
threats:
  - "T1 | E | A phone writes rows of another organization | every pushed row is checked against the viewer's scope | SYNC-010 AB-1"
  - "T2 | T | A phone writes fields it may not, or computed fields | field rights by role, computed fields ignored | SYNC-010 AB-2"
  - "T3 | T | A phone sends a lower sale or a forged balance | sale amount, totals and balances are recomputed by the server | SYNC-014 AB-1"
  - "T4 | I | A driver's phone receives customer debts | pull projects available credit only | SYNC-004 AB-1"
  - "T5 | E | A revoked collaborator keeps writing | the first push after a rights change is judged with current rights | SYNC-019 AB-1"
  - "T6 | D | One duplicate blocks a phone forever | duplicates are merged or stored closed and unknown rows are set aside | SYNC-009 AB-1, SYNC-011 AB-1"
  - "T7 | E | A replay runs with an administrator's rights | replay is judged as its author with current rights | SYNC-023 AB-1"
constraints:
  C-32: "Immutable journals are never updated or deleted by the application; only the retention purge removes them."
  C-39: "The application account has only INSERT and SELECT on the immutable tables."
  C-29: "`Administrator.totp_secret` is required; `recovery_email` differs from `Person.email`; `AdminAction` has exactly one target, a reason, `sync_archive_id` only for REPLAY_SYNC (super administrators only), and is immutable."
  C-35: "Synchronized tables carry `server_updated_at`, set by the server on every write, and `deleted_at` for deletion; unique constraints ignore deleted rows."
  C-36: "No uniqueness rule makes a sync fail; every possible duplicate has a written behavior, and a line no rule can write is set aside."
  CM-27: "Sync: computed fields (balance, amount_held, balance_effect, totals, line amounts, sale amount, customer-order reference price, price_updated_at, credit_limit_set_at, ended_by_party, last_synced_at, scope_version, server_updated_at) are ignored on receipt and recomputed."
  CM-28: "Sync outcomes: a business problem is stored with sync_issue; a conflict is refused until the phone pulls and resends; a forbidden send is refused, recorded, and triggers a full resync plus a notification to its author; a line no rule can write is set aside while the rest passes."
  CM-29: "First send after a rights change (scope_version_seen older than scope_version): judged with current rights; seller operations (sales, deliveries, collections) are always accepted and reported to the owner, any other forbidden operation is refused and reported."
  CM-30: "Sync pull returns only what the user may see; a driver receives, per customer, only the available credit instead of balance and limit; the phone keeps all customers, the catalog, open orders and the last 90 days of the rest."
  CM-31: "The server refuses a sync from an app version below the platform minimum; a phone clock more than 5 minutes off makes the app ask for automatic time; operations dated in the future or more than 3 days after the phone's last sync are reported to the owner, never refused."
  CM-32: "Only a SUPER_ADMIN replays an archived batch, with a mandatory reason, logged as REPLAY_SYNC; it is judged as if sent by its author with their current rights, never the administrator's; the author and the owner are notified."
  CM-35: "Retention: commercial data and journals at least 10 years; notifications 24 months; SyncArchive 90 days; expired or revoked verification codes and tokens 30 days."
  CM-03: "`Person.scope_version` is incremented by the server on every rights change."
  CM-22: "Partial delivery: 'later' creates a CONFIRMED order for the remainder at the original order's prices; 'abandon' closes the order on what was delivered."
  CM-23: "Crossed departures: the server keeps the first delivery and stores the other closed with sync_issue 'Livraison déjà prise par <name>'; if the second one delivered, the delivery wins and the other is closed."
  CM-12: "Allowed transitions only: PENDING to CONFIRMED or CANCELLED; CONFIRMED to IN_DELIVERY, DELIVERED or CANCELLED; IN_DELIVERY to DELIVERED or CONFIRMED; DELIVERED wins over CANCELLED; DELIVERED and CANCELLED are frozen except supplier_note."
  C-01: "Identifiers use `uuid` columns (UUIDv7), amounts `bigint`, quantities `numeric(12,3)`, timestamps `timestamptz`."
contracts:
  provides:
    - name: SyncEngine
      file: src/modules/sync/sync.judge.ts
      story: SYNC-010
      items:
        - "judgeBatch(viewer: Viewer, batch: PushBatch, options: { replay?: boolean }): Promise<PushResult> — the only way a batch is applied, from a push or a replay"
        - "SyncAdapter registry: registerAdapter(adapter: SyncAdapter) with pull(viewer, since) and push(ctx, change) per table"
      used_by: [admin]
  consumes:
    - "order: transitionOrder, lineAmountOf, orderTotal (docs/stories/modules/order/contracts.md)"
    - "delivery: deliverOrder, deleteUnstartedDeliveries (docs/stories/modules/delivery/contracts.md)"
    - "finance: appendLedgerEntry (docs/stories/modules/finance/contracts.md)"
    - "relationship: visibleRelationsWhere, projectForDriver, mergeDuplicateRelation, resolveMergedRelation (docs/stories/modules/relationship/contracts.md)"
    - "catalog: getReferencePrice (docs/stories/modules/catalog/contracts.md)"
    - "access: abilityFor (docs/stories/modules/access/contracts.md)"
    - "admin: recordAdminAction (docs/stories/modules/admin/contracts.md)"
stories:
  - id: SYNC-001
    title: Sync types, adapter registry and viewer
    kind: technical
    size: M
    risk: medium
    depends_on: [ORG-005, AUTH-006, ACC-001]
    read_first: [docs/stories/modules/access/contracts.md, src/modules/organization/organization.repository.ts]
    design_refs: [synchronisation-hors-ligne/principes-la-synchronisation-classique, synchronisation-hors-ligne/ce-que-recoit-et-garde-chaque-telephone]
    constraints: []
    asvs: [v5.0.0-8.2.2, v5.0.0-8.3.1]
    story: "Technical story: define the shapes of a sync exchange, the adapter registry and the viewer, so that every table plugs into pull and push in one way."
    context: |
      - Exists: `abilityFor` (ACC-001), collaborations (ORG-003), `authMiddleware` giving person and device ids.
      - Adds: `src/modules/sync/sync.types.ts` (types below), `src/modules/sync/sync.registry.ts` (`registerAdapter`, `getAdapters`, `getAdapter(table)`) and `src/modules/sync/sync.viewer.ts` (`buildViewer(personId, deviceId)`).
      - `Viewer = { personId, deviceId, memberships: Array<{ organizationId, role, status }> (ACTIVE only), scopeVersion, isOnline: false }`. The registry has one adapter per table name; registering the same table twice throws.
      - `SyncAdapter = { table: SyncTable; pull(viewer, since: Date | null, tx): Promise<{ created: Row[]; updated: Row[]; deleted: string[] }>; push(ctx: PushContext, change: TableChange): Promise<LineOutcome[]> }`. `SyncTable` is one of `organizations, collaborations, people, customer_relationships, customer_prices, products, orders, order_lines, deliveries, ledger_entries, expenses, handovers, credit_limit_changes, notifications` (Q-014).
      - `LineOutcome = { table, id, kind: 'accepted' | 'issue' | 'forbidden' | 'aside'; code?: string; message?: string }`.
    acceptance: |
      Scenario: AC-1 Viewer
        Given a person who is OWNER of A, SELLER of B, INVITED in C and REVOKED in D
        When buildViewer runs
        Then memberships contain A as OWNER and B as SELLER only, and scopeVersion is the person's current value
      Scenario: AC-2 Registry
        When an adapter is registered and looked up by table
        Then it is returned
        And registering the same table again throws
      Scenario: AC-3 Unknown table
        Then getAdapter of a name outside the 14 tables throws `httpError(400, 'SYNC_UNKNOWN_TABLE', ...)`
    implementation:
      create: [src/modules/sync/sync.types.ts, src/modules/sync/sync.registry.ts, src/modules/sync/sync.viewer.ts, tests/integration/sync/registry-viewer.test.ts]
      modify: []
      pattern: src/modules/organization/organization.repository.ts
      signatures:
        - "buildViewer(personId: string, deviceId: string): Promise<Viewer>"
        - "registerAdapter(adapter: SyncAdapter): void"
        - "getAdapter(table: string): SyncAdapter"
      types:
        - "Viewer = { personId: string; deviceId: string; memberships: Array<{ organizationId: string; role: Role }>; scopeVersion: number }"
      errors: ["SYNC_UNKNOWN_TABLE 400"]
      dependencies: ["@prisma/client"]
    security:
      - "v5.0.0-8.2.2: the viewer is built from the database, never from the request."
    tests: |
      viewer | integration | AC-1 | active memberships only
      registry | unit | AC-2 | lookup and duplicate error
      unknown table | unit | AC-3 | SYNC_UNKNOWN_TABLE
    command: npx vitest run tests/integration/sync/registry-viewer.test.ts
    out_of_scope:
      - "Adapters (SYNC-003 onward)."
  - id: SYNC-002
    title: Sync archive table
    kind: technical
    size: S
    risk: high
    depends_on: [AUTH-007, ADM-002, FND-002]
    read_first: [prisma/schema.prisma, tests/integration/admin/admin-action-table.test.ts]
    design_refs: [synchronisation-hors-ligne/syncarchive, contraintes-a-poser-au-niveau-base-de]
    constraints: [SyncArchive:required, SyncArchive:fk, C-32, C-39, C-35, CM-35, C-29]
    asvs: [v5.0.0-8.3.1, v5.0.0-16.3.1]
    fields: ["SyncArchive.{person_id,device_id,received_at,changes}"]
    story: "Technical story: create the immutable archive of received batches and link the administration journal to it, so that a batch can be examined and replayed later."
    context: |
      - Exists: `people`, `devices`, `admin_actions` with a plain `sync_archive_id` column (ADM-002), role `distribo_app`.
      - Adds: table `sync_archives` (`received_at` default now, `changes` jsonb not null, `server_updated_at`), foreign keys, an index on (`person_id`, `received_at` desc), trigger `set_server_updated_at()`, and `REVOKE UPDATE, DELETE, TRUNCATE ... FROM distribo_app`. A migration adds the foreign key `admin_actions.sync_archive_id` to `sync_archives(id)`.
    acceptance: |
      Scenario: AC-1 Rows can be added and read
        When the application account inserts an archive row and reads it back
        Then `changes` is returned unchanged and `received_at` and `server_updated_at` are set
      Scenario: AC-2 Rows cannot change
        When the application account updates or deletes a row
        Then PostgreSQL answers permission denied (42501)
      Scenario: AC-3 Required and keys
        When `changes` is null, or the person or device is unknown
        Then the insert fails with 23502 or 23503
      Scenario: AC-4 Journal link
        When a REPLAY_SYNC journal row points to an unknown archive id
        Then the insert fails with 23503
    abuse: |
      Scenario: AB-1 Erasing evidence of a batch (repudiation)
        When code running as the application account deletes an archive row
        Then the delete is refused
    implementation:
      create: [prisma/migrations/<timestamp>_sync_002_sync_archives/migration.sql, tests/integration/sync/archive-table.test.ts]
      modify: [prisma/schema.prisma]
      pattern: tests/integration/admin/admin-action-table.test.ts
      signatures: []
      types: []
      errors: []
      dependencies: [prisma, "@prisma/client"]
    security:
      - "v5.0.0-8.3.1: only INSERT and SELECT are granted to `distribo_app`."
      - "v5.0.0-16.3.1: every received batch is kept for 90 days."
    tests: |
      add and read | integration | AC-1, C-35 | jsonb round trip
      immutable | security | AC-2, AB-1, C-32, C-39, CM-35, WSTG-ATHZ-03 | 42501
      required and keys | integration | AC-3, SyncArchive:required, SyncArchive:fk | rejected
      journal link | integration | AC-4, C-29 | 23503
    command: npx vitest run tests/integration/sync/archive-table.test.ts
    out_of_scope:
      - "Writing archives (SYNC-009). The 90-day purge (PRIV module)."
  - id: SYNC-003
    title: Pull endpoint and identity tables
    kind: feature
    size: M
    risk: high
    depends_on: [SYNC-001, FND-008]
    read_first: [src/modules/sync/sync.registry.ts, src/modules/organization/organization.repository.ts]
    design_refs: [synchronisation-hors-ligne/principes-la-synchronisation-classique, synchronisation-hors-ligne/ce-que-recoit-et-garde-chaque-telephone]
    constraints: [C-35, CM-30]
    asvs: [v5.0.0-8.2.2, v5.0.0-15.3.1, v5.0.0-2.2.1]
    story: As a seller, I want my phone to receive what changed since its last synchronization so that it works offline with current data.
    context: |
      - Exists: registry and viewer (SYNC-001); `server_updated_at` and `deleted_at` on synchronized tables; `authMiddleware`.
      - Adds: `GET /api/v1/sync/pull?last_pulled_at=<epoch ms | empty>` returning 200 `{ changes: { <table>: { created, updated, deleted } }, timestamp }` for every registered adapter, and the adapters for `organizations`, `collaborations` and `people`. Files: `sync.routes.ts`, `sync.schemas.ts`, `sync.service.ts`, `sync.openapi.ts`, `adapters/identity.adapter.ts`.
      - `timestamp` is the server time read before the queries (epoch ms). With `last_pulled_at` empty every visible row is `created` and nothing is `deleted`. With a value, a row is `created` when its `created_at` is later, else `updated`; a row with `deleted_at` and `server_updated_at` later is listed by id in `deleted`. Rows use snake_case columns, timestamps as epoch ms, bigint as numbers, quantities as numbers.
      - Identity adapters: `organizations` (the viewer's ACTIVE organizations, all columns), `collaborations` (rows of those organizations; `amount_held` only for the viewer's own row and for an OWNER viewer), `people` (only the public fields `id, full_name, phone_number` of people appearing in the viewer's collaborations and relationships; nothing else).
    acceptance: |
      Scenario: AC-1 First pull
        Given a SELLER of organization A
        When the phone pulls with last_pulled_at empty
        Then organizations holds A, collaborations hold A's team, people hold their public fields, all as `created`
      Scenario: AC-2 Incremental pull
        When a collaborator's role changes after the last pull
        Then that collaboration is `updated` and unchanged rows are absent
      Scenario: AC-3 Amount held
        Then a SELLER sees `amount_held` only on their own row and an OWNER sees all
      Scenario: AC-4 Other organizations
        Then rows of organizations the viewer does not belong to never appear
      Scenario Outline: AC-5 Bad parameter
        When last_pulled_at is <value>
        Then the response is 400 `VALIDATION_ERROR`
        Examples:
          | value        |
          | abc          |
          | -5           |
          | a future time |
    abuse: |
      Scenario: AB-1 Pulling another business (horizontal)
        When a member of A pulls
        Then no row of B appears in any table
      Scenario: AB-2 Private person fields (information disclosure)
        When people are pulled
        Then no email, language, password hash or dates appear
    implementation:
      create: [src/modules/sync/sync.routes.ts, src/modules/sync/sync.service.ts, src/modules/sync/sync.schemas.ts, src/modules/sync/adapters/identity.adapter.ts, tests/integration/sync/pull-identity.test.ts]
      modify: [src/app.ts]
      pattern: src/modules/organization/organization.routes.ts
      signatures:
        - "pullChanges(viewer: Viewer, lastPulledAt: number | null): Promise<{ changes: Record<string, TableChanges>; timestamp: number }>"
      types: []
      errors: ["VALIDATION_ERROR 400", "UNAUTHORIZED 401"]
      dependencies: [express, zod]
    security:
      - "v5.0.0-8.2.2: every adapter starts from the viewer's memberships."
      - "v5.0.0-15.3.1: explicit column lists per table."
    tests: |
      first pull | integration | AC-1, C-35 | created rows
      incremental | integration | AC-2 | updated only
      amount held | integration | AC-3, CM-30 | per role
      other organizations | integration | AC-4 | none
      bad parameter | integration | AC-5 | each Examples row → 400
      other business | security | AB-1, WSTG-ATHZ-04 | none of B
      private fields | security | AB-2, CWE-200 | absent
    command: npx vitest run tests/integration/sync/pull-identity.test.ts
    out_of_scope:
      - "Schema and migration parameters of WatermelonDB: not used."
      - "OpenAPI registration (SYNC-006)."
  - id: SYNC-004
    title: Pull relationships and negotiated prices
    kind: feature
    size: M
    risk: high
    depends_on: [SYNC-003, REL-005, CAT-002]
    read_first: [src/modules/sync/adapters/identity.adapter.ts, src/modules/relationship/relationship.visibility.ts]
    design_refs: [synchronisation-hors-ligne/ce-que-recoit-et-garde-chaque-telephone, relations-commerciales/customerrelationship/cloisonnement]
    constraints: [CM-30, C-35]
    asvs: [v5.0.0-8.2.2, v5.0.0-8.2.3, v5.0.0-15.3.1]
    story: As a driver, I want my phone to know each customer's available credit, and nothing more, so that I can check credit offline without seeing debts.
    context: |
      - Exists: pull engine (SYNC-003); `visibleRelationsWhere`, `projectForSupplier`, `projectForCustomer`, `projectForDriver` (REL-005).
      - Adds: `adapters/relationship.adapter.ts` registering `customer_relationships` and `customer_prices`.
      - Relationships for an organization viewer: the organization's rows as supplier (all customers and counters) in the supplier projection for SELLER and above; for a DRIVER only rows that have a CONFIRMED order with an address or a delivery of theirs, sent with `credit_limit` = the available credit (limit minus balance, null when there is no ceiling), `balance` = 0 and no notes or labels except `customer_label`. The customer person's own rows use the customer projection. Deleted and merged rows go to `deleted`.
      - `customer_prices`: rows for the organization's customers to OWNER, MANAGER and SELLER; a customer person receives only their own relationships' rows; a DRIVER receives none.
    acceptance: |
      Scenario: AC-1 Seller receives customers
        When a SELLER pulls
        Then all the organization's customers and counters arrive with customer_label, supplier_notes, credit_limit and balance
      Scenario: AC-2 Driver receives available credit only
        Given a customer with limit 50000 and balance 40000 and a confirmed order to deliver
        When a DRIVER pulls
        Then that relationship has credit_limit 10000 and balance 0, and no supplier_notes
      Scenario: AC-3 No ceiling
        When the limit is empty
        Then the driver's credit_limit is null
      Scenario: AC-4 Customer person
        When a customer person pulls
        Then their relationships arrive in the customer view (supplier_label, no customer_label)
      Scenario: AC-5 Merged and deleted
        Then a merged duplicate is listed in `deleted`
    abuse: |
      Scenario: AB-1 A driver's phone learns debts (information disclosure)
        When the driver's pull is searched for balance, credit_limit or notes of any customer
        Then only available credit in the credit_limit column appears
    implementation:
      create: [src/modules/sync/adapters/relationship.adapter.ts, tests/integration/sync/pull-relationships.test.ts]
      modify: [src/modules/sync/sync.service.ts]
      pattern: src/modules/sync/adapters/identity.adapter.ts
      signatures: []
      types: []
      errors: []
      dependencies: ["@prisma/client"]
    security:
      - "v5.0.0-8.2.3: the driver projection replaces balance and limit."
      - "v5.0.0-8.2.2: rows come from the visibility predicate."
    tests: |
      seller | integration | AC-1, C-35 | supplier view
      driver | integration | AC-2, CM-30 | 10000 and 0
      no ceiling | integration | AC-3 | null
      customer person | integration | AC-4 | customer view
      merged | integration | AC-5 | in deleted
      driver debts | security | AB-1, CWE-200 | none
    command: npx vitest run tests/integration/sync/pull-relationships.test.ts
    out_of_scope:
      - "Orders and deliveries (SYNC-006)."
  - id: SYNC-005
    title: Pull the catalog
    kind: feature
    size: S
    risk: medium
    depends_on: [SYNC-004, CAT-001, CAT-003]
    read_first: [src/modules/sync/adapters/relationship.adapter.ts, src/modules/catalog/catalog.repository.ts]
    design_refs: [synchronisation-hors-ligne/ce-que-recoit-et-garde-chaque-telephone, catalogue/product]
    constraints: [C-35]
    asvs: [v5.0.0-8.2.2, v5.0.0-15.3.1]
    story: As a seller, I want my phone to hold the catalog so that I can sell offline at the right prices.
    context: |
      - Exists: `products` (CAT-001), pull engine.
      - Adds: `adapters/catalog.adapter.ts` registering `products`: for OWNER, MANAGER and SELLER, every product of the organization (any status, deleted rows in `deleted`); a DRIVER receives the ACTIVE and INACTIVE products named by lines of orders they can see (names only: `id, name, unit`); a customer person receives no product rows (they browse online, CAT-007).
    acceptance: |
      Scenario: AC-1 Seller catalog
        When a SELLER pulls
        Then every product of the organization arrives with price and min_order_quantity
      Scenario: AC-2 Driver
        Then a DRIVER receives only id, name and unit of products on orders to deliver
      Scenario: AC-3 Customer person
        Then a customer person receives no product rows
      Scenario: AC-4 Incremental
        When a price changes after the last pull
        Then the product is `updated` with the new price
    abuse: |
      Scenario: AB-1 Another business's catalog (horizontal)
        When a member of A pulls
        Then no product of B arrives
    implementation:
      create: [src/modules/sync/adapters/catalog.adapter.ts, tests/integration/sync/pull-catalog.test.ts]
      modify: [src/modules/sync/sync.service.ts]
      pattern: src/modules/sync/adapters/identity.adapter.ts
      signatures: []
      types: []
      errors: []
      dependencies: ["@prisma/client"]
    security:
      - "v5.0.0-8.2.2: products come from the viewer's organizations only."
      - "v5.0.0-15.3.1: the driver gets three columns."
    tests: |
      seller | integration | AC-1, C-35 | all products
      driver | integration | AC-2 | three columns
      customer | integration | AC-3 | none
      incremental | integration | AC-4 | updated
      other business | security | AB-1, WSTG-ATHZ-04 | none
    command: npx vitest run tests/integration/sync/pull-catalog.test.ts
    out_of_scope:
      - "Customer-specific prices for customers: online browsing."
  - id: SYNC-006
    title: Pull orders, lines and deliveries
    kind: feature
    size: M
    risk: high
    depends_on: [SYNC-005, ORD-007, DLV-001]
    read_first: [src/modules/sync/adapters/relationship.adapter.ts, src/modules/order/order.views.ts]
    design_refs: [synchronisation-hors-ligne/ce-que-recoit-et-garde-chaque-telephone]
    constraints: [CM-30, C-35]
    asvs: [v5.0.0-8.2.2, v5.0.0-8.2.3, v5.0.0-15.3.1]
    story: As a driver, I want my phone to hold the orders to deliver and my deliveries so that I can work without network.
    context: |
      - Exists: orders, lines, deliveries; pull engine; `projectOrderForSupplier`, `projectOrderForCustomer`.
      - Adds: `adapters/order.adapter.ts` registering `orders`, `order_lines` and `deliveries`, and `sync.openapi.ts` documenting `GET /api/v1/sync/pull` (imported by `sync.routes.ts`).
      - Retention: open orders (PENDING, CONFIRMED, IN_DELIVERY) always; DELIVERED and CANCELLED orders of the last 90 days; their lines and deliveries follow their order.
      - Scope: OWNER, MANAGER and SELLER receive all orders of the organization as supplier (supplier view; `price_set_by_id` only for OWNER and MANAGER; `sync_issue` included); a DRIVER receives CONFIRMED and IN_DELIVERY orders with an address, orders they delivered in the last 90 days and their own deliveries, without `customer_note` of other... every order field except `sync_issue`; a customer person receives their orders in the customer view.
    acceptance: |
      Scenario: AC-1 Seller gets all open orders
        Given open orders and a delivered order 100 days old
        When a SELLER pulls
        Then the open orders arrive with lines and the 100-day-old delivered order does not
      Scenario: AC-2 Driver gets the pool and own deliveries
        Then a DRIVER receives CONFIRMED orders with an address, IN_DELIVERY orders, and their deliveries, and no PENDING order
      Scenario: AC-3 Customer person
        Then a customer person receives their orders in the customer view without sync_issue
      Scenario: AC-4 Lines follow orders
        When an order is updated
        Then its lines are sent with it
      Scenario: AC-5 Incremental
        When one delivery changed after the last pull
        Then only that delivery is `updated`
    abuse: |
      Scenario: AB-1 Another business's orders (horizontal)
        When a member of A pulls
        Then no order, line or delivery of B arrives
    implementation:
      create: [src/modules/sync/adapters/order.adapter.ts, src/modules/sync/sync.openapi.ts, tests/integration/sync/pull-orders.test.ts]
      modify: [src/modules/sync/sync.routes.ts, src/modules/sync/sync.service.ts]
      pattern: src/modules/sync/adapters/relationship.adapter.ts
      signatures: []
      types: []
      errors: []
      dependencies: ["@prisma/client", "@asteasolutions/zod-to-openapi"]
    security:
      - "v5.0.0-8.2.2: scope starts from the viewer's memberships or person id."
      - "v5.0.0-8.2.3: per-role field lists."
    tests: |
      seller | integration | AC-1, CM-30 | open and recent only
      driver | integration | AC-2 | pool and own
      customer | integration | AC-3 | customer view
      lines | integration | AC-4, C-35 | with order
      incremental | integration | AC-5 | one row
      other business | security | AB-1, WSTG-ATHZ-04 | none
