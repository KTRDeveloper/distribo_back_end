  - id: SYNC-009
    title: Push endpoint, archive and envelope
    kind: feature
    size: M
    risk: high
    depends_on: [SYNC-008, SYNC-002, SYNC-006]
    read_first: [src/modules/sync/sync.routes.ts, src/modules/sync/sync.registry.ts]
    design_refs: [synchronisation-hors-ligne/ce-que-le-serveur-fait-de-chaque-ligne, synchronisation-hors-ligne/syncarchive]
    constraints: [C-36, CM-28, CM-31]
    asvs: [v5.0.0-2.2.1, v5.0.0-2.3.3, v5.0.0-16.3.1]
    story: As a seller, I want my phone to send what I did offline so that the server records it and tells me what it could not.
    context: |
      - Exists: registry (SYNC-001), archive table (SYNC-002), device tracking (SYNC-008).
      - Adds: `POST /api/v1/sync/push?last_pulled_at=<epoch ms>` with body `{ changes: { <table>: { created: [], updated: [], deleted: [] } } }` (at most 2000 rows in total, 400 `VALIDATION_ERROR` above) and `src/modules/sync/sync.push.ts`; the body limit for this path is 5 MB (FND-008).
      - Order of work: (1) archive the batch as received in its own committed transaction; (2) refuse an app version below the platform minimum, read from remote-config `sync` / `min_app_version` and header `X-App-Version` compared as dotted numbers: 426 `APP_UPDATE_REQUIRED` (nothing is lost, the batch stays archived); (3) set `clock_skew: true` in the response when header `X-Client-Time` differs from server time by more than 5 minutes; (4) conflict check: if any `updated` row exists on the server with `server_updated_at` later than `last_pulled_at`, answer 409 `SYNC_CONFLICT` and apply nothing; (5) hand the batch to `judgeBatch` (SYNC-010) in one transaction; (6) set the device's `last_synced_at`.
      - A table name the registry does not know is set aside: it is counted in `aside` and the rest of the batch passes. A known table that the phone may not write yields a `forbidden` outcome (SYNC-018).
      - Response 200 `{ accepted, rejected: [{ table, id, code, message }], aside, clock_skew, resync_required }`.
    acceptance: |
      Scenario: AC-1 Batch archived first
        When a phone pushes any batch
        Then one archive row holds the changes exactly as received, whatever the outcome
      Scenario Outline: AC-2 Version and time
        When the request has <case>
        Then the result is <result>
        Examples:
          | case                                              | result                               |
          | X-App-Version below the minimum                   | 426 APP_UPDATE_REQUIRED, archived    |
          | X-App-Version at the minimum                      | processed                            |
          | no minimum configured                             | processed                            |
          | X-Client-Time 6 minutes off                       | 200 with clock_skew true             |
          | X-Client-Time 4 minutes off                       | 200 with clock_skew false            |
      Scenario: AC-3 Conflict
        Given a row updated on the server after last_pulled_at
        When the phone pushes an update of that row
        Then the response is 409 `SYNC_CONFLICT` and no row of the batch is applied
      Scenario: AC-4 Unknown table set aside
        When the batch has a table named "widgets" and a valid line
        Then `aside` is 1 and the valid line is processed
      Scenario: AC-5 Size
        When the batch has 2001 rows
        Then the response is 400 `VALIDATION_ERROR` and nothing is archived as applied
      Scenario: AC-6 Last sync
        Then the device's last_synced_at is set to server time after a processed push
    abuse: |
      Scenario: AB-1 One bad row blocks a phone forever (denial of service)
        When a batch holds an unknown table and a row that breaks a uniqueness rule
        Then the response is still 200 and the other lines are processed
    implementation:
      create: [src/modules/sync/sync.push.ts, tests/integration/sync/push-envelope.test.ts]
      modify: [src/modules/sync/sync.routes.ts, src/modules/sync/sync.schemas.ts, src/modules/sync/sync.service.ts, src/modules/sync/sync.openapi.ts]
      pattern: src/modules/sync/sync.service.ts
      signatures:
        - "pushChanges(viewer: Viewer, input: { lastPulledAt: number; changes: PushBatch; appVersion: string; clientTime?: string }): Promise<PushResponse>"
      types: []
      errors: ["APP_UPDATE_REQUIRED 426", "SYNC_CONFLICT 409", "VALIDATION_ERROR 400"]
      dependencies: [express, zod, "@prisma/client"]
    security:
      - "v5.0.0-2.2.1: size and shape limits on the batch."
      - "v5.0.0-16.3.1: every batch is archived; version refusals are logged."
      - "v5.0.0-2.3.3: the judged batch is applied in one transaction."
    tests: |
      archived first | integration | AC-1, CM-28 | one row, exact changes
      version and time | integration | AC-2, CM-31 | each Examples row → result
      conflict | integration | AC-3 | 409, nothing applied
      unknown table | integration | AC-4, C-36 | aside 1
      size | integration | AC-5 | 400
      last sync | integration | AC-6 | set
      never blocked | security | AB-1, CWE-400 | 200
    command: npx vitest run tests/integration/sync/push-envelope.test.ts
    out_of_scope:
      - "Judging lines (SYNC-010 onward)."
  - id: SYNC-010
    title: "Judge pipeline: scope, field rights, computed fields"
    kind: feature
    size: M
    risk: high
    depends_on: [SYNC-009, ACC-002]
    read_first: [src/modules/sync/sync.push.ts, src/shared/access/ability.ts]
    design_refs: [synchronisation-hors-ligne/ce-que-le-serveur-fait-de-chaque-ligne, annexe-la-table-des-regles/qui-et-ou]
    constraints: [CM-27, CM-28]
    asvs: [v5.0.0-8.2.1, v5.0.0-8.2.2, v5.0.0-8.2.3, v5.0.0-15.3.3]
    story: As an owner, I want the server to judge each line a phone sends so that nobody writes outside their scope or their fields.
    context: |
      - Exists: `pushChanges` (SYNC-009), `abilityFor` with the ACC rules, `Viewer` (SYNC-001).
      - Adds: `src/modules/sync/sync.judge.ts` with `judgeBatch(viewer, batch, options)` and the helpers `checkScope`, `checkFields`, `stripComputed`. Tables are processed in this order: `customer_relationships`, `orders`, `order_lines`, `deliveries`, `ledger_entries`, `notifications`; each has an adapter `push` (SYNC-011 onward).
      - Scope: a pushed row must belong to an organization the viewer is an ACTIVE member of (or, for a customer person, to their own relationships); anything else is `forbidden` with code `OUT_OF_SCOPE`.
      - Field rights: the abilities are built with context `{ onServer: true, online: false, daysSinceSync: 0 }` and each changed field is checked with `can(action, subject, field)`; a field the role may not write makes the line `forbidden` with code `FIELD_NOT_ALLOWED`.
      - Computed fields (`balance`, `amount_held`, `balance_effect`, `total_amount`, line `amount`, sale amount, `price_updated_at`, `credit_limit_set_at`, `ended_by_party`, `last_synced_at`, `scope_version`, `server_updated_at`) are removed from the row before the adapter sees it, and the server recomputes them. The author of a create is always the viewer.
    acceptance: |
      Scenario: AC-1 Scope
        When a SELLER of A pushes an order of organization B
        Then the line is forbidden with OUT_OF_SCOPE and nothing of B changes
      Scenario: AC-2 Fields
        When a SELLER pushes a relationship with a new credit_limit
        Then the line is forbidden with FIELD_NOT_ALLOWED and the limit is unchanged
      Scenario: AC-3 Computed fields ignored
        When a pushed relationship carries balance 999999 and server_updated_at in the past
        Then those values are ignored and the server's values stand
      Scenario: AC-4 Author from the session
        When a pushed order names another person as entered_by_id
        Then the stored author is the viewer
      Scenario: AC-5 Order of tables
        Then relationships are judged before orders, orders before lines, lines before deliveries and ledger entries
      Scenario: AC-6 Honest lines pass
        When a line is in scope and uses allowed fields
        Then it is handed to its adapter
    abuse: |
      Scenario: AB-1 Writing in another business by knowing an id (horizontal)
        When a phone pushes an update of a row id belonging to another organization
        Then the line is forbidden and the row is unchanged
      Scenario: AB-2 Writing a field the role may not (elevation)
        When a DRIVER pushes a change to unit_price_applied
        Then the line is forbidden
    implementation:
      create: [src/modules/sync/sync.judge.ts, tests/integration/sync/judge.test.ts]
      modify: [src/modules/sync/sync.push.ts]
      pattern: src/modules/sync/sync.push.ts
      signatures:
        - "judgeBatch(viewer: Viewer, batch: PushBatch, options?: { replay?: boolean }): Promise<PushResult>"
        - "stripComputed(table: SyncTable, row: Row): Row"
      types: []
      errors: []
      dependencies: ["@casl/ability", "@prisma/client"]
    security:
      - "v5.0.0-8.2.2: object-level scope on every pushed row."
      - "v5.0.0-8.2.3: field-level check through the rules table."
      - "v5.0.0-15.3.3: computed and author fields are never taken from the phone."
    tests: |
      scope | integration | AC-1 | OUT_OF_SCOPE
      fields | integration | AC-2 | FIELD_NOT_ALLOWED
      computed ignored | integration | AC-3, CM-27 | server values
      author | integration | AC-4 | viewer
      table order | unit | AC-5 | order list
      honest lines | integration | AC-6, CM-28 | adapter called
      foreign id | security | AB-1, WSTG-ATHZ-04, CWE-639 | forbidden
      forbidden field | security | AB-2, WSTG-ATHZ-03, CWE-915 | forbidden
    command: npx vitest run tests/integration/sync/judge.test.ts
    out_of_scope:
      - "The table adapters (SYNC-011 onward)."
  - id: SYNC-011
    title: Push new and edited customers, and merge duplicates
    kind: feature
    size: M
    risk: high
    depends_on: [SYNC-010, REL-025, REL-007, SYNC-004]
    read_first: [src/modules/relationship/relationship.repository.ts, src/modules/sync/sync.judge.ts]
    design_refs: [synchronisation-hors-ligne/ce-que-recoit-et-garde-chaque-telephone, relations-commerciales/customerrelationship/entree-en-relation-le-numero-comme]
    constraints: [C-36, C-06]
    asvs: [v5.0.0-8.2.1, v5.0.0-2.3.3, v5.0.0-2.4.1]
    story: As a seller, I want a customer I added offline to be resolved by the server without duplicates so that no phone is ever blocked.
    context: |
      - Exists: judge pipeline (SYNC-010); `findOrCreateByPhone`, `ensureCustomerRelationship`, `mergeDuplicateRelation`, `resolveMergedRelation` (REL-025).
      - Adds: `adapters/relationship.push.ts` registering the push side of `customer_relationships`.
      - Create (SELLER and above): the row carries `id`, `customer_phone_number`, `customer_label`, `delivery_address`; the supplier is the viewer's organization from the row's `supplier_organization_id` (checked by scope); credit limit 0, balance 0, status ACTIVE; a counter (no customer number) is forbidden here (`COUNTER_ONLINE_ONLY`). The number is normalized; an invalid one makes the line an `issue` with code `INVALID_PHONE` and it is not stored. The server finds or creates the person, sets `customer_person_id`, empties `customer_phone_number`.
      - Duplicate: when the organization already has a live relationship with that person, the new row is merged into the existing one (`mergeDuplicateRelation`); an info issue `MERGED` ("<label> ajoutée deux fois : fiches réunies") is reported and later pushed rows that name the duplicate id are redirected to the surviving id for the rest of the batch.
      - Update: `customer_label`, `delivery_address`, `supplier_notes` (a SELLER may write these; others are forbidden by SYNC-010).
    acceptance: |
      Scenario: AC-1 New customer
        When a SELLER pushes a relationship with customer_phone_number "6 77 12 34 56"
        Then a guest person holds +237677123456 and the relationship has customer_person_id set, an empty phone column, limit 0 and balance 0
      Scenario: AC-2 Duplicate merged
        Given the organization already has that customer
        When a second phone pushes the same number as a new row
        Then the new row is deleted with merged_into_id set and the batch is not rejected
      Scenario: AC-3 Redirect
        When the same batch has an order for the duplicate's id
        Then the order is stored on the surviving relationship
      Scenario: AC-4 Invalid number
        When the phone number is not a valid mobile
        Then the line is an issue INVALID_PHONE and nothing is stored, and the rest of the batch passes
      Scenario: AC-5 Edit
        When a SELLER updates customer_label and supplier_notes
        Then both are stored
      Scenario: AC-6 Repeat
        When the same created row is pushed twice
        Then one relationship exists
    abuse: |
      Scenario: AB-1 A duplicate never blocks the batch (denial of service)
        When two phones add the same customer offline
        Then both batches succeed
      Scenario: AB-2 Credit chosen by the phone (mass assignment)
        When the pushed row carries credit_limit or status ENDED
        Then the line is forbidden and the relationship is created with defaults or unchanged
    implementation:
      create: [src/modules/sync/adapters/relationship.push.ts, tests/integration/sync/push-relationships.test.ts]
      modify: [src/modules/sync/sync.judge.ts, src/modules/sync/sync.types.ts]
      pattern: src/modules/sync/adapters/relationship.adapter.ts
      signatures: []
      types: []
      errors: []
      dependencies: ["@prisma/client"]
    security:
      - "v5.0.0-8.2.1: create and update follow the rules table."
      - "v5.0.0-2.3.3: person, relationship and merge in one transaction."
      - "v5.0.0-2.4.1: creating persons is bounded by the batch size limit."
    tests: |
      new customer | integration | AC-1, C-06 | person and row
      duplicate merged | integration | AC-2, C-36 | merged_into_id
      redirect | integration | AC-3 | order on survivor
      invalid number | integration | AC-4 | issue, rest passes
      edit | integration | AC-5 | stored
      repeat | integration | AC-6 | one row
      never blocked | security | AB-1, CWE-400 | both succeed
      credit by phone | security | AB-2, CWE-915 | forbidden
    command: npx vitest run tests/integration/sync/push-relationships.test.ts
    out_of_scope:
      - "Orders (SYNC-012)."
  - id: SYNC-012
    title: Push orders entered offline
    kind: feature
    size: M
    risk: high
    depends_on: [SYNC-011, ORD-013]
    read_first: [src/modules/order/order.calculations.ts, src/modules/catalog/catalog.repository.ts]
    design_refs: [synchronisation-hors-ligne/ce-que-le-serveur-fait-de-chaque-ligne, commandes-et-livraisons/order]
    constraints: [CM-27, CM-16]
    asvs: [v5.0.0-2.2.1, v5.0.0-2.3.3, v5.0.0-8.2.1]
    story: As a seller, I want orders I entered offline to be stored with correct amounts so that my customers are billed exactly.
    context: |
      - Exists: judge pipeline; `lineAmountOf`, `orderTotal`; `getActiveProduct`; ORD table rules.
      - Adds: `adapters/order.push.ts` registering the push side of `orders` and `order_lines` (create only; status changes are SYNC-013).
      - Create (SELLER and above): an order row with `id`, `customer_relationship_id` (redirected if merged), `delivery_address_applied`, `delivery_cost`, `desired_delivery_date`, `customer_note`, `created_at` and its lines (`id`, `product_id`, `quantity`, `reference_price`, `unit_price_applied`). The server sets `placed_by_party` SUPPLIER, `entered_by_id` the viewer, status CONFIRMED, computes `label_applied`, every `amount` and `total_amount`, ignores pushed totals and amounts.
      - The phone's `reference_price` (the price it had in front of it) is kept; when `unit_price_applied` differs the line gets `price_set_by_id` the viewer and `price_set_at` = server now.
      - A product that is INACTIVE or deleted now is not refused: the order is stored and its `sync_issue` says "Article retiré de la vente depuis la saisie" (code `PRODUCT_RETIRED`). A relationship that is not ACTIVE, or a counter, makes the line an issue that is not stored (`RELATIONSHIP_NOT_ACTIVE`, `USE_COUNTER_SALE`) and `forbidden` never applies to honest phones.
    acceptance: |
      Scenario: AC-1 Order stored with server amounts
        When a SELLER pushes an order of 10 units priced 3000 with total_amount 3 and line amount 1
        Then the stored line amount is 30000 and total_amount 30000
      Scenario: AC-2 Price gap has an author
        When a line's unit_price_applied is 2800 and reference_price 3000
        Then price_set_by_id is the viewer and price_set_at is set by the server
      Scenario: AC-3 Retired article
        When the product became INACTIVE after the entry
        Then the order is stored with sync_issue code PRODUCT_RETIRED
      Scenario Outline: AC-4 Not stored
        When the order is on <case>
        Then the line is an issue <code> and nothing is stored
        Examples:
          | case                              | code                 |
          | an ENDED or PENDING relationship  | RELATIONSHIP_NOT_ACTIVE |
          | a counter                         | USE_COUNTER_SALE     |
      Scenario: AC-5 Repeat and author
        When the same batch is pushed twice, or entered_by_id names someone else
        Then one order exists and its author is the viewer
    abuse: |
      Scenario: AB-1 Phone-chosen amounts (tampering)
        When a phone pushes a lower amount or total for an order
        Then the stored amounts are recomputed by the server
      Scenario: AB-2 Someone else's customer (horizontal)
        When the relationship belongs to another organization
        Then the line is forbidden OUT_OF_SCOPE
    implementation:
      create: [src/modules/sync/adapters/order.push.ts, tests/integration/sync/push-orders.test.ts]
      modify: [src/modules/sync/sync.judge.ts]
      pattern: src/modules/sync/adapters/relationship.push.ts
      signatures: []
      types: []
      errors: []
      dependencies: ["@prisma/client"]
    security:
      - "v5.0.0-2.2.1: quantities parsed with `parseQuantity`; amounts recomputed."
      - "v5.0.0-2.3.3: order and lines are one transaction."
      - "v5.0.0-8.2.1: create needs SELLER or above."
    tests: |
      server amounts | integration | AC-1, CM-27 | 30000
      price gap | integration | AC-2, CM-16 | author and time
      retired article | integration | AC-3 | sync_issue
      not stored | integration | AC-4 | each Examples row → issue
      repeat and author | integration | AC-5 | one order
      client amounts | security | AB-1, CWE-345 | recomputed
      other organization | security | AB-2, WSTG-ATHZ-04 | forbidden
    command: npx vitest run tests/integration/sync/push-orders.test.ts
