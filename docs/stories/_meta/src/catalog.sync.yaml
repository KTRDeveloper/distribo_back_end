  - id: CAT-031
    title: Reseller copies purchased variants into their catalog
    kind: change
    size: M
    risk: medium
    depends_on: [CAT-011, CAT-022, CAT-016, CAT-024, CAT-038]
    amends: [CAT-011]
    read_first: [src/modules/catalog/catalog.service.ts, src/modules/catalog/catalog.repository.ts]
    design_refs: [catalogue/product, catalogue/productvariant]
    constraints: [C-47]
    asvs: [v5.0.0-8.2.1, v5.0.0-8.2.2, v5.0.0-15.3.3]
    story: As a manager, I want to copy the articles I buy into my own catalog, size by size, with my own prices so that I can sell them.
    context: |
      - Exists: `POST .../products/copy` with `{ id, source_product_id, price }` copies one flat article (CAT-011); `findLiveVariantByText` (CAT-024); `assertRoomForProduct` (CAT-038); `simplifyText`.
      - Change: body `{ id, source_product_id, destination, variants: [{ id, source_variant_id, price }] }`, 1 to 50 variants. `destination` is `{ product_id }` (a live product of the caller's organization) or `{ name? }` for a new product, whose id is the body's `id` and whose name defaults to the source's. Strict; no `status`, no photo.
      - The source product must be live, not paused, of a supplier whose customer the caller's organization is in a live relationship, with every listed variant ACTIVE and not deleted (else 404). A new product takes the source's name, description and category; each variant its name and unit; never the price or the minimum quantity.
      - A source variant matching a live variant of the destination (simplified name and unit) is not copied: `already_in_catalog` lists it with the existing id and status.
      - A new product, or a destination with no ACTIVE variant that is not paused, runs `assertRoomForProduct` (C-46).
      - Answer 201 `CopyProductResult`.
    acceptance: |
      Scenario: AC-1 New product
        Given a supplier product "Riz" with ACTIVE variants "sac 25 kg" and "sac 50 kg"
        When a reseller copies both with prices 16000 and 31000 to a new product
        Then the answer is 201 with a product "Riz", two variants named and united as the source, priced as sent, `copied` listing both ids
      Scenario: AC-2 Existing product
        Given the reseller has "Riz" with a live "sac 25 kg"
        When they copy both variants into it
        Then only "sac 50 kg" is created and `already_in_catalog` lists the 25 kg one with its status
      Scenario Outline: AC-3 Refusals
        When the request has <problem>
        Then the answer is <status> and nothing is stored
        Examples:
          | problem                                                 | status                |
          | a source product of a supplier that is not theirs       | 404 NOT_FOUND         |
          | a source variant INACTIVE or of another product, or a destination of another organization | 404 NOT_FOUND |
          | a price of 0, or the same source variant twice          | 400 VALIDATION_ERROR  |
          | a full plan and a new product                           | 409 PRODUCT_LIMIT_REACHED |
          | a SELLER or DRIVER caller                               | 403 FORBIDDEN         |
      Scenario: AC-4 Repeat
        When the same body is posted twice
        Then one copy exists
    abuse: |
      Scenario: AB-1 Copying a competitor's catalog (information disclosure)
        When an organization with no live relationship to the supplier posts its product id
        Then the answer is 404
      Scenario: AB-2 Reading the supplier's price and minimum
        When the copy is made
        Then neither the answer nor the new rows carry the supplier's price or minimum
    implementation:
      create: [tests/integration/catalog/copy-variants.test.ts]
      modify: [src/modules/catalog/catalog.schemas.ts, src/modules/catalog/catalog.service.ts, src/modules/catalog/catalog.repository.ts, src/modules/catalog/catalog.openapi.ts]
      pattern: src/modules/admin/report.routes.ts
      signatures:
        - "copyProduct(actor: Actor, input: CopyProductInput): Promise<CopyProductResult>"
      types:
        - "CopyProductInput = { id: string; source_product_id: string; destination: { product_id: string } | { name?: string }; variants: Array<{ id: string; source_variant_id: string; price: number }> }"
        - "CopyProductResult = { product: ProductView; copied: string[]; already_in_catalog: Array<{ source_variant_id: string; variant_id: string; status: 'ACTIVE' | 'INACTIVE' }> }"
      errors: [VALIDATION_ERROR 400, PRODUCT_LIMIT_REACHED 409, FORBIDDEN 403, NOT_FOUND 404]
      dependencies: [express, zod]
    security:
      - "v5.0.0-8.2.1: manager online or owner, by the rules table."
      - "v5.0.0-8.2.2: the source is found through the caller's own customer relationship, the destination through the actor's organization."
      - "v5.0.0-15.3.3: strict schema; the supplier's price and minimum are never read."
    tests: |
      new product | integration | AC-1 | two variants copied
      existing product | integration | AC-2, C-47 | one created, one reported
      refusals | integration | AC-3 | each Examples row → status
      repeat | integration | AC-4 | one copy
      competitor | security | AB-1, WSTG-ATHZ-04 | 404, nothing stored
      supplier price | security | AB-2, CWE-200 | no price or minimum copied
    command: npx vitest run tests/integration/catalog/copy-variants.test.ts tests/integration/catalog/copy-product.test.ts
    out_of_scope:
      - "Copying the photos of the source: CAT-045."
    tests_to_update:
      - "tests/integration/catalog/copy-product.test.ts | body `{ id, source_product_id, price }`, flat answer | send `destination` and `variants`, expect AC-1; relationship, scope and repeat cases keep their meaning"

  - id: CAT-032
    title: The server writes the photo keys of a product or a variant
    kind: technical
    size: S
    risk: medium
    depends_on: [CAT-014, CAT-021, FND-013]
    read_first: [src/modules/catalog/catalog.repository.ts, docs/stories/modules/foundation/contracts.md]
    design_refs: [catalogue/product, catalogue/productvariant, images/stockage]
    constraints: [C-49, C-35]
    asvs: [v5.0.0-15.3.3, v5.0.0-2.2.3, v5.0.0-8.2.2]
    fields: ["Product.image_keys", "ProductVariant.image_keys"]
    story: "Technical story: provide the two functions that replace the photo keys of a product or of a variant and hand back the previous keys, so that the images module can delete the old files after the commit."
    context: |
      - Exists: the `image_keys` columns, 5 keys at most (CAT-012, CAT-014); `imageKeySchema` and the folder `products` (FND-013); the trigger that moves the product's `server_updated_at` when a variant changes (CAT-021).
      - New in `catalog.repository.ts`, in the caller's transaction: `setProductImageKeys(tx, organizationId, productId, keys)` and `setVariantImageKeys(tx, organizationId, variantId, keys)`. They lock the row, write the new list (empty clears it), move `server_updated_at` and return the previous list.
      - A product or variant that is unknown, deleted or of another organization: 404 `NOT_FOUND`, nothing written. An INACTIVE variant can be written.
      - Every key must match `imageKeySchema` and start with `products/`, at most 5 distinct keys; otherwise a RangeError is thrown and nothing is written.
      - No catalog schema accepts a key (C-49). First usage: the photo routes of the images module, which may import `catalog` only through its contract (ADR-004).
    acceptance: |
      Scenario Outline: AC-1 Set, replace and clear a product
        Given a product whose keys are <before>
        When `setProductImageKeys` is called with <given>
        Then it returns <before> and the stored keys are <given>
        Examples:
          | before       | given        |
          | none         | key A        |
          | key A        | keys B and C |
          | keys B and C | none         |
      Scenario: AC-2 A variant, and its product travels with it
        Given a variant whose product has `server_updated_at` T
        When `setVariantImageKeys` writes key A at a later time
        Then it returns an empty list, the variant holds key A and the product's `server_updated_at` is later than T
      Scenario Outline: AC-3 Rows that cannot be written
        When a writer is called for <target>
        Then it fails with 404 `NOT_FOUND` and writes nothing
        Examples:
          | target                                  |
          | an id that is not a product or variant  |
          | a deleted product or variant            |
      Scenario: AC-4 Two replacements at once
        Given a product holds key A
        When two calls replace it with key B and key C at the same time
        Then one returns key A and the other returns the key the first wrote
    abuse: |
      Scenario: AB-1 A crafted key (tampering)
        When a writer receives `avatars/<uuid>.webp`, `products/../x.webp`, an uppercase UUID, six keys or the same key twice
        Then it throws a RangeError and the stored keys are unchanged
      Scenario: AB-2 A product of another business (broken access control)
        When a writer is called for business A with the id of a product or variant of business B
        Then the answer is 404 `NOT_FOUND` and B's keys are unchanged
    implementation:
      create: [tests/integration/catalog/image-key-writers.test.ts]
      modify: [src/modules/catalog/catalog.repository.ts]
      pattern: tests/integration/organization/amount-held.test.ts
      signatures:
        - "setProductImageKeys(tx: Prisma.TransactionClient, organizationId: string, productId: string, keys: string[]): Promise<string[]>"
        - "setVariantImageKeys(tx: Prisma.TransactionClient, organizationId: string, variantId: string, keys: string[]): Promise<string[]>"
      types: []
      errors: ["NOT_FOUND 404"]
      dependencies: ["@prisma/client"]
    security:
      - "v5.0.0-15.3.3: the photo keys have exactly one writer per table, and it validates every key."
      - "v5.0.0-2.2.3: the row is locked before the previous keys are read."
      - "v5.0.0-8.2.2: the row is selected by its id and the organization id together."
    tests: |
      product keys | integration | AC-1, C-49 | each Examples row → returned and stored lists
      variant keys | integration | AC-2, C-35 | key stored, product date moved
      not writable | integration | AC-3 | each Examples row → 404, nothing written
      concurrent | integration | AC-4 | `Promise.all` of two replacements → A and the first writer's key
      crafted key | security | AB-1, CWE-22 | the five values → RangeError, keys unchanged
      other business | security | AB-2, CWE-639 | B's id → 404, B's keys unchanged
    command: npx vitest run tests/integration/catalog/image-key-writers.test.ts
    out_of_scope:
      - "Receiving and storing the file, and deleting the old files: the images module."

  - id: CAT-033
    title: A product sent by a phone is applied without failing the batch
    kind: technical
    size: S
    risk: high
    depends_on: [CAT-014, CAT-021, CAT-016]
    read_first: [src/modules/catalog/catalog.repository.ts]
    design_refs: [catalogue/product, synchronisation-hors-ligne/ce-que-recoit-et-garde-chaque-telephone]
    constraints: [C-36, C-46, C-35]
    asvs: [v5.0.0-15.3.3, v5.0.0-8.2.2, v5.0.0-2.2.1]
    fields: ["Product.{name,description,category,paused_at,image_keys}"]
    story: "Technical story: give the catalog the function that creates or edits a product sent by the owner's phone, so that the synchronization writes products without ever reaching the database rules."
    context: |
      - Exists: new-style product rows with an empty `unit` and the default price (CAT-014); `server_updated_at` set by the database (C-35).
      - New `catalog.sync-writers.ts` and repository functions `findProductAnyState`, `insertProduct`, `updateProductText`. `applyProductFromSync(tx, organizationId, input, now)` takes `{ id, name, description, category }` and answers a result; it never throws for a business reason.
      - Unknown id: the product is created new-style in the organization. Id of the organization: the three text fields are rewritten, nothing is written when unchanged. Id of another organization: `FOREIGN`. Deleted product: `GONE`. Neither writes anything.
      - Limits as in CAT-004: `name` 1 to 100, `category` up to 100, `description` up to 2000. Beyond them: `INVALID` with the field names only, nothing written.
      - `paused_at`, `image_keys`, `unit` and `price` are never taken from a phone (CM-27, C-46). The plan limit never refuses a product: the caller pauses the excess afterwards.
      - First usage: the product push of the synchronization (ADR-004).
    acceptance: |
      Scenario: AC-1 A new product
        When `applyProductFromSync` receives an unknown id with name "Riz parfumé"
        Then the result is CREATED, the product belongs to the organization, `unit` is empty, `paused_at` and `image_keys` are empty, and `server_updated_at` is the database time
      Scenario: AC-2 An edit
        Given a product "Riz" with a description
        When the input has name "Riz parfumé" and none
        Then the result is UPDATED and the description is empty
      Scenario: AC-3 The same input twice
        Then the second result is UNCHANGED and `server_updated_at` did not move
      Scenario Outline: AC-4 Nothing written
        When the input is <case>
        Then the result is <result> and the database is unchanged
        Examples:
          | case                                              | result                      |
