  - id: CAT-020
    title: The server can count, list and pause the products on sale
    kind: technical
    size: S
    risk: high
    depends_on: [CAT-014, CAT-019]
    read_first: [src/modules/catalog/catalog.repository.ts]
    design_refs: [catalogue/product]
    constraints: [C-46]
    asvs: [v5.0.0-8.2.2, v5.0.0-2.3.3]
    story: "Technical story: give the catalog the functions that list the products on sale and pause or resume them for one business, so that billing can enforce the product limit without reading the catalog tables."
    context: |
      - Exists: `products.paused_at`, written by the server only (CAT-014, C-46), and the variants of a product (CAT-013). No route or job pauses a product yet.
      - New in `catalog.repository.ts`, each with the caller's transaction and an organization id:
        - `listProductsOnSale`: products not deleted, with `paused_at` empty and at least one ACTIVE, not deleted variant. Newest first (`created_at` descending, then `id`). Each item is `{ productId, createdAt, variantIds }` with every not deleted variant of the product.
        - `listPausedProducts`: products not deleted, with `paused_at` set and at least one ACTIVE, not deleted variant; same shape and order.
        - `setProductsPaused(tx, organizationId, productIds, paused, now)`: for those ids that belong to the organization, are not deleted and are not already in that state, sets `paused_at = now` (pause) or clears it (resume) and sets `server_updated_at = now` so the phones receive it. It returns the ids it changed.
      - First usage: billing (BIL-020). It ships here because billing must not read catalog tables (ADR-004).
    acceptance: |
      Scenario: AC-1 What is on sale
        Given a business with a product with an ACTIVE variant, one whose variants are all INACTIVE, a deleted one and a paused one
        When `listProductsOnSale` runs
        Then it returns only the first, with the ids of all its not deleted variants
      Scenario: AC-2 Newest first
        Given three products created one after another
        When `listProductsOnSale` runs
        Then they come back newest first
      Scenario: AC-3 Pausing
        When `setProductsPaused` pauses two products at 2026-10-12T09:00:00Z
        Then their `paused_at` and `server_updated_at` are that instant, both ids are returned, they leave the on-sale list and `listPausedProducts` returns them
      Scenario: AC-4 Resuming
        When `setProductsPaused` resumes a paused product
        Then `paused_at` is empty, `server_updated_at` moves forward and the product is back on sale
      Scenario Outline: AC-5 Ids that are left alone
        When `setProductsPaused` pauses <given>
        Then <result>
        Examples:
          | given                         | result                                       |
          | a deleted product             | it is unchanged and not returned             |
          | an already paused product     | its first `paused_at` is kept, not returned  |
          | an empty list                 | it returns an empty list                     |
    abuse: |
      Scenario: AB-1 A caller names the products of another business (broken access control)
        When `setProductsPaused` is called for business A with the id of a product of business B
        Then that product is unchanged, and its id is not returned
    implementation:
      create: [tests/integration/catalog/product-pause.test.ts]
      modify: [src/modules/catalog/catalog.repository.ts]
      pattern: tests/integration/organization/amount-held.test.ts
      signatures:
        - "listProductsOnSale(tx: Prisma.TransactionClient, organizationId: string): Promise<SaleProduct[]>"
        - "listPausedProducts(tx: Prisma.TransactionClient, organizationId: string): Promise<SaleProduct[]>"
        - "setProductsPaused(tx: Prisma.TransactionClient, organizationId: string, productIds: string[], paused: boolean, now: Date): Promise<string[]>"
      types:
        - "SaleProduct = { productId: string; createdAt: Date; variantIds: string[] }"
      errors: []
      dependencies: ["@prisma/client"]
    security:
      - "v5.0.0-8.2.2: every query is bound to the organization id given by server code, and the update matches the product ids only inside it."
      - "v5.0.0-2.3.3: the change runs in the caller's transaction."
    tests: |
      on sale | integration | AC-1, C-46 | four products → the one on sale, its variant ids
      order | integration | AC-2 | three products → newest first
      pause | integration | AC-3 | dates, returned ids, lists
      resume | integration | AC-4 | empty date, back on sale
      left alone | integration | AC-5 | each Examples row → result
      other business | security | AB-1, CWE-639 | B's product unchanged, not returned
    command: npx vitest run tests/integration/catalog/product-pause.test.ts
    out_of_scope:
      - "Deciding how many products may stay and which ones: billing (BIL-020)."
      - "Refusing an excess product in the online catalog routes: the stories that write products."

  - id: CAT-021
    title: A variant change also moves its product's server date
    kind: migration
    size: S
    risk: high
    depends_on: [CAT-012, CAT-014]
    amends: [CAT-012]
    read_first: [prisma/schema.prisma, tests/integration/catalog/product-variant-table.test.ts]
    design_refs: [catalogue/product, catalogue/productvariant]
    constraints: [CM-42, C-35]
    asvs: [v5.0.0-2.3.3]
    story: "Technical story: make every insert or update of a variant also move the server date of its product, so that phones always receive a product together with its variants."
    context: |
      - Exists: `products` and `product_variants`, each with a `server_updated_at` set by the database (CAT-001, CAT-012); the mirror triggers of CAT-014, which copy an old-style product write to the variant of the same id only when one of the five old columns changed.
      - One migration, one transaction: a function and a trigger on `product_variants`, after every insert and every update (`deleted_at` included), that sets `products.server_updated_at` to the database time for the variant's `product_id`.
      - Why: a phone pulls a table by `server_updated_at`. Without this, a changed variant would reach a customer's phone without its product, and a product put back on sale would not reach it at all (design 3.1).
      - No loop: the CAT-014 mirror fires only when an old column changed, and this trigger changes none.
      - `prisma/schema.prisma`: the `//` comment above `ProductVariant` gains, in plain words: saving a variant also marks its product as changed so that the phones receive both; a trigger does it, not the code.
    acceptance: |
      Scenario: AC-1 An insert
        Given a product whose `server_updated_at` is old
        When a variant is inserted for it
        Then the product's `server_updated_at` is the database time
      Scenario Outline: AC-2 An update
        When a variant gets <change>
        Then its product's `server_updated_at` moves to the database time
        Examples:
          | change                  |
          | a new price             |
          | status INACTIVE         |
          | a new name              |
          | `deleted_at` set        |
          | a new `image_keys` list |
      Scenario: AC-3 Only its own product
        Given two products, each with a variant
        When one variant changes
        Then the other product's `server_updated_at` is unchanged
      Scenario: AC-4 No loop
        When the price of an old-style product (non-empty `unit`) is updated
        Then the statement ends, and the product and its variant carry the new price
    abuse: |
      Scenario: AB-1 A write that skips the application (tampering)
        When a variant is updated by a raw SQL statement
        Then its product's `server_updated_at` still moves
    implementation:
      create: ["prisma/migrations/<timestamp>_cat_021_variant_touches_product/migration.sql", tests/integration/catalog/variant-touches-product.test.ts]
      modify: [prisma/schema.prisma]
      pattern: tests/integration/organization/organization-table.test.ts
      signatures: []
      types: []
      errors: []
      dependencies: [prisma, "@prisma/client"]
    security:
      - "v5.0.0-2.3.3: the product date moves in the same transaction as the variant write, so both succeed or neither does."
    tests: |
      insert | integration | AC-1, CM-42, C-35 | variant inserted → product date is database time
      update | integration | AC-2, CM-42 | each Examples row → product date moves
      own product | integration | AC-3 | other product unchanged
      no loop | integration | AC-4 | old-style price update ends, both rows carry the price
      raw write | security | AB-1, CWE-693 | raw SQL update → product date moves
    command: npx vitest run tests/integration/catalog/variant-touches-product.test.ts tests/integration/catalog/product-new-columns.test.ts
    out_of_scope:
      - "Pulling products and variants: the synchronization stories."

  - id: CAT-038
    title: The plan's product limit is checked in one place
    kind: technical
    size: S
    risk: medium
    depends_on: [CAT-014, ORG-045]
    read_first: [src/modules/catalog/catalog.repository.ts]
    design_refs: [catalogue/product, catalogue/productvariant]
