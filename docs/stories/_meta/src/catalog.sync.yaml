kind: stories
module: catalog
constraints:
  C-35: "Synchronized tables carry `server_updated_at`, set by the server on every write, and `deleted_at` for deletion; unique constraints ignore deleted rows."
  C-36: "No uniqueness rule makes a sync fail; every possible duplicate has a written behavior, and a line no rule can write is set aside."
  C-50: "A photo file is deleted from storage as soon as its key leaves its card or its card is deleted; a nightly cleanup deletes every file older than 24 hours that no card cites."
  C-56: "`ImageCopy` has `copy_key` as primary key; `root_key` equals the source's `root_key` when the source is itself a copy, else the source key; written by the server only, in the transaction that stores the copy's key; never synchronized; never updated, deleted or purged."
  CM-27: "Sync: computed fields (balance, amount_held, balance_effect, totals, line amounts, sale amount, customer-order reference price, price_updated_at, credit_limit_set_at, ended_by_party, last_synced_at, scope_version, server_updated_at) are ignored on receipt and recomputed."
stories:
  - id: CAT-012
    title: Product variants table
    kind: migration
    size: M
    risk: high
    depends_on: [CAT-001]
    amends: [CAT-001]
    read_first: [prisma/schema.prisma, tests/integration/organization/organization-table.test.ts]
    design_refs: [catalogue/productvariant, contraintes-a-poser-au-niveau-base-de]
    constraints: [ProductVariant:required, 'ProductVariant.status:enum', ProductVariant:fk, C-13, C-45, C-49, C-35]
    asvs: [v5.0.0-2.2.3]
    fields: ["ProductVariant.{product_id,organization_id,name,unit,price,price_updated_at,min_order_quantity,image_keys,status,created_at,merged_into_id}"]
    story: "Technical story: create the variants table, the sold level of the catalog, so that a product can carry several units and prices."
    context: |
      - Exists: `products` (CAT-001) with `set_product_price_updated_at()` and `set_server_updated_at()`.
      - One migration, one transaction: table `product_variants` with `id`, the fields above, `server_updated_at` and `deleted_at`. `name`, `min_order_quantity` and `merged_into_id` may be empty; `status` uses `ProductStatus`, ACTIVE by default; `price` bigint, `min_order_quantity` numeric(12,3).
      - Keys: (`product_id`, `organization_id`) refers to `products` (`id`, `organization_id`), which gets a unique index on that pair (C-45); `merged_into_id` is a foreign key too. CHECKs: `price` > 0 and `min_order_quantity` > 0 when set (C-13); at most 5 `image_keys`, with a GIN index (C-49).
      - The two functions become triggers: the price date follows the price only; the server date is the database time.
      - `prisma/schema.prisma`: add `model ProductVariant` with its relations (the list `variants` on the model `Product`) and `@@unique([id, organizationId])` on `Product`. Above the model, a plain-words `//` comment: a variant belongs to the business of its product; a live product keeps one live variant, which the code ensures, not the database.
    acceptance: |
      Scenario: AC-1 Defaults and server dates
        When a variant is inserted with product, business, unit, price 3000 and a `price_updated_at` of 2020
        Then `name` and `min_order_quantity` are empty, `status` is ACTIVE and `image_keys` is empty
        And `price_updated_at`, `created_at` and `server_updated_at` are the database time
      Scenario Outline: AC-2 Value rules
        When a variant has <values>
        Then the database <result>
        Examples:
          | values | result |
          | price 0 | rejects (23514) |
          | min_order_quantity 0 | rejects (23514) |
          | 5 image keys | accepts |
          | 6 image keys | rejects (23514) |
      Scenario: AC-3 The price date moves with the price only
        Given a variant
        When its price changes, and then only its unit changes
        Then `price_updated_at` moves with the price and stays on the unit change
      Scenario: AC-4 Required values and keys
        When `product_id`, `unit` or `price` is empty, a key refers to nothing, or `status` is not ACTIVE or INACTIVE
        Then the insert fails with 23502, 23503 or 22P02
    abuse: |
      Scenario: AB-1 A variant slipped under another business's product (tampering)
        When code inserts, straight in the database, a variant of business A under a product of business B
        Then PostgreSQL rejects it with 23503, even though no application check ran
    implementation:
      create: [prisma/migrations/<timestamp>_cat_012_product_variants/migration.sql, tests/integration/catalog/product-variant-table.test.ts]
      modify: [prisma/schema.prisma]
      pattern: tests/integration/organization/organization-table.test.ts
      signatures: []
      types: []
      errors: []
      dependencies: [prisma, "@prisma/client"]
    security:
      - "v5.0.0-2.2.3: related values are checked by the database, not only by code: the business of a variant is that of its product (composite key), prices and quantities are positive, photos are at most 5."
    tests: |
      defaults | integration | AC-1, C-35 | insert → defaults, database dates
      value rules | integration | AC-2, C-13, C-49 | each Examples row → accepted or 23514
      price date | integration | AC-3, C-13 | price change moves it; unit change keeps it
      required and keys | integration | AC-4, ProductVariant:required, ProductVariant.status:enum, ProductVariant:fk | empty or unknown values → 23502, 23503, 22P02
      crafted write | security | AB-1, C-45, CWE-20 | raw insert under a product of another business → 23503
    command: npx vitest run tests/integration/catalog/product-variant-table.test.ts
    out_of_scope:
      - "The copy of existing products (CAT-013), new product columns (CAT-014), negotiated prices (CAT-015), one name and unit per product (CAT-018)."
  - id: CAT-013
    title: Every existing product gets its variant
    kind: migration
    size: S
    risk: high
    depends_on: [CAT-012]
    amends: [CAT-001]
    read_first: [prisma/schema.prisma, tests/integration/organization/organization-table.test.ts]
    design_refs: [catalogue/product, catalogue/productvariant]
    constraints: [C-45, C-35]
    asvs: [v5.0.0-2.2.3]
    story: "Technical story: give every product already stored one variant that carries what it sold, so that nothing is lost when selling moves from the product to the variant."
    context: |
      - Exists: `products` (CAT-001), each row with its own `unit`, `price`, `price_updated_at`, `min_order_quantity` and `status`; `product_variants` (CAT-012), empty.
      - One migration, one transaction, no new column. The variant takes the same `id` as its product, so that order lines and negotiated prices, which hold the product id today, find it with the id they already hold.
      - Between the lines `-- copy start` and `-- copy end`: switch off the price-date trigger of `product_variants`, one `INSERT ... SELECT` of every product without a variant, switch the trigger on again. The variant has an empty name and copies `organization_id`, `unit`, `price`, `price_updated_at`, `min_order_quantity`, `status`, `created_at` and `deleted_at`.
      - The server date of the variant is the migration time (the existing trigger), so phones fetch the new rows. Deleted products are copied too, deleted.
      - The test replays the lines between the two markers on rows it inserts, so that the copy is proved on old-shaped data and proved safe to run twice.
    acceptance: |
      Scenario: AC-1 Each product gets one variant
        Given a product at 3000 XAF with minimum 2.5 whose price changed in 2024, and a deleted product
        When the copy runs
        Then each has one variant with the same id, the same business, an empty name, and the same unit, price, `price_updated_at`, minimum, status and `deleted_at`
      Scenario: AC-2 Dates
        When the copy runs
        Then `price_updated_at` is still the 2024 date of the product
        And `server_updated_at` of the variant is later than that of the product
      Scenario: AC-3 Running it again changes nothing
        Given a variant whose price was then set to 3500
        When the copy runs again
        Then no variant is added and the price is still 3500
      Scenario: AC-4 A product that already has a variant is skipped
        Given a product with a variant under another id
        When the copy runs
        Then no second variant is created for that product
      Scenario: AC-5 The price-date trigger is back on
        When the copy has run and a variant's price changes, and then only its unit changes
        Then `price_updated_at` moves with the price change and stays on the unit change
    abuse: |
      Scenario: AB-1 A copied variant lands in another business (information disclosure)
        When the copy runs for products of two businesses
        Then every variant has the business of its own product, and none has the other
    implementation:
      create: [prisma/migrations/<timestamp>_cat_013_variant_per_product/migration.sql, tests/integration/catalog/variant-per-product.test.ts]
      modify: []
      pattern: tests/integration/organization/organization-table.test.ts
      signatures: []
      types: []
      errors: []
      dependencies: [prisma, "@prisma/client"]
    security:
      - "v5.0.0-2.2.3: the copy takes the business from the product row, never from another source."
    tests: |
      copy | integration | AC-1, C-45 | replay the marked lines on old rows → one variant each, same values
      dates | integration | AC-2, C-35 | price date kept; server date later
      twice | integration | AC-3 | replay again → no row added, price unchanged
      skip | integration | AC-4 | product with another variant → no second one
      trigger | integration | AC-5 | price change moves the date; unit change keeps it
      two businesses | security | AB-1, CWE-639 | each variant has its product's business
    command: npx vitest run tests/integration/catalog/variant-per-product.test.ts
    out_of_scope:
      - "The new product columns and the old-style writes that must still reach the variants (CAT-014)."
      - "Pointing negotiated prices at variants (CAT-015) and order lines (ORD)."
  - id: CAT-014
    title: Products carry photos and a pause date, and old-style writes reach the variants
    kind: migration
    size: M
    risk: high
    depends_on: [CAT-013]
    amends: [CAT-001]
    read_first: [prisma/schema.prisma, tests/integration/organization/organization-table.test.ts]
    design_refs: [catalogue/product, contraintes-a-poser-au-niveau-base-de]
    constraints: [Product:required, C-46, C-49, C-35]
    asvs: [v5.0.0-2.2.1]
    fields: ["Product.image_keys", "Product.paused_at"]
    story: "Technical story: give products their photos and pause date, and keep old-style writes reaching the variants, so that nothing breaks while the code moves to variants."
    context: |
      - Exists: `products` with the old columns `unit`, `price`, `min_order_quantity`, `status` (CAT-001), and a variant per product (CAT-012, CAT-013). Old code and tests still write those columns.
      - One migration, one transaction: on `products`, `image_keys` (text[], empty by default, at most 5 keys, GIN index) and `paused_at` (timestamptz, empty by default; only the server writes it, C-46).
      - Between `-- touch start` and `-- touch end`: one statement moving every product's `server_updated_at` to the migration time, so phones fetch it again.
      - `unit` gets the default empty text and `price` the default 1, so a row written the new way needs neither. An empty `unit` marks it new-style: its old columns are never read.
      - Two triggers, dropped with the old columns. After an insert or an update with a non-empty `unit`, the variant of the same id is inserted (empty name, old columns copied) or updated (the five old columns, only when one changed). An empty `unit` is never copied: the code inserts its variants itself.
      - `prisma/schema.prisma`: `imageKeys`, `pausedAt`, the two defaults and the GIN index on `Product`, and above it a plain-words `//` comment: old columns ignored, empty `unit` means new-style, the triggers copy old-style writes to the variant of the same id until the story that drops them.
    acceptance: |
      Scenario: AC-1 New-style row
        When a product is inserted with a business and a name only
        Then `image_keys` is empty, `paused_at` is empty, `unit` is empty, `price` is 1 and `status` is ACTIVE
        And no variant is created
      Scenario Outline: AC-2 Photo limit
        When a product has <keys>
        Then the database <result>
        Examples:
          | keys            | result          |
          | 5 image keys    | accepts         |
          | 6 image keys    | rejects (23514) |
          | image_keys null | rejects (23502) |
      Scenario: AC-3 An old-style insert reaches a variant
        When a product is inserted with unit "sac", price 3000 and minimum 2.5
        Then one variant exists with the same id, an empty name, unit "sac", price 3000, minimum 2.5 and status ACTIVE
      Scenario Outline: AC-4 An old-style update reaches the variant
        Given a product inserted the old way
        When its <column> is set to <value>
        Then its variant <effect>
        Examples:
          | column     | value    | effect                                |
          | price      | 3500     | has price 3500 and a later price date |
          | status     | INACTIVE | is INACTIVE                           |
      Scenario: AC-5 A new-style product keeps its own variants
        Given a product with an empty `unit` and a variant with a new id
        When the product is renamed
        Then no variant with the id of the product appears
      Scenario: AC-6 Phones fetch the products again
        When the touch statement of the migration runs on products a day old
        Then every `server_updated_at` is later than before
    abuse: |
      Scenario: AB-1 A thousand photos on one product (resource exhaustion)
        When code sets a list of 1000 keys on a product, straight in the database
        Then PostgreSQL rejects it with 23514
    implementation:
      create: [prisma/migrations/<timestamp>_cat_014_product_photos_pause_mirror/migration.sql, tests/integration/catalog/product-new-columns.test.ts]
      modify: [prisma/schema.prisma]
      pattern: tests/integration/organization/organization-table.test.ts
      signatures: []
      types: []
      errors: []
      dependencies: [prisma, "@prisma/client"]
    security:
      - "v5.0.0-2.2.1: the number of photos of a product is limited in the database."
    tests: |
      new-style row | integration | AC-1, C-46, C-35 | insert with a name → defaults, no variant
      photo limit | integration | AC-2, C-49, Product:required | each Examples row → accepted, 23514 or 23502
      old insert | integration | AC-3 | insert the old way → one variant, same id and values
      old update | integration | AC-4 | each Examples row → variant changed
      new-style product | integration | AC-5 | rename → variants unchanged
      touch | integration | AC-6, C-35 | replay the marked lines → dates later
      thousand photos | security | AB-1, CWE-400 | raw update with 1000 keys → 23514
    command: npx vitest run tests/integration/catalog/product-new-columns.test.ts
    out_of_scope:
      - "Writing photos (IMG) and pausing products (BIL); dropping the old columns and triggers (a later story)."
  - id: CAT-015
    title: Negotiated prices point at a variant
    kind: migration
    size: M
    risk: high
    depends_on: [CAT-013]
    amends: [CAT-002, CAT-008]
    read_first: [prisma/schema.prisma, src/modules/catalog/catalog.repository.ts]
    design_refs: [relations-commerciales/customerprice, contraintes-a-poser-au-niveau-base-de]
    constraints: [CustomerPrice:fk, C-11, C-35]
    asvs: [v5.0.0-2.2.3, v5.0.0-8.2.2]
    fields: ["CustomerPrice.product_variant_id"]
    story: "Technical story: let a negotiated price name a variant instead of a product, so that a customer can have a different price for each variant."
    context: |
      - Exists: `customer_prices` with `product_id`, one live row per (`customer_relationship_id`, `product_id`) through `customer_prices_live_relationship_product_key`, and a trigger that checks the product's business (CAT-002); a variant of the same id for each old product (CAT-013).
      - One migration, one transaction: `product_variant_id` (uuid, foreign key to `product_variants`, empty allowed for now), copied from `product_id` by one statement between `-- copy start` and `-- copy end`. `product_id` stays, required, until a later story drops it. Every `server_updated_at` moves to the migration time.
      - A trigger fills `product_variant_id` from `product_id` when an insert leaves it empty, so old code and tests keep working. A second refuses (23514) a variant not owned by the relationship's supplier, as CAT-002 does for products.
      - The old unique index goes: two variants of a product may each carry a price for one customer. New unique index on live (`customer_relationship_id`, `product_variant_id`) (C-11).
      - `catalog.repository.ts`: `upsertCustomerPrice` conflicts on (`customer_relationship_id`, `product_variant_id`) where `deleted_at` is empty; the rest is unchanged.
      - `prisma/schema.prisma`: `productVariantId` and its relation on `CustomerPrice`; the `//` comment above it now says: unique per variant among live rows, the variant is the supplier's, the old column goes later.
    acceptance: |
      Scenario: AC-1 Every existing price names its variant
        Given a price inserted with no `product_variant_id`
        When the copy statement of the migration runs
        Then `product_variant_id` equals `product_id`, and `server_updated_at` is later than before
      Scenario: AC-2 An old-style insert is completed
        When a price is inserted with `product_id` only
        Then `product_variant_id` equals `product_id`
      Scenario Outline: AC-3 One live price per customer and variant
        When a second price for the same relationship is inserted for <variant>, the first being <state>
        Then the insert <result>
        Examples:
          | variant                             | state   | result          |
          | the same variant                    | live    | rejects (23505) |
          | the same variant                    | deleted | accepts         |
          | another variant of the same product | live    | accepts         |
      Scenario: AC-4 Replacing a price keeps one row
        Given a live price for a relationship and a variant
        When `upsertCustomerPrice` is called again for the same pair with another price
        Then the row keeps its id and takes the new price, and no second live row exists
      Scenario: AC-5 Keys
        When `product_variant_id` names no variant
        Then the insert fails with 23503
    abuse: |
      Scenario: AB-1 A price for a variant of another business (tampering)
        When code inserts a price for a variant of business B on a relationship of business A, straight in the database
        Then PostgreSQL rejects it with 23514, even though no application check ran
    implementation:
      create: [prisma/migrations/<timestamp>_cat_015_customer_price_variant/migration.sql, tests/integration/catalog/customer-price-variant.test.ts]
      modify: [prisma/schema.prisma, src/modules/catalog/catalog.repository.ts]
      pattern: tests/integration/organization/organization-table.test.ts
      signatures:
        - "upsertCustomerPrice(tx: Prisma.TransactionClient, data: { id: string; relationshipId: string; productId: string; price: bigint; setById: string }): Promise<{ productId: string; price: bigint; setById: string; setAt: Date }>"
      types: []
      errors: []
      dependencies: [prisma, "@prisma/client"]
    security:
      - "v5.0.0-2.2.3: the supplier's ownership of the variant is checked in the database."
      - "v5.0.0-8.2.2: one live price per customer and variant."
    tests: |
      copy | integration | AC-1, C-35 | replay the marked lines → variant id = product id
      old insert | integration | AC-2 | insert with `product_id` only → filled
      uniqueness | integration | AC-3, C-11 | each Examples row → accepted or 23505
      replace | integration | AC-4 | upsert twice → one live row, new price
      keys | integration | AC-5, CustomerPrice:fk | unknown variant → 23503
      crafted write | security | AB-1, CWE-639 | raw insert for another business's variant → 23514
    command: npx vitest run tests/integration/catalog/customer-price-variant.test.ts tests/integration/catalog/customer-price-table.test.ts
    out_of_scope:
      - "Routes that set, list, remove and copy prices by variant, and dropping `product_id` with the filling trigger: later stories."
    tests_to_update:
      - "tests/integration/catalog/customer-price-table.test.ts | the old unique index is replaced by one on the variant | a second live price for the same relationship and product still fails with 23505"
  - id: CAT-018
    title: Two variants of a product never share a name and a unit
    kind: technical
    size: S
    risk: high
    depends_on: [CAT-012]
    read_first: [prisma/schema.prisma, tests/integration/organization/organization-table.test.ts]
    design_refs: [catalogue/productvariant, contraintes-a-poser-au-niveau-base-de]
    constraints: [C-47, C-35]
    asvs: [v5.0.0-2.2.1]
    story: "Technical story: forbid, in the database, two live variants of one product with the same name and unit, and a merged variant that is not deleted, so that a customer never sees the same article twice."
    context: |
      - Exists: `product_variants` (CAT-012) with `name` (empty allowed), `unit`, `merged_into_id` and `deleted_at`.
      - One migration, one transaction. Unique index (C-47) on (`product_id`, simplified name, simplified unit) where `deleted_at` is empty. Simplified text is `lower(btrim(regexp_replace(coalesce(x, ''), '[ \t\r\n]+', ' ', 'g')))`: capitals and extra spaces ignored, an empty name equals the empty text, nothing else guessed.
      - CHECK: `merged_into_id` set means `deleted_at` is set. The code that merges variants (a later story) deletes and points in one write.
      - `prisma/schema.prisma`: the unique index cannot be written as `@@unique` (it uses text functions and ignores deleted rows), so the `//` comment above `ProductVariant` gains, in plain words: one live variant per name and unit, compared without capitals or extra spaces, and a merged variant is always deleted.
    acceptance: |
      Scenario Outline: AC-1 One name and unit per product
        Given a live variant of a product with name <n1> and unit <u1>
        When another variant of <product> gets name <n2> and unit <u2>
        Then the insert <result>
        Examples:
          | n1        | u1        | product | n2        | u2         | result          |
          | empty     | sac 10 kg | same    | empty     | Sac  10 kg | rejects (23505) |
          | Rouge / L | piece     | same    | rouge / l | PIECE      | rejects (23505) |
          | empty     | sac 10 kg | same    | empty     | sac 10kg   | accepts         |
          | Rouge / L | piece     | same    | Bleu / M  | piece      | accepts         |
          | Rouge / L | piece     | other   | Rouge / L | piece      | accepts         |
      Scenario: AC-2 A deleted variant frees its name and unit
        Given a deleted variant with name "Rouge / L" and unit "piece"
        When another variant of the same product gets the same name and unit
        Then the insert is accepted
      Scenario Outline: AC-3 A merged variant is deleted
        When a variant has <values>
        Then the database <result>
        Examples:
          | values                               | result          |
          | merged_into_id set, deleted_at set   | accepts         |
          | merged_into_id set, deleted_at empty | rejects (23514) |
          | merged_into_id empty, deleted_at empty | accepts       |
    abuse: |
      Scenario: AB-1 The same article listed twice by concurrent writes (tampering)
        When two transactions insert the same name and unit for one product at the same time
        Then exactly one succeeds and the other fails with 23505
    implementation:
      create: [prisma/migrations/<timestamp>_cat_018_variant_name_unit/migration.sql, tests/integration/catalog/variant-name-unit.test.ts]
      modify: [prisma/schema.prisma]
      pattern: tests/integration/organization/organization-table.test.ts
      signatures: []
      types: []
      errors: []
      dependencies: [prisma, "@prisma/client"]
    security:
      - "v5.0.0-2.2.1: the uniqueness is enforced by the database, so concurrent writes cannot both pass an application check."
    tests: |
      name and unit | integration | AC-1, C-47 | each Examples row → accepted or 23505
      deleted frees | integration | AC-2, C-35 | deleted then re-added → accepted
      merged | integration | AC-3, C-47 | each Examples row → accepted or 23514
      concurrent | security | AB-1, CWE-362 | two parallel inserts → one 23505
    command: npx vitest run tests/integration/catalog/variant-name-unit.test.ts
    out_of_scope:
      - "Merging two variants into one: a later story."
      - "A TypeScript twin of the simplified text (CAT-016)."
  - id: CAT-016
    title: Variant label and comparison text shared by the app and the server
    kind: technical
    size: XS
    risk: medium
    depends_on: [CAT-018]
    read_first: [src/shared/money.ts, tests/unit/shared/money.test.ts]
    design_refs: [catalogue/productvariant]
    constraints: [C-47]
    asvs: [v5.0.0-2.2.1]
    story: "Technical story: one function composes the label of a variant and one function simplifies a text for comparison, the same for the phone and the server, so that an order line and a duplicate check never differ between them."
    context: |
      - Exists: `src/shared/` holds code without Node-only imports (`money.ts`, `ids.ts`). The unique index of CAT-018 compares names and units in SQL.
      - `variantLabel(productName, variantName, unit)`: the product name, then " \u2014 " (space, em dash, space), then the unit; with a variant name, the name then the unit in parentheses: "Riz \u2014 sac 50 kg", "T-shirt \u2014 Rouge / L (piece)". A variant name that is null or empty counts as no name. Nothing else is changed: no trimming, no case change (names stay as typed).
      - `simplifyText(text)`: the comparison form. Null becomes empty; each run of space, tab, carriage return and line feed becomes one space; spaces at both ends go; then lower case. It is the SQL expression of CAT-018, `lower(btrim(regexp_replace(coalesce(x, ''), '[ \t\r\n]+', ' ', 'g')))`.
      - The TypeScript twin never uses `trim()`, which also removes characters (a non-breaking space) that PostgreSQL keeps. Tests compare ASCII letters only: lower case of other letters depends on the database collation.
      - Adds `src/shared/variant.ts` with no import. First usage: order lines freeze the label (ORD) and the catalog tells "already in your catalog" and merges duplicates. It ships here because both modules import it (ADR-004).
    acceptance: |
      Scenario Outline: AC-1 Label
        When `variantLabel("<product>", <variant>, "<unit>")` is called
        Then the result is "<label>"
        Examples:
          | product | variant   | unit      | label                      |
          | Riz     | null      | sac 50 kg | Riz \u2014 sac 50 kg        |
          | T-shirt | "Rouge/L" | piece     | T-shirt \u2014 Rouge/L (piece) |
          | Riz     | ""        | sac 50 kg | Riz \u2014 sac 50 kg        |
      Scenario Outline: AC-2 Comparison text
        When `simplifyText(<input>)` is called
        Then the result is <result>
        Examples:
          | input             | result       |
          | "Sac 10 kg"       | "sac 10 kg"  |
          | "  sac   10 kg "  | "sac 10 kg"  |
          | "sac 10kg"        | "sac 10kg"   |
          | "\tRiz\n\r"      | "riz"        |
          | null              | ""           |
