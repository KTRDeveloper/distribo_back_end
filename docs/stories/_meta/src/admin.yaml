      Scenario: AC-1 Suspend and reactivate a person
        When a MODERATOR suspends and then reactivates a person
        Then the statuses go ACTIVE, SUSPENDED, ACTIVE, the sessions ended at suspension, and two journal rows exist
      Scenario: AC-2 Organization
        Then the same works for an organization
      Scenario Outline: AC-3 Refusals
        When the request has <problem>
        Then the response is <status> and nothing changes
        Examples:
          | problem                                    | status                 |
          | suspending a SUSPENDED target              | 409 INVALID_STATE      |
          | reactivating an ACTIVE target              | 409 INVALID_STATE      |
          | reactivating a CLOSED organization         | 409 INVALID_STATE      |
          | an ANONYMIZED person                       | 409 TARGET_ANONYMIZED  |
          | an empty reason                            | 400 VALIDATION_ERROR   |
          | an unknown id                              | 404 NOT_FOUND          |
      Scenario: AC-4 Reactivated person can sign in
        Then a reactivated person passes the login status check again
    abuse: |
      Scenario: AB-1 Untraced suspension (repudiation)
        When any suspension or reactivation succeeds
        Then a journal row with author, target and reason exists
      Scenario: AB-2 Ordinary token (elevation)
        When a customer's token calls these routes
        Then the response is 401
    implementation:
      create: [tests/integration/admin/suspend-reactivate.test.ts]
      modify: [src/modules/admin/admin.routes.ts, src/modules/admin/admin.service.ts, src/modules/admin/admin.repository.ts, src/modules/admin/admin.schemas.ts]
      pattern: src/modules/admin/admin.routes.ts
      signatures:
        - "suspendPerson(admin: AdminContext, personId: string, input: { reason: string }): Promise<void>"
        - "reactivatePerson(admin: AdminContext, personId: string, input: { reason: string }): Promise<void>"
        - "suspendOrganization(admin: AdminContext, organizationId: string, input: { reason: string }): Promise<void>"
        - "reactivateOrganization(admin: AdminContext, organizationId: string, input: { reason: string }): Promise<void>"
      types: []
      errors: ["INVALID_STATE 409", "TARGET_ANONYMIZED 409", "VALIDATION_ERROR 400", "NOT_FOUND 404"]
      dependencies: [express, zod, "@prisma/client"]
    security:
      - "v5.0.0-8.2.1: admin token and live administrator."
      - "v5.0.0-7.4.2: suspension ends sessions."
      - "v5.0.0-16.3.1: journaled."
    tests: |
      person cycle | integration | AC-1, CM-33 | statuses, sessions, journal
      organization | integration | AC-2 | statuses, journal
      refusals | integration | AC-3 | each Examples row → status
      sign in again | integration | AC-4 | login passes
      untraced | security | AB-1, CWE-778 | journal row
      ordinary token | security | AB-2, WSTG-ATHZ-03 | 401
    command: npx vitest run tests/integration/admin/suspend-reactivate.test.ts
    out_of_scope:
      - "Effects of a suspended organization on orders (ORD-003 and ORD stories)."
  - id: ADM-015
    title: Administrators read the action journal
    kind: feature
    size: S
    risk: medium
    depends_on: [ADM-014, FND-009, ADM-006]
    read_first: [src/modules/admin/admin.routes.ts, src/modules/admin/admin.repository.ts]
    design_refs: [gouvernance-de-la-plateforme/adminaction]
    constraints: []
    asvs: [v5.0.0-8.2.1, v5.0.0-16.3.3]
    story: As a super-admin, I want to read the journal of administration actions so that I can audit what the team did.
    context: |
      - Exists: journal rows (ADM-002 onward).
      - Adds: `GET /api/v1/admin/actions?limit&cursor&action&administrator_id&target_person_id&target_organization_id` (any administrator; paginated, newest first): `{ id, administrator_id, action, target_person_id, target_organization_id, report_id, sync_archive_id, reason, occurred_at }`.
      - Adds `admin.openapi.ts` documenting the admin routes of ADM-006 to ADM-015 (with `bearerAuth`); `admin.routes.ts` imports it for its side effect.
    acceptance: |
      Scenario: AC-1 List
        Given 5 journal rows
        When an administrator lists
        Then 5 items are returned newest first
      Scenario Outline: AC-2 Filters
        When the query has <query>
        Then only the matching rows are returned
        Examples:
          | query                          |
          | action=SUSPEND                 |
          | administrator_id of one admin  |
          | target_person_id of one person |
      Scenario: AC-3 Pagination
        When limit 2 is used with the cursor
        Then pages of 2, 2 and 1 items follow
      Scenario: AC-4 Access
        Then a normal token or no token answers 401
    abuse: |
      Scenario: AB-1 Customer reads the journal (elevation)
        When a customer's access token is used
        Then the response is 401 and nothing is returned
    implementation:
      create: [src/modules/admin/admin.openapi.ts, tests/integration/admin/action-journal.test.ts]
      modify: [src/modules/admin/admin.routes.ts, src/modules/admin/admin.service.ts, src/modules/admin/admin.repository.ts, src/modules/admin/admin.schemas.ts]
      pattern: src/modules/admin/admin.routes.ts
      signatures:
        - "listAdminActions(query: ListActionsQuery): Promise<{ items: AdminActionView[]; next_cursor: string | null }>"
      types: []
      errors: ["VALIDATION_ERROR 400", "UNAUTHORIZED 401"]
      dependencies: [express, zod, "@asteasolutions/zod-to-openapi"]
    security:
      - "v5.0.0-8.2.1: admin token required."
      - "v5.0.0-16.3.3: the journal is readable for audit."
    tests: |
      list | integration | AC-1 | 5 newest first
      filters | integration | AC-2 | each Examples row → matches
      paging | integration | AC-3 | 2, 2, 1
      access | integration | AC-4 | 401
      customer token | security | AB-1, WSTG-ATHZ-03 | 401
    command: npx vitest run tests/integration/admin/action-journal.test.ts
    out_of_scope:
      - "Replaying an archived sync batch (SYNC module)."
