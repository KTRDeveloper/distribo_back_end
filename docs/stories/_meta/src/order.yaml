kind: module
module: order
prefix: ORD
title: Order
responsibility: Owns orders and their lines, the order state machine, and the gestures that place, accept, refuse, enter, change and cancel orders before delivery.
entities: [Order, OrderLine]
depends_on: [foundation, person, notification, access, organization, relationship, catalog]
asvs_level: L2
asvs_rationale: Orders fix prices and totals that become debts; the server computes every price and total and enforces the state machine.
classification:
  - "OrderLine.unit_price_applied, reference_price, amount | confidential | visible to both parties of the relationship"
  - "OrderLine.price_set_by_id | internal | visible to the supplier's owner and managers only"
  - "Order.customer_note, supplier_note | confidential | visible to both parties"
  - "Order.sync_issue | internal | supplier team only"
threats:
  - "T1 | T | A client chooses its own price | the server computes the reference price and applies it; the customer never sends a price | ORD-009 AB-1"
  - "T2 | T | A supplier raises a price after the customer's order | acceptance may only lower a price; prices freeze at acceptance | ORD-011 AB-1"
  - "T3 | T | A step is skipped or a frozen order is changed | one state machine with conditional updates | ORD-008 AB-1, ORD-014 AB-1"
  - "T4 | E | A driver or seller does a manager's or customer's step | rules table per step | ORD-011 AB-2, ORD-016 AB-1"
  - "T5 | I | A party reads another business's orders | visibility predicate through the relationship | ORD-019 AB-1"
  - "T6 | R | A price gap has no author | price_set_by_id and price_set_at are required when the applied price differs | ORD-004 AB-1"
  - "T7 | T | An acceptance date lands on an order the supplier entered, or on a pending one | the database refuses it; only the accept gesture writes it, from PENDING | ORD-022 AB-1, ORD-023 AB-1"
constraints:
  C-14: "An order is created only on an ACTIVE relationship whose supplier is an ACTIVE organization (not suspended, not closed)."
  C-15: "Every order line is for an ACTIVE variant of the relationship's supplier, of a product that is not paused; on a customer-placed order the quantity is at least the variant's `min_order_quantity` when sent."
  C-16: "`cancelled_by_party`, `cancelled_by_id` and `cancelled_at` are set if and only if `status` is CANCELLED; `cancellation_reason` only when CANCELLED and required when the supplier cancelled."
  C-51: "`status` PENDING requires `placed_by_party` CUSTOMER and an empty `accepted_at`; a set `accepted_at` requires `placed_by_party` CUSTOMER."
  C-18: "Status changes follow the permitted steps; delivery wins; a delivered or cancelled order is frozen except `supplier_note`."
  C-19: "`delivered_at` and `delivered_by_id` are set if and only if `status` is DELIVERED; every line then has `delivered_quantity`; `total_amount` equals the sum of line amounts plus `delivery_cost`."
  C-24: "A SALE ledger entry has `order_id` set and `amount` equal to `Order.total_amount` (server-fixed), and there is at most one non-reversed sale per order; the payment born of 'Commande livrée' also carries `order_id`."
  C-20: "Line `amount` is quantity times applied price rounded to the franc, half up; `label_applied` is composed by the shared label function; on a customer-placed order `unit_price_applied` equals `reference_price` when sent and is never raised afterward; `price_set_by_id` and `price_set_at` are set if and only if `unit_price_applied` differs from `reference_price`."
  C-04: "Author columns (`*_by_id`, `assigned_to_id`, `reporter_id`, `person_id` of an administrator, `to_person_id`) refer to a registered person; `resolved_by_id` and `administrator_id` refer to an Administrator."
  CM-38: "The pool of orders to take lists the confirmed orders with a delivery address; a driver does not see there an order assigned to another driver, and sees it again when that assignment ends (failed attempt or removal); managers, owners and sellers see every order of the pool."
  CM-12: "Allowed transitions only: PENDING to CONFIRMED or CANCELLED; CONFIRMED to IN_DELIVERY, DELIVERED or CANCELLED; IN_DELIVERY to DELIVERED or CONFIRMED (failed attempt); DELIVERED wins over CANCELLED; DELIVERED and CANCELLED are frozen except supplier_note."
  CM-14: "Line amount = quantity in thousandths times applied price, divided by 1000, rounded to the nearest franc with 0.5 rounded up, integer arithmetic only; 2.5 x 333 gives 833."
  CM-16: "Customer-placed order: unit_price_applied equals the server-computed reference price at sending; the supplier may only lower it, at acceptance; prices freeze at acceptance (customer order) or at departure or delivery (supplier order)."
  CM-11: "Reference price of a line = negotiated price when one exists (even higher than the variant price), else the variant price."
  CM-10: "CLOSED (by the owner, reopenable): no new order or customer, not findable by number, pending orders refused with reason 'Commerce fermé', team revoked, subscription stopped; relations, balances and history stay visible and payments stay possible."
  C-01: "Identifiers use `uuid` columns (UUIDv7), amounts `bigint`, quantities `numeric(12,3)`, timestamps `timestamptz`."
  C-35: "Synchronized tables carry `server_updated_at`, set by the server on every write, and `deleted_at` for deletion; unique constraints ignore deleted rows."
  C-58: "`replaced_by_order_id` is unique among set values, never the order's own id, set only on an order placed by the CUSTOMER, and names an order of the same relationship."
  C-60: "A `PICKUP` order has no delivery address."
  C-61: "`supplier_name_applied`, `collected_applied` and `balance_after_applied` are set exactly when the order is DELIVERED; `customer_name_applied` may stay empty. Enforced after the backfill of the orders already delivered."
  C-62: "Once set, the database refuses any change to `supplier_name_applied`, `customer_name_applied`, `collected_applied` and `balance_after_applied`."
contracts:
  provides:
    - name: OrderCalculations
      file: src/modules/order/order.calculations.ts
      story: ORD-007
      items:
        - "lineAmountOf(line: { quantityMilli: bigint; deliveredQuantityMilli?: bigint | null; unitPriceApplied: bigint }): bigint — uses `lineAmount` and the delivered quantity when set"
        - "orderTotal(amounts: bigint[], deliveryCost: bigint): bigint"
      used_by: [delivery, sync]
    - name: OrderStateMachine
      file: src/modules/order/order.state.ts
      story: ORD-008
      items:
        - "transitionOrder(tx, orderId: string, to: OrderStatus, actor: { personId: string; party: 'CUSTOMER' | 'SUPPLIER' }, fields?: TransitionFields): Promise<Order> — applies only a permitted step by a conditional update; DELIVERED wins over CANCELLED; frozen orders change only supplier_note; `fields.acceptedAt` records an acceptance and limits the step to PENDING (ORD-023)"
      used_by: [delivery, sync]
    - name: OrderDemand
      file: src/modules/order/order.repository.ts
      story: ORD-029
      items:
        - "countOrderedLinesByVariant(tx, supplierOrganizationId: string, since: Date): Promise<Map<string, number>> — per variant id, the lines of the supplier's orders created since that date, cancelled and deleted ones left out"
      used_by: [billing]
    - name: VariantUsage
      file: src/modules/order/order.repository.ts
      story: ORD-030
      items:
        - "listOrderedVariantIds(tx, variantIds: string[]): Promise<Set<string>> — the ids among those that an order line cites, whatever the state of the line or its order"
      used_by: [catalog, sync]
  consumes:
    - "catalog: getReferencePrice, getActiveVariant, variantLabel (docs/stories/modules/catalog/contracts.md)"
    - "relationship: ensureCustomerRelationship, visibleRelationsWhere, projectForSupplier (docs/stories/modules/relationship/contracts.md)"
    - "organization: loadActor, assertOrganizationActive (docs/stories/modules/organization/contracts.md)"
    - "notification: notify, recipientLanguage, retargetNotifications (docs/stories/modules/notification/contracts.md)"
    - "access: requireAbility, abilityFor, idempotent (docs/stories/modules/access/contracts.md)"
stories:
  - id: ORD-001
    title: Orders table
    kind: technical
    size: S
    risk: medium
    depends_on: [REL-002, PER-008, FND-005]
    read_first: [prisma/schema.prisma, tests/integration/relationship/relationship-table.test.ts]
    design_refs: [commandes-et-livraisons/order, contraintes-a-poser-au-niveau-base-de]
    constraints: [Order:required, Order.placed_by_party:enum, Order.status:enum, Order.cancelled_by_party:enum, Order:fk, C-35, C-04, C-01]
    asvs: [v5.0.0-2.2.3]
    fields: ["Order.{customer_relationship_id,placed_by_party,entered_by_id,delivery_address_applied,total_amount,delivery_cost,status,delivered_at,delivered_by_id,created_at,desired_delivery_date,cancelled_by_party,cancelled_by_id,cancelled_at,cancellation_reason,parent_order_id,customer_note,supplier_note,sync_issue}"]
    story: "Technical story: create the orders table with its columns and keys so that orders can be stored."
    context: |
      - Exists: `customer_relationships`, `require_registered_person()`, `set_server_updated_at()`.
      - Adds: table `orders` (Prisma model `Order`, table name `orders`; `total_amount` and `delivery_cost` bigint, `delivery_cost` default 0, `status` default CONFIRMED, `created_at` default now, `server_updated_at`, `deleted_at`), foreign keys including `parent_order_id` to itself, indexes on `customer_relationship_id`, `status`, and (`delivered_by_id`, `delivered_at`), and triggers `require_registered_person('entered_by_id', 'delivered_by_id', 'cancelled_by_id')` and `set_server_updated_at()`.
      - State, cancellation, delivery and creation rules follow in ORD-002, ORD-003 and ORD-006.
    acceptance: |
      Scenario: AC-1 Order defaults
        When an order is inserted with a relationship, placed_by_party SUPPLIER, entered_by_id and total_amount 0
        Then `delivery_cost` is 0, `status` is CONFIRMED, and `created_at` and `server_updated_at` are set
      Scenario Outline: AC-2 Enums and keys
        When a row has <values>
        Then the insert <result>
        Examples:
          | values                                   | result          |
          | status "LATE"                            | rejects         |
          | placed_by_party "ADMIN"                  | rejects         |
          | cancelled_by_party "PLATFORM"            | rejects         |
          | an unknown relationship                  | rejects (23503) |
          | entered_by_id of a guest                 | rejects (23514) |
          | parent_order_id of an existing order     | accepts         |
      Scenario: AC-3 Required
        When placed_by_party, entered_by_id or total_amount is null
        Then the insert fails with 23502
    implementation:
      create: [prisma/migrations/<timestamp>_ord_001_orders/migration.sql, tests/integration/order/order-table.test.ts]
      modify: [prisma/schema.prisma]
      pattern: tests/integration/relationship/relationship-table.test.ts
      signatures: []
      types: []
      errors: []
      dependencies: [prisma, "@prisma/client"]
    security:
      - "v5.0.0-2.2.3: enums, keys and author checks are enforced by the database."
    tests: |
      defaults | integration | AC-1, C-01, C-35 | insert → defaults; column types
      enums and keys | integration | AC-2, Order.placed_by_party:enum, Order.status:enum, Order.cancelled_by_party:enum, Order:fk, C-04 | each Examples row → accepted or rejected
      required | integration | AC-3, Order:required | null → 23502
    command: npx vitest run tests/integration/order/order-table.test.ts
    out_of_scope:
      - "Order rules in the database (ORD-002, ORD-003, ORD-006)."
  - id: ORD-002
    title: Order status, cancellation and delivery rules in the database
    kind: technical
    size: S
    risk: high
    depends_on: [ORD-001]
    read_first: [prisma/schema.prisma, tests/integration/order/order-table.test.ts]
    design_refs: [commandes-et-livraisons/order, contraintes-a-poser-au-niveau-base-de]
    constraints: [C-16, C-17, C-18, C-19, CM-12]
    asvs: [v5.0.0-2.3.1, v5.0.0-2.2.3]
    story: "Technical story: enforce the order status rules with CHECKs and a transition trigger, so that no code path can skip a step or change a frozen order."
    context: |
      - Exists: `orders` (ORD-001).
      - Adds: one migration. CHECKs: `cancelled_by_party`, `cancelled_by_id` and `cancelled_at` are all set exactly when `status = 'CANCELLED'`; `cancellation_reason` is null unless CANCELLED and not null when `cancelled_by_party = 'SUPPLIER'`; `status = 'PENDING'` requires `placed_by_party = 'CUSTOMER'`; `delivered_at` and `delivered_by_id` are both set exactly when `status = 'DELIVERED'`.
      - A BEFORE UPDATE trigger allows only these status steps: PENDING to CONFIRMED or CANCELLED; CONFIRMED to IN_DELIVERY, DELIVERED or CANCELLED; IN_DELIVERY to DELIVERED or CONFIRMED; CANCELLED to DELIVERED is allowed only when `sync_issue` is set in the same update (delivery wins over an earlier cancellation, and the cancellation columns are cleared); DELIVERED to CANCELLED is refused; a row that is DELIVERED or CANCELLED may otherwise change only `supplier_note`, `sync_issue` and `server_updated_at`. Anything else raises SQLSTATE 23514.
    acceptance: |
      Scenario Outline: AC-1 Cancellation columns
        When a row has status <status> and <cancel>
        Then the statement <result>
        Examples:
          | status    | cancel                                                | result          |
          | CANCELLED | party, person and time set, reason set                | accepts         |
          | CANCELLED | party SUPPLIER, reason empty                          | rejects (23514) |
          | CANCELLED | party CUSTOMER, reason empty                          | accepts         |
          | CANCELLED | time empty                                            | rejects (23514) |
          | CONFIRMED | cancelled_by_party set                                | rejects (23514) |
          | CONFIRMED | cancellation_reason set                               | rejects (23514) |
      Scenario: AC-2 PENDING is the customer's
        When a row has status PENDING and placed_by_party SUPPLIER
        Then the insert fails with 23514
      Scenario: AC-3 Delivery columns
        Then `delivered_at` and `delivered_by_id` are required for DELIVERED and refused for every other status
      Scenario Outline: AC-4 Steps
        When an order goes from <from> to <to>
        Then the update <result>
        Examples:
          | from        | to          | result          |
          | PENDING     | CONFIRMED   | accepts         |
          | PENDING     | CANCELLED   | accepts         |
          | PENDING     | DELIVERED   | rejects (23514) |
          | CONFIRMED   | IN_DELIVERY | accepts         |
          | CONFIRMED   | DELIVERED   | accepts         |
          | IN_DELIVERY | CONFIRMED   | accepts         |
          | IN_DELIVERY | CANCELLED   | rejects (23514) |
          | DELIVERED   | CANCELLED   | rejects (23514) |
          | CANCELLED   | CONFIRMED   | rejects (23514) |
          | CANCELLED   | DELIVERED, sync_issue set    | accepts         |
          | CANCELLED   | DELIVERED, sync_issue empty  | rejects (23514) |
      Scenario: AC-5 Frozen orders
        When a DELIVERED order gets a new `delivery_cost`, and then a new `supplier_note`
        Then the first update fails with 23514 and the second succeeds
    abuse: |
      Scenario: AB-1 Reviving or altering a finished order (tampering)
        When code moves a CANCELLED order back to CONFIRMED or edits a DELIVERED order's cost
        Then PostgreSQL refuses it, even though no validation ran
    implementation:
      create: [prisma/migrations/<timestamp>_ord_002_status_rules/migration.sql, tests/integration/order/status-rules.test.ts]
      modify: []
      pattern: tests/integration/relationship/party-rules.test.ts
      signatures: []
      types: []
      errors: []
      dependencies: [prisma, "@prisma/client"]
    security:
      - "v5.0.0-2.3.1: the permitted steps live in the database, so every path obeys them."
      - "v5.0.0-2.2.3: related columns are checked together."
    tests: |
      cancellation columns | integration | AC-1, C-16 | each Examples row → accepted or 23514
      pending is customer's | integration | AC-2, C-17 | 23514
      delivery columns | integration | AC-3, C-19 | required for DELIVERED, refused otherwise
      steps | integration | AC-4, C-18, CM-12 | each Examples row → accepted or 23514
      frozen | integration | AC-5, C-18 | cost refused, note accepted
      crafted update | security | AB-1, CWE-841 | revive and edit both refused
    command: npx vitest run tests/integration/order/status-rules.test.ts
    out_of_scope:
      - "Applying the steps from routes (ORD-008)."
  - id: ORD-003
    title: Orders only on live relationships of active organizations
    kind: technical
    size: XS
    risk: high
    depends_on: [ORD-001, ORG-001, ORD-002]
    read_first: [prisma/schema.prisma, tests/integration/order/order-table.test.ts]
    design_refs: [commandes-et-livraisons/order/autres-regles, contraintes-a-poser-au-niveau-base-de]
    constraints: [C-14]
    asvs: [v5.0.0-2.3.1, v5.0.0-2.2.3]
    story: "Technical story: refuse in the database an order on a relationship that is not ACTIVE or whose supplier is not an active organization."
    context: |
      - Exists: `orders`, `customer_relationships` (status), `organizations` (status).
      - Adds: a BEFORE INSERT trigger on `orders`: the relationship must have `status = 'ACTIVE'`, no `deleted_at`, `supplier_organization_id` not null, and that organization `ACTIVE`; otherwise SQLSTATE 23514. It applies to inserts only, so old orders of a closed business stay valid.
      - Counters (relationships without a customer) are allowed.
    acceptance: |
      Scenario Outline: AC-1 Relationship and supplier state
        When an order is inserted on a relationship <case>
        Then the insert <result>
        Examples:
          | case                                             | result          |
          | ACTIVE, supplier organization ACTIVE             | accepts         |
          | PENDING                                          | rejects (23514) |
          | ENDED                                            | rejects (23514) |
          | ACTIVE with the supplier organization SUSPENDED  | rejects (23514) |
          | ACTIVE with the supplier organization CLOSED     | rejects (23514) |
          | deleted                                          | rejects (23514) |
          | a counter of an ACTIVE organization              | accepts         |
      Scenario: AC-2 Old orders stay
        When an organization is closed after it received orders
        Then updating a `supplier_note` on an old order still works
    abuse: |
      Scenario: AB-1 Order on a blocked relationship by a crafted write (tampering)
        When code inserts an order on an ENDED relationship
        Then PostgreSQL refuses it
    implementation:
      create: [prisma/migrations/<timestamp>_ord_003_creation_guard/migration.sql, tests/integration/order/creation-guard.test.ts]
      modify: []
      pattern: tests/integration/order/status-rules.test.ts
      signatures: []
      types: []
      errors: []
      dependencies: [prisma, "@prisma/client"]
    security:
      - "v5.0.0-2.3.1: the business rule holds for every insert path, including sync."
    tests: |
      creation states | integration | AC-1, C-14 | each Examples row → accepted or 23514
      old orders | integration | AC-2 | note update works
      crafted insert | security | AB-1, CWE-841 | 23514
    command: npx vitest run tests/integration/order/creation-guard.test.ts
    out_of_scope:
      - "Refusing pending orders when a business closes (ORD-018)."
  - id: ORD-004
    title: Order lines table
    kind: technical
    size: M
    risk: high
    depends_on: [ORD-001, CAT-001, PER-008, FND-003, ORD-002]
    read_first: [prisma/schema.prisma, tests/integration/order/order-table.test.ts]
    design_refs: [commandes-et-livraisons/orderline, contraintes-a-poser-au-niveau-base-de]
    constraints: [OrderLine:required, OrderLine:fk, C-20, CM-14, C-04, C-01, C-35]
    asvs: [v5.0.0-2.2.1, v5.0.0-2.2.3]
    fields: ["OrderLine.{order_id,product_id,label_applied,quantity,delivered_quantity,reference_price,unit_price_applied,amount,price_set_by_id,price_set_at}"]
    story: "Technical story: create the order lines table with the amount and price-gap rules in the database, so that an amount is always the rounded product of quantity and applied price."
    context: |
      - Exists: `orders` (ORD-001), `products` (CAT-001); `lineAmount` (FND-003).
      - Adds: table `order_lines` (`quantity` and `delivered_quantity` numeric(12,3), `server_updated_at`, `deleted_at`, indexes on `order_id` and `product_id`), triggers `require_registered_person('price_set_by_id')` and `set_server_updated_at()`.
      - CHECKs: `quantity > 0`; `delivered_quantity` null or between 0 and `quantity`; `reference_price >= 0`; `unit_price_applied >= 0`; `amount = (((coalesce(delivered_quantity, quantity) * 1000)::bigint * unit_price_applied) + 500) / 1000` (integer arithmetic, half up); `price_set_by_id` and `price_set_at` both set exactly when `unit_price_applied <> reference_price`.
    acceptance: |
      Scenario Outline: AC-1 Amount rule
        When a line has quantity <q>, delivered_quantity <d>, unit_price_applied <p> and amount <a>
        Then the insert <result>
        Examples:
          | q   | d     | p    | a     | result          |
          | 2.5 | empty | 333  | 833   | accepts         |
          | 2.5 | empty | 333  | 832   | rejects (23514) |
          | 10  | 8     | 3000 | 24000 | accepts         |
          | 10  | 8     | 3000 | 30000 | rejects (23514) |
          | 0.001 | empty | 500 | 1    | accepts         |
          | 0.001 | empty | 499 | 0    | accepts         |
      Scenario Outline: AC-2 Quantities
        When a line has quantity <q> and delivered_quantity <d>
        Then the insert <result>
        Examples:
          | q  | d   | result          |
          | 0  | empty | rejects (23514) |
          | 10 | 11  | rejects (23514) |
          | 10 | 0   | accepts         |
      Scenario Outline: AC-3 Price gap
        When a line has unit_price_applied <applied>, reference_price <ref> and <author>
        Then the insert <result>
        Examples:
          | applied | ref  | author                        | result          |
          | 2800    | 3000 | price_set_by_id and price_set_at set | accepts  |
          | 2800    | 3000 | no author                     | rejects (23514) |
          | 3000    | 3000 | an author set                 | rejects (23514) |
          | 3000    | 3000 | no author                     | accepts         |
      Scenario: AC-4 Keys and required
        When the order or the product is unknown, or `label_applied` is null
        Then the insert fails with 23503 or 23502
    abuse: |
      Scenario: AB-1 A price gap without an author (repudiation)
        When code inserts a line whose applied price differs from the reference and no author
        Then PostgreSQL refuses it
    implementation:
      create: [prisma/migrations/<timestamp>_ord_004_order_lines/migration.sql, tests/integration/order/order-line-table.test.ts]
      modify: [prisma/schema.prisma]
      pattern: tests/integration/order/status-rules.test.ts
      signatures: []
      types: []
      errors: []
      dependencies: [prisma, "@prisma/client"]
    security:
      - "v5.0.0-2.2.1: amounts and quantities are validated in the database."
      - "v5.0.0-2.2.3: price, quantity, amount and author are checked together."
    tests: |
      amount rule | integration | AC-1, C-20, CM-14, C-01, C-35 | each Examples row → accepted or 23514; column types
      quantities | integration | AC-2 | each Examples row → accepted or 23514
      price gap | integration | AC-3, C-20, C-04 | each Examples row → accepted or 23514
      customer orders | integration | AC-4, C-20 | above → 23514; insert equal only
      keys and required | integration | AC-4, OrderLine:required, OrderLine:fk | rejected
      gap without author | security | AB-1, CWE-778 | 23514
    command: npx vitest run tests/integration/order/order-line-table.test.ts
    out_of_scope:
      - "Product and quantity rules (ORD-005) and totals (ORD-006)."
  - id: ORD-005
    title: Order line product and minimum quantity rules
    kind: technical
    size: S
    risk: high
    depends_on: [ORD-004, ORD-003]
    read_first: [prisma/schema.prisma, tests/integration/order/order-line-table.test.ts]
    design_refs: [commandes-et-livraisons/order/autres-regles, catalogue/product]
    constraints: [C-15, C-20, CM-16]
    asvs: [v5.0.0-2.2.3, v5.0.0-8.2.2]
    story: "Technical story: refuse a line for a product that is not an active product of the relationship's supplier, and a customer order below the minimum quantity."
    context: |
      - Exists: `order_lines`, `orders`, `products`, `customer_relationships`.
      - Adds: a BEFORE INSERT OR UPDATE trigger on `order_lines`. On insert: the product must belong to the supplier organization of the order's relationship and have `status = 'ACTIVE'` and no `deleted_at`; when the order was placed by the CUSTOMER and the product has `min_order_quantity`, `quantity` must be at least that value. On an order placed by the CUSTOMER, `unit_price_applied` must equal `reference_price` on insert and may never exceed it on update. Otherwise SQLSTATE 23514. Product and quantity are not re-checked on update, so a later product change never blocks an old order.
    acceptance: |
      Scenario Outline: AC-1 Product rule
        When a line is inserted for <product>
        Then the insert <result>
        Examples:
          | product                                       | result          |
          | an ACTIVE product of the supplier             | accepts         |
          | an INACTIVE product of the supplier           | rejects (23514) |
          | a product of another organization             | rejects (23514) |
          | a deleted product                             | rejects (23514) |
      Scenario Outline: AC-2 Minimum quantity
        Given a product with min_order_quantity 5
        When a line for an order placed by <party> has quantity <q>
        Then the insert <result>
        Examples:
          | party    | q     | result          |
          | CUSTOMER | 4.999 | rejects (23514) |
          | CUSTOMER | 5     | accepts         |
          | SUPPLIER | 1     | accepts         |
