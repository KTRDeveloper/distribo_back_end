  - id: ORD-014
    title: Seller edits an order they entered, before departure
    kind: feature
    size: M
    risk: high
    depends_on: [ORD-013, ORD-009]
    read_first: [src/modules/order/order.service.ts, src/modules/order/order.repository.ts]
