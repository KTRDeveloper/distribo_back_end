  - id: ORD-013
    title: Seller enters an order for a customer
    kind: feature
    size: M
    risk: high
    depends_on: [ORD-008, ORD-005, REL-009, CAT-003, ACC-003, ACC-007, ORD-009]
    read_first: [src/modules/order/order.service.ts, docs/stories/modules/catalog/contracts.md]
