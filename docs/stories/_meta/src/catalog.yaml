      signatures:
        - "copyCustomerPrices(actor: Actor, targetRelationshipId: string, input: { id: string; from_relationship_id: string }): Promise<{ copied: number }>"
      types: []
      errors: ["OWN_RECORD 403", "NOT_FOUND 404", "FORBIDDEN 403", "VALIDATION_ERROR 400"]
