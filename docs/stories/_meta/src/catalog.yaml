kind: module
module: catalog
prefix: CAT
title: Catalog
responsibility: Owns each organization's own catalog at two levels (products and their variants), the negotiated price per customer for one variant, and the reference price an order line freezes.
entities: [Product, ProductVariant, CustomerPrice]
depends_on: [foundation, person, notification, access, organization, relationship, order, images]
asvs_level: L2
asvs_rationale: Prices are business data; a customer must never see another customer's negotiated price, and only managers change prices.
classification:
  - "ProductVariant.price | internal | public to anyone who finds the business, as the default price"
  - "CustomerPrice.price | confidential | visible to the supplier team and to that customer only"
threats:
  - "T1 | I | A customer reads another customer's negotiated price | the catalog view builds prices from the caller's own relationship only | CAT-007 AB-1"
  - "T2 | E | A seller or driver changes prices or the catalog | product and price gestures need MANAGER online or OWNER | CAT-004 AB-1, CAT-008 AB-1"
  - "T3 | E | A manager sets their own negotiated price | own customer record is refused | CAT-008 AB-2"
  - "T4 | T | A price is written for a variant of another business | the variant must belong to the relationship's supplier | CAT-008 AB-3, CAT-015 AB-1"
  - "T5 | E | A business goes past its product limit by creating products or putting them back on sale | the online routes refuse at the limit (409 PRODUCT_LIMIT_REACHED); what arrives by synchronization is paused afterwards | CAT-022 AC-3, CAT-024 AC-3, CAT-038 AC-2"
  - "T6 | T | A deletion erases the article of past sales | a variant cited by an order line or a negotiated price is never deleted, online or by synchronization | CAT-026 AB-1, CAT-036 AB-1"
  - "T7 | E | A phone un-pauses a product, writes photo keys or the merge link | the sync writers read named fields only | CAT-033 AB-2, CAT-034 AC-5, CAT-035 AB-2"
constraints:
  C-11: "`CustomerPrice` is unique per (relationship, variant) among rows not deleted; the variant belongs to the supplier of the relationship."
  C-13: "`ProductVariant.price` > 0; `min_order_quantity` > 0 when set; `price_updated_at` is set by the server on every price change."
  C-15: "Every order line is for an ACTIVE variant of the relationship's supplier, of a product that is not paused; on a customer-placed order the quantity is at least the variant's `min_order_quantity` when sent."
  C-45: "A product that is not deleted has at least one variant that is not deleted; `ProductVariant.organization_id` equals `Product.organization_id`."
  C-46: "`Product.paused_at` is written by the server only; the products on sale (not deleted, not paused, with at least one ACTIVE variant) number at most `Organization.max_products`, checked by the phone and by the online routes; what arrives in excess through synchronization is paused, never refused."
  C-47: "Two variants of one product that are not deleted never share both the same simplified name and the same simplified unit (capitals and extra spaces ignored, an empty name counts as empty text); `merged_into_id` set implies the variant is deleted."
  C-48: "A variant cited by an order line or a negotiated price is never deleted, only taken off sale (`INACTIVE`); a deletion received for a cited variant becomes a withdrawal from sale, and a line received for a deleted variant restores it, off sale."
  C-49: "`Product.image_keys` and `ProductVariant.image_keys` hold at most 5 keys (CHECK) with a GIN index; a key is cited by one record only, across all tables; the image keys, `Organization.logo_key` and `Person.avatar_key` are written by the server only."
  CM-42: "Every insert or update of a `ProductVariant` also sets `server_updated_at` of its product to the database time, so that a product and its variants always travel together to the phones."
  C-04: "Author columns (`*_by_id`, `assigned_to_id`, `reporter_id`, `person_id` of an administrator, `to_person_id`) refer to a registered person; `resolved_by_id` and `administrator_id` refer to an Administrator."
  CM-11: "Reference price of a line = negotiated price when one exists (even higher than the variant price), else the variant price."
  C-01: "Identifiers use `uuid` columns (UUIDv7), amounts `bigint`, quantities `numeric(12,3)`, timestamps `timestamptz`."
  C-35: "Synchronized tables carry `server_updated_at`, set by the server on every write, and `deleted_at` for deletion; unique constraints ignore deleted rows."
contracts:
  provides:
    - name: ReferencePrice
      file: src/modules/catalog/catalog.repository.ts
      story: CAT-003
      items:
        - "getReferencePrice(tx, relationshipId: string, variantId: string): Promise<{ price: bigint; negotiated: boolean; changedAt: Date }> — negotiated price when a live one exists, else the variant price (CAT-017)"
        - "getActiveVariant(tx, organizationId: string, variantId: string): Promise<ActiveVariant> — 404 unless the variant is ACTIVE, owned by the organization and its product is not deleted or paused; carries the product name, variant name, unit, price, `priceUpdatedAt` and `minOrderQuantity` (CAT-019)"
      used_by: [order, sync]
    - name: VariantText
      file: src/shared/variant.ts
      story: CAT-016
      items:
        - "variantLabel(productName: string, variantName: string | null, unit: string): string — the label frozen on an order line"
        - "simplifyText(text: string | null): string — the comparison form used for variants of one product"
      used_by: [order, sync]
    - name: ProductPause
      file: src/modules/catalog/catalog.repository.ts
      story: CAT-020
      items:
        - "listProductsOnSale(tx, organizationId: string): Promise<SaleProduct[]> — the products not deleted, not paused and with an ACTIVE variant, newest first; each with its id, creation date and all its variant ids"
        - "listPausedProducts(tx, organizationId: string): Promise<SaleProduct[]> — the paused products that would be on sale again if resumed, same shape and order"
        - "setProductsPaused(tx, organizationId: string, productIds: string[], paused: boolean, now: Date): Promise<string[]> — sets or clears `paused_at` on the organization's own products that are not in that state, returns the ids it changed"
      used_by: [billing]
    - name: ImageKeyWriters
      file: src/modules/catalog/catalog.repository.ts
      story: CAT-032
      items:
        - "setProductImageKeys(tx, organizationId: string, productId: string, keys: string[]): Promise<string[]> — replaces the photo keys of a product of the organization, returns the previous keys, 404 if the product is not found"
        - "setVariantImageKeys(tx, organizationId: string, variantId: string, keys: string[]): Promise<string[]> — same for a variant"
      used_by: [images]
    - name: ImageKeyReaders
      file: src/modules/catalog/catalog.repository.ts
      story: CAT-044
      items:
        - "lockProductImageKeys(tx, organizationId: string, productId: string): Promise<string[]> — reads the photo keys of a product of the organization under a row lock, 404 if the product is not found"
        - "lockVariantImageKeys(tx, organizationId: string, variantId: string): Promise<{ productId: string; keys: string[] }> — same for a variant"
        - "readProductImageKeys(tx, organizationId: string, productId: string): Promise<string[]> — the same read of a product without a lock"
        - "readVariantImageKeys(tx, organizationId: string, variantId: string): Promise<{ productId: string; keys: string[] }> — the same read without a lock"
      used_by: [images]
    - name: ImageKeyRelease
      file: src/modules/catalog/catalog.repository.ts
      story: CAT-046
      items:
        - "releaseDeletedImageKeys(tx, deletedBefore: Date, limit: number): Promise<string[]> — empties the photo keys of products and variants deleted before the date and returns the released keys"
      used_by: [images]
    - name: CatalogSyncWriters
      file: src/modules/catalog/catalog.sync-writers.ts
      story: CAT-033
      items:
        - "applyProductFromSync(tx, organizationId: string, input: ProductSyncInput, now: Date): Promise<ProductSyncResult> — creates or edits a product sent by a phone (CAT-033)"
        - "applyVariantFromSync(tx, organizationId: string, input: VariantSyncInput, now: Date): Promise<VariantSyncResult> — creates or edits a variant (CAT-034); a duplicate is folded into the first one (CAT-035)"
        - "deleteVariantFromSync(tx, organizationId: string, variantId: string, now: Date): Promise<DeleteSyncResult> — deletes an unused variant, takes a used one off sale (CAT-036)"
        - "deleteProductFromSync(tx, organizationId: string, productId: string, now: Date): Promise<DeleteSyncResult> — same for a product and its variants (CAT-036)"
        - "resolveVariantForLine(tx, organizationId: string, variantId: string, now: Date): Promise<ResolvedVariant | null> — the live variant a sale or a negotiated price cites, following a merge or bringing a deleted variant back off sale (CAT-037)"
        - "applyPriceFromSync(tx, organizationId: string, input: PriceSyncInput, now: Date): Promise<PriceSyncResult> — writes a negotiated price sent by a phone; a price entered twice keeps the last (CAT-039)"
        - "deletePriceFromSync(tx, organizationId: string, priceId: string, now: Date): Promise<'DELETED' | 'ALREADY' | 'NOT_FOUND'> — removes a negotiated price sent by a phone (CAT-039)"
      used_by: [sync]
  consumes:
    - "organization: loadActor, assertOrganizationActive, PlanRefresh (docs/stories/modules/organization/contracts.md)"
    - "relationship: visibleRelationsWhere, projectForSupplier (docs/stories/modules/relationship/contracts.md)"
    - "access: requireAbility, abilityFor, idempotent (docs/stories/modules/access/contracts.md)"
    - "order: VariantUsage (docs/stories/modules/order/contracts.md)"
    - "foundation: ImageKeys (docs/stories/modules/foundation/contracts.md)"
    - "images: ImageCopies copyImage (docs/stories/modules/images/contracts.md)"
stories:
  - id: CAT-001
    title: Products table
    kind: technical
    size: S
    risk: low
    depends_on: [ORG-001, FND-002, FND-005]
    read_first: [prisma/schema.prisma, tests/integration/organization/organization-table.test.ts]
    design_refs: [catalogue/product, contraintes-a-poser-au-niveau-base-de]
    constraints: [Product:required, Product.status:enum, Product:fk, C-13, C-01, C-35]
    asvs: [v5.0.0-2.2.3]
    fields: ["Product.{organization_id,name,unit,price,price_updated_at,min_order_quantity,description,category,status,created_at}"]
    story: "Technical story: create the products table with its price rules so that each organization can own articles."
    context: |
      - Exists: `organizations`, `set_server_updated_at()`.
      - Adds: table `products` (`price` bigint, `min_order_quantity` numeric(12,3) null, `status` default ACTIVE, `price_updated_at` and `created_at` default now, `server_updated_at`, `deleted_at`), CHECK `price > 0`, CHECK `min_order_quantity > 0` when set, and a trigger that sets `price_updated_at` to `now()` on insert and whenever `price` changes.
    acceptance: |
      Scenario: AC-1 Defaults
        When a product is inserted with name, unit, price 3000
        Then `status` is ACTIVE, `price_updated_at`, `created_at` and `server_updated_at` are set
      Scenario Outline: AC-2 Price rules
        When a row has <values>
        Then the insert <result>
        Examples:
          | values                        | result          |
          | price 1                       | accepts         |
          | price 0                       | rejects (23514) |
          | price -5                      | rejects (23514) |
          | min_order_quantity 0.001      | accepts         |
          | min_order_quantity 0          | rejects (23514) |
          | min_order_quantity 1.0005     | rejects or rounds to 3 decimals |
          | status "DELETED"              | rejects         |
      Scenario: AC-3 Price change date
        When the price is updated, and then only the name is updated
        Then `price_updated_at` moves only for the price change
      Scenario: AC-4 Required and key
        When name, unit or price is null, or the organization is unknown
        Then the insert fails with 23502 or 23503
    implementation:
      create: [prisma/migrations/<timestamp>_cat_001_products/migration.sql, tests/integration/catalog/product-table.test.ts]
      modify: [prisma/schema.prisma]
      pattern: tests/integration/organization/organization-table.test.ts
      signatures: []
      types: []
      errors: []
      dependencies: [prisma, "@prisma/client"]
    security:
      - "v5.0.0-2.2.3: price limits and the price date are enforced by the database."
    tests: |
      defaults | integration | AC-1, C-01, C-35 | insert → defaults; column types incl. numeric(12,3)
      price rules | integration | AC-2, C-13, Product.status:enum | each Examples row → accepted or rejected
      price date | integration | AC-3, C-13 | moves only on price change
      required and key | integration | AC-4, Product:required, Product:fk | rejected
    command: npx vitest run tests/integration/catalog/product-table.test.ts
    out_of_scope:
      - "Routes (CAT-004 onward)."
  - id: CAT-002
    title: Negotiated prices table
    kind: technical
    size: S
    risk: medium
    depends_on: [CAT-001, REL-002, PER-008]
    read_first: [prisma/schema.prisma, tests/integration/relationship/relationship-table.test.ts]
    design_refs: [relations-commerciales/customerprice, contraintes-a-poser-au-niveau-base-de]
    constraints: [CustomerPrice:required, CustomerPrice:fk, C-11, C-04, C-01, C-35]
    asvs: [v5.0.0-2.2.3, v5.0.0-8.2.2]
    fields: ["CustomerPrice.{customer_relationship_id,product_id,price,set_by_id,set_at}"]
    story: "Technical story: create the negotiated prices table so that one customer can have its own price for one article."
    context: |
      - Exists: `products` (CAT-001), `customer_relationships` (REL-001), `require_registered_person()`.
      - Adds: table `customer_prices` (`set_at` default now, `server_updated_at`, `deleted_at`), partial unique index on (`customer_relationship_id`, `product_id`) where `deleted_at` is null, triggers `require_registered_person('set_by_id')` and `set_server_updated_at()`.
      - A trigger refuses a row whose product does not belong to the supplier organization of the relationship (a relationship whose supplier is a person has no products). The application rule that a price is positive is in the routes (CAT-008).
    acceptance: |
      Scenario: AC-1 Row
        When a price is inserted for a relationship and a product of the same supplier
        Then the row is stored with `set_at` and `server_updated_at` set
      Scenario Outline: AC-2 Uniqueness
        When a second price for the same relationship and product is inserted while the first is <first>
        Then the insert <result>
        Examples:
          | first    | result          |
          | live     | rejects (23505) |
          | deleted  | accepts         |
      Scenario: AC-3 Product of another supplier
        When the product belongs to a different organization than the relationship's supplier
        Then the insert fails with 23514
      Scenario: AC-4 Author and keys
        When `set_by_id` is a guest, or a foreign key is unknown, or `price` is null
        Then the insert fails with 23514, 23503 or 23502
    abuse: |
      Scenario: AB-1 Price for a foreign product by a crafted write (tampering)
        When code inserts a price for another business's product
        Then PostgreSQL refuses it, even though no validation ran
    implementation:
      create: [prisma/migrations/<timestamp>_cat_002_customer_prices/migration.sql, tests/integration/catalog/customer-price-table.test.ts]
      modify: [prisma/schema.prisma]
      pattern: tests/integration/relationship/relationship-table.test.ts
      signatures: []
      types: []
      errors: []
      dependencies: [prisma, "@prisma/client"]
    security:
      - "v5.0.0-2.2.3: supplier ownership of the product is checked in the database."
      - "v5.0.0-8.2.2: one live price per pair."
    tests: |
      row | integration | AC-1, C-01, C-35 | stored; server time
      uniqueness | integration | AC-2, C-11 | each Examples row → accepted or 23505
      foreign product | integration | AC-3, C-11 | 23514
      author and keys | integration | AC-4, CustomerPrice:required, CustomerPrice:fk, C-04 | rejected
      crafted write | security | AB-1, CWE-20 | raw insert for a foreign product → 23514
    command: npx vitest run tests/integration/catalog/customer-price-table.test.ts
    out_of_scope:
      - "Routes that write prices (CAT-008)."
  - id: CAT-003
    title: Reference price and active product lookup
    kind: technical
    size: S
    risk: high
    depends_on: [CAT-002, REL-006]
    read_first: [prisma/schema.prisma, src/modules/relationship/relationship.repository.ts]
    design_refs: [relations-commerciales/customerprice, catalogue/product]
    constraints: [CM-11, C-15]
    asvs: [v5.0.0-2.2.3, v5.0.0-2.3.1]
    story: "Technical story: provide the function that says which price an order line freezes, so that orders and sync compute it the same way."
    context: |
      - Exists: `products`, `customer_prices`.
      - Adds: `src/modules/catalog/catalog.repository.ts` with `getReferencePrice(tx, relationshipId, productId)` and `getActiveProduct(tx, organizationId, productId)`.
      - The reference price is the live negotiated price for the pair when one exists, even when higher than the product price; else `products.price`. It returns `{ price, negotiated, changedAt }` where `changedAt` is the negotiated `set_at` or the product's `price_updated_at`.
      - `getActiveProduct` throws 404 `NOT_FOUND` unless the product belongs to the organization and is ACTIVE and not deleted.
    acceptance: |
      Scenario Outline: AC-1 Reference price
        Given a product priced 3000
        When the negotiated price is <negotiated> for the relationship
        Then getReferencePrice returns price <price> and negotiated <flag>
        Examples:
          | negotiated        | price | flag  |
          | none              | 3000  | false |
          | 2800              | 2800  | true  |
          | 3500 (higher)     | 3500  | true  |
          | deleted (2800)    | 3000  | false |
      Scenario: AC-2 Other customers do not matter
        When another relationship has a negotiated price of 1000
        Then the first relationship's reference price is unchanged
      Scenario Outline: AC-3 Active product
        When getActiveProduct receives <case>
        Then <result>
        Examples:
          | case                                | result           |
          | an ACTIVE product of the organization | it is returned |
          | an INACTIVE product                 | 404 NOT_FOUND    |
          | a deleted product                   | 404 NOT_FOUND    |
          | a product of another organization   | 404 NOT_FOUND    |
    abuse: |
      Scenario: AB-1 Using another customer's price (information disclosure)
        When getReferencePrice is called with relationship A
        Then no price of relationship B is ever used
    implementation:
      create: [src/modules/catalog/catalog.repository.ts, tests/integration/catalog/reference-price.test.ts]
      modify: []
      pattern: src/modules/tasks/tasks.repository.ts
      signatures:
        - "getReferencePrice(tx: Prisma.TransactionClient, relationshipId: string, productId: string): Promise<{ price: bigint; negotiated: boolean; changedAt: Date }>"
        - "getActiveProduct(tx: Prisma.TransactionClient, organizationId: string, productId: string): Promise<Product>"
      types: []
      errors: ["NOT_FOUND 404"]
      dependencies: ["@prisma/client"]
    security:
      - "v5.0.0-2.2.3: prices are read on the server, from the database, inside the caller's transaction."
    tests: |
      reference price | integration | AC-1, CM-11 | each Examples row → price and flag
      other customers | integration | AC-2 | unchanged
      active product | integration | AC-3, C-15 | each Examples row → result
      isolation | security | AB-1, CWE-200 | other relationship's price never used
    command: npx vitest run tests/integration/catalog/reference-price.test.ts
    out_of_scope:
      - "Freezing prices on order lines (ORD module)."
  - id: CAT-004
    title: Manager creates a product
    kind: feature
    size: M
    risk: medium
    depends_on: [CAT-001, ORG-005, ACC-002, ACC-007, CAT-003, FND-003]
    read_first: [src/modules/organization/organization.routes.ts, src/shared/money.ts]
    design_refs: [catalogue/product]
    constraints: [Product:required, C-13]
    asvs: [v5.0.0-8.2.1, v5.0.0-15.3.3, v5.0.0-2.2.1]
    story: As a manager, I want to add an article to my catalog so that customers can order it.
    context: |
      - Exists: `products` (CAT-001); `loadActor`; `requireAbility('create', 'Product')` (ACC-002, online for MANAGER, always for OWNER); `parseQuantity`; `idempotent()`.
      - Adds: `POST /api/v1/organizations/{organizationId}/products` with `{ id, name, unit, price, min_order_quantity?, description?, category? }`; response 201 with the product view `{ id, name, unit, price, price_updated_at, min_order_quantity, description, category, status, created_at }`.
      - Limits: `name` 1 to 100, `unit` 1 to 100, `category` up to 100, `description` up to 2000 (Q-027); `price` an integer of at least 1; `min_order_quantity` a decimal string or number greater than 0 with at most 3 decimals. The organization must be ACTIVE.
    acceptance: |
      Scenario: AC-1 Create
        When a MANAGER posts name "Riz parfumé — sac 25 kg", unit "sac 25 kg" and price 15000
        Then the response is 201 with status ACTIVE and price_updated_at set
      Scenario Outline: AC-2 Limits
        When the body has <field> = <value>
        Then the response is <status>
        Examples:
          | field               | value       | status |
          | name                | empty       | 400    |
          | name                | 101 chars   | 400    |
          | unit                | empty       | 400    |
          | price               | 0           | 400    |
          | price               | 1.5         | 400    |
          | min_order_quantity  | 0           | 400    |
          | min_order_quantity  | 0.0001      | 400    |
          | min_order_quantity  | 2.5         | 201    |
      Scenario: AC-3 Roles
        Then a SELLER or DRIVER gets 403 and an OWNER gets 201
      Scenario: AC-4 Inactive organization
        When the organization is CLOSED or SUSPENDED
        Then the response is 409 `ORGANIZATION_NOT_ACTIVE`
      Scenario: AC-5 Repeat
        When the same body is posted twice
        Then one product exists and both answers are equal
    abuse: |
      Scenario: AB-1 Seller creates articles (vertical)
        When a SELLER or DRIVER posts
        Then the response is 403 and nothing is stored
      Scenario: AB-2 Server-owned fields (mass assignment)
        When the body contains status, organization_id or price_updated_at
        Then the response is 400
      Scenario: AB-3 Another business (horizontal)
        When a member of A posts to business B
        Then the response is 404
    implementation:
      create: [src/modules/catalog/catalog.routes.ts, src/modules/catalog/catalog.schemas.ts, src/modules/catalog/catalog.service.ts, tests/integration/catalog/create-product.test.ts]
      modify: [src/modules/catalog/catalog.repository.ts, src/app.ts]
      pattern: src/modules/organization/organization.routes.ts
      signatures:
        - "createProduct(actor: Actor, input: CreateProductInput): Promise<ProductView>"
      types:
        - "CreateProductInput = { id: string; name: string; unit: string; price: number; min_order_quantity?: number | string; description?: string; category?: string }"
      errors: ["VALIDATION_ERROR 400", "ORGANIZATION_NOT_ACTIVE 409", "FORBIDDEN 403", "NOT_FOUND 404"]
      dependencies: [express, zod]
    security:
      - "v5.0.0-8.2.1: manager online or owner, decided by the rules table."
      - "v5.0.0-15.3.3: strict schema; status and organization come from the server."
      - "v5.0.0-2.2.1: integer price and 3-decimal quantity checks before any database call."
    tests: |
      create | integration | AC-1, Product:required, C-13 | 201, ACTIVE
      limits | integration | AC-2, C-13 | each Examples row → status
      roles | integration | AC-3 | 403 and 201
      inactive organization | integration | AC-4 | 409
      repeat | integration | AC-5 | one row
      seller | security | AB-1, WSTG-ATHZ-03 | 403
      mass assignment | security | AB-2, CWE-915 | 400
      other business | security | AB-3, WSTG-ATHZ-04 | 404
    command: npx vitest run tests/integration/catalog/create-product.test.ts
    out_of_scope:
      - "OpenAPI registration of the catalog routes (CAT-006)."
  - id: CAT-005
    title: Manager edits and retires a product
    kind: feature
    size: M
    risk: medium
    depends_on: [CAT-004, CAT-003]
    read_first: [src/modules/catalog/catalog.service.ts, src/modules/catalog/catalog.routes.ts]
    design_refs: [catalogue/product]
    constraints: [C-13, Product.status:enum]
    asvs: [v5.0.0-8.2.1, v5.0.0-15.3.3, v5.0.0-8.2.2]
    story: As a manager, I want to change an article, including its price and its availability, so that my catalog stays right.
    context: |
      - Exists: `POST .../products` (CAT-004); rule `update` on Product (ACC-002).
      - Adds: `PATCH /api/v1/organizations/{organizationId}/products/{productId}` with any of `name, unit, price, min_order_quantity (null clears), description, category, status` (ACTIVE or INACTIVE); response 200 with the product view and `negotiated_prices_to_review` (the number of live negotiated prices of this product whose `set_at` is older than the new `price_updated_at`; 0 when the price did not change).
      - INACTIVE removes the article from sale; old orders keep their frozen lines. At least one field is required. Same limits as CAT-004.
    acceptance: |
      Scenario: AC-1 Change fields
        When a MANAGER patches name and category
        Then the response is 200 with the new values and price_updated_at unchanged
      Scenario: AC-2 Price change
        When the price goes from 15000 to 16000 and 3 customers have negotiated prices set before now
        Then price_updated_at is now and negotiated_prices_to_review is 3
      Scenario: AC-3 Retire and restore
        When the status is set INACTIVE, then ACTIVE
        Then both answers are 200 and the product follows
      Scenario Outline: AC-4 Refusals
        When the request has <problem>
        Then the response is <status>
        Examples:
          | problem                                   | status |
          | price 0                                   | 400    |
          | no field                                  | 400    |
          | status "DELETED"                          | 400    |
          | organization_id or price_updated_at sent  | 400    |
          | a product of another organization         | 404    |
          | a SELLER or DRIVER caller                 | 403    |
    abuse: |
      Scenario: AB-1 Seller changes a price (vertical)
        When a SELLER patches price
        Then the response is 403 and the price is unchanged
      Scenario: AB-2 Editing another business's product (horizontal)
        When a member of A patches a product of B under A's path
        Then the response is 404 and B's product is unchanged
    implementation:
      create: [tests/integration/catalog/edit-product.test.ts]
