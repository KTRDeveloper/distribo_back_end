  - id: DLV-007
    title: "\"Commande livrée\": deliver a whole order and record the sale and the payment"
    kind: feature
    size: M
    risk: high
    depends_on: [DLV-005, FIN-004, ACC-003, ACC-007, NTF-002]
    read_first: [src/modules/finance/ledger.service.ts, src/modules/order/order.state.ts]
    design_refs: [commandes-et-livraisons/order/clore-une-commande-commande-livree, relations-commerciales/customerrelationship/plafond-de-credit-une-seule-regle]
    constraints: [CM-13, CM-15]
    asvs: [v5.0.0-2.2.1, v5.0.0-2.3.3, v5.0.0-2.3.4, v5.0.0-8.2.1]
    story: As a driver, I want one gesture that closes an order and records what I collected so that the sale and the payment are exact.
    context: |
      - Exists: `transitionOrder`, `appendLedgerEntry`, `lineAmountOf`, `orderTotal`; rules `deliver` on Order and create LedgerEntry SALE or PAYMENT (ACC-003, ACC-004); `idempotent()`.
      - Adds: `POST /api/v1/organizations/{organizationId}/orders/{orderId}/deliver` with `{ id, collected_amount, mode?, sale_entry_id, payment_entry_id? }`; response 200 `{ order, sale, payment }`.
      - One transaction with the relationship row locked: a DRIVER needs the order IN_DELIVERY with a delivery of theirs (which gets `arrived_at`); a SELLER or above may deliver a CONFIRMED order in the shop. Every line gets `delivered_quantity` = `quantity`; amounts and total are recomputed by the server; the order becomes DELIVERED with `delivered_at` now and `delivered_by_id` the caller.
      - A SALE entry of `Order.total_amount` (the client never sends it) and, when `collected_amount` is above 0, a PAYMENT entry of `collected_amount` (arrears allowed) with `mode`; both carry `order_id` and the caller as recorder. The customer is notified `order.status_changed`.
      - Credit rule: `balance + total − collected` must not exceed `credit_limit` (null means no limit); otherwise 409 `CREDIT_INSUFFICIENT` with `details.min_collect` = the smallest allowed collection, and nothing is written.
    acceptance: |
      Scenario: AC-1 Delivered and paid in full
        Given an IN_DELIVERY order of 30000 and a customer with balance 0
        When the assigned driver delivers with collected_amount 30000 in cash
        Then the order is DELIVERED, a SALE of 30000 and a PAYMENT of 30000 exist with the order id, and the balance is 0
      Scenario Outline: AC-2 Credit rule
        Given limit 50000 and balance 40000 and an order of 30000
        When collected_amount is <collected>
        Then the response is <status>
        Examples:
          | collected | status                                         |
          | 20000     | 200 (SALE 30000, PAYMENT 20000, balance 50000) |
          | 19999     | 409 CREDIT_INSUFFICIENT with min_collect 20000 |
          | 0         | 409 CREDIT_INSUFFICIENT with min_collect 20000 |
          | 30000     | 200                                            |
      Scenario Outline: AC-3 Refusals
        When the request has <problem>
        Then the response is <status> and nothing is written
        Examples:
          | problem                                    | status                 |
          | a DRIVER on an order of another driver     | 404 NOT_FOUND          |
          | a DRIVER on a CONFIRMED order              | 409 INVALID_TRANSITION |
          | a DELIVERED or CANCELLED order             | 409 INVALID_TRANSITION |
          | collected_amount above 0 without a mode    | 400 VALIDATION_ERROR   |
    abuse: |
      Scenario: AB-1 A lower sale than the order (tampering)
        When a phone sends a sale amount of 3000 for an order of 30000
        Then the SALE is 30000 or the request is refused
      Scenario: AB-2 Driver refunds through this route (elevation)
        When a DRIVER sends a kind or a negative amount
        Then the response is 400
      Scenario: AB-3 Credit exceeded by a race (tampering)
        When two deliveries for one customer run at once with a total above the limit
        Then the second is refused because the relationship row is locked
    implementation:
      create: [tests/integration/delivery/deliver.test.ts]
      modify: [src/modules/delivery/delivery.routes.ts, src/modules/delivery/delivery.schemas.ts, src/modules/delivery/delivery.service.ts, src/modules/delivery/delivery.repository.ts]
      pattern: src/modules/delivery/delivery.routes.ts
      signatures:
        - "deliverOrder(actor: Actor, orderId: string, input: DeliverInput, options?: { viaSync?: boolean }): Promise<DeliverResult>"
      types:
        - "DeliverInput = { id: string; collected_amount: number; mode?: 'CASH' | 'MOBILE_MONEY'; sale_entry_id: string; payment_entry_id?: string }"
      errors: ["CREDIT_INSUFFICIENT 409", "INVALID_TRANSITION 409", "NOT_FOUND 404", "VALIDATION_ERROR 400", "FORBIDDEN 403"]
      dependencies: [express, zod, "@prisma/client"]
    security:
      - "v5.0.0-2.2.1: the sale amount is taken from the order on the server."
      - "v5.0.0-2.3.3: order, lines, entries, caches and delivery are one transaction."
      - "v5.0.0-2.3.4: the relationship row is locked before the credit check."
    tests: |
      paid in full | integration | AC-1, CM-13 | statuses and entries
      credit rule | integration | AC-2, CM-15 | each Examples row → status and min_collect
      refusals | integration | AC-3 | each Examples row → status
      lower sale | security | AB-1, WSTG-BUSL-02, CWE-345 | SALE 30000
      driver refund | security | AB-2, WSTG-ATHZ-03 | 400
      race | security | AB-3, WSTG-BUSL-04, CWE-362 | second refused
    command: npx vitest run tests/integration/delivery/deliver.test.ts
    out_of_scope:
      - "Partial deliveries (DLV-008). Counter sales (DLV-009)."
  - id: DLV-008
    title: Deliver only part of an order and settle the rest
    kind: change
    size: M
    risk: high
    depends_on: [DLV-007]
    amends: [DLV-007]
    read_first: [src/modules/delivery/delivery.service.ts, src/modules/order/order.calculations.ts]
    design_refs: [commandes-et-livraisons/order/le-reste-d-une-livraison-partielle, commandes-et-livraisons/orderline]
    constraints: [CM-22]
    asvs: [v5.0.0-2.2.1, v5.0.0-2.3.3, v5.0.0-15.3.3]
    story: As a driver, I want to record that only part of an order was delivered, and decide what happens to the rest, so that the customer pays for what they received.
    context: |
      - Exists: `deliverOrder` and its route (DLV-007); `lineAmountOf`, `orderTotal`.
      - Changes: the deliver body accepts `lines: [{ line_id, delivered_quantity }]` (a decimal with at most 3 places, from 0 up to the ordered quantity; unlisted lines are fully delivered) and `rest: 'LATER' | 'ABANDON'`, required when any line is short. At least one line must have a delivered quantity above 0 (else 400).
      - The sale and the credit rule use the recomputed total on delivered quantities. With `LATER` the server also creates, in the same transaction, a CONFIRMED order linked by `parent_order_id`, same relationship and delivery address, `delivery_cost` 0, with one line per short line: remaining quantity, same `label_applied`, `reference_price`, `unit_price_applied` and price author as the original line, amount rounded as usual. With `ABANDON` nothing is created.
    acceptance: |
      Scenario: AC-1 Partial with rest later
        Given a line of 10 sacks at 3000 and the driver delivers 8, rest LATER, collected 24000
        Then the line's delivered_quantity is 8 and its amount 24000, the SALE is 24000, and a CONFIRMED child order of 2 sacks at 3000 with parent_order_id exists
      Scenario: AC-2 Abandon
        When the rest is ABANDON
        Then no child order exists and the original stays DELIVERED for what was delivered
      Scenario Outline: AC-3 Refusals
        When the request has <problem>
        Then the response is <status> and nothing is written
        Examples:
          | problem                                        | status               |
          | a short line without `rest`                    | 400 VALIDATION_ERROR |
          | delivered_quantity above the ordered one       | 400 VALIDATION_ERROR |
          | every delivered_quantity 0                     | 400 VALIDATION_ERROR |
          | delivered_quantity with 4 decimals             | 400 VALIDATION_ERROR |
          | a line of another order                        | 404 NOT_FOUND        |
      Scenario: AC-4 Credit uses the delivered total
        When the limit would be exceeded only by the undelivered part
        Then the delivery is accepted
    abuse: |
      Scenario: AB-1 Hiding goods by abandoning the rest (repudiation)
        When a non-owner abandons a rest
        Then the delivered order keeps its short lines, which the owner's exceptions show (DLV-012)
      Scenario: AB-2 Client-computed amounts (tampering)
        When the body carries amount or total_amount
        Then the response is 400
    implementation:
      create: [tests/integration/delivery/partial-delivery.test.ts]
      modify: [src/modules/delivery/delivery.schemas.ts, src/modules/delivery/delivery.service.ts, src/modules/delivery/delivery.repository.ts]
      pattern: src/modules/delivery/delivery.service.ts
      signatures: []
      types:
        - "DeliverInput = DeliverInput & { lines?: Array<{ line_id: string; delivered_quantity: string | number }>; rest?: 'LATER' | 'ABANDON' }"
      errors: ["VALIDATION_ERROR 400", "NOT_FOUND 404"]
      dependencies: [zod, "@prisma/client"]
    security:
      - "v5.0.0-2.2.1: quantities parsed with `parseQuantity`, amounts recomputed."
      - "v5.0.0-2.3.3: lines, sale, payment, rest order and caches are one transaction."
    tests: |
      partial and later | integration | AC-1, CM-22 | line, sale, child order
      abandon | integration | AC-2 | no child
      refusals | integration | AC-3 | each Examples row → status
      credit on delivered total | integration | AC-4 | accepted
      abandoned rest | security | AB-1, CWE-778 | short line remains visible
      client amounts | security | AB-2, CWE-915 | 400
    command: npx vitest run tests/integration/delivery/partial-delivery.test.ts tests/integration/delivery/deliver.test.ts
    out_of_scope:
      - "Showing abandoned rests to the owner (DLV-012)."
    tests_to_update: []
  - id: DLV-009
    title: Seller validates a counter sale
    kind: feature
    size: M
    risk: high
    depends_on: [DLV-007, ORD-013, REL-011, ORD-009]
    read_first: [src/modules/delivery/delivery.service.ts, src/modules/order/order.service.ts]
    design_refs: [commandes-et-livraisons/order/autres-regles, relations-commerciales/customerrelationship/comptoirs]
    constraints: [C-26, CM-13]
    asvs: [v5.0.0-2.2.1, v5.0.0-2.3.3, v5.0.0-8.2.1]
    story: As a seller, I want one gesture to sell at the counter so that the sale is created, delivered and paid at once.
    context: |
      - Exists: `enterOrder` line rules (ORD-013), `deliverOrder` core (DLV-007); rule create Order and `deliver` for SELLER (ACC-003); counters (REL-006, REL-011); `idempotent()`.
      - Adds: `POST /api/v1/organizations/{organizationId}/counters/{relationshipId}/sales` with `{ id, sale_entry_id, payment_entry_id, lines: [{ id, product_id, quantity, unit_price_applied? }], collected_amount, mode }`; response 201 `{ order, sale, payment }`.
      - One transaction creates the order (CONFIRMED, placed by SUPPLIER, prices as ORD-013) and delivers it at once (DELIVERED, delivered by the caller, `delivery_address_applied` empty, no delivery row), writing the SALE and the PAYMENT of the same amount. `collected_amount` must equal the order total exactly (409 `COUNTER_PAYMENT_INCOMPLETE` otherwise): a counter has no credit and no arrears.
      - The relationship must be a counter of the organization (else 404); the organization ACTIVE.
    acceptance: |
      Scenario: AC-1 Counter sale
        When a SELLER sells 2 articles for a total of 9000 and collects 9000 in cash
        Then the order is DELIVERED, a SALE and a PAYMENT of 9000 exist and the counter's balance is 0
      Scenario Outline: AC-2 Payment must match
        When collected_amount is <collected> for a total of 9000
        Then the response is <status>
        Examples:
          | collected | status                             |
          | 9000      | 201                                |
          | 8999      | 409 COUNTER_PAYMENT_INCOMPLETE     |
          | 9001      | 409 COUNTER_PAYMENT_INCOMPLETE     |
          | 0         | 409 COUNTER_PAYMENT_INCOMPLETE     |
      Scenario: AC-3 Not a counter
        When the relationship has a customer
        Then the response is 404 `NOT_FOUND`
      Scenario: AC-4 Atomic and repeat
        When any step fails, or the same id is posted twice
        Then nothing is stored, or the second answer equals the first
    abuse: |
      Scenario: AB-1 Anonymous credit (business logic)
        When a partial payment is sent on a counter
        Then the response is 409 and no order or entry exists
      Scenario: AB-2 Another business's counter (horizontal)
        When a member of A posts to a counter of B
        Then the response is 404
    implementation:
      create: [tests/integration/delivery/counter-sale.test.ts]
      modify: [src/modules/delivery/delivery.routes.ts, src/modules/delivery/delivery.schemas.ts, src/modules/delivery/delivery.service.ts, src/modules/delivery/delivery.repository.ts]
      pattern: src/modules/delivery/delivery.routes.ts
      signatures:
        - "sellAtCounter(actor: Actor, relationshipId: string, input: CounterSaleInput): Promise<{ order: SupplierOrderView; sale: LedgerEntryView; payment: LedgerEntryView }>"
      types: []
      errors: ["COUNTER_PAYMENT_INCOMPLETE 409", "NOT_FOUND 404", "VALIDATION_ERROR 400", "FORBIDDEN 403"]
      dependencies: [express, zod]
    security:
      - "v5.0.0-2.2.1: totals and the sale amount are computed on the server."
      - "v5.0.0-2.3.3: order, delivery state, entries and caches are one transaction."
    tests: |
      counter sale | integration | AC-1, CM-13 | order and entries
      payment match | integration | AC-2, C-26 | each Examples row → status
      not a counter | integration | AC-3 | 404
      atomic and repeat | integration | AC-4, CWE-362 | as described
      anonymous credit | security | AB-1, WSTG-BUSL-01 | 409, nothing stored
      other business | security | AB-2, WSTG-ATHZ-04 | 404
    command: npx vitest run tests/integration/delivery/counter-sale.test.ts
    out_of_scope:
      - "Selling to a named customer in the shop: enter the order then deliver it (ORD-013, DLV-007)."
  - id: DLV-010
