kind: module
module: delivery
prefix: DLV
title: Delivery
responsibility: Owns delivery attempts by drivers and the single "Commande livrée" gesture that closes an order, records the sale and the payment, checks the credit limit and handles partial deliveries and counter sales.
entities: [Delivery]
depends_on: [foundation, person, notification, access, organization, relationship, order, finance]
asvs_level: L2
asvs_rationale: Delivery moves goods and cash; the server fixes the sale amount, checks credit and keeps the driver's writes to the two entries born of delivery.
classification:
  - "Delivery.failure_reason | internal | supplier team only"
  - "Driver views | confidential | a driver sees the available credit of a customer, never balance or limit"
threats:
  - "T1 | T | A phone sends a lower sale amount than the order total | the server takes the amount from the order | DLV-007 AB-1"
  - "T2 | E | A driver refunds, cancels or grants credit | a driver's writes are limited to the sale and payment of a delivery | DLV-007 AB-2"
  - "T3 | I | A driver learns a customer's debt | driver views carry only the available credit | DLV-003 AB-1"
  - "T4 | T | Two drivers depart with one order | one in-progress delivery per order | DLV-005 AB-1"
  - "T5 | T | Credit is exceeded by a delivery | the credit rule is checked in the same transaction under a row lock | DLV-007 AB-3"
  - "T6 | R | Goods leave without the owner knowing | abandoned rests and unsettled deliveries are shown to the owner | DLV-011 AB-1, DLV-012 AB-1"
constraints:
  C-21: "A delivery's `assigned_to_id` is an ACTIVE collaborator of the supplier, driver or above; `arrived_at` and `failed_at` are never both set; `failure_reason` is set if and only if `failed_at` is set; at most one delivery in progress (neither arrived nor failed) per order."
  C-22: "A delivery not yet departed is removed when its order is cancelled or delivered without it; with crossed departures the server keeps the first and stores the other closed."
  C-26: "A sale on a counter is paid in full: no credit for anonymous customers."
  C-24: "A SALE ledger entry has `order_id` set and `amount` equal to `Order.total_amount` (server-fixed), and there is at most one non-reversed sale per order; the payment born of 'Commande livrée' also carries `order_id`."
  C-04: "Author columns (`*_by_id`, `assigned_to_id`, `reporter_id`, `person_id` of an administrator, `to_person_id`) refer to a registered person; `resolved_by_id` and `administrator_id` refer to an Administrator."
  C-38: "Every online route that changes data carries the client-created id; an id already received changes nothing and returns the first result."
  C-19: "`delivered_at` and `delivered_by_id` are set if and only if `status` is DELIVERED; every line then has `delivered_quantity`; `total_amount` equals the sum of line amounts plus `delivery_cost`."
  CM-13: "The amount of a sale is always Order.total_amount computed by the server on delivered quantities; the amount sent by the phone is ignored."
  CM-15: "At delivery or sale, the unpaid part must fit the available credit: credit_limit minus the balance before the gesture, never below 0 (null limit = no limit). The minimum to collect is the delivered total minus that credit, never below 0, so a debt already above the limit never blocks a sale paid in full; example: limit 50 000, balance 40 000, order 30 000 requires collecting at least 20 000."
  CM-22: "Partial delivery: 'later' creates a CONFIRMED order for the remainder at the original order's prices, linked by parent_order_id; 'abandon' closes the order on what was delivered; abandon by a non-owner joins the owner's exceptions."
  CM-23: "Crossed departures: the server keeps the first delivery and stores the other closed with sync_issue 'Livraison déjà prise par <name>'; if the second one delivered, the delivery wins and the other is closed."
  CM-12: "Allowed transitions only: PENDING to CONFIRMED or CANCELLED; CONFIRMED to IN_DELIVERY, DELIVERED or CANCELLED; IN_DELIVERY to DELIVERED or CONFIRMED (failed attempt); DELIVERED wins over CANCELLED; DELIVERED and CANCELLED are frozen except supplier_note."
  C-01: "Identifiers use `uuid` columns (UUIDv7), amounts `bigint`, quantities `numeric(12,3)`, timestamps `timestamptz`."
  C-35: "Synchronized tables carry `server_updated_at`, set by the server on every write, and `deleted_at` for deletion; unique constraints ignore deleted rows."
contracts:
  provides:
    - name: DeliverOrder
      file: src/modules/delivery/delivery.service.ts
      story: DLV-007
      items:
        - "deliverOrder(actor: Actor, orderId: string, input: DeliverInput, options?: { viaSync?: boolean }): Promise<DeliverResult> — the one closing gesture: order DELIVERED, SALE and optional PAYMENT entries, credit rule, partial rest"
        - "deleteUnstartedDeliveries(tx, orderId: string): Promise<number> — removes deliveries not yet departed"
      used_by: [sync]
    - name: AbandonedRests
      file: src/modules/delivery/delivery.repository.ts
      story: DLV-012
      items:
        - "findAbandonedRests(tx, organizationId: string, period: { from: Date; toExclusive: Date }, excludePersonId: string): Promise<Map<string, { count: number; amount: bigint }>> — per deliverer, the lines of DELIVERED orders without a child order whose delivered quantity is below the ordered one, valued at the applied price"
      used_by: [finance]
    - name: OpenDeliveries
      file: src/modules/delivery/delivery.repository.ts
      story: DLV-015
      items:
        - "findDriversWithOpenDeliveries(tx, organizationId: string, personIds: string[]): Promise<Set<string>> — of those people, the ones assigned a delivery of the organization's orders that has left and neither arrived nor failed"
      used_by: [billing]
  consumes:
    - "order: transitionOrder, lineAmountOf, orderTotal, projectOrderForSupplier (docs/stories/modules/order/contracts.md)"
    - "finance: appendLedgerEntry (docs/stories/modules/finance/contracts.md)"
    - "relationship: projectForDriver, visibleRelationsWhere, addToBalance (docs/stories/modules/relationship/contracts.md)"
    - "organization: loadActor (docs/stories/modules/organization/contracts.md)"
    - "access: requireAbility, abilityFor, idempotent (docs/stories/modules/access/contracts.md)"
stories:
  - id: DLV-001
    title: Deliveries table
    kind: technical
    size: S
    risk: medium
    depends_on: [ORD-001, PER-008, FND-002]
    read_first: [prisma/schema.prisma, tests/integration/order/order-table.test.ts]
    design_refs: [commandes-et-livraisons/delivery, contraintes-a-poser-au-niveau-base-de]
    constraints: [Delivery:required, Delivery:fk, C-01, C-35, C-04]
    asvs: [v5.0.0-2.2.3]
    fields: ["Delivery.{order_id,assigned_to_id,departed_at,arrived_at,failed_at,failure_reason,sync_issue}"]
    story: "Technical story: create the deliveries table, one row per attempt, so that transport of goods can be recorded."
    context: |
      - Exists: `orders`, `require_registered_person()`, `set_server_updated_at()`.
      - Adds: table `deliveries` with `server_updated_at` and `deleted_at`, foreign keys, indexes on `order_id` and (`assigned_to_id`, `departed_at`), triggers `require_registered_person('assigned_to_id')` and `set_server_updated_at()`.
      - Rules follow in DLV-002.
    acceptance: |
      Scenario: AC-1 Row
        When a delivery is inserted for an order and a registered driver
        Then the row is stored with `departed_at`, `arrived_at` and `failed_at` empty and `server_updated_at` set
      Scenario Outline: AC-2 Keys and author
        When a row has <values>
        Then the insert <result>
        Examples:
          | values                           | result          |
          | an unknown order                 | rejects (23503) |
          | assigned_to_id of a guest        | rejects (23514) |
          | assigned_to_id null              | rejects (23502) |
    implementation:
      create: [prisma/migrations/<timestamp>_dlv_001_deliveries/migration.sql, tests/integration/delivery/delivery-table.test.ts]
      modify: [prisma/schema.prisma]
      pattern: tests/integration/order/order-table.test.ts
      signatures: []
      types: []
      errors: []
      dependencies: [prisma, "@prisma/client"]
    security:
      - "v5.0.0-2.2.3: keys and author are checked by the database."
    tests: |
      row | integration | AC-1, C-01, C-35 | stored; column types; server time
      keys and author | integration | AC-2, Delivery:required, Delivery:fk, C-04 | each Examples row → rejected
    command: npx vitest run tests/integration/delivery/delivery-table.test.ts
    out_of_scope:
      - "State rules (DLV-002)."
  - id: DLV-002
    title: Delivery state rules in the database
    kind: technical
    size: S
    risk: high
    depends_on: [DLV-001, ORG-003, ORD-003]
    read_first: [prisma/schema.prisma, tests/integration/delivery/delivery-table.test.ts]
    design_refs: [commandes-et-livraisons/delivery, contraintes-a-poser-au-niveau-base-de]
    constraints: [C-21]
    asvs: [v5.0.0-2.3.1, v5.0.0-2.2.3]
    story: "Technical story: enforce the delivery states, the driver's membership and one delivery in progress per order in the database."
    context: |
      - Exists: `deliveries` (DLV-001), `collaborations`.
      - Adds: one migration. CHECKs: `arrived_at` and `failed_at` are not both set; `failure_reason` is set exactly when `failed_at` is set. Partial unique index on `order_id` where `arrived_at` and `failed_at` are null and `deleted_at` is null. A BEFORE INSERT trigger requires an ACTIVE collaboration of `assigned_to_id` in the supplier organization of the order's relationship (any role is driver or above).
    acceptance: |
      Scenario Outline: AC-1 State rules
        When a delivery row has <values>
        Then the statement <result>
        Examples:
          | values                                                  | result          |
          | arrived_at and failed_at both set                       | rejects (23514) |
          | failed_at set, failure_reason "client absent"           | accepts         |
          | failed_at set, failure_reason empty                     | rejects (23514) |
          | failure_reason set, failed_at empty                     | rejects (23514) |
          | arrived_at set only                                     | accepts         |
      Scenario Outline: AC-2 One in progress
        When a second delivery is inserted for an order whose first delivery is <first>
        Then the insert <result>
        Examples:
          | first                        | result          |
          | in progress                  | rejects (23505) |
          | failed                       | accepts         |
          | arrived                      | accepts         |
          | deleted                      | accepts         |
      Scenario Outline: AC-3 Driver membership
        When the assigned person is <person>
        Then the insert <result>
        Examples:
          | person                                        | result          |
          | an ACTIVE DRIVER of the supplier              | accepts         |
          | an ACTIVE SELLER of the supplier              | accepts         |
          | a REVOKED or INVITED collaborator             | rejects (23514) |
          | an ACTIVE collaborator of another business    | rejects (23514) |
    abuse: |
      Scenario: AB-1 Two drivers on one order by a crafted write (tampering)
        When code inserts a second in-progress delivery
        Then PostgreSQL refuses it
    implementation:
      create: [prisma/migrations/<timestamp>_dlv_002_delivery_rules/migration.sql, tests/integration/delivery/delivery-rules.test.ts]
      modify: []
      pattern: tests/integration/order/creation-guard.test.ts
      signatures: []
      types: []
      errors: []
      dependencies: [prisma, "@prisma/client"]
    security:
      - "v5.0.0-2.3.1: one delivery in progress is a unique index."
      - "v5.0.0-2.2.3: membership is checked in the database."
    tests: |
      state rules | integration | AC-1, C-21 | each Examples row → accepted or 23514
      one in progress | integration | AC-2, C-21 | each Examples row → accepted or 23505
      membership | integration | AC-3, C-21 | each Examples row → accepted or 23514
      second delivery | security | AB-1, CWE-362 | 23505
    command: npx vitest run tests/integration/delivery/delivery-rules.test.ts
    out_of_scope:
      - "Routes (DLV-003 onward)."
  - id: DLV-003
    title: Driver sees the orders to deliver
    kind: feature
    size: M
    risk: high
    depends_on: [DLV-002, REL-005, ORD-007]
    read_first: [src/modules/relationship/relationship.visibility.ts, src/modules/order/order.views.ts]
    design_refs: [commandes-et-livraisons/delivery, relations-commerciales/customerrelationship/plafond-de-credit-une-seule-regle]
    constraints: []
    asvs: [v5.0.0-8.2.2, v5.0.0-8.2.3, v5.0.0-15.3.1]
    story: As a driver, I want to see the orders to deliver and my own deliveries so that I know what to take.
    context: |
      - Exists: `projectForDriver` (REL-005); orders (ORD module); `loadActor`.
      - Adds: `GET /api/v1/organizations/{organizationId}/deliveries/to-deliver` (DRIVER and above): CONFIRMED orders of the organization with a `delivery_address_applied`, not deleted, newest first, paginated; item `{ order_id, delivery_address, desired_delivery_date, customer_note, total_amount, lines: [{ label, quantity, unit_price_applied, amount }], customer: DriverRelationshipView }`.
      - `GET /api/v1/organizations/{organizationId}/deliveries/mine?status=in_progress|done|failed` (DRIVER and above): the caller's own deliveries with the same order fields, `departed_at`, `arrived_at`, `failed_at`, `failure_reason`.
      - The customer part is `projectForDriver`: name, `available_credit`; never balance, limit, notes or the ledger. Adds `delivery.openapi.ts` documenting these routes and later delivery routes; `delivery.routes.ts` imports it.
    acceptance: |
      Scenario: AC-1 To deliver
        Given 2 CONFIRMED orders with an address, 1 without, 1 PENDING and 1 DELIVERED
        When a DRIVER lists to-deliver
        Then only the 2 orders with an address are returned
      Scenario: AC-2 Available credit only
        Given a customer with limit 50000 and balance 40000
        Then the driver sees available_credit 10000 and no balance, limit or notes
      Scenario: AC-3 Mine
        When a driver lists their deliveries
        Then only rows assigned to them appear, filtered by status
      Scenario: AC-4 All drivers see the pool
        Then every ACTIVE driver of the organization sees the same to-deliver list
      Scenario: AC-5 Pagination
        When limit 1 is used with the cursor
        Then pages follow without repeats
    abuse: |
      Scenario: AB-1 Debt of a customer (information disclosure)
        When a driver reads any of these responses
        Then no balance, credit_limit, supplier_notes or ledger data appears
      Scenario: AB-2 Another business's orders (horizontal)
        When a member of A requests business B
        Then the response is 404
    implementation:
      create: [src/modules/delivery/delivery.routes.ts, src/modules/delivery/delivery.service.ts, src/modules/delivery/delivery.openapi.ts, src/modules/delivery/delivery.repository.ts, tests/integration/delivery/driver-lists.test.ts]
      modify: [src/app.ts]
      pattern: src/modules/organization/organization.routes.ts
      signatures:
        - "listToDeliver(actor: Actor, query: PageQuery): Promise<{ items: ToDeliverItem[]; next_cursor: string | null }>"
        - "listMyDeliveries(actor: Actor, query: MineQuery): Promise<{ items: MyDeliveryItem[]; next_cursor: string | null }>"
      types: []
      errors: ["NOT_FOUND 404", "VALIDATION_ERROR 400"]
      dependencies: [express, zod, "@asteasolutions/zod-to-openapi"]
    security:
      - "v5.0.0-8.2.2: queries start from the actor's organization."
      - "v5.0.0-8.2.3: the customer part comes only from `projectForDriver`."
      - "v5.0.0-15.3.1: explicit fields."
    tests: |
      to deliver | integration | AC-1 | two orders
      credit only | integration | AC-2 | 10000, no balance
      mine | integration | AC-3 | own rows and filter
      pool | integration | AC-4 | same list for two drivers
      paging | integration | AC-5 | no repeats
      debt hidden | security | AB-1, CWE-200 | fields absent
      other business | security | AB-2, WSTG-ATHZ-04 | 404
    command: npx vitest run tests/integration/delivery/driver-lists.test.ts
    out_of_scope:
      - "Assigning, departing and delivering (DLV-004 onward)."
  - id: DLV-004
    title: Manager assigns an order to a driver
    kind: feature
    size: S
    risk: medium
    depends_on: [DLV-003, ACC-003, ACC-007, NTF-002]
    read_first: [src/modules/delivery/delivery.service.ts, src/modules/delivery/delivery.routes.ts]
    design_refs: [commandes-et-livraisons/delivery]
    constraints: [C-21]
    asvs: [v5.0.0-8.2.1, v5.0.0-2.3.1]
    story: As a manager, I want to assign an order to a driver so that they know it is theirs to deliver.
    context: |
      - Exists: rule `assign` on Delivery for MANAGER online (ACC-003); `deliveries` (DLV-001, DLV-002); `notify`.
      - Adds: `POST /api/v1/organizations/{organizationId}/orders/{orderId}/assign` with `{ id, driver_person_id }`; response 201 with the delivery `{ id, order_id, assigned_to_id, departed_at }`.
      - The order must be CONFIRMED with a delivery address; the driver an ACTIVE collaborator. A not-yet-departed delivery of the order is reassigned (same row, new driver); a delivery already departed answers 409 `DELIVERY_IN_PROGRESS`. The driver is notified `delivery.assigned`.
    acceptance: |
      Scenario: AC-1 Assign
        When a MANAGER assigns a CONFIRMED order with an address to a driver
        Then a delivery exists for that driver with departed_at empty and the driver is notified
      Scenario: AC-2 Reassign
        When the manager assigns the same order to another driver before departure
        Then the same delivery row belongs to the new driver
      Scenario Outline: AC-3 Refusals
        When the request has <problem>
        Then the response is <status> and nothing changes
        Examples:
          | problem                                   | status                     |
          | a delivery already departed               | 409 DELIVERY_IN_PROGRESS   |
          | an order without a delivery address       | 400 VALIDATION_ERROR       |
          | an order not CONFIRMED                    | 409 INVALID_TRANSITION     |
          | a driver who is not an ACTIVE collaborator| 404 NOT_FOUND              |
          | a SELLER or DRIVER caller                 | 403 FORBIDDEN              |
      Scenario: AC-4 Repeat
        When the same id is posted twice
        Then one delivery exists
    abuse: |
      Scenario: AB-1 Driver assigns orders to themselves (vertical)
        When a DRIVER posts an assignment
        Then the response is 403 and nothing is stored
    implementation:
      create: [src/modules/delivery/delivery.schemas.ts, tests/integration/delivery/assign.test.ts]
      modify: [src/modules/delivery/delivery.routes.ts, src/modules/delivery/delivery.service.ts, src/modules/delivery/delivery.repository.ts]
      pattern: src/modules/delivery/delivery.routes.ts
      signatures:
        - "assignDelivery(actor: Actor, orderId: string, input: { id: string; driver_person_id: string }): Promise<DeliveryView>"
      types: []
      errors: ["DELIVERY_IN_PROGRESS 409", "INVALID_TRANSITION 409", "NOT_FOUND 404", "FORBIDDEN 403", "VALIDATION_ERROR 400"]
      dependencies: [express, zod]
    security:
      - "v5.0.0-8.2.1: manager online."
      - "v5.0.0-2.3.1: departed deliveries are never reassigned."
    tests: |
      assign | integration | AC-1, C-21 | delivery and notification
      reassign | integration | AC-2 | same row
      refusals | integration | AC-3 | each Examples row → status
      repeat | integration | AC-4 | one delivery
      driver assigns | security | AB-1, WSTG-ATHZ-03 | 403
    command: npx vitest run tests/integration/delivery/assign.test.ts
    out_of_scope:
      - "Departure (DLV-005)."
  - id: DLV-005
    title: Driver departs with an order
    kind: feature
    size: M
    risk: high
    depends_on: [DLV-004, ORD-008]
    read_first: [src/modules/order/order.state.ts, src/modules/delivery/delivery.service.ts]
    design_refs: [commandes-et-livraisons/delivery]
    constraints: [C-21, CM-12]
    asvs: [v5.0.0-8.2.1, v5.0.0-2.3.1, v5.0.0-2.3.4]
    story: As a driver, I want to leave with an order so that it is marked in delivery and nobody else takes it.
    context: |
      - Exists: `transitionOrder` (ORD-008); rule `depart` on Order for DRIVER with status CONFIRMED (ACC-003); `assignDelivery`; `notify`; `idempotent()`.
      - Adds: `POST /api/v1/organizations/{organizationId}/orders/{orderId}/depart` with `{ id }`; response 200 `{ delivery, order_status: 'IN_DELIVERY' }`.
      - One transaction: the order must be CONFIRMED with a delivery address; if a not-yet-departed delivery exists it must be assigned to the caller or the caller must be a MANAGER or OWNER (else 409 `ASSIGNED_TO_OTHER`); otherwise a delivery is created for the caller; `departed_at` = now; the order becomes IN_DELIVERY; the customer is notified `order.status_changed`.
      - A live delivery in progress of another driver answers 409 `DELIVERY_IN_PROGRESS`.
    acceptance: |
      Scenario: AC-1 Depart with an unassigned order
        When a DRIVER departs with a CONFIRMED order with an address
        Then a delivery for them with departed_at exists and the order is IN_DELIVERY
      Scenario: AC-2 Depart with an assigned order
        Given the order was assigned to the caller
        Then the same delivery row gets departed_at
      Scenario Outline: AC-3 Refusals
        When the request has <problem>
        Then the response is <status> and nothing changes
        Examples:
          | problem                                        | status                     |
          | an order assigned to another driver            | 409 ASSIGNED_TO_OTHER      |
          | an order already IN_DELIVERY                   | 409 DELIVERY_IN_PROGRESS   |
          | a PENDING, DELIVERED or CANCELLED order        | 409 INVALID_TRANSITION     |
          | an order without an address                    | 400 VALIDATION_ERROR       |
      Scenario: AC-4 Two drivers at once
        When two drivers depart with the same order simultaneously
        Then exactly one succeeds
      Scenario: AC-5 Repeat
        When the same id is posted twice
        Then one delivery exists
    abuse: |
      Scenario: AB-1 Double departure (tampering)
        When a second driver departs with an order already on the road
        Then the response is 409 and the first delivery is unchanged
      Scenario: AB-2 Another business's order (horizontal)
        When a member of A departs with an order of B
        Then the response is 404
    implementation:
      create: [tests/integration/delivery/depart.test.ts]
      modify: [src/modules/delivery/delivery.routes.ts, src/modules/delivery/delivery.schemas.ts, src/modules/delivery/delivery.service.ts, src/modules/delivery/delivery.repository.ts]
      pattern: src/modules/delivery/delivery.routes.ts
      signatures:
        - "departWithOrder(actor: Actor, orderId: string, input: { id: string }): Promise<{ delivery: DeliveryView; order_status: 'IN_DELIVERY' }>"
      types: []
      errors: ["ASSIGNED_TO_OTHER 409", "DELIVERY_IN_PROGRESS 409", "INVALID_TRANSITION 409", "NOT_FOUND 404", "VALIDATION_ERROR 400"]
      dependencies: [express, zod]
    security:
      - "v5.0.0-8.2.1: driver and above, with the status condition."
      - "v5.0.0-2.3.4: the unique in-progress index and the conditional order update settle races."
    tests: |
      unassigned | integration | AC-1, CM-12 | delivery and IN_DELIVERY
      assigned | integration | AC-2 | same row
      refusals | integration | AC-3 | each Examples row → status
      simultaneous | integration | AC-4, C-21, CWE-362 | one success
      repeat | integration | AC-5 | one delivery
      double departure | security | AB-1, WSTG-BUSL-06 | 409
      other business | security | AB-2, WSTG-ATHZ-04 | 404
    command: npx vitest run tests/integration/delivery/depart.test.ts
    out_of_scope:
      - "Crossed departures made offline (SYNC module)."
  - id: DLV-006
    title: Driver reports a failed delivery
    kind: feature
    size: S
    risk: medium
    depends_on: [DLV-005]
    read_first: [src/modules/delivery/delivery.service.ts, src/modules/order/order.state.ts]
    design_refs: [commandes-et-livraisons/delivery]
    constraints: [C-21, CM-12]
    asvs: [v5.0.0-8.2.1, v5.0.0-8.2.2, v5.0.0-2.3.1]
    story: As a driver, I want to report a failed delivery with a reason so that the order goes back to the orders to deliver.
    context: |
      - Exists: departed deliveries (DLV-005); rule `fail_delivery` for DRIVER (ACC-003).
      - Adds: `POST /api/v1/organizations/{organizationId}/deliveries/{deliveryId}/fail` with `{ id, reason }` (1 to 2000 characters, required); response 200 `{ delivery, order_status: 'CONFIRMED' }`.
      - One transaction: the delivery (in progress, assigned to the caller, or any caller MANAGER or OWNER) gets `failed_at` = now and `failure_reason`; the order returns from IN_DELIVERY to CONFIRMED. The owner and managers are notified `delivery.failed`.
    acceptance: |
      Scenario: AC-1 Fail
        When the assigned driver reports "client absent"
        Then the delivery has failed_at and the reason, and the order is CONFIRMED again and in the to-deliver list
      Scenario: AC-2 New attempt
        Then another driver can depart with it and a second delivery row exists
      Scenario Outline: AC-3 Refusals
        When the request has <problem>
        Then the response is <status>
        Examples:
          | problem                                      | status                   |
          | no reason                                    | 400 VALIDATION_ERROR     |
          | a delivery of another driver                 | 404 NOT_FOUND            |
          | a delivery already arrived or failed         | 409 INVALID_TRANSITION   |
      Scenario: AC-4 Repeat
        When the same id is posted twice
        Then the answers are equal
    abuse: |
      Scenario: AB-1 Failing another driver's delivery (horizontal)
        When a DRIVER posts a failure for a delivery assigned to someone else
        Then the response is 404 and it is unchanged
    implementation:
      create: [tests/integration/delivery/fail.test.ts]
