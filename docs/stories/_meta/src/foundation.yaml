  - id: FND-008
    title: Default JSON body limit of 100 kb
    kind: technical
    size: XS
    risk: medium
    depends_on: [FND-006]
    read_first: [src/app.ts, src/middleware/error-handler.ts]
    design_refs: [synchronisation-hors-ligne/principes-la-synchronisation-classique]
    constraints: []
    asvs: [v5.0.0-2.2.1, v5.0.0-15.2.2]
    story: "Technical story: replace the 10 MB body limit with a 100 kb default and a per-route override, so that no route accepts an oversized body except the ones that need it."
    context: |
      - Exists: `src/app.ts` uses `express.json({ limit: '10mb' })` and `express.urlencoded({ ..., limit: '10mb' })`.
      - Adds: `src/middleware/body-parser.ts` exporting `jsonBodyParser` and `BODY_LIMITS` (`{ '/api/v1/sync/push': '5mb' }`, the route SYNC creates later); default `100kb`. `src/app.ts` uses it and the urlencoded limit becomes `100kb`.
    acceptance: |
      Scenario Outline: AC-1 Body size
        When a POST with a JSON body of <size> is sent to `/api/v1/auth/login`
        Then the status is <status>
        Examples:
          | size   | status |
          | 90 kb  | 401 or 400 (the route's own answer, not 413) |
          | 101 kb | 413    |
      Scenario: AC-2 Error shape
        When the body is too large
        Then the body is `{ error: { code: "PAYLOAD_TOO_LARGE", message, requestId } }`
      Scenario: AC-3 Override
        Then `BODY_LIMITS['/api/v1/sync/push']` is `5mb` and every other path uses `100kb`
    abuse: |
      Scenario: AB-1 Memory exhaustion (denial of service)
        When a client sends a 2 MB JSON body to any route except the override
        Then the response is 413 and the body is not parsed
    implementation:
      create: [src/middleware/body-parser.ts, tests/integration/foundation/body-limit.test.ts]
      modify: [src/app.ts]
      pattern: src/middleware/request-id.ts
      signatures:
        - "jsonBodyParser: express.RequestHandler"
      types:
        - "BODY_LIMITS: Record<string, string>"
      errors: ["PAYLOAD_TOO_LARGE 413"]
      dependencies: [express, supertest]
    security:
      - "v5.0.0-2.2.1: explicit maximum on every request body."
      - "v5.0.0-15.2.2: the limit is checked before parsing."
    tests: |
      sizes | integration | AC-1 | 90 kb → not 413; 101 kb → 413
      error shape | integration | AC-2 | 101 kb → code PAYLOAD_TOO_LARGE with requestId
      override table | unit | AC-3 | read BODY_LIMITS → sync push 5mb, default 100kb
      large body | security | AB-1, CWE-770 | 2 MB body to `/api/v1/auth/login` → 413
    command: npx vitest run tests/integration/foundation/body-limit.test.ts
    out_of_scope:
      - "The sync push route itself (SYNC module)."
  - id: FND-009
    title: Shared limits and pagination helpers
    kind: technical
    size: XS
    risk: low
    depends_on: [FND-006]
    read_first: [docs/stories/CONVENTIONS.md, src/lib/http-error.ts]
    design_refs: [notes-de-conception]
    constraints: []
    asvs: [v5.0.0-2.2.1, v5.0.0-15.2.2]
    story: "Technical story: provide the text limits and the cursor pagination every list route uses, so that lists are bounded and validated the same way."
    context: |
      - Adds: `src/shared/limits.ts` (`NAME_MAX` 100, `TEXT_MAX` 2000, `LABEL_MAX` 100, `PAGE_DEFAULT` 50, `PAGE_MAX` 100; provisional, Q-027) and `src/shared/pagination.ts`.
      - A cursor is base64url JSON `{ createdAt: ISO string, id: uuid }`; lists sort by `created_at` descending then `id` descending.
    acceptance: |
      Scenario Outline: AC-1 Page size
        When paginationQuerySchema parses limit <limit>
        Then the result is <result>
        Examples:
          | limit   | result     |
          | missing | 50         |
          | 1       | 1          |
          | 100     | 100        |
          | 0       | ZodError   |
          | 101     | ZodError   |
          | abc     | ZodError   |
      Scenario: AC-2 Cursor round trip
        When a cursor is encoded and decoded
        Then the decoded `createdAt` and `id` equal the originals
      Scenario: AC-3 Malformed cursor
        When decodeCursor receives text that is not base64url JSON or lacks a UUID id
        Then it throws `httpError(400, 'VALIDATION_ERROR', ...)`
    implementation:
      create: [src/shared/limits.ts, src/shared/pagination.ts, tests/unit/shared/pagination.test.ts]
      modify: []
      pattern: tests/unit/crypto.test.ts
      signatures:
        - "encodeCursor(cursor: { createdAt: Date; id: string }): string"
        - "decodeCursor(text: string): { createdAt: Date; id: string }"
      types:
        - "paginationQuerySchema: z.ZodObject<{ limit: number; cursor?: string }>"
      errors: ["VALIDATION_ERROR 400"]
      dependencies: [zod]
    security:
      - "v5.0.0-2.2.1: the page size has a maximum of 100 on every list."
      - "v5.0.0-15.2.2: a cursor is validated before it reaches a query."
    tests: |
      page size | unit | AC-1 | each Examples row → value or ZodError
      round trip | unit | AC-2 | encode then decode → same values
      malformed | unit | AC-3 | garbage, valid base64 of non-JSON, missing id → 400 error
    command: npx vitest run tests/unit/shared/pagination.test.ts
    out_of_scope:
      - "Applying pagination to a route (each list story)."
