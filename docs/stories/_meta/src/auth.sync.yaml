stories:
  - id: AUTH-039
    title: A device stores the fingerprint of its Android id
    kind: migration
    size: S
    risk: high
    amends: [AUTH-007]
    depends_on: [AUTH-007]
    read_first: [prisma/schema.prisma, tests/integration/organization/amount-held.test.ts]
