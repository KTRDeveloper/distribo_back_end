  - id: AUTH-034
    title: The new password opens the session on this phone
    kind: change
    size: S
    risk: high
    depends_on: [AUTH-033, AUTH-020, AUTH-008]
    amends: [AUTH-020]
    read_first: [src/modules/auth/auth.service.ts, src/modules/auth/session.service.ts]
