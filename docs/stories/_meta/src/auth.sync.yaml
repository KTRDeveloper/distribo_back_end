  - id: AUTH-033
    title: The reset code comes by SMS only
    kind: change
    size: XS
    risk: high
    depends_on: [AUTH-028, AUTH-019]
    amends: [AUTH-019]
    read_first: [src/modules/auth/auth.service.ts, src/modules/auth/number-check-limit.ts]
