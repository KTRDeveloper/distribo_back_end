kind: module
module: finance
prefix: FIN
title: Finance
responsibility: Owns the ledger of each relationship, the balance and held-money caches, expenses, handovers, the nightly check and the owner's money exceptions.
entities: [LedgerEntry, Expense, Handover]
depends_on: [foundation, person, notification, access, organization, relationship, order]
asvs_level: L2
asvs_rationale: Money is recorded here; entries are immutable and the caches are updated atomically, but only managers and the owner may move money beyond a collection.
classification:
  - "LedgerEntry.amount, balance_effect | confidential | visible to both parties of the relationship"
  - "LedgerEntry.recorded_by_id | internal | supplier team only"
  - "Expense, Handover | confidential | organization team; the customer never sees them"
  - "Collaboration.amount_held | confidential | the collaborator and the owner"
threats:
  - "T1 | T | A ledger entry is edited or deleted | the application role has INSERT and SELECT only | FIN-001 AB-1"
  - "T2 | T | A lost response makes a refund happen twice | client-created ids and the idempotency middleware | FIN-005 AB-1"
  - "T3 | E | A seller or driver refunds, credits or reverses | those gestures need MANAGER online or OWNER | FIN-005 AB-2, FIN-009 AB-1"
  - "T4 | T | Two simultaneous writes lose one effect on a balance | caches change by addition in a fixed order | FIN-003 AB-1"
  - "T5 | R | Money leaves without the owner noticing | money gestures by non-owners are grouped by person for the owner | FIN-019 AB-1"
  - "T6 | T | The recorder of a handover keeps part of the cash | the remitter is told the amount noted and can dispute it | FIN-016 AB-1"
constraints:
  C-23: "`LedgerEntry.amount` > 0; `balance_effect` is a generated column of `kind`, `amount` and `reverses_entry_id`; `mode` is set if and only if `kind` is PAYMENT or REFUND."
  C-24: "A SALE entry has `order_id` set and `amount` equal to `Order.total_amount` (server-fixed), and there is at most one non-reversed sale per order; the payment born of 'Commande livrée' also carries `order_id`."
  C-25: "A ledger entry is never updated or deleted; `reverses_entry_id` is unique, on the same relationship, the same kind and amount, and points to an entry that is not itself a reversal."
  C-26: "A sale on a counter is paid in full: no credit for anonymous customers."
  C-27: "`Expense.amount` > 0 and `paid_by_id` is a collaborator of the organization, active or gone; `Handover.amount` > 0, `from_person_id` a collaborator active or gone, `from_person_id` differs from `to_person_id` except the former owner's automatic handover, `to_person_id` an ACTIVE OWNER or MANAGER; expenses and handovers are never modified, only cancelled once with `cancelled_at` and `cancelled_by_id` set together."
  C-37: "`CustomerRelationship.balance` and `Collaboration.amount_held` are updated by adding the effect of each operation inside its transaction, always relationship first then collaboration; a nightly check compares each total with the sum of its entries."
  C-32: "Immutable journals are never updated or deleted by the application; only the retention purge removes them."
  C-39: "The application account has only INSERT and SELECT on the immutable tables."
  C-38: "Every online route that changes data carries the client-created id; an id already received changes nothing and returns the first result."
  C-04: "Author columns (`*_by_id`, `assigned_to_id`, `reporter_id`, `person_id` of an administrator, `to_person_id`) refer to a registered person; `resolved_by_id` and `administrator_id` refer to an Administrator."
  CM-17: "amount_held = payments recorded minus refunds made, expenses paid and handovers given, plus handovers received; a reversed entry counts the other way; a cancelled expense or handover no longer counts; the owner's amount is tracked but never presented."
  CM-18: "At ownership transfer the server records a handover from the former owner to themselves for their amount_held, so it restarts at 0."
  CM-21: "A returned-and-refunded gesture records a CREDIT_NOTE and a REFUND of the same amount in one transaction."
  CM-13: "The amount of a sale is always Order.total_amount computed by the server on delivered quantities; the amount sent by the phone is ignored."
  C-01: "Identifiers use `uuid` columns (UUIDv7), amounts `bigint`, quantities `numeric(12,3)`, timestamps `timestamptz`."
  C-35: "Synchronized tables carry `server_updated_at`, set by the server on every write, and `deleted_at` for deletion; unique constraints ignore deleted rows."
contracts:
  provides:
    - name: Ledger
      file: src/modules/finance/ledger.service.ts
      story: FIN-003
      items:
        - "appendLedgerEntry(tx, input: LedgerInput): Promise<LedgerEntry> — inserts one entry, adds its `balance_effect` to the relationship balance, then adds the cash effect to the recorder's amount held (PAYMENT +amount, REFUND -amount; reversals opposite)"
        - "reverseLedgerEntry(tx, entryId: string, input: { id: string; recordedById: string; note?: string }): Promise<LedgerEntry>"
      used_by: [delivery, sync]
    - name: HeldMoney
      file: src/modules/finance/held-money.ts
      story: FIN-012
      items:
        - "recordExpenseInTx(tx, input): Promise<Expense> and recordHandoverInTx(tx, input): Promise<Handover> — insert and adjust `amount_held`"
      used_by: [organization, sync]
  consumes:
    - "relationship: addToBalance, visibleRelationsWhere (docs/stories/modules/relationship/contracts.md)"
    - "organization: loadActor, addAmountHeld, assertOrganizationActive (docs/stories/modules/organization/contracts.md)"
    - "access: requireAbility, idempotent (docs/stories/modules/access/contracts.md)"
stories:
  - id: FIN-001
    title: Ledger entries table
    kind: technical
    size: M
    risk: high
    depends_on: [REL-001, ORD-001, PER-008, FND-002, REL-014]
    read_first: [prisma/schema.prisma, tests/integration/relationship/reassignment-table.test.ts]
    design_refs: [finances/ledgerentry, contraintes-a-poser-au-niveau-base-de]
    constraints: [LedgerEntry:required, LedgerEntry.kind:enum, LedgerEntry.mode:enum, LedgerEntry:fk, LedgerEntry.balance_effect:generated, C-23, C-04, C-39]
    asvs: [v5.0.0-8.3.1]
    fields: ["LedgerEntry.{customer_relationship_id,order_id,kind,amount,balance_effect,mode,transaction_reference,reverses_entry_id,recorded_by_id,note,occurred_at}"]
    story: "Technical story: create the immutable ledger table with a generated balance effect, so that the sign of an entry comes from its type and nobody can edit or delete a line."
    context: |
      - Exists: `customer_relationships`, `orders`, `require_registered_person()`, `set_server_updated_at()`, role `distribo_app`.
      - Adds: table `ledger_entries` with `server_updated_at` only (no `deleted_at`, Q-015), foreign keys (`order_id`, `reverses_entry_id`, `recorded_by_id`), indexes on (`customer_relationship_id`, `occurred_at` desc), `order_id`, (`recorded_by_id`, `occurred_at`), triggers `require_registered_person('recorded_by_id')` and `set_server_updated_at()`, and `REVOKE UPDATE, DELETE, TRUNCATE ... FROM distribo_app`.
      - `balance_effect` bigint is `GENERATED ALWAYS AS` (`CASE` on `kind`: SALE, OPENING_BALANCE and REFUND give `amount`, PAYMENT and CREDIT_NOTE give `-amount`; the sign flips when `reverses_entry_id` is not null) `STORED`.
      - CHECKs: `amount > 0`; `mode` is not null exactly when `kind` is PAYMENT or REFUND.
    acceptance: |
      Scenario Outline: AC-1 Balance effect
        When an entry of kind <kind> and amount 10000 is inserted <reversal>
        Then balance_effect is <effect>
        Examples:
          | kind            | reversal              | effect |
          | SALE            | as an original        | 10000  |
          | REFUND          | as an original        | 10000  |
          | PAYMENT         | as an original        | -10000 |
          | CREDIT_NOTE     | as an original        | -10000 |
          | PAYMENT         | reversing an entry    | 10000  |
      Scenario Outline: AC-2 Amount and mode
        When a row has <values>
        Then the insert <result>
        Examples:
          | values                                | result          |
          | amount 0                              | rejects (23514) |
          | amount -5                             | rejects (23514) |
          | PAYMENT with mode CASH                | accepts         |
          | PAYMENT without mode                  | rejects (23514) |
          | SALE with mode CASH                   | rejects (23514) |
          | CREDIT_NOTE without mode              | accepts         |
      Scenario: AC-3 Never written by the application
        When a row is inserted with an explicit balance_effect
        Then the insert fails
      Scenario: AC-4 Immutable
        When the application account updates or deletes a row
        Then PostgreSQL answers permission denied (42501)
      Scenario: AC-5 Keys and author
        When the relationship is unknown or `recorded_by_id` is a guest
        Then the insert fails with 23503 or 23514
    abuse: |
      Scenario: AB-1 Rewriting a payment (tampering)
        When code running as the application account changes a PAYMENT's amount from 30000 to 3000
        Then the update is refused and the row is unchanged
    implementation:
      create: [prisma/migrations/<timestamp>_fin_001_ledger_entries/migration.sql, tests/integration/finance/ledger-table.test.ts]
      modify: [prisma/schema.prisma]
      pattern: tests/integration/relationship/reassignment-table.test.ts
      signatures: []
      types: []
      errors: []
      dependencies: [prisma, "@prisma/client"]
    security:
      - "v5.0.0-8.3.1: only INSERT and SELECT are granted to `distribo_app`."
    tests: |
      balance effect | integration | AC-1, LedgerEntry.balance_effect:generated, C-23 | each Examples row → effect
      amount and mode | integration | AC-2, C-23, LedgerEntry.kind:enum, LedgerEntry.mode:enum | each Examples row → accepted or rejected
      generated column | integration | AC-3 | explicit value → error
      immutable | security | AC-4, AB-1, C-39, WSTG-ATHZ-03 | as `distribo_app`: UPDATE, DELETE → 42501
      keys and author | integration | AC-5, LedgerEntry:required, LedgerEntry:fk, C-04 | rejected; column types; server time
    command: npx vitest run tests/integration/finance/ledger-table.test.ts
    out_of_scope:
      - "Sale, reversal and order rules (FIN-002)."
  - id: FIN-002
    title: Ledger sale and reversal rules in the database
    kind: technical
    size: S
    risk: high
    depends_on: [FIN-001, ORD-006, ORD-003]
    read_first: [prisma/schema.prisma, tests/integration/finance/ledger-table.test.ts]
    design_refs: [finances/ledgerentry, contraintes-a-poser-au-niveau-base-de]
    constraints: [C-24, C-25]
    asvs: [v5.0.0-2.3.3, v5.0.0-2.2.3]
    story: "Technical story: enforce in the database that a sale equals its order's total and is unique, and that a reversal mirrors exactly one earlier entry."
    context: |
      - Exists: `ledger_entries` (FIN-001), `orders.total_amount`.
      - Adds: one migration. A BEFORE INSERT trigger: a SALE that is not a reversal needs `order_id`, its `amount` must equal the order's `total_amount`, and the order must have no other SALE without a reversal pointing to it; otherwise 23514.
      - A unique index on `reverses_entry_id` (where not null). A BEFORE INSERT trigger for a reversal: the target has the same `customer_relationship_id`, the same `kind` and the same `amount`, and the target is not itself a reversal; otherwise 23514.
    acceptance: |
      Scenario Outline: AC-1 Sale rules
        When a SALE is inserted with <values>
        Then the insert <result>
        Examples:
          | values                                                        | result          |
          | order_id and amount equal to the order total                  | accepts         |
          | no order_id                                                   | rejects (23514) |
          | amount different from the order total                         | rejects (23514) |
          | a second SALE for an order that has a live SALE               | rejects (23514) |
          | a new SALE for an order whose first SALE was reversed         | accepts         |
      Scenario Outline: AC-2 Reversal rules
        When a reversal targets <target>
        Then the insert <result>
        Examples:
          | target                                                | result          |
          | an entry of the same relationship, kind and amount    | accepts         |
          | the same entry a second time                          | rejects (23505) |
          | an entry of another relationship                      | rejects (23514) |
          | an entry of another kind                              | rejects (23514) |
          | an entry with another amount                          | rejects (23514) |
          | a reversal entry                                      | rejects (23514) |
    abuse: |
      Scenario: AB-1 A sale that does not match its order (tampering)
        When code inserts a SALE of 3000 for an order of 30000
        Then PostgreSQL refuses it
    implementation:
      create: [prisma/migrations/<timestamp>_fin_002_ledger_rules/migration.sql, tests/integration/finance/ledger-rules.test.ts]
      modify: []
      pattern: tests/integration/order/creation-guard.test.ts
      signatures: []
      types: []
      errors: []
      dependencies: [prisma, "@prisma/client"]
    security:
      - "v5.0.0-2.3.3: sale uniqueness and reversal rules hold for every insert path."
      - "v5.0.0-2.2.3: related rows are checked in the database."
    tests: |
      sale rules | integration | AC-1, C-24 | each Examples row → accepted or 23514
      reversal rules | integration | AC-2, C-25 | each Examples row → accepted or SQLSTATE
      mismatched sale | security | AB-1, CWE-345 | 23514
    command: npx vitest run tests/integration/finance/ledger-rules.test.ts
    out_of_scope:
      - "Counter sales paid in full (C-26 in DLV-011)."
  - id: FIN-003
    title: Append a ledger entry and update the caches
    kind: technical
    size: M
    risk: high
    depends_on: [FIN-002, REL-025, ORG-006]
    read_first: [src/modules/relationship/relationship.repository.ts, src/modules/organization/organization.repository.ts]
    design_refs: [finances/ledgerentry, finances/handover]
    constraints: [C-37, CM-17]
    asvs: [v5.0.0-2.3.3, v5.0.0-2.3.4]
    story: "Technical story: provide the one function that writes a ledger entry and updates the balance and the held money in the right order, so that simultaneous writes never lose an effect."
    context: |
      - Exists: `ledger_entries` (FIN-001, FIN-002); `addToBalance` (REL-025 repository, `SET balance = balance + delta`); `addAmountHeld` (ORG-006); `resolveMergedRelation`.
      - Adds: `src/modules/finance/ledger.service.ts` with `appendLedgerEntry(tx, input)` and `reverseLedgerEntry(tx, entryId, input)`.
      - `appendLedgerEntry` resolves a merged relationship id, inserts the row, reads its generated `balance_effect`, adds it to the relationship's `balance` (first), then for a PAYMENT adds +amount and for a REFUND adds -amount to the recorder's `amount_held` (second). A reversal of a PAYMENT subtracts and a reversal of a REFUND adds. It runs in the caller's transaction.
      - `reverseLedgerEntry` builds the mirror entry (same relationship, kind, amount, mode and order) with `reverses_entry_id` and the new id.
    acceptance: |
      Scenario Outline: AC-1 Cache effects
        When appendLedgerEntry writes a <kind> of 10000 recorded by a collaborator
        Then the balance changes by <balance> and the recorder's amount_held by <held>
        Examples:
          | kind            | balance | held   |
          | SALE            | +10000  | 0      |
          | PAYMENT         | -10000  | +10000 |
          | REFUND          | +10000  | -10000 |
          | CREDIT_NOTE     | -10000  | 0      |
          | OPENING_BALANCE | +10000  | 0      |
      Scenario: AC-2 Reversal
        When reverseLedgerEntry reverses a PAYMENT of 10000
        Then the balance rises by 10000 and the recorder's amount_held falls by 10000
      Scenario: AC-3 Simultaneous writes
        When 20 payments of 100 are appended in parallel transactions for one relationship
        Then the balance ends 2000 lower and no effect is lost
      Scenario: AC-4 Atomic
        When the held-money update fails
        Then no entry and no balance change remain
      Scenario: AC-5 Merged relationship
        When the given relationship id was merged into another
        Then the entry is written on the surviving relationship
    abuse: |
      Scenario: AB-1 Lost update on a balance (tampering)
        When two transactions read the same balance and both write
        Then both effects are kept because the cache changes by addition
    implementation:
      create: [src/modules/finance/ledger.service.ts, tests/integration/finance/ledger-service.test.ts]
      modify: []
      pattern: src/modules/organization/organization.repository.ts
      signatures:
        - "appendLedgerEntry(tx: Prisma.TransactionClient, input: LedgerInput): Promise<LedgerEntry>"
        - "reverseLedgerEntry(tx: Prisma.TransactionClient, entryId: string, input: { id: string; recordedById: string; note?: string }): Promise<LedgerEntry>"
      types:
        - "LedgerInput = { id: string; relationshipId: string; kind: LedgerKind; amount: bigint; mode?: 'CASH' | 'MOBILE_MONEY'; orderId?: string; transactionReference?: string; note?: string; recordedById: string; organizationId: string; occurredAt: Date }"
      errors: ["NOT_FOUND 404", "VALIDATION_ERROR 400"]
      dependencies: ["@prisma/client"]
    security:
      - "v5.0.0-2.3.3: entry and both cache updates are one transaction."
      - "v5.0.0-2.3.4: caches change by `SET x = x + delta`; the relationship is always updated before the collaboration."
    tests: |
      cache effects | integration | AC-1, C-37, CM-17 | each Examples row → deltas
      reversal | integration | AC-2 | mirror effects
      simultaneous | integration | AC-3, CWE-362 | balance −2000
      atomic | integration | AC-4 | nothing remains
      merged | integration | AC-5 | entry on surviving row
      lost update | security | AB-1, WSTG-BUSL-04 | both effects kept
    command: npx vitest run tests/integration/finance/ledger-service.test.ts
    out_of_scope:
      - "Routes (FIN-004 onward)."
  - id: FIN-004
    title: Seller records a payment
    kind: feature
    size: M
    risk: high
    depends_on: [FIN-003, REL-009, ACC-004, ACC-007]
    read_first: [src/modules/finance/ledger.service.ts, src/modules/relationship/relationship.visibility.ts]
    design_refs: [finances/ledgerentry]
    constraints: [C-23, C-38]
    asvs: [v5.0.0-8.2.1, v5.0.0-2.3.3, v5.0.0-15.3.3]
    story: As a seller, I want to record a customer's payment so that their balance goes down and I hold the money.
    context: |
      - Exists: `appendLedgerEntry` (FIN-003); rule `create` LedgerEntry kind PAYMENT for SELLER, always (ACC-004); `idempotent()`; `loadActor`.
      - Adds: `POST /api/v1/organizations/{organizationId}/customers/{relationshipId}/payments` with `{ id, amount, mode, transaction_reference?, note? }`; `amount` an integer of at least 1, `mode` CASH or MOBILE_MONEY, `transaction_reference` up to 100 characters and only for MOBILE_MONEY, `note` up to 2000. Response 201 `{ id, kind, amount, mode, occurred_at, balance }`.
      - The entry is recorded by the caller (who now holds the money), `occurred_at` is server time. The relationship must be the organization's own customer relationship, ACTIVE or ENDED (payments stay possible), not PENDING, and not a counter (409 `COUNTER_ONLY_RETURNS`). A CLOSED organization may record payments; a SUSPENDED one answers 409 `ORGANIZATION_NOT_ACTIVE`.
    acceptance: |
      Scenario: AC-1 Record a payment
        Given a customer with balance 45000
        When a SELLER records 20000 in cash
        Then the response is 201, balance is 25000 and the seller's amount_held is +20000
      Scenario: AC-2 Mobile money
        When the mode is MOBILE_MONEY with a reference
        Then the entry stores the reference and the held money counts it
      Scenario: AC-3 Advance
        When the payment exceeds the balance
        Then the balance becomes negative and the response is 201
      Scenario Outline: AC-4 Refusals
        When the request has <problem>
        Then the response is <status> and nothing is stored
        Examples:
          | problem                                     | status                      |
          | amount 0 or 1.5 or negative                 | 400 VALIDATION_ERROR        |
          | mode "CARD"                                 | 400 VALIDATION_ERROR        |
          | a reference with mode CASH                  | 400 VALIDATION_ERROR        |
          | a counter                                   | 409 COUNTER_ONLY_RETURNS    |
          | a PENDING relationship                      | 409 RELATIONSHIP_NOT_ACTIVE |
          | a SUSPENDED organization                    | 409 ORGANIZATION_NOT_ACTIVE |
          | a DRIVER caller                             | 403 FORBIDDEN               |
      Scenario: AC-5 Closed business
        When the organization is CLOSED
        Then the payment is accepted
    abuse: |
      Scenario: AB-1 Double recording by retry (tampering)
        When the same id is posted twice
        Then one entry exists and both answers are equal
      Scenario: AB-2 Client-set fields (mass assignment)
        When the body contains kind, balance_effect, recorded_by_id or occurred_at
        Then the response is 400
      Scenario: AB-3 Another business's customer (horizontal)
        When a member of A posts to a relationship of B
        Then the response is 404
    implementation:
      create: [src/modules/finance/finance.routes.ts, src/modules/finance/finance.schemas.ts, src/modules/finance/finance.service.ts, tests/integration/finance/record-payment.test.ts]
      modify: [src/app.ts]
      pattern: src/modules/organization/organization.routes.ts
      signatures:
        - "recordPayment(actor: Actor, relationshipId: string, input: PaymentInput): Promise<LedgerEntryView>"
      types:
        - "PaymentInput = { id: string; amount: number; mode: 'CASH' | 'MOBILE_MONEY'; transaction_reference?: string; note?: string }"
      errors: ["VALIDATION_ERROR 400", "COUNTER_ONLY_RETURNS 409", "RELATIONSHIP_NOT_ACTIVE 409", "ORGANIZATION_NOT_ACTIVE 409", "FORBIDDEN 403", "NOT_FOUND 404"]
      dependencies: [express, zod]
    security:
      - "v5.0.0-8.2.1: seller and above; the ledger rule carries kind PAYMENT."
      - "v5.0.0-2.3.3: entry, balance and held money are one transaction."
      - "v5.0.0-15.3.3: strict schema; the sign and the recorder come from the server."
    tests: |
      record | integration | AC-1, C-23 | balance and held money
      mobile money | integration | AC-2 | reference stored
      advance | integration | AC-3 | negative balance
      refusals | integration | AC-4 | each Examples row → status
      closed business | integration | AC-5 | 201
      retry | security | AB-1, C-38, CWE-362 | one entry
      client fields | security | AB-2, CWE-915 | 400
      other business | security | AB-3, WSTG-ATHZ-04 | 404
    command: npx vitest run tests/integration/finance/record-payment.test.ts
    out_of_scope:
      - "Payments during delivery (DLV module). OpenAPI registration (FIN-010)."
  - id: FIN-005
    title: Manager returns money to a customer
    kind: feature
    size: M
    risk: high
    depends_on: [FIN-004, ACC-004, NTF-002]
    read_first: [src/modules/finance/finance.service.ts, src/modules/finance/ledger.service.ts]
    design_refs: [finances/ledgerentry]
    constraints: [C-23]
    asvs: [v5.0.0-8.2.1, v5.0.0-2.3.3, v5.0.0-15.3.3]
    story: As a manager, I want to record money I give back to a customer so that their balance and my held money are right.
    context: |
      - Exists: `recordPayment` route file (FIN-004); rule `create` LedgerEntry kind REFUND for MANAGER online, OWNER always (ACC-004); `appendLedgerEntry`; `notify`.
      - Adds: `POST /api/v1/organizations/{organizationId}/customers/{relationshipId}/refunds` with `{ id, amount, mode, transaction_reference?, note? }` (same limits as a payment); response 201 `LedgerEntryView`.
      - A REFUND raises the balance by the amount and lowers the recorder's held money by it. A registered customer is notified `balance.increased`.
      - Refused: a counter (409 `COUNTER_ONLY_RETURNS`, use FIN-008); a PENDING relationship; an organization that is not ACTIVE (409 `ORGANIZATION_NOT_ACTIVE`); the manager's own customer record or that of an organization they manage as customer (403 `OWN_RECORD`).
    acceptance: |
      Scenario: AC-1 Refund
        Given balance 0 and a manager holding 30000
        When they record a refund of 10000 in cash
        Then the response is 201, balance is 10000 and amount_held is 20000
      Scenario: AC-2 Customer notified
        Then a registered customer has one unread `balance.increased`
      Scenario Outline: AC-3 Refusals
        When the request has <problem>
        Then the response is <status> and nothing is stored
        Examples:
          | problem                                   | status                      |
          | a SELLER or DRIVER caller                 | 403 FORBIDDEN               |
          | a counter                                 | 409 COUNTER_ONLY_RETURNS    |
          | the manager's own record                  | 403 OWN_RECORD              |
          | amount 0 or mode missing                  | 400 VALIDATION_ERROR        |
          | a CLOSED organization                     | 409 ORGANIZATION_NOT_ACTIVE |
    abuse: |
      Scenario: AB-1 Double refund by retry (tampering)
        When the same id is posted twice
        Then one entry exists and money leaves once
      Scenario: AB-2 Seller gives money back (vertical)
        When a SELLER or DRIVER posts
        Then the response is 403 and nothing is stored
    implementation:
      create: [tests/integration/finance/refund.test.ts]
      modify: [src/modules/finance/finance.routes.ts, src/modules/finance/finance.schemas.ts, src/modules/finance/finance.service.ts]
      pattern: src/modules/finance/finance.routes.ts
      signatures:
        - "recordRefund(actor: Actor, relationshipId: string, input: PaymentInput): Promise<LedgerEntryView>"
      types: []
      errors: ["COUNTER_ONLY_RETURNS 409", "OWN_RECORD 403", "ORGANIZATION_NOT_ACTIVE 409", "VALIDATION_ERROR 400", "FORBIDDEN 403"]
      dependencies: [express, zod]
    security:
      - "v5.0.0-8.2.1: manager online or owner."
      - "v5.0.0-2.3.3: entry and caches in one transaction."
    tests: |
      refund | integration | AC-1, C-23 | balance +10000, held −10000
      notified | integration | AC-2 | notification
      refusals | integration | AC-3 | each Examples row → status
      retry | security | AB-1, CWE-362 | one entry
