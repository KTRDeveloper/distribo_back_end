kind: stories
module: sync
constraints:
  C-35: "Synchronized tables carry `server_updated_at`, set by the server on every write, and `deleted_at` for deletion; unique constraints ignore deleted rows."
  CM-30: "Sync pull returns only what the user may see; a driver receives, per customer, only the available credit instead of balance and limit; the phone keeps all customers, the catalog, open orders and the last 90 days of the rest."
  C-46: "`Product.paused_at` is written by the server only; the products on sale (not deleted, not paused, with at least one ACTIVE variant) number at most `Organization.max_products`, checked by the phone and by the online routes; what arrives in excess through synchronization is paused, never refused."
  C-48: "A variant cited by an order line or a negotiated price is never deleted, only taken off sale (`INACTIVE`); a deletion received for a cited variant becomes a withdrawal from sale, and a line received for a deleted variant restores it, off sale."
  C-11: "`CustomerPrice` is unique per (relationship, variant) among rows not deleted; the variant belongs to the supplier of the relationship."
  C-41: "`Organization.plan`, `plan_ends_at`, `grace_ends_at`, `max_collaborators` and `max_products` are written by the server only and sent to the team of the business only."
  CM-42: "Every insert or update of a `ProductVariant` also sets `server_updated_at` of its product to the database time, so that a product and its variants always travel together to the phones."
stories:
  - id: SYNC-024
    title: The catalog pull speaks products and variants
    kind: change
    size: M
    risk: medium
    amends: [SYNC-005]
    depends_on: [SYNC-005, CAT-014, CAT-021, FND-013]
    read_first: [src/modules/sync/adapters/catalog.adapter.ts, tests/integration/sync/pull-catalog.test.ts]
    design_refs: [synchronisation-hors-ligne/ce-que-recoit-et-garde-chaque-telephone, catalogue/productvariant]
    constraints: [C-35, CM-42]
    asvs: [v5.0.0-8.2.2, v5.0.0-15.3.1]
    story: "As a seller, I want my phone to hold each product with its variants, so that I can sell every size at its own price offline."
    context: |
      - Exists: the `products` pull (SYNC-005); variants, and `image_keys` and `paused_at` on products (CAT-012, CAT-014); a variant change that also moves its product (CAT-021); `imageUrl` (FND-013).
      - `product_variants` joins `SYNC_TABLES` (15 tables) with its own adapter in `catalog.adapter.ts`. Its push refuses every line, as `products` does today (the owner's pushes: SYNC-031 to SYNC-034).
      - For OWNER, MANAGER and SELLER, `products` rows become `id, organization_id, name, description, category, image_urls, paused_at, created_at, server_updated_at`; `unit`, `price`, `price_updated_at`, `min_order_quantity` and `status` leave them. `image_urls` is `imageUrl(key)` for each key.
      - `product_variants` rows for the same roles: `id, product_id, organization_id, name, unit, price, price_updated_at, min_order_quantity` (decimal string), `status`, `image_urls, created_at, server_updated_at`. Every variant of the organization, any status; a deleted or merged one is listed in `deleted`.
      - A paused product still arrives, with `paused_at`: the team sees what is paused. The driver and customer branches stay as they are (SYNC-025, SYNC-026); the product query keeps `unit` for the driver.
    acceptance: |
      Scenario: AC-1 Product and variants
        Given a product with a variant "sac 10 kg" at 15000 and an INACTIVE variant "sac 25 kg"
        When a SELLER of the business pulls
        Then `products` holds the product with name, description, category, `image_urls` and `paused_at`, and no price, unit or status
        And `product_variants` holds both variants with unit, price, minimum, status and `image_urls`
      Scenario: AC-2 A paused product
        Given a paused product
        Then it arrives with `paused_at` set, with its variants
      Scenario: AC-3 A price change moves the product too
        When a variant's price changes after the last pull
        Then the variant and its product are both `updated`
      Scenario: AC-4 A deletion
        When a variant is deleted or merged into another after the last pull
        Then its id is in `deleted` of `product_variants`
      Scenario: AC-5 The new table
        Then the pull answer has a `product_variants` entry, and `SYNC_TABLES` has 15 names
    abuse: |
      Scenario: AB-1 Another business's catalog (horizontal)
        When a member of A pulls
        Then no product and no variant of B arrives
    implementation:
      modify: [src/modules/sync/adapters/catalog.adapter.ts, src/modules/sync/sync.types.ts]
      create: [tests/integration/sync/pull-variants.test.ts]
      pattern: src/modules/sync/sync.changes.ts
      signatures:
        - "variantsAdapter: SyncAdapter (table 'product_variants')"
      types:
        - "SYNC_TABLES gains 'product_variants' after 'products'"
      errors: []
      dependencies: ["@prisma/client"]
    security:
      - "v5.0.0-8.2.2: products and variants come from the viewer's organizations only."
      - "v5.0.0-15.3.1: rows are built from an explicit list of fields; a photo is sent as an address, never as a key."
    tests: |
      team rows | integration | AC-1 | product without price, variants with it
      paused | integration | AC-2 | paused_at set
      price change | integration | AC-3, CM-42 | variant and product updated
      deletion | integration | AC-4, C-35 | id in deleted
      new table | integration | AC-5 | entry present, 15 names
      other business | security | AB-1, WSTG-ATHZ-04 | none of B
    command: npx vitest run tests/integration/sync/pull-variants.test.ts tests/integration/sync/pull-catalog.test.ts tests/integration/sync/registry-viewer.test.ts
    out_of_scope:
      - "The driver and the customer: SYNC-025 and SYNC-026. Pushes: SYNC-031 to SYNC-034."
    tests_to_update:
      - "tests/integration/sync/pull-catalog.test.ts | the seller test expects price and min_order_quantity on the product, and the incremental test expects the product updated with a new price | the product has no price; the variant carries it, and the variant is the row updated by a price change"
      - "tests/integration/sync/registry-viewer.test.ts | it counts 14 tables, in two titles and an assertion | it counts 15"
  - id: SYNC-025
    title: A driver pull names variants without prices
    kind: change
    size: S
    risk: medium
    amends: [SYNC-005]
    depends_on: [SYNC-024]
    read_first: [src/modules/sync/adapters/catalog.adapter.ts]
    design_refs: [synchronisation-hors-ligne/ce-que-recoit-et-garde-chaque-telephone, catalogue/productvariant]
    constraints: [CM-30]
    asvs: [v5.0.0-8.2.2, v5.0.0-15.3.1]
    story: "As a driver, I want my phone to hold the names and units of what I deliver, so that I can read an order without knowing its prices."
    context: |
      - Exists: the driver branch of `products` (SYNC-005): the products named by lines of orders the driver may see, as `id, name, unit`; `product_variants` for the team (SYNC-024); lines name a variant (ORD-026).
      - The scope walks from the line to its variant and to the variant's product. For a driver, `products` rows are `id, name`, and `product_variants` rows are `id, product_id, name, unit`. No price, minimum, status, photo or `paused_at`.
      - A variant stays on the driver's phone when it is `INACTIVE` or its product is paused: the order still names it. A variant that no visible line names is not sent.
      - Incremental pulls keep the rule of SYNC-005: a variant and its product are sent when they changed, or when a visible line naming them, or its order, changed. A deleted variant is announced by id if some line still names it.
    acceptance: |
      Scenario: AC-1 Names only
        Given a confirmed order with a delivery address whose line names the variant "sac 10 kg", and another variant of the product on no order
        When the DRIVER of the business pulls
        Then `products` holds `id` and `name` of the product, and `product_variants` holds only "sac 10 kg" with `id`, `product_id`, `name` and `unit`
      Scenario: AC-2 Withdrawn or paused
        Given that variant is INACTIVE and its product paused
        Then both still arrive, with the same columns
      Scenario: AC-3 Newly visible
        When a line naming an unchanged variant appears on an order after the last pull
        Then the variant and its product arrive on the incremental pull
      Scenario: AC-4 Not on a visible order
        Given the only order naming a variant is DELIVERED
        Then the variant and its product are not sent
    abuse: |
      Scenario: AB-1 A driver reads the price list (information disclosure)
        When a DRIVER pulls
        Then no row carries `price`, `min_order_quantity`, `status`, `image_urls` or `paused_at`
    implementation:
      modify: [src/modules/sync/adapters/catalog.adapter.ts]
      create: []
      pattern: src/modules/sync/sync.changes.ts
      signatures: []
      types: []
      errors: []
      dependencies: ["@prisma/client"]
    security:
      - "v5.0.0-8.2.2: only variants named by lines of orders the driver may see, in the businesses where they are a driver."
      - "v5.0.0-15.3.1: four columns for a variant, two for a product."
    tests: |
      names only | integration | AC-1, CM-30 | columns and scope
      withdrawn | integration | AC-2 | still sent
      newly visible | integration | AC-3 | sent while unchanged
      delivered | integration | AC-4 | not sent
      no prices | security | AB-1, CWE-213 | forbidden keys absent
    command: npx vitest run tests/integration/sync/pull-catalog.test.ts
    out_of_scope:
      - "Which orders a driver may see: SYNC-006 and SYNC-040."
    tests_to_update:
      - "tests/integration/sync/pull-catalog.test.ts | the two driver tests expect id, name and unit on the product | the product has id and name, and its variant in product_variants has id, product_id, name and unit"
  - id: SYNC-026
    title: A customer pull holds the supplier's articles on sale
    kind: change
    size: M
    risk: high
    amends: [SYNC-005]
    depends_on: [SYNC-024]
    read_first: [src/modules/sync/adapters/catalog.adapter.ts, src/modules/sync/adapters/relationship.adapter.ts]
    design_refs: [synchronisation-hors-ligne/ce-que-recoit-et-garde-chaque-telephone, catalogue/product]
    constraints: [CM-42, C-46]
    asvs: [v5.0.0-8.2.2, v5.0.0-15.3.1]
    story: "As a customer, I want my phone to hold my suppliers' articles on sale, so that I can build an order offline."
    context: |
      - Exists: customers receive no product row (SYNC-005 AC-3, now reversed: design 9.6 gives a customer the catalog of the suppliers they buy from); a customer's own relationships (SYNC-004); online browsing (CAT-028).
      - A customer person receives the catalog of each supplier of whom they hold a live relationship (ACTIVE, not deleted, not merged) with an ACTIVE business. `products`: `id, organization_id, name, description, category, image_urls`. `product_variants`: ACTIVE ones only, `id, product_id, organization_id, name, unit, price, min_order_quantity, image_urls`; the negotiated price comes with `customer_prices` (SYNC-027).
      - A product is sent only while it is not deleted, not paused, and has an ACTIVE variant (C-46).
      - A product and its variants travel together (CM-42): on an incremental pull, a product whose variant came back on sale arrives with its variants. A product, or a variant, that changed and is no longer on sale is announced in `deleted`, so the phone drops it.
    acceptance: |
      Scenario: AC-1 The catalog on sale
        Given a supplier with a product of two ACTIVE variants and one INACTIVE
        When a customer with a live relationship pulls
        Then `products` holds the product and `product_variants` holds the two ACTIVE variants, with price and minimum
      Scenario Outline: AC-2 Left out
        When the supplier has <case>
        Then nothing of it is sent
        Examples:
          | case                                              |
          | a paused product                                  |
          | a product whose variants are all INACTIVE         |
          | a deleted product                                 |
          | a SUSPENDED business                              |
          | a CLOSED relationship with the customer           |
      Scenario: AC-3 Back on sale
        When the only variant of a product returns to ACTIVE after the last pull
        Then the product and the variant arrive on the incremental pull
      Scenario: AC-4 No longer on sale
        When the last ACTIVE variant is withdrawn, or the product paused, after the last pull
        Then the ids of the product and of its variants are in `deleted`
    abuse: |
      Scenario: AB-1 A supplier the customer does not buy from (horizontal)
        When a customer pulls
        Then no product of a business with which they have no live relationship arrives, nor any `image_keys`, `paused_at`, `status` or INACTIVE variant
    implementation:
      modify: [src/modules/sync/adapters/catalog.adapter.ts]
      create: [tests/integration/sync/pull-customer-catalog.test.ts]
      pattern: src/modules/sync/sync.changes.ts
      signatures: []
      types: []
      errors: []
      dependencies: ["@prisma/client"]
    security:
      - "v5.0.0-8.2.2: the scope is the viewer's own relationships and the supplier's status, never an id sent by the phone."
      - "v5.0.0-15.3.1: explicit columns; nothing a supplier keeps private (pause date, withdrawn variants, photo keys)."
    tests: |
      on sale | integration | AC-1 | product and two variants
      left out | integration | AC-2, C-46 | each Examples row → none
      back on sale | integration | AC-3, CM-42 | product and variant sent
      no longer on sale | integration | AC-4 | ids in deleted
      other supplier | security | AB-1, WSTG-ATHZ-04 | none
    command: npx vitest run tests/integration/sync/pull-customer-catalog.test.ts tests/integration/sync/pull-catalog.test.ts
    out_of_scope:
      - "A customer that is an organization: its members do not pull a supplier's catalog yet (open question)."
    tests_to_update:
      - "tests/integration/sync/pull-catalog.test.ts | the customer test expects no product row, but that customer has a live relationship with a business that has products | the customer receives the products on sale and their ACTIVE variants"
  - id: SYNC-027
    title: Negotiated prices and order lines are pulled by variant
    kind: change
    size: S
    risk: medium
    amends: [SYNC-004]
    depends_on: [SYNC-004, CAT-015, ORD-028]
    read_first: [src/modules/sync/adapters/relationship.adapter.ts, tests/integration/sync/pull-relationships.test.ts]
    design_refs: [relations-commerciales/customerprice, synchronisation-hors-ligne/ce-que-recoit-et-garde-chaque-telephone]
    constraints: [C-35]
    asvs: [v5.0.0-8.2.2, v5.0.0-15.3.1]
    story: "As a seller, I want my phone to receive each negotiated price and each order line against its variant, so that the right size is sold at the right price offline."
    context: |
      - Exists: `customer_prices` rows carry `product_id` (SYNC-004); negotiated prices name a variant (CAT-015); order lines are built from `OrderLineView`, which says `product_variant_id` (ORD-028).
      - `customerPricesAdapter` sends `product_variant_id` and no `product_id`. Scope and incremental rules do not change.
      - `order_lines` rows already spread the ORD-028 view, so they carry `product_variant_id`; a test pins the name on the wire, which is the contract with the phone, for the supplier's team and for the customer.
    acceptance: |
      Scenario: AC-1 A price by variant
        Given a negotiated price of 4500 for the variant "sac 10 kg"
        When the OWNER, a SELLER and the customer pull
        Then the row has `product_variant_id`, `price` and `customer_relationship_id`, and no `product_id`
      Scenario: AC-2 A line by variant
        Given an order with a line on that variant
        When the SELLER and the customer pull
        Then the `order_lines` row has `product_variant_id` and no `product_id`
      Scenario: AC-3 A deleted price
        When a price is deleted after the last pull
        Then its id is in `deleted`
    implementation:
      modify: [src/modules/sync/adapters/relationship.adapter.ts]
      create: [tests/integration/sync/pull-by-variant.test.ts]
      pattern: src/modules/sync/sync.changes.ts
      signatures: []
      types: []
      errors: []
      dependencies: ["@prisma/client"]
    security:
      - "v5.0.0-8.2.2: scope is unchanged: the team's relationships and the customer's own."
      - "v5.0.0-15.3.1: the old name is not sent next to the new one."
    tests: |
      price by variant | integration | AC-1 | product_variant_id, no product_id
      line by variant | integration | AC-2 | product_variant_id, no product_id
      deleted price | integration | AC-3, C-35 | id in deleted
    command: npx vitest run tests/integration/sync/pull-by-variant.test.ts tests/integration/sync/pull-relationships.test.ts
    out_of_scope:
      - "Pushes of prices: SYNC-034. Pushes of lines: SYNC-029."
    tests_to_update:
      - "tests/integration/sync/pull-relationships.test.ts | the customer prices test expects `product_id: PRODUCT` | it expects `product_variant_id: PRODUCT`, the variant that has the product's id"
  - id: SYNC-028
    title: Controls on arrival and the list to resolve read the variant
    kind: technical
    size: S
    risk: medium
    amends: [SYNC-016, SYNC-020]
    depends_on: [SYNC-016, SYNC-020, CAT-017, ORD-025]
    read_first: [src/modules/sync/sync.controls.ts, src/modules/sync/sync.repository.ts]
    design_refs: [synchronisation-hors-ligne/ce-que-le-serveur-fait-de-chaque-ligne]
    constraints: [CM-27]
    asvs: [v5.0.0-2.3.1, v5.0.0-8.2.2]
    story: "Technical story: make the price control and the owner's list of orders to review look at each line's variant, so that a price change on one size never flags a line of another."
    context: |
      - Exists: `priceControl` in `sync.controls.ts` reads `tx.product` for the status of the products on an order's lines and calls `getReferencePrice(tx, relationshipId, line.productId)`; `findFlaggedOrders` in `sync.repository.ts` does the same for a `PRICE_CHANGED` order (SYNC-016, SYNC-020). Lines now hold `product_variant_id` (ORD-025).
      - Both read `line.productVariantId` instead of `line.productId`, and `getReferencePrice(tx, relationshipId, variantId)` (CAT-017).
      - A line is retired when its variant is not ACTIVE or is deleted, or when its product is paused or deleted: `priceControl` reads `tx.productVariant` with its product and adds no `PRICE_CHANGED` part for it, as before.
      - The part still names the line by `labelApplied`, so two sizes of a product are told apart.
      - `CM-27`: the phone's reference price is ignored and recomputed from the server's price for the variant.
    acceptance: |
      Scenario: AC-1 A price that moved
        Given an order entered offline with a line on the variant "sac 10 kg" at 15000, and that price moved to 15500 after the order was entered
        When the batch arrives
        Then the order's `sync_issue` starts with `PRICE_CHANGED:` and names that line with the old and the new price
      Scenario: AC-2 Another size
        Given the price of the product's other variant moved, not the sold one
        Then the order is not flagged
      Scenario: AC-3 A false reference price
        Given the phone's reference price is 14000 while the variant has stood at 15000 since before the order
        Then the line's reference price is 15000 and the gap against the applied price shows
      Scenario: AC-4 A withdrawn variant
        Given the sold variant is INACTIVE and its price also moved
        Then the order has no `PRICE_CHANGED` part
      Scenario: AC-5 The list to resolve
        When the owner opens the flagged orders of a `PRICE_CHANGED` order
        Then each line shows the current price of its own variant
    implementation:
      modify: [src/modules/sync/sync.controls.ts, src/modules/sync/sync.repository.ts]
      create: [tests/integration/sync/controls-by-variant.test.ts]
      pattern: tests/integration/organization/amount-held.test.ts
      signatures: []
      types: []
      errors: []
      dependencies: ["@prisma/client"]
    security:
      - "v5.0.0-2.3.1: the server's price decides, not the phone's, per variant."
      - "v5.0.0-8.2.2: the flagged orders are those of the caller's organization, as before."
    tests: |
      moved | integration | AC-1 | PRICE_CHANGED names the line
      other size | integration | AC-2 | not flagged
      false reference | integration | AC-3, CM-27 | corrected to 15000
      withdrawn | integration | AC-4 | no part
      list | integration | AC-5 | current price of the variant
    command: npx vitest run tests/integration/sync/controls-by-variant.test.ts tests/integration/sync/controls-prices.test.ts tests/integration/sync/exceptions.test.ts
    out_of_scope:
      - "The wording of the other controls and the credit control: unchanged."
  - id: SYNC-029
    title: An order line entered offline names a variant
    kind: change
    size: M
    risk: medium
    amends: [SYNC-012]
    depends_on: [SYNC-012, CAT-037, ORD-026]
    read_first: [src/modules/sync/adapters/order.push.ts, src/modules/catalog/catalog.sync-writers.ts]
    design_refs: [synchronisation-hors-ligne/ce-que-le-serveur-fait-de-chaque-ligne, catalogue/productvariant]
    constraints: [C-48, CM-27]
    asvs: [v5.0.0-8.2.1, v5.0.0-2.2.1]
    story: "As a seller, I want an order I entered offline to arrive with the size I sold, so that the sale is kept even if that size was merged or withdrawn meanwhile."
    context: |
      - Exists: `createLine` in `order.push.ts` reads `product_id`, reads the product, labels the line `<name> (<unit>)`, stores a withdrawn article's line with `PRODUCT_RETIRED` and flags the order; `resolveVariantForLine` (CAT-037); the line rule that honors `distribo.allow_retired_product` (ORD-026).
      - A pushed line carries `product_variant_id`; the old key is no longer read (a line without it is invalid, set aside as any malformed line). `createLine` calls `resolveVariantForLine(tx, supplier, id, now)`: `null` is `OUT_OF_SCOPE` (forbidden). Else the line stores `productVariantId`, the variant's `productId` and the label given back; a merged variant puts the line on the surviving one, a deleted one is brought back off sale (C-48).
      - The line is retired when the variant read after that is not ACTIVE or its product is paused; the issue code stays `PRODUCT_RETIRED` and the order's note becomes "Produit retiré de la vente depuis la saisie" (design 9.2).
      - `CM-27`: the amount is computed here; the label comes from the server.
    acceptance: |
      Scenario: AC-1 A line by variant
        When a seller sends a line for the variant "sac 10 kg" of "Riz parfumé"
        Then it is stored with that variant, its product, the label "Riz parfumé — sac 10 kg" and the computed amount
      Scenario: AC-2 A merged variant
        When the line names a variant merged into another
        Then it is stored on the surviving variant
      Scenario: AC-3 A withdrawn variant
        Given the variant is INACTIVE
        Then the line is stored, its outcome is `issue` `PRODUCT_RETIRED`, and the order's `sync_issue` is "Produit retiré de la vente depuis la saisie"
      Scenario: AC-4 A deleted variant
        When the line names a deleted variant
        Then the variant comes back INACTIVE, the line is stored with the same issue
      Scenario: AC-5 The old key
        When a line sends `product_id` and no `product_variant_id`
        Then it is set aside as malformed and nothing is stored
    abuse: |
      Scenario: AB-1 A variant of another business (horizontal)
        When a seller of A sends a line naming a variant of B, deleted or not
        Then the outcome is forbidden `OUT_OF_SCOPE`, nothing is written and the variant of B is not restored
    implementation:
      modify: [src/modules/sync/adapters/order.push.ts]
      create: [tests/integration/sync/push-lines-by-variant.test.ts]
      pattern: src/modules/sync/sync.push.ts
      signatures: []
      types: []
      errors: []
      dependencies: ["@prisma/client"]
    security:
      - "v5.0.0-8.2.1: the resolver is given the supplier of the order, so a foreign variant is never read, restored or written."
      - "v5.0.0-2.2.1: the key must be a UUID; quantity and prices go through the existing readers."
    tests: |
      by variant | integration | AC-1, CM-27 | variant, product, label, amount
      merged | integration | AC-2 | surviving variant
      withdrawn | integration | AC-3 | issue and note
      deleted | integration | AC-4, C-48 | restored INACTIVE
      old key | integration | AC-5 | set aside
      other business | security | AB-1, CWE-639 | forbidden, B untouched
    command: npx vitest run tests/integration/sync/push-lines-by-variant.test.ts tests/integration/sync/push-orders.test.ts tests/integration/sync/push-closing.test.ts
    out_of_scope:
      - "Edits and deletions of lines: refused as before (SYNC-013)."
    tests_to_update:
      - "tests/integration/sync/push-orders.test.ts | the line rows send `product_id`, and the note text is 'Article retiré de la vente depuis la saisie' | they send `product_variant_id` with the same ids; the note is 'Produit retiré de la vente depuis la saisie'"
      - "tests/integration/sync/push-closing.test.ts | the line rows send `product_id` | they send `product_variant_id` with the same id"
      - "tests/integration/sync/controls-credit.test.ts | the line rows send `product_id` | they send `product_variant_id` with the same id"
      - "tests/integration/sync/controls-prices.test.ts | the line rows send `product_id` | they send `product_variant_id` with the same id"
      - "tests/integration/sync/forbidden-sends.test.ts | the line rows send `product_id` | they send `product_variant_id` with the same id"
      - "tests/integration/sync/rights-change.test.ts | the line rows send `product_id` | they send `product_variant_id` with the same id"
      - "tests/integration/sync/replay.test.ts | the line rows send `product_id` | they send `product_variant_id` with the same id"
