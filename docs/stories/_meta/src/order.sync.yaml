  - id: ORD-037
    title: Orders are placed and edited as delivery or pickup
    kind: change
    size: S
    risk: medium
    amends: [ORD-007, ORD-009, ORD-010, ORD-013, ORD-014]
    depends_on: [ORD-036]
    read_first: [src/modules/order/order.schemas.ts, tests/integration/order/order-line-variant-required.test.ts]
    design_refs: [a4-livraison-ou-retrait-reception-mode/champ-ajoute-a-order]
    constraints: [C-60]
    asvs: [v5.0.0-2.2.1, v5.0.0-15.3.3]
    story: As a customer, I want to say whether my order is delivered or picked up, so that nobody delivers an order I come to fetch.
    context: |
      - Exists: column `reception_mode` and its check (ORD-036); bodies of POST /api/v1/orders (ORD-009), POST /api/v1/organizations/{organizationId}/purchases (ORD-010), POST /api/v1/organizations/{organizationId}/orders (ORD-013), PATCH /api/v1/organizations/{organizationId}/orders/{orderId} (ORD-014); views (ORD-007).
      - The four bodies get an optional `reception_mode`, DELIVERY or PICKUP. Absent at creation, the order keeps it empty (older app versions).
      - Creation: PICKUP stores no address and never applies the relationship's usual address; PICKUP with a `delivery_address` that is not null → 400 VALIDATION_ERROR; DELIVERY or absent → today's address rule.
      - Edit: absent → the mode does not change; PICKUP clears the address; DELIVERY on an order whose stored mode is not DELIVERY, with no address sent, applies the usual address; an address sent while the resulting mode is PICKUP → 400 VALIDATION_ERROR, nothing changes.
      - One pure helper decides mode and address for both gestures. The customer and supplier views show `reception_mode` (null when not stated).
      - The field informs only: departure, driver and delivery rules do not change.
    acceptance: |
      Scenario Outline: AC-1 Placing an order with a reception mode
        Given a relationship whose usual address is "Rue 12, Akwa"
        When the customer places an order with <mode> and <address>
        Then the response is <response>
        Examples:
          | mode                 | address            | response                                              |
          | PICKUP               | none               | 201, reception_mode PICKUP, no address                |
          | PICKUP               | "Rue 7, Bonapriso" | 400 VALIDATION_ERROR, nothing stored                  |
          | DELIVERY             | none               | 201, reception_mode DELIVERY, address "Rue 12, Akwa"  |
          | no reception_mode    | none               | 201, reception_mode null, address "Rue 12, Akwa"      |
      Scenario: AC-2 Same rules for a purchase and a seller's entry
        When a manager places a purchase, or a seller enters an order, with PICKUP and no address
        Then the order is stored with PICKUP and no address
      Scenario: AC-3 Editing to pickup clears the address
        When the seller edits an order with address "Rue 12, Akwa" to PICKUP
        Then the order has PICKUP and no address
      Scenario: AC-4 Editing back to delivery applies the usual address
        When the seller edits a PICKUP order to DELIVERY without an address
        Then the order has DELIVERY and address "Rue 12, Akwa"
      Scenario: AC-5 An address on a pickup is refused
        When the seller edits a PICKUP order sending only `delivery_address`
        Then the response is 400 VALIDATION_ERROR and the order is unchanged
    abuse: |
      Scenario: AB-1 An unknown mode
        When a body carries `reception_mode` 'SHIP'
        Then the response is 400 VALIDATION_ERROR whose details name the field and the rule, never the value
    implementation:
      create: [tests/integration/order/reception-mode.test.ts]
      modify: [src/modules/order/order.schemas.ts, src/modules/order/order.service.ts, src/modules/order/order.repository.ts, src/modules/order/order.views.ts, src/modules/order/order.openapi.ts]
      pattern: tests/integration/order/order-line-variant-required.test.ts
      signatures:
        - "resolveReception(sent: { mode?: ReceptionMode; address?: string | null }, stored: { mode: ReceptionMode | null; address: string | null } | null, usualAddress: string | null): { receptionMode: ReceptionMode | null; deliveryAddressApplied: string | null }"
      types: []
      errors: ["VALIDATION_ERROR 400"]
      dependencies: [zod, "@prisma/client"]
    security:
      - "v5.0.0-15.3.3: `reception_mode` is added to the listed writable fields; the strict schemas still reject any other field."
      - "v5.0.0-2.2.1: the mode and address rule is checked on the server for every gesture, the check of ORD-036 backing it."
    tests: |
      place modes | integration | AC-1, C-60 | each Examples row → stored mode and address, or 400
      other routes | integration | AC-2, C-60 | purchase and seller entry with PICKUP → no address
      edit to pickup | integration | AC-3 | address cleared
      edit to delivery | integration | AC-4 | usual address applied
      address on pickup | integration | AC-5, C-60 | 400, order unchanged
      unknown mode | security | AB-1, WSTG-INPV-20 | 'SHIP' → 400, details without the value
    command: npx vitest run tests/integration/order/reception-mode.test.ts tests/unit/order/calculations-and-views.test.ts
    out_of_scope:
      - "Reorder (« Reprendre une commande ») is built on the phone: no server change."
      - "The rest order (DLV-018), the replaced version (ORD-039) and orders created through sync (SYNC-049)."
    tests_to_update:
      - "tests/unit/order/calculations-and-views.test.ts | asserts the exact keys of the order views | the keys also include `reception_mode`"

  - id: ORD-038
    title: An order is refused when its total changed since the customer saw it
    kind: change
    size: XS
    risk: medium
    amends: [ORD-009, ORD-010]
    depends_on: [ORD-010]
    read_first: [src/modules/order/order.schemas.ts, tests/integration/order/order-line-variant-required.test.ts]
    design_refs: [a1-modifier-remplacer-une-commande-en/le-total-vu-par-le-client, a1-modifier-remplacer-une-commande-en/etapes-complete-a-2]
    constraints: [CM-16]
    asvs: [v5.0.0-2.2.1, v5.0.0-2.3.1]
    story: As a customer, I want my order refused when its total is not the one I saw, so that I never pay a price I did not accept.
    context: |
      - Exists: POST /api/v1/orders (ORD-009) and POST /api/v1/organizations/{organizationId}/purchases (ORD-010) price every line on the server.
      - Both bodies get an optional `expected_total`: the total the customer saw, an integer of XAF from 0 to 9007199254740991. It sets no price and is never stored.
      - After pricing, when `expected_total` is given and differs from the server total: 409 `TOTAL_CHANGED`, message "The total changed.", `details: { total }` with the server total; nothing is written (no order, line or notification).
      - `idempotent()` replays that 409 for the same `id`: the phone shows the new total, then sends a new gesture with a new `id`.
      - Absent: today's behavior (older app versions).
      - The check is a pure helper, reused by ORD-039.
    acceptance: |
      Scenario Outline: AC-1 The total the customer saw
        Given lines whose server total is 12500
        When the customer places the order with expected_total <sent>
        Then the response is <response>
        Examples:
          | sent   | response                                                        |
          | 12500  | 201                                                             |
          | absent | 201                                                             |
          | 12000  | 409 TOTAL_CHANGED, details.total 12500, no order, line or notification |
      Scenario: AC-2 The same rule on a purchase
        When a manager places a purchase whose expected_total differs from the server total
        Then the response is 409 TOTAL_CHANGED with details.total and nothing is stored
      Scenario: AC-3 Confirming the new total
        Given a first try answered 409 TOTAL_CHANGED with details.total 12500
        When the customer sends the same lines with a new id and expected_total 12500
        Then the response is 201
    abuse: |
      Scenario: AB-1 A lower total to pay less
        When the customer sends expected_total 1 for lines worth 12500
        Then the response is 409 TOTAL_CHANGED and no price comes from the client
      Scenario Outline: AB-2 A malformed total
        When expected_total is <value>
        Then the response is 400 VALIDATION_ERROR
        Examples:
          | value     |
          | -5        |
          | "12500"   |
          | 12500.5   |
    implementation:
      create: [tests/integration/order/expected-total.test.ts]
      modify: [src/modules/order/order.schemas.ts, src/modules/order/order.service.ts, src/modules/order/order.openapi.ts]
      pattern: tests/integration/order/order-line-variant-required.test.ts
      signatures:
        - "assertExpectedTotal(total: bigint, expected: number | undefined): void"
      types: []
      errors: ["TOTAL_CHANGED 409", "VALIDATION_ERROR 400"]
      dependencies: [zod]
    security:
      - "v5.0.0-2.2.1: `expected_total` is compared, never used as a price; prices stay server-computed (CM-16)."
      - "v5.0.0-2.3.1: the gesture applies only when the customer confirmed the total the server computes."
    tests: |
      place | integration | AC-1, CM-16 | each Examples row → 201, or 409 with details.total and nothing stored
      purchase | integration | AC-2 | different total → 409, nothing stored
      new id | integration | AC-3 | new id with the server total → 201
      lower total | security | AB-1, WSTG-BUSL-01 | expected_total 1 → 409, prices unchanged
      malformed | security | AB-2, WSTG-INPV-20 | each Examples row → 400
    tests_to_update:
      - "tests/integration/order/place-order.test.ts | its bodies send no expected_total | unchanged: passes without edits"
      - "tests/integration/order/place-purchase.test.ts | its bodies send no expected_total | unchanged: passes without edits"
    command: npx vitest run tests/integration/order/expected-total.test.ts
    out_of_scope:
      - "The replace gesture (ORD-039) and orders created through sync."

  - id: ORD-039
    title: Customer changes a pending order
    kind: feature
    size: M
    risk: high
    depends_on: [ORD-035, ORD-037, ORD-038, NTF-005]
    read_first: [docs/stories/modules/order/contracts.md]
    design_refs: [a1-modifier-remplacer-une-commande-en/le-geste, a1-modifier-remplacer-une-commande-en/le-lien-et-la-suppression-champ-ajoute]
    constraints: [C-58, CM-16]
    asvs: [v5.0.0-8.2.2, v5.0.0-15.3.3]
    story: As a customer, I want to change my order while it is pending, so that the supplier gets the right order without a cancellation and a new order.
    context: |
      - New route POST /api/v1/orders/{orderId}/replace, `idempotent()` on the body `id` (the new order); strict body of POST /api/v1/orders without `supplier_organization_id`, `expected_total` required.
      - One transaction: `lockCustomerOrder` (null → 404); not PENDING → 409 INVALID_TRANSITION; the checks and pricing of placing (extract them from `placeOrderFor` into one function both use); `assertExpectedTotal`.
      - New version: PENDING, placed by the CUSTOMER, same relationship, `entered_by_id` the caller, reception by `resolveReception`; only `supplier_note` is copied.
      - Old version: `transitionOrder` to CANCELLED, party CUSTOMER, then `markOrderReplaced` sets `deleted_at` and `replaced_by_order_id`; its lines stay.
      - Then `retargetNotifications(tx, { type: 'order', fromId: old, toId: new })` and one `order.replaced` per person of `listOrderTeamIds`, about the new order, FR "Commande modifiée par le client.", EN "Order changed by the customer."; no `order.placed` nor `order.status_changed`.
      - 201 `{ order: <customer view>, replaced_order_id }`; lists and detail already skip deleted orders.
      - Add the path to `order.openapi.ts`, `catalog.test.ts`, `per-001.test.ts`.
    acceptance: |
      Scenario: AC-1 The customer changes a pending order
        Given a PENDING order O1 of the customer with supplier_note "Livrer après 10 h"
        When the customer replaces O1 with id O2, new lines and their server total as expected_total
        Then the response is 201: O2 PENDING at today's prices with that supplier_note, replaced_order_id O1
        And O1 is CANCELLED by the CUSTOMER, deleted and linked to O2, its lines unchanged, absent from both sides' lists and counts, and answers 404
      Scenario: AC-2 The supplier team is told once
        Given the team got an order.placed about O1
        When O1 is replaced by O2
        Then each OWNER, MANAGER and SELLER gets one order.replaced about O2, the order.placed now names O2, and nothing else is added
      Scenario Outline: AC-3 Refused, nothing changes
        When the customer replaces O1 while <state>
        Then the response is <response> and nothing changes
        Examples:
          | state                  | response               |
          | O1 is CONFIRMED        | 409 INVALID_TRANSITION |
          | expected_total differs | 409 TOTAL_CHANGED      |
      Scenario: AC-4 A repeat changes nothing
        When the same request is sent again with the same id
        Then the response is the first 201 and one new version exists
    abuse: |
      Scenario: AB-1 Another customer's order (horizontal)
        When a customer replaces an order of another customer
        Then the response is 404 NOT_FOUND and nothing changes
      Scenario: AB-2 A version already replaced
        When the customer replaces O1 again
        Then the response is 404 NOT_FOUND and no third version exists
      Scenario: AB-3 Fields the customer may not choose
        When the body adds status or unit_price_applied
        Then the response is 400 VALIDATION_ERROR and nothing changes
    implementation:
      create: [tests/integration/order/replace-order.test.ts]
      modify: [src/modules/order/order.routes.ts, src/modules/order/order.schemas.ts, src/modules/order/order.service.ts, src/modules/order/order.repository.ts, src/modules/order/order.openapi.ts, tests/integration/api-docs/catalog.test.ts, tests/integration/per-001.test.ts]
      pattern: tests/integration/order/order-line-variant-required.test.ts
      signatures:
        - "replaceOrder(customer: { personId: string; organizationId?: string }, orderId: string, input: ReplaceOrderInput): Promise<ReplacedOrderView>"
        - "markOrderReplaced(tx: Prisma.TransactionClient, orderId: string, replacedById: string): Promise<void>"
      types:
        - "ReplaceOrderInput = Omit<PlaceOrderInput, 'supplier_organization_id' | 'expected_total'> & { expected_total: number }"
        - "ReplacedOrderView = { order: CustomerOrderView; replaced_order_id: string }"
      errors: ["NOT_FOUND 404", "INVALID_TRANSITION 409", "TOTAL_CHANGED 409", "VALIDATION_ERROR 400"]
      dependencies: [express, zod, "@prisma/client"]
    security:
      - "v5.0.0-8.2.2: the old version is found through the caller's own relationship; any other id answers 404."
      - "v5.0.0-15.3.3: strict body; the supplier, status and prices never come from the client."
    tests: |
      replace | integration | AC-1, C-58, CM-16 | O1 cancelled, deleted, linked, hidden; O2 priced, note copied
      notifications | integration | AC-2 | one order.replaced each; the old one names O2
      refusals | integration | AC-3 | each Examples row, nothing changed
      repeat | integration | AC-4 | same 201, one O2
      other customer | security | AB-1, WSTG-ATHZ-04 | 404, unchanged
      replaced twice | security | AB-2, WSTG-BUSL-06 | 404
      extra fields | security | AB-3, WSTG-INPV-20 | 400, unchanged
    command: npx vitest run tests/integration/order/replace-order.test.ts
    out_of_scope:
      - "ORD-044, SYNC-045, SYNC-046."

