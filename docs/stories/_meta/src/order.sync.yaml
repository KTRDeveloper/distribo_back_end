kind: stories
module: order
constraints:
  C-35: "Synchronized tables carry `server_updated_at`, set by the server on every write, and `deleted_at` for deletion; unique constraints ignore deleted rows."
  C-48: "A variant cited by an order line or a negotiated price is never deleted, only taken off sale (`INACTIVE`); a deletion received for a cited variant becomes a withdrawal from sale, and a line received for a deleted variant restores it, off sale."
stories:
  - id: ORD-022
    title: Orders carry the date they were accepted
    kind: migration
    size: S
    risk: high
    depends_on: [ORD-002]
    amends: [ORD-001, ORD-002]
    read_first: [prisma/schema.prisma, prisma/migrations/20261004280000_ord_002_status_rules/migration.sql]
    design_refs: [commandes-et-livraisons/order, contraintes-a-poser-au-niveau-base-de]
    constraints: [C-51]
    asvs: [v5.0.0-2.2.3]
    fields: ["Order.accepted_at"]
    story: "Technical story: add the acceptance date to orders, with its rules, so that a refused order and an order cancelled after acceptance can be told apart."
    context: |
      - Exists: table `orders` with the check `orders_pending_placed_by_customer_check` and the trigger `orders_enforce_status_rules` (ORD-002).
      - Adds: column `accepted_at` (`timestamptz`, empty allowed, no default). The accept gesture fills it (ORD-023); an order a supplier enters is born CONFIRMED and keeps it empty.
      - Two new checks state C-51: a set `accepted_at` requires `placed_by_party` CUSTOMER, and `status` PENDING requires `accepted_at` empty. The old PENDING check stays, because a merged migration is never edited.
      - Existing orders keep an empty date: nothing recorded when an old order was accepted, so there is nothing to backfill.
      - `prisma/schema.prisma`: add `acceptedAt DateTime? @map("accepted_at") @db.Timestamptz` to `Order`. Above the model, extend the existing `//` comment in plain words: a pending order has no acceptance date, and only an order the customer placed can have one; name this migration as the place that enforces it.
    acceptance: |
      Scenario: AC-1 The column
        When an order is inserted without an acceptance date
        Then `accepted_at` is empty, and the column is `timestamptz` with no default
      Scenario Outline: AC-2 The two checks
        When a row has placed_by_party <party>, status <status> and accepted_at <date>
        Then the insert <result>
        Examples:
          | party    | status    | date  | result          |
          | CUSTOMER | CONFIRMED | set   | accepts         |
          | CUSTOMER | PENDING   | empty | accepts         |
          | CUSTOMER | PENDING   | set   | rejects (23514) |
          | SUPPLIER | CONFIRMED | set   | rejects (23514) |
          | SUPPLIER | CONFIRMED | empty | accepts         |
      Scenario: AC-3 Acceptance and later cancellation
        Given a PENDING order placed by the customer
        When one update sets status CONFIRMED and accepted_at
        Then it is accepted
        And a later update to CANCELLED by the supplier, with a reason, leaves accepted_at unchanged
    abuse: |
      Scenario: AB-1 A supplier-entered order is made to look accepted (tampering)
        Given a CONFIRMED order placed by the SUPPLIER
        When an update sets accepted_at
        Then it fails with 23514 and the date stays empty
    implementation:
      create: [prisma/migrations/<timestamp>_ord_022_accepted_at/migration.sql, tests/integration/order/order-accepted-at.test.ts]
      modify: [prisma/schema.prisma]
      pattern: tests/integration/organization/amount-held.test.ts
      signatures: []
      types: []
      errors: []
      dependencies: [prisma, "@prisma/client"]
    security:
      - "v5.0.0-2.2.3: the rules are CHECK constraints, so no code path can skip them."
    tests: |
      column | integration | AC-1 | insert without the date → empty; read the column type and default
      checks | integration | AC-2, C-51 | each Examples row → accepted or 23514
      acceptance step | integration | AC-3 | PENDING to CONFIRMED with the date, then to CANCELLED → date kept
      supplier order | security | AB-1, CWE-345 | set the date on a supplier-entered order → 23514
    command: npx vitest run tests/integration/order/order-accepted-at.test.ts
    out_of_scope:
      - "Writing the date (ORD-023)."
      - "Showing 'Refusée' or 'Annulée': the apps derive it from placed_by_party, cancelled_by_party and accepted_at."
    tests_to_update:
      - "tests/unit/order/calculations-and-views.test.ts | its order() fixture is typed as the Prisma Order, which gains acceptedAt | add acceptedAt: null to the fixture"

  - id: ORD-023
    title: Accepting an order records its date
    kind: change
    size: S
    risk: high
    depends_on: [ORD-022, ORD-011]
    amends: [ORD-008, ORD-011]
    read_first: [src/modules/order/order.state.ts, src/modules/order/order.views.ts]
    design_refs: [commandes-et-livraisons/order/refus-et-annulation, commandes-et-livraisons/order]
    constraints: [C-51]
    asvs: [v5.0.0-2.3.1, v5.0.0-15.3.1]
    story: As a customer, I want an order the supplier turned down to be told apart from one cancelled after acceptance so that I know whether the supplier ever agreed to it.
    context: |
      - Exists: `transitionOrder` (ORD-008) with `TransitionFields = { cancellationReason? }`; `acceptOrder` (ORD-011) calls it for CONFIRMED without fields. A failed delivery attempt (IN_DELIVERY to CONFIRMED) uses the same step.
      - Change: `TransitionFields` gains `acceptedAt?: Date`. With it, the step to CONFIRMED is allowed only from PENDING and writes `accepted_at` in the same conditional update; from any other status it answers 409 `INVALID_TRANSITION` and writes nothing. Without it nothing changes, so a failed delivery attempt never sets the date.
      - `acceptOrder` passes `acceptedAt: new Date()`, the server clock. A date from a phone arrives through synchronization, not here.
      - `PartyView` in `order.views.ts` and its OpenAPI document gain `accepted_at` (ISO string or null) for both parties. The apps show "Refusée" when `placed_by_party` is CUSTOMER, `cancelled_by_party` SUPPLIER and `accepted_at` empty, else "Annulée": no derived field.
      - `C-51`: `status` PENDING requires `placed_by_party` CUSTOMER and an empty `accepted_at`; a set `accepted_at` requires `placed_by_party` CUSTOMER.
    acceptance: |
      Scenario: AC-1 Accepting records the date
        When a SELLER accepts a PENDING order placed by a customer
        Then the order is CONFIRMED and `accepted_at` is the server time
        And the supplier view and the customer view both show it
      Scenario: AC-2 A failed delivery attempt keeps the date as it was
        Given an IN_DELIVERY order
        When the step to CONFIRMED is taken without `acceptedAt`
        Then `accepted_at` is unchanged, empty for a supplier-entered order and kept for an accepted one
      Scenario Outline: AC-3 Only a pending order can be accepted
        When the step to CONFIRMED with `acceptedAt` is taken on an order that is <status>
        Then the answer is 409 INVALID_TRANSITION and nothing changes
        Examples:
          | status      |
          | CONFIRMED   |
          | IN_DELIVERY |
          | DELIVERED   |
          | CANCELLED   |
      Scenario: AC-4 Refusal and cancellation
        When a PENDING order is refused
        Then `accepted_at` stays empty
        And an accepted order the supplier then cancels keeps its date
      Scenario: AC-5 Views and documents
        When a supplier-entered order is read by either party
        Then `accepted_at` is null
        And GET /api/v1/docs/openapi.json lists `accepted_at`, a string or null, in both order views
    abuse: |
      Scenario: AB-1 A second acceptance rewrites the date (tampering)
        Given an order already accepted
        When a SELLER accepts it again
        Then the answer is 409 INVALID_TRANSITION and the first date remains
    implementation:
      create: [tests/integration/order/accepted-at.test.ts]
      modify: [src/modules/order/order.state.ts, src/modules/order/order.service.ts, src/modules/order/order.views.ts, src/modules/order/order.openapi.ts]
      pattern: tests/integration/organization/amount-held.test.ts
      signatures:
        - "type TransitionFields = { cancellationReason?: string; acceptedAt?: Date }"
        - "transitionOrder(tx: Prisma.TransactionClient, orderId: string, to: OrderStatus, actor: TransitionActor, fields?: TransitionFields, options?: { viaSync?: boolean }): Promise<Order>"
      types:
        - "PartyView gains accepted_at: string | null"
      errors:
        - "409 INVALID_TRANSITION when acceptedAt is given and the order is not PENDING"
      dependencies: ["@prisma/client", "@asteasolutions/zod-to-openapi"]
    security:
      - "v5.0.0-2.3.1: the date and the status are written by one conditional update on PENDING, so two parallel acceptances cannot both win."
      - "v5.0.0-15.3.1: the view lists `accepted_at` field by field; no whole row is returned."
    tests: |
      accept | integration | AC-1, C-51 | accept a PENDING customer order → CONFIRMED, date set, both views show it
      failed attempt | integration | AC-2 | IN_DELIVERY to CONFIRMED without the field → date unchanged
      not pending | integration | AC-3 | each Examples row → 409, status and date unchanged
      refuse and cancel | integration | AC-4 | refuse → date empty; accept then cancel → date kept
      views | integration | AC-5 | entered order → null; openapi.json lists the field
      second acceptance | security | AB-1, CWE-841 | accept twice → second 409, first date kept
    command: npx vitest run tests/integration/order/accepted-at.test.ts tests/unit/order tests/integration/order/accept-order.test.ts
    out_of_scope:
      - "An acceptance made offline: its date comes through synchronization."
      - "The labels 'Refusée' and 'Annulée': the apps compute them."
    tests_to_update:
      - "tests/unit/order/calculations-and-views.test.ts | the customer view test lists the exact keys | add accepted_at to the expected keys"

  - id: ORD-024
    title: Order lines can name a variant
    kind: migration
    size: S
    risk: high
    depends_on: [CAT-014, ORD-004]
    amends: [ORD-004]
    read_first: [prisma/schema.prisma, prisma/migrations/20261004300000_ord_004_order_lines/migration.sql]
    design_refs: [commandes-et-livraisons/orderline, contraintes-a-poser-au-niveau-base-de]
    constraints: [OrderLine:fk]
    asvs: [v5.0.0-2.2.3]
    story: "Technical story: let order lines name a product variant, so that orders can move from products to variants without breaking the code that still writes products."
    context: |
      - Exists: `order_lines.product_id` (ORD-004), a variant with the same id as every product (CAT-013) and the triggers that give each old-style product its variant (CAT-014).
      - One migration adds the column `product_variant_id` (uuid, empty allowed until ORD-025), a foreign key to `product_variants(id)` (restrict) and an index on it, which also serves the per-variant sales and purchase totals read from delivered lines.
      - Trigger `order_lines_a_fill_variant`, before insert: an empty `product_variant_id` becomes `product_id`, which is the variant of a legacy product. A new-style product has no variant of its id, so the key refuses the line (23503). A value that is given is kept; ORD-026 checks it.
      - `prisma/schema.prisma`: `productVariantId String? @map("product_variant_id") @db.Uuid`, the relation to `ProductVariant` and `@@index([productVariantId])`. Above `OrderLine`, add a plain-words `//` comment: the database fills the variant from `product_id` when a line is saved without it; the column becomes required in ORD-025.
      - Lines saved before this migration are filled by ORD-025.
    acceptance: |
      Scenario: AC-1 Column, key and index
        When the table is read
        Then `product_variant_id` is a uuid that accepts an empty value, with a foreign key and an index
      Scenario: AC-2 A line for an old-style product gets its variant
        When a line is inserted with the `product_id` of an old-style product and no variant
        Then `product_variant_id` equals `product_id`
      Scenario: AC-3 A given variant is kept
        Given a variant whose id differs from its product's
        When a line is inserted with that product and that variant
        Then the line keeps the variant it was given
      Scenario: AC-4 An unknown variant
        When a line is inserted with a variant id that does not exist
        Then it fails with 23503
    abuse: |
      Scenario: AB-1 A line is saved for a product that has no variant of its id (tampering)
        Given a new-style product, whose variants have other ids
        When a line is inserted with its `product_id` and no variant
        Then it fails with 23503 and no line with a guessed variant is stored
    implementation:
      create: [prisma/migrations/<timestamp>_ord_024_order_line_variant/migration.sql, tests/integration/order/order-line-variant.test.ts]
      modify: [prisma/schema.prisma]
      pattern: tests/integration/organization/amount-held.test.ts
      signatures: []
      types: []
      errors: []
      dependencies: [prisma, "@prisma/client"]
    security:
      - "v5.0.0-2.2.3: the key refuses a variant that does not exist, whatever the code does."
    tests: |
      column and key | integration | AC-1, OrderLine:fk | read the column, the key and the index
      old-style line | integration | AC-2 | insert with product_id only → variant equals product_id
      given variant | integration | AC-3 | insert with both → kept as given
      unknown variant | integration | AC-4 | insert with an unknown variant → 23503
      no guessed variant | security | AB-1, CWE-20 | new-style product, no variant given → 23503
    command: npx vitest run tests/integration/order/order-line-variant.test.ts tests/integration/order/order-line-table.test.ts
    out_of_scope:
      - "Filling the lines that already exist and making the column required (ORD-025)."
      - "Checking that the variant belongs to the supplier and to the line's product (ORD-026)."
    tests_to_update:
      - "tests/unit/order/calculations-and-views.test.ts | the lines of its order() fixture are typed as the Prisma OrderLine, which gains productVariantId | add productVariantId: null to each line of the fixture"

  - id: ORD-025
    title: Every order line names its variant
    kind: migration
    size: S
    risk: high
    depends_on: [ORD-024]
    amends: [ORD-004, ORD-024]
    read_first: [prisma/schema.prisma, prisma/migrations/20261004300000_ord_004_order_lines/migration.sql]
    design_refs: [commandes-et-livraisons/orderline, contraintes-a-poser-au-niveau-base-de]
    constraints: [OrderLine:required, C-35]
    asvs: [v5.0.0-2.2.3]
    story: "Technical story: fill the variant of the lines saved before ORD-024 and make it required, so that every line names the variant that was sold."
    context: |
      - Exists: `order_lines.product_variant_id`, empty allowed, filled on insert from `product_id` (ORD-024). Lines saved earlier have it empty.
      - One migration, in this order. Between `-- audit start` and `-- audit end`: a block that stops the migration when a line without a variant has no variant of its `product_id`; its message lists line ids only. There is no source for another value, so none is invented (CAT-013 gave every product a variant of its id, so none is expected).
      - Between `-- copy start` and `-- copy end`: `UPDATE order_lines SET product_variant_id = product_id WHERE product_variant_id IS NULL`. It moves `server_updated_at`, so phones fetch the lines again; a second run changes nothing.
      - Then `product_variant_id SET NOT NULL`.
      - `prisma/schema.prisma`: the field becomes `productVariantId String @default(dbgenerated()) @map("product_variant_id") @db.Uuid` and its relation required. Reads are never empty and a create may leave it out because the trigger fills it. Update the `//` comment above `OrderLine` in plain words.
    acceptance: |
      Scenario: AC-1 Existing lines are filled
        Given a line whose variant is empty
        When the copy block runs
        Then its variant equals its `product_id` and its `server_updated_at` moves forward
        And a second run changes nothing
      Scenario: AC-2 The column is required
        When a line is updated to an empty variant
        Then it fails with 23502
        And a line inserted without a variant gets one from its product
    abuse: |
      Scenario: AB-1 A line the migration cannot explain gets a guessed variant (tampering)
        Given a line with no variant and no variant of its `product_id`
        When the audit block runs
        Then it fails with a message that lists the line id and no label, name or amount
        And no line receives a variant
    implementation:
      create: [prisma/migrations/<timestamp>_ord_025_order_line_variant_required/migration.sql, tests/integration/order/order-line-variant-required.test.ts]
      modify: [prisma/schema.prisma]
      pattern: tests/integration/organization/amount-held.test.ts
      signatures: []
      types: []
      errors: []
      dependencies: [prisma, "@prisma/client"]
    security:
      - "v5.0.0-2.2.3: the audit stops on data it cannot explain instead of inventing a variant."
    tests: |
      copy | integration | AC-1, C-35 | replay the marked block on a line with an empty variant, twice → filled once, date moved once
      audit | security | AB-1, CWE-20 | replay the audit block in a rolled-back transaction → ids only in the message, nothing filled
      required | integration | AC-2, OrderLine:required | update to null → 23502; insert without it → filled
    command: npx vitest run tests/integration/order/order-line-variant-required.test.ts
    out_of_scope:
      - "Removing `product_id` (the contract story, after every writer uses variants)."

  - id: ORD-026
    title: Order line rules read the variant
    kind: migration
    size: S
    risk: high
    depends_on: [ORD-025, CAT-014]
    amends: [ORD-005]
    read_first: [prisma/migrations/20261004340000_sync_012_retired_product_lines/migration.sql, prisma/schema.prisma]
    design_refs: [commandes-et-livraisons/order, contraintes-a-poser-au-niveau-base-de]
    constraints: [C-15]
    asvs: [v5.0.0-2.2.3, v5.0.0-8.2.2]
    story: "Technical story: make the order line rules read the variant and its product, so that a line is accepted only for an active variant of the supplier."
    context: |
      - Exists: `order_lines_enforce_rules()` as SYNC-012 left it. It reads `products` by `product_id` and honours the setting `distribo.allow_retired_product`.
      - Replace it with `CREATE OR REPLACE`. On insert it takes `coalesce(product_variant_id, product_id)`, reads that variant and its product, and refuses with 23514 when: the variant's `product_id` differs from the line's; the variant's business is not the supplier of the order's relationship; the setting is not 'on' and the variant is not ACTIVE or is deleted, or its product is deleted or paused (`paused_at` set); the order is placed by the CUSTOMER and the quantity is below the variant's `min_order_quantity`.
      - Unchanged: an unknown variant is left to the key (23503); on a customer-placed order the applied price equals the reference price on insert and is never raised; the setting skips only the status, deletion and pause checks, never the business or product match.
      - Old-style products keep working: their variant mirrors the status and the minimum (CAT-014) and the product's own `deleted_at` is read on the product.
      - `prisma/schema.prisma`: update the `//` comment above `OrderLine` in plain words: lines are checked against their variant and its product, and the sync setting still lets a retired variant through.
      - `C-15`: Every order line is for an ACTIVE variant of the relationship's supplier, of a product that is not paused; on a customer-placed order the quantity is at least the variant's `min_order_quantity` when sent.
    acceptance: |
      Scenario Outline: AC-1 Refused lines
        When a line is inserted for <case>
        Then it fails with 23514
        Examples:
          | case                                           |
          | a variant of another business                  |
          | an INACTIVE variant                            |
          | a deleted variant                              |
          | a variant of a deleted product                 |
          | a variant of a paused product                  |
          | a variant that belongs to another product than the line's product_id |
      Scenario: AC-2 The minimum is the variant's
        Given a variant with minimum 5
        When a customer-placed order gets a line of 4.999
        Then it fails with 23514
        And a line of 5 is accepted, and so is a line of 1 on an order the supplier placed
      Scenario: AC-3 Retired variants through synchronization
        Given the setting is 'on' for the transaction
        When lines are inserted for an INACTIVE variant, a deleted variant and a variant of a paused product
        Then they are accepted
        And a variant of another business is still refused
      Scenario: AC-4 Old-style products behave as before
        Given a product written the old way and then set INACTIVE with a direct update
        When a line is inserted for it
        Then it fails with 23514
    abuse: |
      Scenario: AB-1 A line borrows another business's variant, with the sync setting on (access control)
        Given the setting is 'on'
        When a line names a variant of a business that is not the order's supplier
        Then it fails with 23514
    implementation:
      create: [prisma/migrations/<timestamp>_ord_026_line_rules_by_variant/migration.sql, tests/integration/order/line-rules-variant.test.ts]
      modify: [prisma/schema.prisma]
      pattern: tests/integration/organization/amount-held.test.ts
      signatures: []
      types: []
      errors: []
      dependencies: [prisma, "@prisma/client"]
    security:
      - "v5.0.0-2.2.3: the rules are checked by the database on every insert, whoever writes."
      - "v5.0.0-8.2.2: the variant's business must be the order's supplier, even when the retired-variant setting is on."
    tests: |
      refused lines | integration | AC-1, C-15 | each Examples row → 23514
      minimum | integration | AC-2, C-15 | 4.999 → 23514; 5 → ok; supplier order with 1 → ok
      sync setting | integration | AC-3 | setting on → retired accepted, other business refused
      old style | integration | AC-4 | legacy product set INACTIVE → 23514
      other business | security | AB-1, CWE-639 | setting on, variant of another business → 23514
    command: npx vitest run tests/integration/order/line-rules-variant.test.ts tests/integration/order/line-rules.test.ts tests/integration/sync/push-orders.test.ts
    out_of_scope:
      - "Reading the variant in the services (ORD-027)."
      - "Changing the sync setting or the code that sets it (the synchronization stories)."

  - id: ORD-027
    title: Order lines are priced from the variant
    kind: change
    size: S
    risk: high
    depends_on: [ORD-026, CAT-016, CAT-017, CAT-019]
    amends: [ORD-009, ORD-010, ORD-013, ORD-014]
    read_first: [src/modules/order/order.service.ts, src/modules/order/order.repository.ts]
    design_refs: [commandes-et-livraisons/orderline, commandes-et-livraisons/order]
    constraints: [C-15, C-20, CM-11]
    asvs: [v5.0.0-2.2.1, v5.0.0-8.2.2]
    story: As a customer, I want my order priced and labelled from the variant I chose so that the price and the name on my order are those of that size, color or pack.
    context: |
      - Exists: `priceLine` (customer orders) and `priceEnteredLine` (seller orders, edits, counter sale) read `getActiveProduct` and label the line `<name> (<unit>)`.
      - Change in `order.service.ts`: both read `getActiveVariant(tx, organizationId, id)`; the minimum uses the variant's `minOrderQuantity`; the reference price is `getReferencePrice(tx, relationshipId, variant.id)`; `labelApplied` is `variantLabel(variant.productName, variant.variantName, variant.unit)`.
      - The line keeps `productId: variant.productId` and gains `productVariantId: variant.id` (`NewOrderLine` in `order.repository.ts`).
      - The request field stays `product_id` and carries the variant id until ORD-028; an existing product's id equals its variant's id.
      - `C-15`: Every order line is for an ACTIVE variant of the relationship's supplier, of a product that is not paused; on a customer-placed order the quantity is at least the variant's `min_order_quantity` when sent.
      - `C-20`: `label_applied` is composed by the shared label function; `unit_price_applied` equals `reference_price` on a customer order.
      - `CM-11`: Reference price = negotiated price when one exists, else the variant price.
    acceptance: |
      Scenario: AC-1 Label, variant and prices come from the variant
        Given the variant "Rouge / L" (unit "pièce") of "T-shirt", priced 3000, with a negotiated price of 2800
        When a seller enters an order for it at 2500
        Then label_applied is "T-shirt — Rouge / L (pièce)" and productVariantId is the variant's id
        And reference_price is 2800 and unit_price_applied 2500
      Scenario Outline: AC-2 Minimum quantity of the variant
        Given a variant with minimum 5
        When <who> orders a quantity of 4
        Then the result is <result>
        Examples:
          | who                     | result               |
          | a customer              | 400 VALIDATION_ERROR |
          | a seller for a customer | accepted             |
      Scenario Outline: AC-3 Variants that cannot be ordered
        When a line names <variant>
        Then the answer is 404 NOT_FOUND with the same message, and nothing is stored
        Examples:
          | variant                       |
          | an INACTIVE variant           |
          | a deleted variant             |
          | a variant of a paused product |
          | an id that does not exist     |
    abuse: |
      Scenario: AB-1 A customer names another supplier's variant (access control)
        When a customer orders a variant of a business that is not the relationship's supplier
        Then the answer is 404 NOT_FOUND and no order is stored
    implementation:
      create: [tests/integration/order/order-by-variant.test.ts]
      modify: [src/modules/order/order.service.ts, src/modules/order/order.repository.ts]
      pattern: tests/integration/organization/amount-held.test.ts
      signatures:
        - "priceLine(tx, supplierOrganizationId: string, relationshipId: string, line: { id: string; product_id: string; quantity: string | number }): Promise<NewOrderLine & { quantityMilli: bigint }>"
      types:
        - "NewOrderLine = { id: string; productId: string; productVariantId: string; labelApplied: string; quantity: string; referencePrice: bigint; unitPriceApplied: bigint; amount: bigint }"
      errors:
        - "404 NOT_FOUND when the variant cannot be ordered (any reason, same message)"
        - "400 VALIDATION_ERROR for a quantity below the minimum on a customer order"
      dependencies: ["@prisma/client"]
    security:
      - "v5.0.0-2.2.1: price, label and amount are computed on the server from the variant."
      - "v5.0.0-8.2.2: the variant must belong to the relationship's supplier; every other case is 404."
    tests: |
