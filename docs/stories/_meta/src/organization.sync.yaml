kind: stories
module: organization
constraints:
  C-01: "Identifiers use `uuid` columns (UUIDv7), amounts `bigint`, quantities `numeric(12,3)`, timestamps `timestamptz`."
  C-35: "Synchronized tables carry `server_updated_at`, set by the server on every write, and `deleted_at` for deletion; unique constraints ignore deleted rows."
stories:
  - id: ORG-020
    title: Plan fields and logo key on the organization
    kind: migration
    size: M
    risk: high
    depends_on: [ORG-001, FND-014]
    amends: [ORG-001]
    read_first: [prisma/schema.prisma, tests/integration/organization/organization-table.test.ts]
    design_refs: [identite-et-organisation/organization, contraintes-a-poser-au-niveau-base-de]
    constraints: [C-41, 'Organization.plan:enum', 'Organization.payment_code:unique', C-49]
    asvs: [v5.0.0-2.2.3]
    fields: ["Organization.logo_key", "Organization.payment_code", "Organization.plan", "Organization.plan_ends_at", "Organization.grace_ends_at", "Organization.max_collaborators", "Organization.max_products"]
    story: "Technical story: add to the organizations table the logo key, the business code and the plan fields, with the database rules that keep them consistent, and give every existing business the free plan and a code."
    context: |
      - Exists: `organizations` (ORG-001); `PLANS.FREE` (FND-014): 2 collaborators, 30 products.
      - Adds one migration, run in one transaction: `logo_key` (text, empty, unique); `payment_code` (text, not null, unique); `plan` (new type `OrganizationPlan`, default FREE); `plan_ends_at` and `grace_ends_at` (timestamptz, empty); `max_collaborators` (integer, default 2) and `max_products` (integer, default 30), empty = no limit.
      - A SQL function `organization_payment_code()` returns 8 characters of `23456789ABCDEFGHJKLMNPQRSTUVWXYZ`, drawn from the bytes of `gen_random_uuid()` (secure, no bias). It is the default of `payment_code` and fills existing rows before the column becomes not null.
      - CHECKs (C-41): `plan = 'FREE'` exactly when `plan_ends_at` is empty; a set `grace_ends_at` needs `plan_ends_at` and is later; the two limits are zero or more.
      - Existing rows get FREE, empty dates, 2 and 30: every rule holds.
      - `prisma/schema.prisma`: add the fields and the enum to `model Organization` and its `//` comment, in plain words: the server alone writes the plan fields and the code, shown to the team only; a free business has no end date; codes and logo files are unique; migration `org_020_organization_plan_fields`.
    acceptance: |
      Scenario: AC-1 Defaults
        When an organization is inserted with a name only
        Then `plan` is FREE, `max_collaborators` is 2, `max_products` is 30, `plan_ends_at`, `grace_ends_at` and `logo_key` are empty
        And `payment_code` has 8 characters from `23456789ABCDEFGHJKLMNPQRSTUVWXYZ`
      Scenario: AC-2 Each row gets its own code
        When two organizations are inserted without a code
        Then their `payment_code` values differ
      Scenario Outline: AC-3 Plan rules
        When a row has <values>
        Then the database <result>
        Examples:
          | values | result |
          | plan ESSENTIAL with plan_ends_at set | accepts |
          | plan ESSENTIAL without plan_ends_at | rejects (23514) |
          | plan FREE with plan_ends_at set | rejects (23514) |
          | grace_ends_at before plan_ends_at | rejects (23514) |
          | max_collaborators -1 | rejects (23514) |
          | plan GOLD | rejects (22P02) |
      Scenario: AC-4 One code, one business
        When two organizations are given the same `payment_code`
        Then the second insert is rejected with 23505
      Scenario: AC-5 One logo file, one business
        When two organizations are given the same `logo_key`
        Then the second insert is rejected with 23505
        And any number of organizations may have an empty key
    abuse: |
      Scenario: AB-1 A plan granted without an end date (elevation)
        When code sets `plan = 'PRO'` and leaves `plan_ends_at` empty, straight in the database
        Then PostgreSQL rejects it with 23514, even though no application check ran
    implementation:
      create: [prisma/migrations/<timestamp>_org_020_organization_plan_fields/migration.sql, tests/integration/organization/organization-plan-fields.test.ts]
      modify: [prisma/schema.prisma]
      pattern: tests/integration/organization/organization-table.test.ts
      signatures: []
      types: []
      errors: []
      dependencies: [prisma, "@prisma/client"]
    security:
      - "v5.0.0-2.2.3: related columns (`plan`, `plan_ends_at`, `grace_ends_at`) are checked together in the database."
    tests: |
      defaults | integration | AC-1 | insert with a name → FREE, 2, 30, empty dates, code of 8 allowed characters
      own code | integration | AC-2, C-41 | two inserts without a code → two different codes
      plan rules | integration | AC-3, C-41, Organization.plan:enum | each Examples row → accepted or 23514
      unique code | integration | AC-4, C-41, Organization.payment_code:unique | same code twice → 23505
      unique logo key | integration | AC-5, C-49 | same key twice → 23505; two empty keys → accepted
      plan without end date | security | AB-1, CWE-20 | raw update to PRO without plan_ends_at → 23514
    command: npx vitest run tests/integration/organization/organization-plan-fields.test.ts
    out_of_scope:
      - "The writers of the plan fields (ORG-035), the logo key (ORG-038) and the code at creation (ORG-028); sending the fields to the team only (ORG-028, SYNC); the cross-table key rule (IMG-006)."
  - id: ORG-021
    title: Organization contacts table
    kind: migration
    size: M
    risk: high
    depends_on: [ORG-001, PER-003]
    amends: [ORG-001]
    read_first: [prisma/schema.prisma, tests/integration/organization/organization-table.test.ts]
    design_refs: [identite-et-organisation/organizationcontact, contraintes-a-poser-au-niveau-base-de]
    constraints: [C-43, OrganizationContact:required, 'OrganizationContact.kind:enum', 'OrganizationContact.verification_method:enum', OrganizationContact:fk, C-35, C-01]
    asvs: [v5.0.0-2.2.3]
    fields: ["OrganizationContact.{kind,slot,value,verified_at,verification_method,created_by_id}"]
    story: "Technical story: create the table of public contacts of a business, with the database rules that keep at most three numbers and one email."
    context: |
      - Exists: `organizations` (ORG-001), `people`, `set_server_updated_at()` (FND-002).
      - Adds one migration, run in one transaction: table `organization_contacts` with `id`, `organization_id` (FK), `kind` (new type `OrganizationContactKind`), `slot` (integer, empty), `value`, `verified_at` (empty = pending), `verification_method` (new type `ContactVerificationMethod`, empty), `created_by_id` (FK to people), `created_at`, `server_updated_at`, `deleted_at`.
      - CHECKs (C-43), besides the slot and verification rules: a PHONE `value` matches `^\+[1-9][0-9]{7,14}$`; an EMAIL `value` is lower case.
      - The unique indexes (C-43) ignore deleted rows (C-35), so they are not written as `@@unique`. One number may belong to several organizations.
      - `prisma/schema.prisma`: add `model OrganizationContact` and its enums, with above it a `//` comment in plain words: at most three numbers and one email per business, pending ones included; a deleted contact frees its place; one number may be public for several businesses; migration `org_021_organization_contacts`.
    acceptance: |
      Scenario: AC-1 Defaults
        When a PHONE contact with slot 1 is inserted
        Then `verified_at`, `verification_method` and `deleted_at` are empty and `server_updated_at` is set
      Scenario Outline: AC-2 Row rules
        When a row is inserted with <values>
        Then the database <result>
        Examples:
          | values | result |
          | PHONE without slot | rejects (23514) |
          | EMAIL with a slot | rejects (23514) |
          | PHONE with slot 4 | rejects (23514) |
          | PHONE value without +237 | rejects (23514) |
          | EMAIL value Shop@Example.cm | rejects (23514) |
          | verified_at set without verification_method | rejects (23514) |
      Scenario Outline: AC-3 Uniqueness among live rows
        Given an organization has a live contact PHONE slot 1 +237677000001
        When another row is inserted with <values>
        Then the database <result>
        Examples:
          | values | result |
          | same organization, slot 1, other number | rejects (23505) |
          | same organization, slot 2, same number | rejects (23505) |
          | other organization, slot 1, same number | accepts |
          | same organization, a second EMAIL | rejects (23505) |
      Scenario: AC-4 A deleted contact frees its place
        Given the contact PHONE slot 1 is marked deleted
        When a new contact takes slot 1 with the same number
        Then the insert is accepted
    abuse: |
      Scenario: AB-1 A fourth number slips in (tampering)
        Given an organization holds the slots 1, 2 and 3
        When code inserts another PHONE contact, straight in the database
        Then PostgreSQL rejects it
    implementation:
      create: [prisma/migrations/<timestamp>_org_021_organization_contacts/migration.sql, tests/integration/organization/organization-contact-table.test.ts]
      modify: [prisma/schema.prisma]
      pattern: tests/integration/organization/organization-table.test.ts
      signatures: []
      types: []
      errors: []
      dependencies: [prisma, "@prisma/client"]
    security:
      - "v5.0.0-2.2.3: the slot, kind and verification columns are checked in the database, not only in code."
    tests: |
      defaults | integration | AC-1, C-35 | insert → pending, live, server_updated_at set
      row rules | integration | AC-2, C-43 | each Examples row → accepted or 23514
      uniqueness | integration | AC-3, C-43 | each Examples row → accepted or 23505
      deleted frees | integration | AC-4, C-35 | deleted then re-added → accepted
      required, lists, keys | integration | OrganizationContact:required, OrganizationContact.kind:enum, OrganizationContact.verification_method:enum, OrganizationContact:fk | empty or unknown values → 23502, 22P02, 23503
      column types | integration | C-01 | uuid ids, timestamptz dates
      slot overflow | security | AB-1, CWE-20 | a fourth number → rejected
    command: npx vitest run tests/integration/organization/organization-contact-table.test.ts
    out_of_scope:
      - "Routes and services on contacts (ORG-024 to ORG-027); synchronization (SYNC)."
  - id: ORG-022
    title: A collaboration can be paused
    kind: migration
    size: XS
    risk: high
    depends_on: [ORG-003]
    amends: [ORG-003]
    read_first: [prisma/schema.prisma, tests/integration/organization/amount-held.test.ts]
    design_refs: [identite-et-organisation/collaboration, contraintes-a-poser-au-niveau-base-de]
    constraints: [C-42, C-05]
    asvs: [v5.0.0-2.2.3]
    fields: ["Collaboration.status"]
    story: "Technical story: add the PAUSED status to collaborations and make the database refuse it for the owner."
    context: |
      - Exists: `CollaborationStatus` INVITED, ACTIVE, REVOKED; the one-owner trigger and `collaborations_check_row()` (ORG-003).
      - Adds one migration, run in one transaction: the value PAUSED in the type, and a CHECK that no OWNER row is PAUSED (C-42). PAUSED means: over the limit of the plan, no access, still in the team (billing writes it, ORG-035).
      - Existing rows hold no PAUSED value, so the CHECK already holds: no audit is needed.
      - The one-owner trigger counts ACTIVE owners only; a paused owner is impossible, so it does not change.
      - `prisma/schema.prisma`: add PAUSED to `enum CollaborationStatus`, and to the `//` comment above `model Collaboration` a plain-language line: a paused member keeps their place in the team but has no access; the owner is never paused; the server alone sets the status; migration name `org_022_collaboration_paused`.
    acceptance: |
      Scenario Outline: AC-1 Paused rows
        When a collaboration is inserted with role <role> and status <status>
        Then the database <result>
        Examples:
          | role    | status | result          |
          | MANAGER | PAUSED | accepts         |
          | SELLER  | PAUSED | accepts         |
          | OWNER   | PAUSED | rejects (23514) |
          | OWNER   | ACTIVE | accepts         |
      Scenario: AC-2 An owner cannot be paused later
        Given an ACTIVE owner
        When its status is updated to PAUSED
        Then the update is rejected with 23514
      Scenario: AC-3 A paused member is not an owner
        Given a paused manager and an ACTIVE owner
        Then the organization still has exactly one ACTIVE owner
    abuse: |
      Scenario: AB-1 The owner is paused so the business has none (denial of service)
        When code sets the OWNER collaboration to PAUSED, straight in the database
        Then PostgreSQL rejects it with 23514
    implementation:
      create: [prisma/migrations/<timestamp>_org_022_collaboration_paused/migration.sql, tests/integration/organization/collaboration-paused.test.ts]
      modify: [prisma/schema.prisma]
      pattern: tests/integration/organization/amount-held.test.ts
      signatures: []
      types: []
      errors: []
      dependencies: [prisma, "@prisma/client"]
    security:
      - "v5.0.0-2.2.3: role and status are checked together in the database, so no code path can pause the owner."
    tests: |
      paused rows | integration | AC-1, C-42 | each Examples row → accepted or 23514
      owner stays active | integration | AC-2, C-42 | OWNER updated to PAUSED → 23514
      one owner | integration | AC-3, C-05 | paused manager + ACTIVE owner → one ACTIVE owner
      owner never paused | security | AB-1, CWE-20 | raw update of the owner to PAUSED → 23514
    command: npx vitest run tests/integration/organization/collaboration-paused.test.ts tests/integration/organization/collaboration-table.test.ts
    out_of_scope:
      - "Pausing and restoring members (ORG-035) and the limit rules (ORG-030)."
      - "Showing PAUSED in views and documents (ORG-036)."
  - id: ORG-023
    title: A one-time code can be tied to a business contact
    kind: migration
    size: XS
    risk: high
    depends_on: [ORG-021, AUTH-027]
    amends: [AUTH-001]
    read_first: [prisma/schema.prisma, tests/integration/auth/otp-table.test.ts]
    design_refs: [acces-et-securite/otpchallenge]
    constraints: [C-33]
    asvs: [v5.0.0-2.2.3]
    fields: ["OtpChallenge.organization_contact_id"]
    story: "Technical story: add to one-time codes the contact of a business they confirm, with the database rule that ties it to the purpose, so that a code for one contact cannot confirm another."
    context: |
      - Exists: `otp_challenges` (AUTH-001) and the purpose ORG_CONTACT_VERIFICATION (AUTH-027); `organization_contacts` (ORG-021).
      - Adds one migration, run in one transaction: `organization_contact_id` (uuid, empty by default, FK to `organization_contacts`) and a CHECK (C-33): it is set exactly when `purpose = 'ORG_CONTACT_VERIFICATION'`.
      - Existing rows have no contact and none uses this purpose yet, so the CHECK already holds: no audit is needed.
      - That `target` equals the value of the contact is not a database rule (it spans two tables): the callers check it (ORG-024, ORG-026).
      - `prisma/schema.prisma`: add the field to `model OtpChallenge`, and to the `//` comment above it, in plain words: a code for a business contact belongs to that one contact, because two businesses may show the same number; migration `org_023_otp_contact_link`.
    acceptance: |
      Scenario Outline: AC-1 The id goes with the purpose
        When a challenge is inserted with purpose <purpose> and <contact>
        Then the database <result>
        Examples:
          | purpose                  | contact       | result          |
          | ORG_CONTACT_VERIFICATION | a contact id  | accepts         |
          | ORG_CONTACT_VERIFICATION | no contact id | rejects (23514) |
          | LOGIN                    | a contact id  | rejects (23514) |
          | LOGIN                    | no contact id | accepts         |
      Scenario: AC-2 The contact must exist
        When a challenge is inserted with an unknown contact id
        Then the database rejects it with 23503
    abuse: |
      Scenario: AB-1 A login code is reused for a contact (spoofing)
        When code inserts a LOGIN challenge that carries a contact id, straight in the database
        Then PostgreSQL rejects it with 23514
    implementation:
      create: [prisma/migrations/<timestamp>_org_023_otp_contact_link/migration.sql, tests/integration/auth/otp-contact-link.test.ts]
      modify: [prisma/schema.prisma]
      pattern: tests/integration/auth/otp-table.test.ts
      signatures: []
      types: []
      errors: []
      dependencies: [prisma, "@prisma/client"]
    security:
      - "v5.0.0-2.2.3: purpose and contact id are checked together in the database."
    tests: |
      id and purpose | integration | AC-1, C-33 | each Examples row → accepted or 23514
      known contact | integration | AC-2, C-33 | unknown contact id → 23503
      login code with a contact | security | AB-1, CWE-345 | raw insert → 23514
    command: npx vitest run tests/integration/auth/otp-contact-link.test.ts tests/integration/auth/otp-table.test.ts
    out_of_scope:
      - "Issuing and verifying such codes (ORG-041)."
  - id: ORG-041
    title: A contact code names the business and serves one contact
    kind: change
    size: S
    risk: high
    depends_on: [ORG-023, AUTH-003]
    amends: [AUTH-002, AUTH-003]
    read_first: [src/modules/auth/otp.service.ts, tests/integration/auth/otp-issue.test.ts]
    design_refs: [acces-et-securite/otpchallenge, identite-et-organisation/organizationcontact]
    constraints: [C-33]
    asvs: [v5.0.0-6.6.3]
    story: "Technical story: let issueCode and verifyCode work on one contact of a business, with the fixed text that names the business, so that a code given for one contact cannot confirm another."
    context: |
      - Exists: `issueCode`, `verifyCode` in `src/modules/auth/otp.service.ts`; `findLatest(target, purpose)` and the type `OtpPurpose` in `otp.repository.ts`; the column from ORG-023.
      - `IssueCodeInput` gains `contact?: { id: string; organizationName: string }`: required with the purpose ORG_CONTACT_VERIFICATION, refused with any other (an `Error`, a programming mistake, never user input). The row keeps the contact id. The language is the one of `personId`, the owner.
      - The text is fixed. FR: `Code 482913. Boutique Fotso veut afficher ce numéro comme contact sur Distribo. Ne donnez ce code que si vous acceptez.` EN: `Code 482913. Boutique Fotso wants to show this number as a contact on Distribo. Only give this code if you agree.` For an email, "ce numéro" becomes "cette adresse" and "this number" "this address" (open question).
      - The business name is cleaned: control characters removed, cut at 40 characters, so a name cannot add lines or a second message.
      - `verifyCode` takes `organizationContactId`, and `findLatest` filters by it when given. Refused with 400 OTP_INVALID: the purpose without the id, or another purpose with one.
      - This ships before its first use (ORG-024, ORG-025).
    acceptance: |
      Scenario: AC-1 The text names the business
        When issueCode runs for a contact of "Boutique Fotso" by SMS
        Then the queued message is the fixed text with the 6-digit code, in French or English
        And the challenge row keeps the contact id
      Scenario: AC-2 The name is cleaned
        When the business name holds a line break and 60 characters
        Then the message holds no control character and 40 characters of the name
      Scenario: AC-3 A code serves one contact
        Given two contacts show the same number and a code was issued for the first
        When verifyCode is called with the second contact id and the right code
        Then it throws 400 OTP_INVALID
        And with the first contact id it succeeds
      Scenario: AC-4 Wrong pairing
        When verifyCode is called for ORG_CONTACT_VERIFICATION without an id, or for LOGIN with one
        Then it throws 400 OTP_INVALID
      Scenario: AC-5 Other purposes unchanged
        When the tests of otp-issue and otp-verify run
        Then they pass as before
    abuse: |
      Scenario: AB-1 A code given for one business confirms another (spoofing)
        Given the same number is a pending contact of two businesses
        When the code issued for business A is entered for the contact of business B
        Then it is refused and B stays pending
    implementation:
      create: [tests/integration/auth/otp-contact-code.test.ts]
      modify: [src/modules/auth/otp.service.ts, src/modules/auth/otp.repository.ts]
      pattern: tests/integration/auth/otp-issue.test.ts
      signatures:
        - "issueCode(input: IssueCodeInput, clientKeys?: ClientKeys): Promise<{ challengeId: string; expiresAt: Date }>"
        - "verifyCode(input: { target: string; purpose: OtpPurpose; code: string; organizationContactId?: string }): Promise<{ challengeId: string; personId: string | null }>"
        - "contactCodeMessage(code: string, language: 'FR' | 'EN', organizationName: string, channel: 'SMS' | 'EMAIL'): string"
      types:
        - "OtpPurpose gains 'ORG_CONTACT_VERIFICATION'"
      errors: ["OTP_INVALID 400"]
      dependencies: ["@prisma/client"]
    security:
      - "v5.0.0-6.6.3: a code stays limited to 5 attempts and one use, and is now tied to one contact."
    tests: |
      fixed text | integration | AC-1 | message equals the French and the English text; row has the contact id
      clean name | unit | AC-2 | line break removed, name of 60 characters cut to 40
      one contact | integration | AC-3, C-33 | code of A with the id of B → 400 OTP_INVALID; with the id of A → success
      wrong pairing | integration | AC-4 | both cases → 400 OTP_INVALID
      others unchanged | integration | AC-5 | otp-issue and otp-verify pass
      cross-business code | security | AB-1, CWE-345 | code of A entered for B → refused, B stays pending
    command: npx vitest run tests/integration/auth/otp-contact-code.test.ts tests/integration/auth/otp-issue.test.ts tests/integration/auth/otp-verify.test.ts
    out_of_scope:
      - "The routes that issue and confirm contact codes (ORG-024, ORG-025, ORG-026)."
      - "The purpose ACCESS_RESTORE in the TypeScript type: it ships with the administrator story that uses it."
    tests_to_update:
      - "tests/integration/auth/otp-issue.test.ts | line 53 matches the French text of a code sent for another purpose | unchanged"
      - "tests/integration/auth/otp-verify.test.ts | verifies codes without a contact id for other purposes | unchanged: the id is refused only for another purpose than ORG_CONTACT_VERIFICATION"
  - id: ORG-040
    title: The owner rules for the team and the contacts are written out
    kind: change
    size: S
    risk: high
    depends_on: [ACC-008, ORG-007, ORG-009, ORG-010]
    amends: [ACC-005, ORG-007, ORG-009, ORG-010]
    read_first: [src/shared/access/ability.ts, tests/unit/access/ability.test.ts]
    design_refs: [annexe-la-table-des-regles/qui-et-ou, annexe-la-table-des-regles/extrait-du-fichier]
    constraints: []
    asvs: [v5.0.0-8.2.1, v5.0.0-15.3.3]
    story: "Technical story: replace the single manage rule on the team with the rows the design lists, and add the rows for business contacts, so that the fields an owner may write are named."
    context: |
      - Exists: `{ who: OWNER, where: ONLINE_FOR_ALL, action: manage, subject: Collaboration }` in `src/shared/access/ability.ts`; the invite POST, the role PATCH and the revoke DELETE of `organization.routes.ts` call `requireAbility('manage', 'Collaboration')`.
      - Replaces it by two OWNER rows, ONLINE_FOR_ALL: `create` Collaboration with fields `['role']` (invite) and `update` Collaboration with fields `['role', 'status']` (change a role, revoke). The three routes call `create` for the invite and `update` for the other two.
      - Adds two OWNER rows, ONLINE_FOR_ALL: `create` and `delete` on OrganizationContact with fields `['kind', 'slot', 'value']`. They ship before their first use (ORG-024, ORG-027).
      - Unchanged: `manage Subscription` (BIL-006 removes it), `transfer_ownership`, `close`, `reopen`.
      - No route changes its answer: owner and network allowed, everyone else 403 FORBIDDEN.
    acceptance: |
      Scenario Outline: AC-1 The owner's rows
        When abilityFor is built for <role> with <ctx>
        Then can(<action>, <subject>) is <result>
        Examples:
          | role    | ctx     | action | subject             | result |
          | OWNER   | online  | create | Collaboration       | true   |
          | OWNER   | online  | update | Collaboration       | true   |
          | OWNER   | online  | create | OrganizationContact | true   |
          | OWNER   | online  | delete | OrganizationContact | true   |
          | OWNER   | offline | create | OrganizationContact | false  |
          | OWNER   | offline | update | Collaboration       | false  |
          | MANAGER | online  | update | Collaboration       | false  |
          | MANAGER | online  | create | OrganizationContact | false  |
      Scenario: AC-2 Writable fields are named
        Given the OWNER online
        Then `update` is allowed on the fields role and status of Collaboration, not on amount_held
        And `create` is allowed on the field role of Collaboration, not on status
      Scenario: AC-3 No manage left on the team
        Then can('manage', 'Collaboration') is false for every role and context
        And no row of `RULES` names `manage` with the subject Collaboration
      Scenario: AC-4 The routes keep their answers
        When the tests of invite, change-role and revoke run
        Then they pass as before
    abuse: |
      Scenario: AB-1 A manager changes the team or the contacts (elevation)
        Given a MANAGER, online
        When abilityFor is built
        Then it cannot create or update Collaboration, nor create or delete OrganizationContact
    implementation:
      create: [tests/unit/access/owner-rules.test.ts]
      modify: [src/shared/access/ability.ts, src/modules/organization/organization.routes.ts]
      pattern: src/shared/access/roles.ts
      signatures: []
      types: []
      errors: []
      dependencies: ["@casl/ability"]
    security:
      - "v5.0.0-8.2.1: the team and contact gestures stay owner-only, online, and refused for every other role."
      - "v5.0.0-15.3.3: the fields an owner may write on a collaboration or a contact are listed per action."
    tests: |
      owner rows | unit | AC-1 | each Examples row → result
