  - id: ORG-038
    title: Server-side writer of the business logo key
    kind: technical
    size: XS
    risk: medium
    depends_on: [ORG-020, FND-013]
    read_first: [src/modules/organization/organization.repository.ts, docs/stories/modules/foundation/contracts.md]
    design_refs: [identite-et-organisation/organization, images/stockage]
    constraints: [C-49]
    asvs: [v5.0.0-15.3.3, v5.0.0-2.2.3]
    fields: ["Organization.logo_key"]
    story: "Technical story: provide the two functions that read and write a business logo key, the write handing back the previous key, so that the images module can delete the old file after the commit."
    context: |
      - Exists: the column `logo_key`, unique (ORG-020); `imageKeySchema` and the folder `logos` (FND-013).
      - Adds to `organization.repository.ts`: `getLogoKey(organizationId)` (null when empty or the organization is absent or deleted) and `setLogoKey(tx, organizationId, key)`: in the caller's transaction it locks the organization row, reads the previous key, writes the new one (`null` clears it) and returns the previous key.
      - Only the server calls them: the logo routes of the images module (IMG). No organization schema accepts a key.
      - A key must match `imageKeySchema` and start with `logos/`; otherwise a RangeError is thrown and nothing is written. A key already held by another business is refused by the unique index and the error is not caught.
      - First usage: IMG (logo upload and removal). It ships here because the images module may import `organization` only through its contract (ADR-004).
    acceptance: |
      Scenario Outline: AC-1 Set, replace and clear
        Given a business whose logo key is <before>
        When `setLogoKey` is called with <given>
        Then it returns <returned> and `getLogoKey` returns <given>
        Examples:
          | before | given | returned |
          | empty  | key A | null     |
          | key A  | key B | key A    |
          | key B  | null  | key B    |
      Scenario: AC-2 Unknown or deleted business
        When `setLogoKey` is called with such an id
        Then it fails with 404 `NOT_FOUND` and `getLogoKey` returns null
      Scenario: AC-3 One file, one business
        Given business X holds key A
        When `setLogoKey` gives key A to business Y
        Then it fails with unique violation 23505 and Y's key is unchanged
      Scenario: AC-4 Same transaction as the caller
        Given the caller's transaction is rolled back after `setLogoKey`
        Then the stored key is the one from before
      Scenario: AC-5 Two replacements at once
        Given a business holds key A
        When two calls replace it with key B and key C at the same time
        Then one returns key A and the other returns the key the first wrote
    abuse: |
      Scenario: AB-1 A key from another folder or a crafted key (tampering)
        When `setLogoKey` receives `avatars/<uuid>.webp`, `logos/../x.webp` or an uppercase UUID
        Then it throws a RangeError and the stored key is unchanged
      Scenario: AB-2 An owner sends a key in a request (tampering)
        When the creation request carries `logo_key`
        Then the answer is 400 VALIDATION_ERROR and no business is created
    implementation:
      create: [tests/integration/organization/logo-key-writer.test.ts]
      modify: [src/modules/organization/organization.repository.ts]
      pattern: src/modules/person/person.repository.ts
      signatures:
        - "getLogoKey(organizationId: string): Promise<string | null>"
        - "setLogoKey(tx: Prisma.TransactionClient, organizationId: string, key: string | null): Promise<string | null>"
      types: []
      errors: ["NOT_FOUND 404"]
      dependencies: ["@prisma/client"]
    security:
      - "v5.0.0-15.3.3: the logo key has exactly one writer, and it validates the key."
      - "v5.0.0-2.2.3: the row is locked before the previous key is read, so two writers never return the same previous key."
    tests: |
      set replace clear | integration | AC-1 | each Examples row → returned and stored values
      unknown business | integration | AC-2 | random and deleted ids → 404, null
      shared file | integration | AC-3, C-49 | key A on Y → 23505, key unchanged
      same transaction | integration | AC-4 | rollback after the call → previous key stored
      concurrent | integration | AC-5 | `Promise.all` of two replacements → A and the first writer's key
      crafted key | security | AB-1, CWE-22 | the three values → RangeError and key unchanged
      key in the body | security | AB-2, CWE-915 | 400, no row
    command: npx vitest run tests/integration/organization/logo-key-writer.test.ts
    out_of_scope:
      - "Receiving, re-encoding and storing the file, and deleting the previous file: IMG."
      - "Checking that the key is not cited by another card: IMG."
  - id: ORG-044
    title: Billing finds a business by its payment code and its owner
    kind: technical
    size: XS
    risk: low
    depends_on: [ORG-020, ORG-035]
    read_first: [src/modules/organization/organization.repository.ts]
    design_refs: [identite-et-organisation/organization]
    constraints: [C-41]
    asvs: [v5.0.0-8.2.1]
    story: "Technical story: let billing find a business from the code typed on the payment site, and find its owner, through functions of the organization contract."
    context: |
      - Exists: `payment_code`, unique (ORG-020); `findActiveOwnerId(tx, organizationId)` in `organization.repository.ts`, not yet in the contract.
      - Adds `findOrganizationByPaymentCode(code, tx?)`: the id, name and status of the non-deleted organization whose `payment_code` equals `code` exactly, else null. It does not trim or change case: the caller does (BIL-007).
      - Adds `findOrganizationSummary(organizationId, tx?)`: the same three fields by id, null when absent or deleted.
      - The contract lists these three functions for billing. Shipped before their callers; the tests call them directly.
    acceptance: |
      Scenario: AC-1 A code finds its business
        When `findOrganizationByPaymentCode` receives the exact code of a business
        Then it returns that business's id, name and status
      Scenario Outline: AC-2 No business
        When `findOrganizationByPaymentCode` receives <code>
        Then it returns null
        Examples:
          | code                                  |
          | a code that no business holds         |
          | the code of a deleted business        |
          | the right code in lower case          |
      Scenario: AC-3 Summary and owner
        When `findOrganizationSummary` and `findActiveOwnerId` run for a business, and the first runs for a deleted one
        Then they return its id, name and status and its OWNER's person id, and null for the deleted one
    implementation:
      create: [tests/integration/organization/payment-code-lookup.test.ts]
      modify: [src/modules/organization/organization.repository.ts]
      pattern: tests/integration/organization/amount-held.test.ts
      signatures:
        - "findOrganizationByPaymentCode(code: string, tx?: Prisma.TransactionClient): Promise<OrganizationSummary | null>"
        - "findOrganizationSummary(organizationId: string, tx?: Prisma.TransactionClient): Promise<OrganizationSummary | null>"
      types:
        - "OrganizationSummary = { id: string; name: string; status: 'ACTIVE' | 'SUSPENDED' | 'CLOSED' }"
      errors: []
      dependencies: []
    security:
      - "v5.0.0-8.2.1: the functions return three fields and nothing of the plan or the team; no route exposes it before BIL-007."
    tests: |
      found | integration | AC-1, C-41 | exact code → id, name, status
      absent | integration | AC-2 | each Examples row → null
      summary and owner | integration | AC-3 | summary, OWNER id, null for a deleted business
    command: npx vitest run tests/integration/organization/payment-code-lookup.test.ts
    out_of_scope:
      - "Reading the code typed by a person and the route: BIL-007."

  - id: ORG-045
    title: Billing reads the plan fields and lists businesses by plan date
    kind: technical
    size: XS
    risk: low
    depends_on: [ORG-044]
    read_first: [src/modules/organization/organization.repository.ts]
    design_refs: [identite-et-organisation/organization]
    constraints: [C-41, C-42]
    asvs: [v5.0.0-8.2.1]
    story: "Technical story: let billing read the plan fields of a business and list, page by page, the businesses whose plan dates are past or near, or whose team is larger than their limit, so that its daily jobs touch only those."
    context: |
      - Exists: the plan columns and `listTeamSeats` (ORG-035), in `organization.repository.ts`.
      - Adds `readPlanFields(tx, organizationId)`: the five plan fields (`PlanFields`, ORG-035) of a non-deleted business, else null. Billing compares them with the new rights to journal a change (BIL-028).
      - Adds `listOrganizationsToRefresh(now, limit, afterId?)`: the ids of non-deleted businesses, ascending by id, after `afterId`, at most `limit` (1 to 500), that match one of:
        - the plan is not FREE and `COALESCE(grace_ends_at, plan_ends_at)` is not after `now`;
        - `max_collaborators` is set and the non-owner collaborations ACTIVE or INVITED number more than it.
      - Adds `listOrganizationsEnding(from, to, limit, afterId?)`: the same kind of page for non-deleted businesses whose plan is not FREE and `plan_ends_at` is at or after `from` and before `to`.
      - All three read only; the callers act on each business in its own transaction (BIL-039, BIL-026). The contract lists them for billing, shipped before their callers.
    acceptance: |
      Scenario Outline: AC-1 Who is listed
        Given a business with <state>
        When `listOrganizationsToRefresh` runs
        Then the business is <listed>
        Examples:
          | state                                                  | listed     |
          | ESSENTIAL and `plan_ends_at` in the past, no grace     | listed     |
          | ESSENTIAL in grace until a future date                 | not listed |
          | ESSENTIAL and `grace_ends_at` in the past              | listed     |
          | PRO until a future date, 3 seats, limit 10             | not listed |
          | limit 2 and 3 seats ACTIVE or INVITED                  | listed     |
          | limit 2, 1 ACTIVE seat and 2 PAUSED ones              | not listed |
          | FREE, limit 2, 2 seats                                 | not listed |
          | a deleted business that would be listed                | not listed |
      Scenario: AC-2 Pages
        Given 5 businesses to refresh
        When the function runs with `limit` 2, then with the last id it returned
        Then it returns 2 ids, then the next 2 ids, ascending, and the third call returns the last one
      Scenario: AC-3 Ending between two dates
        Given businesses ending before, at, inside and at the end of the range, a FREE one, and a deleted one
        When `listOrganizationsEnding(from, to, 10)` runs
        Then it returns the ones ending at `from` or inside, ascending by id, and no other
      Scenario: AC-4 The plan fields
        When `readPlanFields` runs for a business, a deleted one and an unknown id
        Then it returns the five fields of the first and null for the other two
    implementation:
      create: [tests/integration/organization/refresh-list.test.ts]
      modify: [src/modules/organization/organization.repository.ts]
      pattern: tests/integration/organization/amount-held.test.ts
      signatures:
        - "readPlanFields(tx: Prisma.TransactionClient, organizationId: string): Promise<PlanFields | null>"
        - "listOrganizationsToRefresh(now: Date, limit: number, afterId?: string): Promise<string[]>"
        - "listOrganizationsEnding(from: Date, to: Date, limit: number, afterId?: string): Promise<string[]>"
      types: []
      errors: []
      dependencies: []
    security:
      - "v5.0.0-8.2.1: the lists return ids only and no route exposes any of the three functions."
    tests: |
      who | integration | AC-1, C-41, C-42 | each Examples row → listed or not
      pages | integration | AC-2 | limit 2 → ids ascending, no repeat
      ending | integration | AC-3 | range [from, to) → ids, FREE and deleted left out
      plan fields | integration | AC-4 | five fields, null for deleted and unknown
    command: npx vitest run tests/integration/organization/refresh-list.test.ts
    out_of_scope:
      - "Refreshing the rights and the daily job: BIL-028, BIL-039."
