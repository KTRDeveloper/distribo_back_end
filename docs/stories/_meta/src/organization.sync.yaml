  - id: ORG-033
    title: A new owner is asked to review the public contacts
    kind: change
    size: S
    risk: medium
    depends_on: [ORG-015, ORG-024, NTF-002]
    amends: [ORG-015]
    read_first: [src/modules/organization/organization.service.ts, src/modules/organization/organization-contact.repository.ts]
    design_refs: [identite-et-organisation/collaboration, identite-et-organisation/organizationcontact]
    constraints: [CM-37]
    asvs: [v5.0.0-8.2.1, v5.0.0-16.2.5]
    story: As an owner, I want a business I just received to ask me to review its public contacts so that the business is not found under the number of someone who left.
    context: |
      - Exists: `transferOwnership` (ORG-015) with its single transaction and the `ownership.received` notice; the contact repository (ORG-024); `toPublicPerson` (PER-005); `notify` and `recipientLanguage` (NTF).
      - Adds, after the existing notice and in the same transaction: when the business has at least one live contact (not deleted), the new owner gets one notification `organization.contacts_review`, related `{type: 'organization', id}`, in their language. Contacts are never changed by a transfer.
      - French: "Les contacts publics de {name} restent en place. Revoyez-les dans les reglages." English: "The public contacts of {name} stay in place. Review them in the settings."
      - Mention: when a live PHONE contact has `value` equal to the former owner's current number (`toPublicPerson(...).phone_number`), the text adds, in French, " Le contact {slot} est le numero de l'ancien proprietaire. Le garder ?" and in English " Contact {slot} is the former owner's number. Keep it?". The slot and the words "former owner" replace the number and the name of the design, so the stored notice holds no personal data (open question).
      - The former owner's email is never read, compared or written: only PHONE contacts can be mentioned.
      - Adds `listLiveContacts(tx, organizationId): Promise<{ kind; slot; value }[]>` to `organization-contact.repository.ts`. The former owner is read with the existing `findCollaborationWithPerson`.
    acceptance: |
      Scenario: AC-1 The new owner is asked to review
        Given a business with two live contacts
        When the owner transfers it to an ACTIVE manager
        Then the new owner has one unread `organization.contacts_review` related to the organization, besides `ownership.received`
        And the text is in their language and holds the business name
      Scenario: AC-2 No contact, no notice
        Given a business with no live contact, or only deleted ones
        When the ownership is transferred
        Then no `organization.contacts_review` exists
      Scenario: AC-3 The former owner's number is mentioned
        Given the live PHONE contact in slot 2 holds the former owner's number
        When the ownership is transferred
        Then the text ends with the mention naming contact 2
        And it holds neither that number nor the former owner's name
      Scenario Outline: AC-4 Other contacts get no mention
        Given the business has <case>
        When the ownership is transferred
        Then the notice has no mention
        Examples:
          | case                                                          |
          | a PHONE contact with another number                           |
          | an EMAIL contact equal to the former owner's email            |
          | a deleted contact with the former owner's number              |
      Scenario: AC-5 Contacts and the transfer stay as they are
        When the ownership is transferred
        Then every contact keeps its value, slot and verification
        And a failing notification rolls the transfer back
    abuse: |
      Scenario: AB-1 The private email leaks to the new owner (disclosure)
        Given an EMAIL contact equals the former owner's email
        When the ownership is transferred
        Then the notice does not contain that address, nor "@"
    implementation:
      create: [tests/integration/organization/transfer-contacts-review.test.ts]
      modify: [src/modules/organization/organization.service.ts, src/modules/organization/organization-contact.repository.ts]
      pattern: src/middleware/load-actor.ts
      signatures:
        - "listLiveContacts(tx: Prisma.TransactionClient, organizationId: string): Promise<{ kind: 'PHONE' | 'EMAIL'; slot: number | null; value: string }[]>"
      types: []
      errors: []
      dependencies: []
    security:
      - "v5.0.0-8.2.1: the organization comes from the loaded actor; contacts of another business are never read."
      - "v5.0.0-16.2.5: the notice carries no number, name or address."
    tests: |
      notice sent | integration | AC-1, CM-37 | two contacts → one notice, FR and EN, related organization
      none | integration | AC-2 | no contact or deleted ones → none
      mention | integration | AC-3 | slot 2 equals the former number → mention, no digits, no name
      no mention | integration | AC-4 | each Examples row → no mention
      unchanged and atomic | integration | AC-5 | contacts as before; notify fails → transfer rolled back
      private email | security | AB-1, CWE-200 | EMAIL equals his email → no address, no "@"
    command: npx vitest run tests/integration/organization/transfer-contacts-review.test.ts tests/integration/organization/transfer.test.ts
    out_of_scope:
      - "Keeping or removing a contact: ORG-025 to ORG-027."
      - "The notice for a recycled number: ORG-037."
    tests_to_update:
      - "tests/integration/organization/transfer.test.ts | counts the notifications after a transfer on a business with no public contact | unchanged: the review notice is sent only when a live contact exists"
  - id: ORG-034
    title: Closing and reopening a business run the lifecycle hooks
    kind: change
    size: S
    risk: high
    depends_on: [ORG-016, ORG-017, ORG-022, ORG-043]
    amends: [ORG-016, ORG-017]
    read_first: [src/modules/organization/organization.service.ts, src/modules/sync/sync.registry.ts]
    design_refs: [identite-et-organisation/organization]
    constraints: [CM-10]
    asvs: [v5.0.0-8.2.1, v5.0.0-2.3.3]
    story: As an owner, I want closing and reopening my business to end its team and its plans in one step so that nothing stays paid or active on a closed business.
    context: |
      - Exists: `closeOrganization` (one transaction) and `reopenOrganization` (one conditional update, no transaction); `PAUSED` since ORG-022.
      - Adds `src/modules/organization/lifecycle-hooks.ts`, patterned on the sync registry: `registerLifecycleHook({ onClose?, onReopen? })` stores a hook and returns a function that removes it; a hook with neither function throws. `runCloseHooks` and `runReopenHooks` call the hooks in registration order with `(tx, organizationId, now)`, in the caller's transaction; a failing hook aborts the operation.
      - `closeOrganization` runs the close hooks last, after the old subscription is ended.
      - `reopenOrganization` now runs in a transaction: `reopenClosedOrganization(tx, organizationId)`, then the reopen hooks, unless the update matched nothing.
      - `revokeNonOwnerCollaborations` also turns `PAUSED` non-owner rows into `REVOKED` (CM-10). Like `INVITED` rows they have no access: no scope bump, no notice.
    acceptance: |
      Scenario: AC-1 Close runs the close hooks
        Given two hooks registered in order
        When the owner closes the business
        Then both `onClose` run in that order with the transaction, the organization id and the time of the close
      Scenario: AC-2 A failing hook undoes the close
        Given an `onClose` that throws
        When the owner closes the business
        Then the answer is 500, the organization is still ACTIVE and nothing else changed
      Scenario: AC-3 Paused members are revoked
        Given a PAUSED seller and an ACTIVE manager
        When the owner closes the business
        Then both are REVOKED and the owner is unchanged
        And only the manager gets a scope bump and an `organization.closed` notice
      Scenario: AC-4 Reopen runs the reopen hooks in one transaction
        Given a CLOSED business and an `onReopen` that throws
        When the owner reopens it
        Then the answer is 500 and the business is still CLOSED
        And with a hook that does not throw, the business is ACTIVE and the hook ran once
      Scenario: AC-5 Refused calls run no hook
        When the owner closes a CLOSED or SUSPENDED business, or reopens an ACTIVE or SUSPENDED one
        Then the answer is 409 and no hook ran
      Scenario: AC-6 Registration
        When a hook with neither function is registered
        Then it throws
        And a hook removed with the returned function no longer runs
    abuse: |
      Scenario: AB-1 The owner lifts a moderation suspension (elevation)
        Given a SUSPENDED business with a reopen hook registered
        When its owner calls reopen
        Then the answer is 409, the status stays SUSPENDED and the hook did not run
    implementation:
      create: [src/modules/organization/lifecycle-hooks.ts, tests/integration/organization/lifecycle-hooks.test.ts]
      modify: [src/modules/organization/organization.service.ts, src/modules/organization/organization.repository.ts]
      pattern: src/modules/sync/sync.registry.ts
      signatures:
        - "registerLifecycleHook(hook: LifecycleHook): () => void"
        - "runCloseHooks(tx: Prisma.TransactionClient, organizationId: string, now: Date): Promise<void>"
        - "runReopenHooks(tx: Prisma.TransactionClient, organizationId: string, now: Date): Promise<void>"
        - "reopenClosedOrganization(tx: Prisma.TransactionClient, organizationId: string): Promise<boolean>"
      types:
        - "HookFn = (tx: Prisma.TransactionClient, organizationId: string, now: Date) => Promise<void>"
        - "LifecycleHook = { onClose?: HookFn; onReopen?: HookFn }"
      errors: ["ORGANIZATION_NOT_ACTIVE 409", "ORGANIZATION_NOT_CLOSED 409"]
      dependencies: []
    security:
      - "v5.0.0-8.2.1: the organization id given to a hook is the actor's, never one from the body."
      - "v5.0.0-2.3.3: the hooks run inside the transaction, so a failure leaves no half-closed business."
    tests: |
      close hooks | integration | AC-1, CM-10 | two hooks → called in order with tx, id and date
      failing close hook | integration | AC-2 | throw → 500 and every table as before
      paused members | integration | AC-3, CM-10 | PAUSED and ACTIVE → REVOKED; bump and notice for the ACTIVE one only
      reopen hooks | integration | AC-4 | throwing hook → CLOSED; normal hook → ACTIVE, one call
      refusals | integration | AC-5 | four cases → 409, no call
      registration | unit | AC-6 | empty hook throws; removed hook silent
      suspension kept | security | AB-1, CWE-285 | SUSPENDED → 409, no call
    command: npx vitest run tests/integration/organization/lifecycle-hooks.test.ts tests/integration/organization/close.test.ts tests/integration/organization/reopen.test.ts
    out_of_scope:
      - "Registering a hook: billing (BIL) ends the plans on close and keeps the free plan on reopen."
      - "Removing the old `subscriptions` call from close: BIL-005."
    tests_to_update:
      - "tests/integration/organization/close.test.ts | no collaboration is PAUSED | unchanged"
      - "tests/integration/organization/reopen.test.ts | reopens and refuses as before | unchanged"
  - id: ORG-035
    title: The organization lets billing write the plan and pause seats
    kind: technical
    size: S
    risk: high
    depends_on: [ORG-020, ORG-022, PER-005]
    read_first: [src/modules/organization/organization.repository.ts, src/modules/person/person.repository.ts]
    design_refs: [identite-et-organisation/organization, identite-et-organisation/collaboration]
    constraints: [C-41, C-42, CM-03]
    asvs: [v5.0.0-15.3.3, v5.0.0-8.2.1]
    story: "Technical story: give billing the only server-side gates on the plan fields of a business and on the pause of its team seats."
    context: |
      - Exists: the plan columns with their database rule (ORG-020), `PAUSED` (ORG-022), `bumpScopeVersion` (PER-005). Billing calls these functions later; no route does.
      - Adds to `organization.repository.ts`:
        - `writePlanFields(tx, organizationId, fields)`: writes `plan`, `plan_ends_at`, `grace_ends_at`, `max_collaborators`, `max_products` and nothing else; after creation nothing else writes them. The database refuses an invalid combination; the error is thrown.
        - `listTeamSeats(tx, organizationId)`: non-owner, non-deleted ACTIVE, INVITED or PAUSED collaborations, oldest `invited_at` first, then `id`.
        - `setSeatPaused(tx, collaborationId, paused)`: `true` turns ACTIVE or INVITED into PAUSED; `false` turns PAUSED into ACTIVE, or INVITED when `accepted_at` is empty. Never the OWNER, a REVOKED or a deleted row. A change bumps the person's `scope_version` and returns true.
      - Shipped before its caller; the tests call it directly.
    acceptance: |
      Scenario: AC-1 The plan fields are written alone
        When `writePlanFields` receives ESSENTIAL with an end date, no grace, 5 collaborators and no product limit
        Then those five columns hold the values and no other column changes
      Scenario Outline: AC-2 The database refuses an impossible plan
        When `writePlanFields` receives <fields>
        Then it throws and the row is unchanged
        Examples:
          | fields                                          |
          | FREE with an end date                           |
          | PRO without an end date                         |
          | a grace end not after the plan end              |
      Scenario: AC-3 The seat list
        Given an owner, ACTIVE, INVITED, PAUSED, REVOKED and deleted seats, and a seat of another business
        When `listTeamSeats` runs
        Then it returns the ACTIVE, INVITED and PAUSED ones, oldest invitation first
      Scenario: AC-4 Pause
        When `setSeatPaused(true)` runs on an ACTIVE and on an INVITED seat
        Then both are PAUSED, each person's `scope_version` is +1 and the result is true
      Scenario Outline: AC-5 Resume
        When `setSeatPaused(false)` runs on a PAUSED seat with <accepted>
        Then its status is <status> and `scope_version` is +1
        Examples:
          | accepted             | status  |
          | `accepted_at` set    | ACTIVE  |
          | `accepted_at` empty  | INVITED |
      Scenario Outline: AC-6 Nothing to change
        When `setSeatPaused` runs on <row>
        Then the result is false and nothing changes
        Examples:
          | row                                   |
          | the OWNER, paused: true               |
          | a REVOKED or a deleted seat          |
          | an ACTIVE seat, paused: false         |
    abuse: |
      Scenario: AB-1 An owner picks a bigger plan (elevation)
        When the creation request carries `plan` or `max_collaborators`
        Then the answer is 400 VALIDATION_ERROR and no business is created
    implementation:
      create: [tests/integration/organization/subscription-fields.test.ts]
      modify: [src/modules/organization/organization.repository.ts]
      pattern: src/modules/person/person.repository.ts
      signatures:
        - "writePlanFields(tx: Prisma.TransactionClient, organizationId: string, fields: PlanFields): Promise<void>"
        - "listTeamSeats(tx: Prisma.TransactionClient, organizationId: string): Promise<TeamSeat[]>"
        - "setSeatPaused(tx: Prisma.TransactionClient, collaborationId: string, paused: boolean): Promise<boolean>"
      types:
        - "PlanFields = { plan: 'FREE' | 'ESSENTIAL' | 'PRO' | 'ENTERPRISE'; planEndsAt: Date | null; graceEndsAt: Date | null; maxCollaborators: number | null; maxProducts: number | null }"
        - "TeamSeat = { id; personId; role; status: 'ACTIVE' | 'INVITED' | 'PAUSED'; invitedAt: Date; acceptedAt: Date | null }"
      errors: []
      dependencies: []
    security:
      - "v5.0.0-15.3.3: after creation the five plan columns have this one writer; no request field reaches them."
      - "v5.0.0-8.2.1: the seat query is bound to the organization given by server code."
    tests: |
      write alone | integration | AC-1, C-41 | five columns written, others unchanged
      impossible plan | integration | AC-2, C-41 | each Examples row → throws
      seat list | integration | AC-3 | rows and order
      pause | integration | AC-4, C-42, CM-03 | PAUSED, bump, true
      resume | integration | AC-5, C-42, CM-03 | each Examples row → status, bump
      no change | integration | AC-6, C-42 | each Examples row → false
      plan in the body | security | AB-1, CWE-915 | 400, no row
    command: npx vitest run tests/integration/organization/subscription-fields.test.ts
    out_of_scope:
      - "Computing the plan, choosing who is paused, telling people: billing."
  - id: ORG-036
    title: A paused team member is listed, can be changed or revoked, and has no access
    kind: change
    size: S
    risk: medium
    depends_on: [ORG-022, ORG-034, PER-011]
    amends: [ORG-007, ORG-009, ORG-010, ORG-019]
    read_first: [src/modules/organization/organization.service.ts, src/modules/organization/organization.repository.ts]
    design_refs: [identite-et-organisation/collaboration]
    constraints: [CM-03]
    asvs: [v5.0.0-8.2.1, v5.0.0-15.3.1]
    story: As an owner, I want my paused team members to stay in the team list and be manageable so that I can change their role or remove them.
    context: |
      - Exists: `PAUSED` in the database (ORG-022). A PAUSED member keeps their row and their held money but has no access: `loadActor` accepts ACTIVE only.
      - Team list: PAUSED rows already come back; the type `CollaboratorItem` and the OpenAPI enum must say `PAUSED`. `person` now carries `avatar_url` (PER-011): add it to the types and to the OpenAPI person objects of the team list, the invite answer and the role-change answer.
      - `changeRole`: `updateRole` also matches PAUSED. A PAUSED target gets the new role and no scope bump, no notice (no right changes, as for INVITED); the answer shows `status` `PAUSED` (`CollaborationView.status` and its OpenAPI enum gain it).
      - `revokeCollaboration` also matches PAUSED: REVOKED, amount kept, no bump, no notice. Answer 204 as before.
      - `anonymizeRows` in `privacy.repository.ts` also revokes PAUSED rows, so a later resume never reactivates a deleted person.
      - Not here: a PAUSED payer or remitter in finance (FIN stories); who becomes PAUSED (ORG-035, billing).
    acceptance: |
      Scenario: AC-1 The list shows paused members
        Given an ACTIVE, a PAUSED and a REVOKED member
        When the owner lists the team
        Then the PAUSED item has `status` PAUSED and a `person` with `avatar_url`
      Scenario: AC-2 The role of a paused member
        When the owner changes the role of a PAUSED member
        Then the answer is 200 with `status` PAUSED and the new role
        And `scope_version` is unchanged and no notification exists
      Scenario: AC-3 Revoking a paused member
        When the owner revokes a PAUSED member
        Then the answer is 204, the row is REVOKED and `amount_held` is kept
        And `scope_version` is unchanged and no notification exists
      Scenario: AC-4 Anonymization ends a paused seat
        When the person of a PAUSED member is anonymized
        Then the collaboration is REVOKED
      Scenario: AC-5 The documentation says so
        When the OpenAPI document is read
        Then the team-list `status` enum and the role-change `status` enum contain PAUSED
        And the `person` of the team list, the invite answer and the role-change answer has `avatar_url`
    abuse: |
      Scenario: AB-1 A paused member keeps working (elevation)
        Given a PAUSED seller
        When they list the team, open the business or read their organizations
        Then the first two answer 404 NOT_FOUND and the business is absent from the third
    implementation:
      create: [tests/integration/organization/paused-seats.test.ts]
      modify: [src/modules/organization/organization.service.ts, src/modules/organization/organization.repository.ts, src/modules/organization/organization.schemas.ts, src/modules/organization/organization.openapi.ts, src/modules/privacy/privacy.repository.ts]
      pattern: src/middleware/load-actor.ts
      signatures: []
      types:
        - "CollaborationView.status = 'INVITED' | 'ACTIVE' | 'PAUSED'"
        - "person = { public_name: string | null; phone_number: string | null; registered: boolean; avatar_url: string | null }"
      errors: []
      dependencies: []
