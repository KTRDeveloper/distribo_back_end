  - id: AUTH-008
    title: Issue and revoke sessions
    kind: technical
    size: M
    risk: high
    depends_on: [AUTH-007, AUTH-006, AUTH-005]
    read_first: [src/lib/refresh-token.ts, src/config/env.ts]
    design_refs: [acces-et-securite/device, acces-et-securite/refreshtoken]
    constraints: [CM-08, C-34]
    asvs: [v5.0.0-7.2.2, v5.0.0-7.2.4, v5.0.0-7.4.2]
    story: "Technical story: open a session (device, refresh token, access token) and end sessions, so that every sign-in path creates and ends sessions the same way."
    context: |
      - Exists: tables (AUTH-007); `signAccessToken` (AUTH-006); `generateRefreshToken`, `hashRefreshToken` in `src/lib/refresh-token.ts`; env `REFRESH_TOKEN_EXPIRES_IN_DAYS` (default 30 today).
      - Adds: `src/modules/auth/session.repository.ts` and `session.service.ts`; `REFRESH_TOKEN_EXPIRES_IN_DAYS` defaults to 90 in `src/config/env.ts`.
      - `issueSession(personId, device, tx?)` creates a `Device` from `DeviceInfo = { platform: ANDROID|IOS; model?: string(100); app_version: string(32); push_token?: string(512); integrity_verdict?: string(100) }`, one refresh token expiring in 90 days, and an access token; returns `{ deviceId, accessToken, refreshToken, expiresIn }`.
      - `revokeSessions(personId, reason, { exceptDeviceId? })` sets `revoked_at` on the person's live devices and `revoked_at` and `revoked_reason` on their live refresh tokens, and returns the number of devices ended.
    acceptance: |
      Scenario: AC-1 Issue
        When issueSession runs for a registered person with device info
        Then one device and one refresh token exist, the token hash is the SHA-256 of the returned refresh token, `expires_at` is 90 days ahead, and the access token carries the person id and device id
      Scenario: AC-2 One device per session
        When issueSession runs twice for the same person
        Then two devices and two refresh tokens exist
      Scenario Outline: AC-3 Revoke
        Given a person with devices A, B and C
        When revokeSessions is called with reason <reason> and exceptDeviceId <except>
        Then <ended> devices end and the ended devices' tokens carry the reason
        Examples:
          | reason         | except | ended |
          | LOGOUT_ALL     | none   | 3     |
          | PASSWORD_RESET | B      | 2     |
      Scenario: AC-4 Only the named person
        When revokeSessions runs for person X
        Then the devices of person Y are unchanged
      Scenario: AC-5 Invalid device info
        When platform is "WINDOWS" or app_version is empty
        Then issueSession throws `httpError(400, 'VALIDATION_ERROR', ...)` and creates nothing
    abuse: |
      Scenario: AB-1 Reading a refresh token from the database (information disclosure)
        When the tables are dumped
        Then no refresh token can be derived without the raw value
    implementation:
      create: [src/modules/auth/session.repository.ts, src/modules/auth/session.service.ts, tests/integration/auth/session-service.test.ts]
      modify: [src/config/env.ts]
      pattern: src/modules/tasks/tasks.repository.ts
      signatures:
        - "issueSession(personId: string, device: DeviceInfo, tx?: Prisma.TransactionClient): Promise<{ deviceId: string; accessToken: string; refreshToken: string; expiresIn: number }>"
        - "revokeSessions(personId: string, reason: RevokedReason, options?: { exceptDeviceId?: string }): Promise<number>"
      types:
        - "RevokedReason = 'LOGOUT' | 'DEVICE_REMOVED' | 'LOGOUT_ALL' | 'REUSE_DETECTED' | 'PASSWORD_RESET' | 'ACCOUNT_SUSPENDED'"
        - "DeviceInfo = { platform: 'ANDROID' | 'IOS'; model?: string; app_version: string; push_token?: string; integrity_verdict?: string }"
      errors: ["VALIDATION_ERROR 400"]
      dependencies: [jsonwebtoken, zod, "@prisma/client"]
    security:
      - "v5.0.0-7.2.4: every sign-in creates a new device, refresh token and access token."
      - "v5.0.0-7.4.2: `revokeSessions` ends all live sessions of a person in one transaction."
      - "v5.0.0-7.2.2: the refresh token is 32 random bytes; only its SHA-256 is stored."
    tests: |
      issue | integration | AC-1, CM-08 | session → rows, hash matches, 90 days, claims
      two sessions | integration | AC-2 | two calls → 2 devices, 2 tokens
      revoke | integration | AC-3, C-34 | each Examples row → count and reasons
      other person | integration | AC-4 | Y unchanged
      invalid device | integration | AC-5 | bad platform, empty version → 400, no rows
      hash only | security | AB-1, CWE-312 | dump refresh_tokens → no column equals the raw token
    command: npx vitest run tests/integration/auth/session-service.test.ts
    out_of_scope:
      - "Rotation at refresh (AUTH-015). Routes (later stories)."
  - id: AUTH-009
    title: Visitor asks for a registration code
    kind: feature
    size: S
    risk: high
    depends_on: [AUTH-004, PER-005, NTF-002]
    read_first: [src/modules/person/person.repository.ts, src/modules/auth/otp.service.ts]
    design_refs: [identite-et-organisation/person]
    constraints: [CM-07]
    asvs: [v5.0.0-6.6.1, v5.0.0-2.4.1, v5.0.0-6.3.8]
    story: As a visitor, I want a code sent to my phone number so that I can prove the number is mine before registering.
    context: |
      - Exists: `issueCode` with caps (AUTH-004); `findByActivePhone`, `normalizeE164`, `isCameroonMobile`.
      - Adds: `POST /api/v1/auth/register/request` with body `{ phone_number }`; response 202 `{ sent: true, expires_in: 600, existing_account: null | { masked_name } }`.
      - The code goes to the number in every case, with purpose REGISTRATION; `personId` is the holder's id when the number has an active holder, else null.
      - `existing_account` is set only when the holder is registered; `masked_name` = first word of `full_name` in full, then the first letter of each further word and "…" (for one word: its first letter and "…"). Example: "Béatrice Ngono" gives "Béatrice N…". This is the one deliberate disclosure the design makes.
    acceptance: |
      Scenario: AC-1 Unknown number
        When a visitor posts "6 77 12 34 56"
        Then the response is 202 with existing_account null and one REGISTRATION code is queued to +237677123456
      Scenario: AC-2 Guest number
        Given a guest holds the number
        Then the response is 202 with existing_account null and the challenge points to the guest
      Scenario: AC-3 Registered number
        Given a registered person "Béatrice Ngono" holds the number
        Then the response is 202 with masked_name "Béatrice N…" and the code is queued
      Scenario Outline: AC-4 Invalid numbers
        When the number is <number>
        Then the response is <status>
        Examples:
          | number         | status                   |
          | missing        | 400 VALIDATION_ERROR     |
          | 12345          | 400 VALIDATION_ERROR     |
          | +33612345678   | 400 UNSUPPORTED_NUMBER   |
      Scenario: AC-5 Limits
        When a fourth code is requested for one number within an hour
        Then the response is 429 `OTP_RATE_LIMITED`
    abuse: |
      Scenario: AB-1 SMS pumping through this route (denial of service)
        When 50 requests come from one IP with different foreign numbers
        Then no SMS is queued
      Scenario: AB-2 Name disclosure is limited (information disclosure)
        When a registered number is requested
        Then only `masked_name` is returned, never the full name, email or ids
    implementation:
      create: [src/modules/auth/auth.routes.ts, src/modules/auth/auth.schemas.ts, src/modules/auth/auth.service.ts, src/modules/auth/auth.openapi.ts, tests/integration/auth/register-request.test.ts]
      modify: [src/app.ts]
      pattern: src/modules/tasks/tasks.routes.ts
      signatures:
        - "requestRegistrationCode(input: { phone_number: string }, clientKeys: { ip?: string }): Promise<{ sent: true; expires_in: number; existing_account: { masked_name: string } | null }>"
        - "maskName(fullName: string): string"
      types: []
      errors: ["VALIDATION_ERROR 400", "UNSUPPORTED_NUMBER 400", "OTP_RATE_LIMITED 429"]
      dependencies: [express, zod, "@asteasolutions/zod-to-openapi"]
    security:
      - "v5.0.0-6.6.1: SMS only to +237 mobiles."
      - "v5.0.0-2.4.1: the IP address is passed as a cap key."
      - "v5.0.0-6.3.8: the response differs only by `masked_name`, which the design requires."
    tests: |
      unknown | integration | AC-1 | 202, queued to normalized number
      guest | integration | AC-2 | 202, existing_account null, challenge person = guest
      registered | integration | AC-3 | masked_name "Béatrice N…"
      invalid | integration | AC-4 | each Examples row → status
      limits | integration | AC-5, CM-07 | 4th request → 429
      pumping | security | AB-1, WSTG-BUSL-07, CWE-770 | 50 foreign numbers → 0 queued
      disclosure | security | AB-2, CWE-200 | response keys exactly sent, expires_in, existing_account.masked_name
    command: npx vitest run tests/integration/auth/register-request.test.ts
    out_of_scope:
      - "Completing the registration (AUTH-010)."
  - id: AUTH-010
    title: Visitor registers with the code
    kind: feature
    size: M
    risk: high
    depends_on: [AUTH-009, AUTH-008, AUTH-005]
    read_first: [src/modules/auth/auth.service.ts, src/modules/person/person.repository.ts]
    design_refs: [identite-et-organisation/person]
    constraints: [CM-05, C-02, C-03]
    asvs: [v5.0.0-6.2.1, v5.0.0-6.2.4, v5.0.0-7.2.4, v5.0.0-16.3.1]
    story: As a visitor, I want to register with my name, my password and the code so that I get an account and am signed in on my phone.
    context: |
      - Exists: `verifyCode` (AUTH-003), `validatePasswordRules`, `hashPassword` (AUTH-005), `issueSession` (AUTH-008), `findByActivePhone` (PER-005), `POST /auth/register/request` (AUTH-009).
      - Adds: `POST /api/v1/auth/register` with body `{ phone_number, code, full_name, password, device }` (`device` as `DeviceInfo`, AUTH-008). Response 201 `{ access_token, refresh_token, expires_in, token_type: 'Bearer', person: { id, full_name } }`.
      - Creates a registered person, or completes a guest that holds the number: `full_name`, `password_hash`, `registered_at` = now, `phone_verified_at` = now. No foreign key changes: relations and invitations already point to this person.
      - A registered holder answers 409 `ACCOUNT_EXISTS`. Two registrations racing for one number: the loser gets 409 `ACCOUNT_EXISTS`.
      - Logs `info` event `registered` with the person id.
    acceptance: |
      Scenario: AC-1 New person
        Given a valid code for an unused number
        When the visitor registers with name "Béatrice Ngono", a valid password and device info
        Then the response is 201 with tokens, the person is registered with a verified number, and the password hash is Argon2id
      Scenario: AC-2 Guest completed
        Given a guest holds the number and has a relationship pointing to it
        When the visitor registers
        Then the guest row becomes the registered person with the same id, and nothing pointing to it changes
      Scenario: AC-3 Registered holder
        When the number belongs to a registered person
        Then the response is 409 `ACCOUNT_EXISTS` and nothing changes
      Scenario Outline: AC-4 Refusals
        When the request has <problem>
        Then the response is <status> and no person is created
        Examples:
          | problem                          | status                 |
          | a wrong code                     | 400 OTP_INVALID        |
          | an expired code                  | 400 OTP_EXPIRED        |
          | password 1234567                 | 400 WEAK_PASSWORD      |
          | password "12345678"              | 400 WEAK_PASSWORD      |
          | full_name empty                  | 400 VALIDATION_ERROR   |
          | full_name of 101 characters      | 400 VALIDATION_ERROR   |
          | device platform "WINDOWS"        | 400 VALIDATION_ERROR   |
    abuse: |
      Scenario: AB-1 Registering someone else's number (spoofing)
        When a visitor submits a number without having its code
        Then no person is created or completed
      Scenario: AB-2 Server-owned fields in the body (mass assignment)
        When the body contains id, status, registered_at or scope_version
        Then the response is 400 and nothing is stored
      Scenario: AB-3 Password in logs (information disclosure)
        When a registration succeeds or fails
        Then no log line contains the password or the code
    implementation:
      create: [src/modules/auth/auth.repository.ts, tests/integration/auth/register.test.ts]
      modify: [src/modules/auth/auth.routes.ts, src/modules/auth/auth.schemas.ts, src/modules/auth/auth.service.ts, src/modules/auth/auth.openapi.ts]
      pattern: src/modules/auth/auth.service.ts
      signatures:
        - "register(input: RegisterInput): Promise<SessionResponse>"
      types:
        - "RegisterInput = { phone_number: string; code: string; full_name: string; password: string; device: DeviceInfo }"
        - "SessionResponse = { access_token: string; refresh_token: string; expires_in: number; token_type: 'Bearer'; person: { id: string; full_name: string | null } }"
      errors: ["ACCOUNT_EXISTS 409", "OTP_INVALID 400", "OTP_EXPIRED 400", "WEAK_PASSWORD 400", "VALIDATION_ERROR 400"]
      dependencies: [express, zod, argon2, "@prisma/client"]
    security:
      - "v5.0.0-6.2.1: password 8 to 64 characters; rules from `validatePasswordRules`."
      - "v5.0.0-7.2.4: a new device and new tokens are created."
      - "v5.0.0-16.3.1: registration success and failure are logged with fixed event names and no personal data."
    tests: |
      new person | integration | AC-1, CM-05, C-03 | register → 201, registered row, argon2id hash
      guest completed | integration | AC-2, C-02 | same id, dependants unchanged
      registered holder | integration | AC-3 | 409, row unchanged
      refusals | integration | AC-4 | each Examples row → status, no row
      wrong owner | security | AB-1, WSTG-ATHN-04 | no code → no person
      mass assignment | security | AB-2, CWE-915 | forbidden fields → 400
      no secrets in logs | security | AB-3, CWE-532 | logger output has no password or code
    command: npx vitest run tests/integration/auth/register.test.ts
    out_of_scope:
      - "Recycled numbers (AUTH-011). Showing what is attached to the number (REL and ORG modules)."
  - id: AUTH-011
    title: New holder of a recycled number registers
    kind: feature
    size: M
    risk: high
    depends_on: [AUTH-010, NTF-002]
    read_first: [src/modules/auth/auth.service.ts, src/modules/auth/auth.repository.ts]
    design_refs: [identite-et-organisation/person]
    constraints: [C-02, CM-04, CM-03]
    asvs: [v5.0.0-6.4.3, v5.0.0-16.3.1, v5.0.0-8.2.2]
    story: As a visitor, I want to say "this number is new to me" so that I get a new account and the previous holder keeps theirs.
    context: |
      - Exists: `POST /api/v1/auth/register` (AUTH-010); `bumpScopeVersion`, `releasePhoneNumber` rule of PER (CM-04); `notify`; `enqueueOtpDelivery` for the email.
      - Adds: optional `new_holder: true` in the register body. With it, a registered holder of the number is released in one transaction: `phone_number` moves to `released_phone_number`, `phone_verified_at` is emptied, `scope_version` is bumped; then a new registered person takes the number (as AUTH-010).
      - The previous holder is notified: a notification `phone.taken_over` (content: "Votre numéro est maintenant utilisé par quelqu'un d'autre. Ajoutez votre nouveau numéro.") and, when their email is verified, an email with the same text and no number. Their account, history and sessions are untouched.
      - `new_holder: true` with a guest or unused number behaves as a normal registration. The code is still required.
    acceptance: |
      Scenario: AC-1 Recycled number
        Given a registered person P holds +237677123456 and a visitor proves the number with a code
        When the visitor registers with new_holder true
        Then P has phone_number empty, released_phone_number +237677123456, phone_verified_at empty and scope_version increased by 1
        And a new registered person holds the number and receives tokens
      Scenario: AC-2 Previous holder is told
        Then P has an unread notification with source_event `phone.taken_over`
        And when P's email is verified one email job is queued without the phone number in its text
      Scenario: AC-3 History is kept
        Then P keeps id, name, relationships and sessions, and P's relationships still point to P
      Scenario: AC-4 Without a code
        When new_holder is true and the code is wrong
        Then the response is 400 `OTP_INVALID` and nobody is released
      Scenario: AC-5 Atomic
        When the new person's insert fails
        Then P still holds the number
    abuse: |
      Scenario: AB-1 Taking over an account by claiming a number is new (elevation)
        When an attacker with the SIM registers with new_holder true
        Then the attacker gets a new empty person and no data, relationship or session of P
      Scenario: AB-2 Released number stays out of lookups (information disclosure)
        When someone looks up the released number
        Then it answers as an unknown number
    implementation:
      create: [tests/integration/auth/register-new-holder.test.ts]
      modify: [src/modules/auth/auth.schemas.ts, src/modules/auth/auth.service.ts, src/modules/auth/auth.repository.ts, src/modules/auth/auth.openapi.ts]
      pattern: src/modules/auth/auth.service.ts
      signatures:
        - "releaseHolderAndRegister(input: RegisterInput): Promise<SessionResponse>"
      types:
        - "RegisterInput = RegisterInput & { new_holder?: boolean }"
      errors: ["OTP_INVALID 400", "ACCOUNT_EXISTS 409"]
      dependencies: ["@prisma/client", zod, bullmq]
    security:
      - "v5.0.0-6.4.3: the code proves the SIM; the previous holder is warned on every channel we have."
      - "v5.0.0-8.2.2: nothing owned by the previous holder is reassigned."
