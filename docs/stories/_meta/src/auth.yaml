kind: module
module: auth
prefix: AUTH
title: Authentication
responsibility: Owns registration, login with a code on every sign-in, one session per phone, password and email and phone-number changes, and the one-time codes behind them.
entities: [OtpChallenge, Device, RefreshToken]
depends_on: [foundation, person, notification, access]
asvs_level: L2
asvs_rationale: Accounts and sessions protect business and money data; sign-in needs the password and the SIM, and codes cost money to send.
classification:
  - "Person.password_hash | credential | Argon2id hash, never returned or logged"
  - "OtpChallenge.code_hash | credential | hash only, never logged"
  - "OtpChallenge.target | PII | phone number or email, never logged"
  - "RefreshToken.token_hash | credential | SHA-256 hash of a random token, never logged"
  - "Device.push_token | credential | stored, never returned to others"
threats:
  - "T1 | S | Password guessing or credential stuffing | 5 failures lock the account for LOGIN_LOCK_MINUTES, a code is needed anyway | AUTH-013 AB-1"
  - "T2 | S | Code guessing | 5 attempts per code, single use, 10 minute expiry | AUTH-003 AB-1"
  - "T3 | D | SMS pumping and code flooding | +237 only, 3 per hour per number, 60 seconds apart, device and IP caps | AUTH-002 AB-1, AUTH-004 AB-1"
  - "T4 | S | Stolen refresh token replayed | rotation at every use, reuse revokes that device | AUTH-016 AB-1"
  - "T5 | I | Account enumeration by number checks | sign-in and registration tell the user what to do (no account, wrong password), so every number check counts in a per-IP limit and nothing private is shown before the code | AUTH-028 AB-1, AUTH-029 AB-1"
  - "T6 | E | Recycled number lets a new holder take the old account | the new holder gets a new person; the old one keeps the account and history | AUTH-011 AB-1"
  - "T7 | R | Sensitive account changes leave no trace | login alerts, immutable number-change journal, security log events | AUTH-014 AB-2, AUTH-025 AB-2"
  - "T8 | D | Claiming a number to harass its active holder | the claim is refused when the old account synced in the last 6 months or is suspended, with one message for both; the holder is warned at most once a day | AUTH-031 AB-1, AUTH-032 AB-1"
constraints:
  C-33: "`OtpChallenge` allows 5 attempts at most; a consumed or expired code is never accepted; SMS goes only to +237 mobile numbers; an EMAIL code goes to the person's verified email, to the administrator's recovery address, or, for ORG_CONTACT_VERIFICATION, to the email of the contact being verified, except for EMAIL_VERIFICATION; `organization_contact_id` is set if and only if `purpose = ORG_CONTACT_VERIFICATION`, and then `target` equals the contact's value."
  C-34: "`Device.last_synced_at` and `Device.scope_version_seen` are set by the server only; `RefreshToken.token_hash` is unique; `revoked_reason` is set if and only if `revoked_at` is set."
  CM-05: "Password: 8 to 64 characters, spaces allowed, no composition rules, refused when on the blocklist, hashed with Argon2id; 5 failed attempts force a wait."
  CM-06: "A code expires 10 minutes after sending and works once."
  CM-07: "Sending limits: 3 codes per hour per number, 1 minute before a resend, caps per device and per IP address, a global daily cap that alerts the team; SMS only to +237 mobiles."
  CM-08: "Access token (JWT) lives 15 minutes and is not stored; refresh token lives 90 days, extended at each use, replaced at each use; a reused token revokes only its own device session (REUSE_DETECTED)."
  CM-04: "Releasing a number moves it from phone_number to released_phone_number and clears phone_verified_at; lookups, SMS and registration read only the active number."
  C-01: "Identifiers use `uuid` columns (UUIDv7), amounts `bigint`, quantities `numeric(12,3)`, timestamps `timestamptz`."
  C-59: "At most one open (not revoked) device per person and `android_id_hash`."
contracts:
  provides:
    - name: OtpService
      file: src/modules/auth/otp.service.ts
      story: AUTH-002
      items:
        - "issueCode(input: IssueCodeInput, clientKeys?: ClientKeys): Promise<{ challengeId: string; expiresAt: Date }> — IssueCodeInput = { personId: string | null; target: string; purpose: OtpPurpose; channel: OtpChannel; contact?: { id: string; organizationName: string } }; contact is required with the purpose ORG_CONTACT_VERIFICATION and refused with any other (ORG-041)"
        - "verifyCode(input: { target: string; purpose: OtpPurpose; code: string; organizationContactId?: string }): Promise<{ challengeId: string; personId: string | null }> — organizationContactId is required with ORG_CONTACT_VERIFICATION and refused with any other (ORG-041)"
      used_by: [admin, organization]
    - name: PasswordLib
      file: src/lib/password.ts
      story: AUTH-005
      items:
        - "hashPassword(plain: string): Promise<string> — Argon2id"
        - "verifyPassword(hash: string, plain: string): Promise<boolean>"
        - "validatePasswordRules(plain: string): Promise<string[]> — list of broken rule codes, empty when valid"
      used_by: [admin]
    - name: SessionService
      file: src/modules/auth/session.service.ts
      story: AUTH-008
      items:
        - "issueSession(personId: string, device: DeviceInfo, tx?): Promise<SessionTokens>"
        - "revokeSessions(personId: string, reason: RevokedReason, options?: { exceptDeviceId?: string }): Promise<number>"
      used_by: [admin, sync]
    - name: SupportAccess
      file: src/modules/auth/support-access.service.ts
      story: ADM-017
      items:
        - "releaseNumberOfPerson(tx: Prisma.TransactionClient, personId: string): Promise<string | null> — releases the active number of a registered person as a recycled-number claim does and returns it; null for a guest or a person with no active number (ADM-017)"
        - "moveAccountToNumber(tx: Prisma.TransactionClient, personId: string, newPhone: string): Promise<boolean> — replaces the active number and writes the PhoneNumberChangeLog row; false when the person has no number to replace; throws on a number taken (ADM-020)"
      used_by: [admin]
    - name: AuthMiddleware
      file: src/middleware/auth.ts
      story: AUTH-006
      items:
        - "authMiddleware sets `req.user = { id: personId, deviceId }` from a verified HS256 access token"
      used_by: [every module]
  consumes:
    - "person: PersonRepository, `people` table (docs/stories/modules/person/contracts.md)"
    - "notification: notify, recipientLanguage (docs/stories/modules/notification/contracts.md)"
    - "foundation: normalizeE164, isCameroonMobile, newId, httpError (docs/stories/modules/foundation/contracts.md)"
stories:
  - id: AUTH-001
    title: One-time code table
    kind: technical
    size: XS
    risk: medium
    depends_on: [PER-003, FND-005]
    read_first: [prisma/schema.prisma, tests/integration/person/person-table.test.ts]
    design_refs: [acces-et-securite/otpchallenge, contraintes-a-poser-au-niveau-base-de]
    constraints: [OtpChallenge:required, OtpChallenge:fk, OtpChallenge.purpose:enum, OtpChallenge.channel:enum, C-33, C-01]
    asvs: [v5.0.0-6.5.1, v5.0.0-6.5.3]
    fields: ["OtpChallenge.{person_id,target,purpose,channel,code_hash,expires_at,attempts,consumed_at,created_at}"]
    story: "Technical story: create the table that holds one-time codes as hashes, with the limits the database can enforce."
    context: |
      - Exists: `people` (PER-002); the old `otp_challenges` table was dropped there.
      - Adds: table `otp_challenges` (`person_id` nullable, `channel` default SMS, `attempts` default 0), CHECK `attempts <= 5`, CHECK that a SMS `target` starts with `+237`, and an index on (`target`, `purpose`, `created_at` desc).
      - Enforced later in code: a consumed or expired code is refused (AUTH-003); an EMAIL code goes to a verified email (AUTH-023, ADM).
    acceptance: |
      Scenario: AC-1 Row with defaults
        When a code row is inserted for a person, target +237677123456, purpose LOGIN, a hash and an expiry
        Then `channel` is SMS, `attempts` is 0, `consumed_at` is empty and `created_at` is set
      Scenario Outline: AC-2 Database limits
        When a row has <values>
        Then the insert <result>
        Examples:
          | values                                   | result          |
          | attempts 5                               | accepts         |
          | attempts 6                               | rejects (23514) |
          | person_id empty, purpose REGISTRATION    | accepts         |
          | channel SMS, target +33612345678         | rejects (23514) |
          | channel SMS, target +237677123456        | accepts         |
          | channel EMAIL, target a@example.test     | accepts         |
      Scenario: AC-3 Enums and foreign key
        When purpose is "NEW_DEVICE", channel is "PUSH" or the person id is unknown
        Then the insert fails
    implementation:
      create: [prisma/migrations/<timestamp>_auth_001_otp_challenges/migration.sql, tests/integration/auth/otp-table.test.ts]
      modify: [prisma/schema.prisma]
      pattern: tests/integration/person/person-table.test.ts
      signatures: []
      types: []
      errors: []
      dependencies: [prisma, "@prisma/client"]
    security:
      - "v5.0.0-6.5.1: only a hash of the code is stored; there is no plain-code column."
      - "v5.0.0-6.5.3: the attempts limit is a CHECK, so code paths cannot exceed it."
    tests: |
      defaults | integration | AC-1, OtpChallenge:required, C-01 | insert → defaults; `expectColumnType` on id, expires_at
      limits | integration | AC-2, C-33 | each Examples row → accepted or 23514
      enums and fk | integration | AC-3, OtpChallenge.purpose:enum, OtpChallenge.channel:enum, OtpChallenge:fk | bad enum values and unknown person → rejected
    command: npx vitest run tests/integration/auth/otp-table.test.ts
    out_of_scope:
      - "Issuing and verifying codes (AUTH-002, AUTH-003)."
  - id: AUTH-002
    title: Issue a one-time code
    kind: technical
    size: M
    risk: high
    depends_on: [AUTH-001, FND-004, FND-006, NTF-002]
    read_first: [src/lib/otp.ts, src/lib/otp-delivery-queue.ts]
    design_refs: [acces-et-securite/otpchallenge]
    constraints: [CM-06, CM-07, C-33]
    asvs: [v5.0.0-6.5.4, v5.0.0-6.6.1, v5.0.0-2.4.1, v5.0.0-11.4.2]
    story: "Technical story: create and send a one-time code with the sending limits, so that no flow can flood a phone or the SMS budget."
    context: |
      - Exists: `generateOtp`, `hashOtp` (bcrypt) in `src/lib/otp.ts`; `enqueueOtpDelivery({ channel, to, message, subject? })`; `checkAndConsume(key, limit, windowSeconds)` in `src/lib/rate-limit.ts`; `otp_challenges` (AUTH-001); `isCameroonMobile`.
      - Adds: `src/modules/auth/otp.repository.ts` and `otp.service.ts` with `issueCode`; `hashOtp` and `verifyOtp` in `src/lib/otp.ts` now use Argon2id (`argon2`) with memory 19456 KiB, time 2, parallelism 1.
      - `issueCode`: refuse a SMS target that is not a Cameroon mobile (400 `UNSUPPORTED_NUMBER`); allow 3 codes per hour per target (key `otp:hour:<target>`) and one per 60 seconds per target and purpose (key `otp:cooldown:<purpose>:<target>`), else 429 `OTP_RATE_LIMITED`; store a 6-digit code as a hash valid 10 minutes; queue the message.
      - Message text: French "Votre code Distribo : <code>. Il expire dans 10 minutes." or English "Your Distribo code: <code>. It expires in 10 minutes." from `recipientLanguage` when the person is known, else French. Email codes carry subject "Distribo".
    acceptance: |
      Scenario: AC-1 Code issued and queued
        When issueCode is called for a Cameroon number with purpose LOGIN
        Then one challenge exists with a hash, `expires_at` 10 minutes ahead, attempts 0
        And one delivery job is queued to that number whose message contains the 6-digit code
      Scenario Outline: AC-2 Sending limits
        Given <history>
        When issueCode is called
        Then the result is <result>
        Examples:
          | history                                       | result                          |
          | no code sent                                  | issued                          |
          | one code sent 30 seconds ago, same purpose    | 429 OTP_RATE_LIMITED            |
          | one code sent 61 seconds ago, same purpose    | issued                          |
          | three codes sent in the last hour             | 429 OTP_RATE_LIMITED            |
      Scenario: AC-3 Foreign numbers refused
        When the target is +33612345678 with channel SMS
        Then the result is 400 `UNSUPPORTED_NUMBER`, nothing is stored and nothing is queued
      Scenario: AC-4 No plain code stored
        Then the stored hash is an Argon2id string and never equals the code
    abuse: |
      Scenario: AB-1 SMS pumping (denial of service)
        When a bot requests codes for 100 different foreign numbers
        Then no SMS is queued
      Scenario: AB-2 Code in logs (information disclosure)
        When a code is issued
        Then no log entry contains the code or the target
    implementation:
      create: [src/modules/auth/otp.repository.ts, src/modules/auth/otp.service.ts, tests/integration/auth/otp-issue.test.ts]
      modify: [src/lib/otp.ts]
      pattern: src/modules/tasks/tasks.repository.ts
      signatures:
        - "issueCode(input: IssueCodeInput): Promise<{ challengeId: string; expiresAt: Date }>"
      types:
        - "OtpPurpose = 'REGISTRATION' | 'LOGIN' | 'PASSWORD_RESET' | 'PHONE_CHANGE' | 'EMAIL_VERIFICATION' | 'TOTP_RECOVERY'"
        - "IssueCodeInput = { personId: string | null; target: string; purpose: OtpPurpose; channel: 'SMS' | 'EMAIL' }"
      errors: ["OTP_RATE_LIMITED 429", "UNSUPPORTED_NUMBER 400"]
      dependencies: [argon2, ioredis, bullmq, "@prisma/client"]
    security:
      - "v5.0.0-6.5.4: codes are 6 digits from `crypto.randomInt`."
      - "v5.0.0-6.6.1: SMS only to +237 mobiles."
      - "v5.0.0-2.4.1: limits are checked before the row is written and before anything is queued."
      - "v5.0.0-11.4.2: codes hashed with Argon2id."
    tests: |
      issue | integration | AC-1, CM-06 | LOGIN code → row, 10 minute expiry, queued message has 6 digits
      limits | integration | AC-2, CM-07 | each Examples row (rate-limit module mocked with a fake clock) → result
      foreign number | integration | AC-3, C-33 | +33 number → 400, no row, no job
      hash only | integration | AC-4 | stored hash starts with `$argon2id$` and differs from the code
      sms pumping | security | AB-1, WSTG-BUSL-07, CWE-770 | 100 foreign targets → 0 jobs
      no code in logs | security | AB-2, CWE-532 | capture logger output → no code, no number
    command: npx vitest run tests/integration/auth/otp-issue.test.ts tests/unit/auth/otp.test.ts
    out_of_scope:
      - "Verifying a code (AUTH-003). Device, IP and daily caps (AUTH-004)."
  - id: AUTH-003
    title: Verify a one-time code
    kind: technical
    size: S
    risk: high
    depends_on: [AUTH-002]
    read_first: [src/modules/auth/otp.service.ts, src/modules/auth/otp.repository.ts]
    design_refs: [acces-et-securite/otpchallenge]
    constraints: [CM-06, C-33]
    asvs: [v5.0.0-6.5.1, v5.0.0-6.5.3, v5.0.0-6.6.3, v5.0.0-2.3.4]
    story: "Technical story: check a submitted code against the latest one issued, so that a code works once, expires, and cannot be guessed by repeated tries."
    context: |
      - Exists: `issueCode` (AUTH-002); the challenge with the latest `created_at` for a (target, purpose) is the current one.
      - Adds: `verifyCode({ target, purpose, code })` returning `{ challengeId, personId }`.
      - Order: no challenge, or consumed -> 400 `OTP_INVALID`; expired -> 400 `OTP_EXPIRED`; already 5 attempts -> 429 `OTP_LOCKED`; wrong code -> attempts + 1 and 400 `OTP_INVALID`; right code -> set `consumed_at`.
      - Attempts and consumption are single SQL updates (`UPDATE ... WHERE attempts < 5` and `WHERE consumed_at IS NULL`), so parallel calls cannot exceed 5 tries or use a code twice.
    acceptance: |
      Scenario: AC-1 Right code
        When verifyCode receives the right code within 10 minutes
        Then it returns the challenge id and person id and `consumed_at` is set
      Scenario: AC-2 Single use
        When the same right code is verified a second time
        Then the result is 400 `OTP_INVALID`
      Scenario: AC-3 Expiry
        When the right code is verified after `expires_at`
        Then the result is 400 `OTP_EXPIRED` and the challenge is not consumed
      Scenario: AC-4 Attempts
        When five wrong codes are sent, then the right code
        Then the first five answer 400 `OTP_INVALID`, the sixth try answers 429 `OTP_LOCKED`, and the row shows attempts 5 and no `consumed_at`
      Scenario: AC-5 Newest code only
        Given two codes issued for one target and purpose
        When the older code is verified
        Then the result is 400 `OTP_INVALID`
    abuse: |
      Scenario: AB-1 Guessing a code (spoofing)
        When 1000 wrong codes are sent in parallel
        Then at most 5 are counted, the rest answer 429, and the challenge stays unconsumed
      Scenario: AB-2 Parallel use of one right code (tampering)
        When the right code is verified twice at the same time
        Then exactly one call succeeds
    implementation:
      create: [tests/integration/auth/otp-verify.test.ts]
      modify: [src/modules/auth/otp.service.ts, src/modules/auth/otp.repository.ts]
      pattern: src/modules/auth/otp.service.ts
      signatures:
        - "verifyCode(input: { target: string; purpose: OtpPurpose; code: string }): Promise<{ challengeId: string; personId: string | null }>"
      types: []
      errors: ["OTP_INVALID 400", "OTP_EXPIRED 400", "OTP_LOCKED 429"]
      dependencies: [argon2, "@prisma/client"]
    security:
      - "v5.0.0-6.5.3: a code works once; consumption is an atomic conditional update."
      - "v5.0.0-6.6.3: 5 attempts per code, counted atomically."
      - "v5.0.0-2.3.4: attempts and consumption use `WHERE` guards, not read-then-write."
    tests: |
      right code | integration | AC-1 | verify → ids returned, consumed_at set
      single use | integration | AC-2, CM-06 | second verify → OTP_INVALID
      expiry | integration | AC-3, CM-06 | after expiry → OTP_EXPIRED, not consumed
      attempts | integration | AC-4, C-33 | 5 wrong then right → 5 invalid then OTP_LOCKED, attempts 5
      newest only | integration | AC-5 | older code → OTP_INVALID
      guessing | security | AB-1, WSTG-ATHN-03, CWE-307 | 1000 parallel wrong codes → attempts 5, the rest 429
      parallel use | security | AB-2, CWE-362 | two parallel right codes → one success
    command: npx vitest run tests/integration/auth/otp-verify.test.ts
    out_of_scope:
      - "Endpoints that call it (AUTH-011 onward)."
  - id: AUTH-004
    title: Device, IP and daily caps on code sending
    kind: technical
    size: S
    risk: high
    depends_on: [AUTH-003]
    read_first: [src/modules/auth/otp.service.ts, src/lib/config-service.ts]
    design_refs: [acces-et-securite/otpchallenge]
    constraints: [CM-07]
    asvs: [v5.0.0-2.4.1, v5.0.0-16.3.3]
    story: "Technical story: cap code sending per device, per IP address and per day, so that a flood spread over many numbers still stops."
    context: |
      - Exists: `issueCode` with the per-number limits (AUTH-002); `configService.get(category, key)` returns null when unset (Q-006).
      - Adds: optional `clientKeys: { deviceId?: string; ip?: string }` on `issueCode`. Limits come from remote-config category `otp`: `max_per_device_per_hour`, `max_per_ip_per_hour`, `max_per_day`. A limit that is unset is off.
      - Counters: `otp:device:<deviceId>`, `otp:ip:<ip>` (window 3600 s), `otp:day` (window 86400 s). A refusal is 429 `OTP_RATE_LIMITED`.
      - When the daily cap is reached the first time in a day, log `error` with event `otp_daily_cap_reached` and increment Prometheus counter `otp_daily_cap_reached_total` (Q-009).
    acceptance: |
      Scenario Outline: AC-1 Caps
        Given cap <cap> is set to 2 and unset caps are off
        When 3 codes are requested for different numbers with the same <key>
        Then the third is <result>
        Examples:
          | cap                    | key       | result              |
          | max_per_device_per_hour| device id | 429 OTP_RATE_LIMITED|
          | max_per_ip_per_hour    | ip        | 429 OTP_RATE_LIMITED|
          | max_per_day            | any       | 429 OTP_RATE_LIMITED|
      Scenario: AC-2 Caps unset
        When no cap is configured and 50 codes are requested from one device
        Then no request is refused by these caps
      Scenario: AC-3 Alert
        When the daily cap is reached
        Then one `error` log with event `otp_daily_cap_reached` and one counter increment exist for that day
    abuse: |
      Scenario: AB-1 Distributed SMS pumping (denial of service)
        When one device requests codes for 20 valid numbers with a per-device cap of 5
        Then only 5 are queued
    implementation:
      create: [tests/integration/auth/otp-caps.test.ts]
      modify: [src/modules/auth/otp.service.ts, src/lib/metrics.ts]
      pattern: src/modules/auth/otp.service.ts
      signatures:
        - "issueCode(input: IssueCodeInput, clientKeys?: { deviceId?: string; ip?: string }): Promise<{ challengeId: string; expiresAt: Date }>"
      types: []
      errors: ["OTP_RATE_LIMITED 429"]
      dependencies: [ioredis, prom-client]
    security:
      - "v5.0.0-2.4.1: caps are read at each call, so an operator can change them without a deploy."
      - "v5.0.0-16.3.3: reaching the daily cap is logged with a fixed event name."
    tests: |
      caps | integration | AC-1, CM-07 | each Examples row → third request 429
      unset caps | integration | AC-2 | 50 requests → none refused by caps
      alert | integration | AC-3 | daily cap reached → one error log, counter +1
      distributed pumping | security | AB-1, WSTG-BUSL-07, CWE-770 | cap 5, 20 numbers → 5 queued
    command: npx vitest run tests/integration/auth/otp-caps.test.ts
    out_of_scope:
      - "Choosing the cap values (Q-006, set by an operator in remote-config)."
  - id: AUTH-005
    title: Password rules and Argon2id hashing
    kind: technical
    size: S
    risk: high
    depends_on: [FND-000]
    read_first: [docs/stories/CONVENTIONS.md, src/lib/crypto.ts]
    design_refs: [identite-et-organisation/person]
    constraints: [CM-05]
    asvs: [v5.0.0-6.2.1, v5.0.0-6.2.4, v5.0.0-6.2.5, v5.0.0-6.2.8, v5.0.0-6.2.9, v5.0.0-11.4.2]
    story: "Technical story: provide password hashing and the password rules of the design, so that every flow checks passwords the same way."
    context: |
      - Adds: `src/lib/password.ts` (`hashPassword`, `verifyPassword`, `validatePasswordRules`) and `src/lib/password-blocklist.ts` (`isBlockedPassword(plain)`), plus `data/common-passwords.txt` (one lower-case password per line; start with at least these 20: 123456, 12345678, password, motdepasse, azerty, azerty123, qwerty, qwerty123, 111111, 000000, abc123, iloveyou, admin, welcome, letmein, monkey, dragon, football, bonjour, cameroun). The real list is supplied before release (Q-004).
      - Argon2id parameters: memory 19456 KiB, time 2, parallelism 1. The hash is verified against the password exactly as typed (no trim, no case change).
      - Rules: length 8 to 64 characters counted in Unicode code points, spaces allowed, no composition rule, refused when the lower-cased password is in the blocklist. Broken rules are returned as codes `TOO_SHORT`, `TOO_LONG`, `BLOCKED`.
    acceptance: |
      Scenario Outline: AC-1 Rules
        When validatePasswordRules receives <password>
        Then the result is <result>
        Examples:
          | password                       | result        |
          | 1234567                        | TOO_SHORT     |
          | abcdefgh                       | valid         |
          | le riz aime la pluie           | valid         |
          | 64 characters                  | valid         |
          | 65 characters                  | TOO_LONG      |
          | Password                       | BLOCKED       |
          | 12345678                       | BLOCKED       |
          | 8 emoji characters             | valid         |
      Scenario: AC-2 Hash and verify
        When hashPassword hashes "le riz aime la pluie" twice
        Then both hashes start with `$argon2id$`, differ from each other, and verifyPassword accepts the password against each
        And verifyPassword rejects "le riz aime la pluie " with a trailing space
      Scenario: AC-3 Garbage hash
        When verifyPassword receives a hash that is not Argon2id
        Then it returns false and does not throw
    abuse: |
      Scenario: AB-1 Composition rules would push predictable passwords (design conflict)
        When a lower-case password of 8 letters that is not on the blocklist is validated
        Then it is valid
    implementation:
      create: [src/lib/password.ts, src/lib/password-blocklist.ts, data/common-passwords.txt, tests/unit/auth/password.test.ts]
      modify: []
      pattern: src/lib/crypto.ts
      signatures:
        - "hashPassword(plain: string): Promise<string>"
        - "verifyPassword(hash: string, plain: string): Promise<boolean>"
        - "validatePasswordRules(plain: string): Promise<Array<'TOO_SHORT' | 'TOO_LONG' | 'BLOCKED'>>"
        - "isBlockedPassword(plain: string): Promise<boolean>"
      types: []
      errors: []
      dependencies: [argon2]
    security:
      - "v5.0.0-11.4.2: Argon2id with the stated parameters."
      - "v5.0.0-6.2.5: no rule about character types."
      - "v5.0.0-6.2.8: no trimming or normalization of the password."
    tests: |
      rules | unit | AC-1, CM-05 | each Examples row → result
      hash and verify | unit | AC-2, CM-05 | two hashes differ, both verify; trailing space fails
      garbage hash | unit | AC-3 | bcrypt-looking string → false, no throw
      no composition | unit | AB-1 | 8 lower-case letters off the list → valid
    command: npx vitest run tests/unit/auth/password.test.ts
    out_of_scope:
      - "The full blocklist file (Q-004). Lockout after failures (AUTH-014)."
  - id: AUTH-006
    title: Access token carries the person and the device
    kind: change
    size: S
    risk: high
    depends_on: [PER-002, FND-006]
    amends: [FND-001]
    read_first: [src/lib/jwt.ts, src/middleware/auth.ts]
    design_refs: [acces-et-securite/refreshtoken, identite-et-organisation/person]
    constraints: [CM-08]
    asvs: [v5.0.0-9.1.1, v5.0.0-9.1.2, v5.0.0-9.2.1, v5.0.0-9.2.2]
    story: "Technical story: put the person id and the device id in the access token and stop putting the phone number in it, so that the token is small, private and tied to one session."
    context: |
      - Exists: `signToken({ accountId, phoneNumber })` and `verifyToken` in `src/lib/jwt.ts`; `authMiddleware` sets `req.user = { id, phoneNumber }`; `src/types/express.d.ts`; `tests/helpers/request.ts` signs `{ accountId, tokenVersion }`.
      - Changes: the payload is `{ sub: personId, did: deviceId, typ: 'access' }`, signed HS256, lifetime from `ACCESS_TOKEN_EXPIRES_IN` (default 15m); verification accepts only HS256 and requires `sub`, `did` and `typ` = access; `req.user = { id: sub, deviceId: did }`.
      - The test helpers sign the new payload; a helper argument `deviceId` defaults to a fixed UUID.
    acceptance: |
      Scenario: AC-1 New payload
        When signAccessToken signs for a person and a device
        Then the decoded payload has `sub`, `did`, `typ` access, `iat`, `exp` 15 minutes later and no phone number
      Scenario Outline: AC-2 Verification
        When verifyAccessToken receives <token>
        Then the result is <result>
        Examples:
          | token                                            | result   |
          | a fresh valid token                              | accepted |
          | an expired token                                 | rejected |
          | signed with another secret                       | rejected |
          | algorithm none                                   | rejected |
          | signed HS512 with the right secret               | rejected |
          | missing `did`                                    | rejected |
          | `typ` refresh                                    | rejected |
      Scenario: AC-3 Middleware
        When a request carries a valid token
        Then `req.user` is `{ id, deviceId }` and the next handler runs
        And an invalid token answers 401 `INVALID_TOKEN`, a missing header 401 `UNAUTHORIZED`
    abuse: |
      Scenario: AB-1 Algorithm confusion (spoofing)
        When a token with `alg: none` or signed HS512 is presented
        Then the response is 401 `INVALID_TOKEN`
    implementation:
      create: [tests/unit/auth/access-token.test.ts]
      modify: [src/lib/jwt.ts, src/middleware/auth.ts, src/types/express.d.ts, tests/helpers/request.ts]
      pattern: src/lib/jwt.ts
      signatures:
        - "signAccessToken(payload: { personId: string; deviceId: string }): string"
        - "verifyAccessToken(token: string): { personId: string; deviceId: string }"
      types:
        - "req.user: { id: string; deviceId: string }"
      errors: ["INVALID_TOKEN 401", "UNAUTHORIZED 401"]
      dependencies: [jsonwebtoken, express]
    security:
      - "v5.0.0-9.1.2: `jwt.verify` is called with `algorithms: ['HS256']`."
      - "v5.0.0-9.2.2: `typ` must be `access`."
      - "v5.0.0-9.1.1: the signature is checked before any claim is read."
    tests: |
      payload | unit | AC-1, CM-08 | sign → decoded claims, no phone, 15 minute expiry
      verification | unit | AC-2 | each Examples row → accepted or rejected
      middleware | integration | AC-3 | valid → req.user set; invalid → INVALID_TOKEN; none → UNAUTHORIZED
      algorithm confusion | security | AB-1, WSTG-SESS-10, CWE-347 | none and HS512 tokens → 401
    command: npx vitest run tests/unit/auth/access-token.test.ts tests/integration/user.test.ts
    out_of_scope:
      - "Issuing tokens at login (AUTH-008)."
    tests_to_update:
      - "tests/helpers/request.ts | signs `{ accountId, tokenVersion }` | signs `{ sub, did, typ: 'access' }`"
  - id: AUTH-007
