  - id: AUTH-018
    title: Person manages their phones
    kind: feature
    size: M
    risk: medium
    depends_on: [AUTH-017, AUTH-009, AUTH-010]
    read_first: [src/modules/auth/session.service.ts, src/modules/auth/auth.routes.ts]
