  - id: PER-007
    title: Person reads and edits their own profile
    kind: feature
    size: S
    risk: medium
    depends_on: [PER-005]
    read_first: [docs/stories/modules/person/contracts.md, src/modules/user/user.routes.ts]
    design_refs: [identite-et-organisation/person]
    constraints: [Person:required, C-03]
    asvs: [v5.0.0-8.2.3, v5.0.0-15.3.1, v5.0.0-15.3.3]
    fields: ["Person.{full_name,email,email_verified_at,preferred_language,scope_version}"]
    story: As a customer, I want to see and change my own name, language and email so that my profile stays right.
    context: |
      - Exists: `GET` and `PATCH /api/v1/users/me` in the `user` module (before this story they return the account's id, email, name, email verified date and creation date).
      - Changes: both routes now read and write `Person` through `src/modules/user/user.*`; response fields are `id, full_name, phone_number, phone_verified, email, email_verified, preferred_language, registered, scope_version, created_at`.
      - PATCH accepts only `full_name` (1 to 100 characters, Q-027), `preferred_language` (FR or EN) and `email`; a changed email is stored at once and `email_verified_at` is emptied; `email: null` clears both.
      - The verification code for an email is sent by the AUTH module.
    acceptance: |
      Scenario: AC-1 Read own profile
        Given a signed-in registered person
        When they GET /api/v1/users/me
        Then the response is 200 with the ten fields above and no `password_hash`
      Scenario: AC-2 Update name and language
        When they PATCH full_name "Béatrice N." and preferred_language "EN"
        Then the response is 200 with the new values and the row is updated
      Scenario: AC-3 Change email resets verification
        Given a person with a verified email
        When they PATCH email to another address
        Then email is the new address and email_verified is false
      Scenario Outline: AC-4 Limits
        When they PATCH <field> with <value>
        Then the response is <status>
        Examples:
          | field              | value       | status |
          | full_name          | empty       | 400    |
          | full_name          | 100 chars   | 200    |
          | full_name          | 101 chars   | 400    |
          | preferred_language | ES          | 400    |
          | email              | not-an-email| 400    |
    abuse: |
      Scenario: AB-1 Server-owned fields (mass assignment)
        When a PATCH contains phone_number, status, scope_version, registered_at or password_hash
        Then the response is 400 and nothing is stored
      Scenario: AB-2 Another person's profile (horizontal)
        When a PATCH contains an `id` of another person
        Then the response is 400 and the other profile is unchanged
      Scenario: AB-3 No token (unauthenticated)
        When the request has no valid token
        Then the response is 401
    implementation:
      create: [tests/integration/person/profile.test.ts]
      modify: [src/modules/user/user.repository.ts, src/modules/user/user.service.ts, src/modules/user/user.schemas.ts, src/modules/user/user.types.ts, src/modules/user/user.openapi.ts]
      pattern: src/modules/user/user.service.ts
      signatures:
        - "getProfile(personId: string): Promise<Profile>"
        - "updateProfile(personId: string, input: UpdateProfileInput): Promise<Profile>"
      types:
        - "UpdateProfileInput = { full_name?: string; preferred_language?: 'FR' | 'EN'; email?: string | null }"
      errors: ["VALIDATION_ERROR 400", "UNAUTHORIZED 401", "NOT_FOUND 404"]
      dependencies: [express, zod, "@prisma/client"]
    security:
      - "v5.0.0-15.3.3: strict schema with three optional fields."
      - "v5.0.0-8.2.3: the row is selected and updated by the person id from the token only."
      - "v5.0.0-15.3.1: explicit response field list; `password_hash` is never selected."
    tests: |
      read | integration | AC-1 | GET → ten fields, no password_hash
      update | integration | AC-2 | PATCH name and language → stored
      email reset | integration | AC-3, C-03 | verified email replaced → email_verified false, date empty
      limits | integration | AC-4, Person:required | each Examples row → status
      mass assignment | security | AB-1, CWE-915 | forbidden fields → 400, row unchanged
      own row only | security | AB-2, WSTG-ATHZ-04 | id in body → 400; other row unchanged
      no token | security | AB-3, WSTG-ATHN-04 | no header → 401
    command: npx vitest run tests/integration/person/profile.test.ts tests/integration/user.test.ts
    out_of_scope:
      - "Sending the email verification code (AUTH module)."
      - "Changing the phone number (AUTH module)."
  - id: PER-008
    title: Registered-person guard for author columns
    kind: technical
    size: XS
    risk: high
    depends_on: [PER-003, FND-002]
    read_first: [tests/integration/foundation/database-roles.test.ts, prisma/schema.prisma]
    design_refs: [identite-et-organisation/person, contraintes-a-poser-au-niveau-base-de]
    constraints: []
    asvs: [v5.0.0-8.2.1, v5.0.0-2.2.3]
    story: "Technical story: create one SQL trigger function that refuses a guest in any author column, so that each table story can attach it and a guest can never act."
    context: |
      - Exists: `people` with `registered_at` (PER-002).
      - Adds: SQL function `require_registered_person()` used as `CREATE TRIGGER ... BEFORE INSERT OR UPDATE ON <table> FOR EACH ROW EXECUTE FUNCTION require_registered_person('col_a', 'col_b')`. It reads the column names from `TG_ARGV`, skips a null value, and on UPDATE skips a column whose value did not change. A person counts as registered when `registered_at` is set, even if later anonymized.
      - Each table story attaches the trigger to its own author columns and tests it (constraint C-04).
    acceptance: |
      Scenario: AC-1 Registered author accepted
        Given a scratch table with column `by_id` and the trigger on it
        When a row references a registered person
        Then the insert succeeds
      Scenario: AC-2 Guest refused
        When a row references a guest (empty `registered_at`)
        Then the insert fails with SQLSTATE 23514 and a message naming the column
      Scenario: AC-3 Null skipped
        When the author column is null
        Then the insert succeeds
      Scenario: AC-4 Unchanged column skipped on update
        Given a row whose author was registered when inserted and was anonymized later
        When another column of that row is updated
        Then the update succeeds
        And changing the author column to a guest fails with 23514
    abuse: |
      Scenario: AB-1 Guest acts through a crafted request (elevation)
        When code inserts an action row whose author is a guest, bypassing every check in the application
        Then PostgreSQL refuses the row
    implementation:
      create: [prisma/migrations/<timestamp>_per_008_registered_person_guard/migration.sql, tests/integration/person/registered-guard.test.ts]
      modify: []
      pattern: tests/integration/foundation/database-roles.test.ts
      signatures: []
      types: []
      errors: []
      dependencies: [prisma, "@prisma/client"]
    security:
      - "v5.0.0-8.2.1: the check lives in the database, so it holds for every code path."
    tests: |
      registered accepted | integration | AC-1 | scratch table and trigger → insert with a registered person passes
      guest refused | integration | AC-2 | insert with a guest → 23514
      null skipped | integration | AC-3 | null author → passes
      unchanged skipped | integration | AC-4 | anonymized author row updated elsewhere → passes; author set to a guest → 23514
      crafted request | security | AB-1, CWE-862 | raw insert with a guest author → 23514
    command: npx vitest run tests/integration/person/registered-guard.test.ts
    out_of_scope:
      - "Attaching the trigger to real tables (each table's story)."
  - id: PER-009
    title: Restore the test baseline after the unified Person integrity changes
    kind: change
    size: S
    risk: medium
    depends_on: [PER-002]
    amends: [PER-003]
    read_first: [tests/integration/person/person-table.test.ts, tests/integration/data-model/identity.test.ts]
    design_refs: [identite-et-organisation/person, contraintes-a-poser-au-niveau-base-de]
    constraints: [C-02, C-03]
    asvs: [v5.0.0-2.2.3, v5.0.0-14.2.4]
    story: "Technical story: reconcile the legacy identity tests with the unified Person schema and its integrity checks so that the full test baseline verifies the current design instead of removed models."
    context: |
      - Exists: the unified `people` table (PER-002) and its integrity constraints (PER-003); PER-003's dedicated tests pass.
      - `person-table.test.ts` still uses non-E.164 values in successful inserts and leaves unrelated Person fields invalid in enum rejection cases.
      - `identity.test.ts` still creates removed `Account` rows and unavailable `Organization` and `Customer` rows; `db.test.ts` still expects removed Prisma delegates.
      - This story changes tests only. It does not restore removed models or alter production code, the Prisma schema or migrations.
    acceptance: |
      Scenario: AC-1 Existing Person fixtures satisfy the integrity checks
        Given the PER-003 constraints are installed
        When the successful cases in `person-table.test.ts` insert a Person
        Then every active phone number is valid E.164
        And exactly one of `phone_number` and `released_phone_number` is set
      Scenario: AC-2 Negative tests fail for their intended reason
        When the invalid status and invalid language cases run
        Then every unrelated Person field satisfies the current integrity constraints
        And each case is rejected for its invalid enum value rather than a phone or completeness check
      Scenario: AC-3 Legacy identity expectations match the unified Person model
        When `identity.test.ts` runs
        Then no retained test creates or queries `Account`, `Organization` or `Customer`
        And obsolete or not-yet-available model scenarios are retired rather than restoring those models
        And current Person invariants remain covered without duplicating equivalent tests
      Scenario: AC-4 Prisma delegate inventory matches the current schema
        When `db.test.ts` checks the generated Prisma client
        Then every model in the current schema has a delegate
        And removed `Account`, `OtpChallenge`, `EmailVerificationRequest` and `RefreshToken` delegates are not required
      Scenario: AC-5 The test baseline is restored
        When the PER-003 tests and the full quality gates run
        Then the story tests, full suite, typecheck, lint and format check all pass
    abuse: |
      Scenario: AB-1 Weakening integrity tests to hide failures (tampering)
        When the legacy tests are reconciled
        Then no PER-003 constraint or assertion is disabled, bypassed or weakened
    implementation:
      create: []
      modify: [tests/integration/person/person-table.test.ts, tests/integration/data-model/identity.test.ts, tests/unit/db.test.ts]
      pattern: tests/integration/person/person-checks.test.ts
      signatures: []
      types: []
      errors: []
      dependencies: []
    security:
      - "v5.0.0-2.2.3: fixtures satisfy every unrelated database invariant so negative tests prove the intended constraint."
      - "v5.0.0-14.2.4: tests verify only the identity models present in the current generated client."
    tests: |
      valid Person fixtures | integration | AC-1, C-02, C-03 | successful inserts use E.164 and exactly one phone column
      isolated enum failures | integration | AC-2, C-02, C-03 | otherwise-valid rows with invalid status or language → intended rejection
      unified identity tests | integration | AC-3 | retained suite uses Person only; removed or future model scenarios retired
      current delegates | unit | AC-4 | generated client → current delegates present, removed delegates not required
      full baseline | integration | AC-5 | targeted tests and all quality gates → pass
      constraints preserved | security | AB-1, CWE-20 | PER-003 tests remain enabled and pass unchanged
    command: npx vitest run tests/integration/person/person-checks.test.ts tests/integration/person/person-table.test.ts tests/integration/data-model/identity.test.ts tests/unit/db.test.ts && npm test && npm run typecheck && npm run lint && npm run format:check
    out_of_scope:
      - "Production code, Prisma schema and migration changes."
      - "Restoring Account, Organization, Customer or any other removed or not-yet-implemented model."
      - "Renaming the intentionally retained `Task.accountId` field or unrelated account-named test helpers."
    tests_to_update:
      - "tests/integration/person/person-table.test.ts | successful fixtures use non-E.164 values and enum cases are not otherwise valid under PER-003 | use `uniquePhone()` or explicit valid E.164 values and make enum cases satisfy unrelated constraints"
      - "tests/integration/data-model/identity.test.ts | exercises removed Account and unavailable Organization/Customer models | retain only non-duplicated current Person invariants and retire obsolete or future-model cases"
      - "tests/unit/db.test.ts | expects Prisma delegates removed by PER-002 | assert delegates represented by the current schema and stop requiring removed identity/auth delegates"
